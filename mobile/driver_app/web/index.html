<!DOCTYPE html>
<html>

<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Cabi Driver App">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Cabi">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabi</title>
    <link rel="manifest" href="manifest.json">
    <script>
        var serviceWorkerVersion = null;
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA_ybfC1sxL4K92fKiuIsfHLkFK7sWl9-0&libraries=places"></script>
    <script src="flutter.js" defer></script>
</head>

<body>
    <script>
        window.addEventListener('load', function (ev) {
            _flutter.loader.loadEntrypoint({
                serviceWorker: {
                    serviceWorkerVersion: serviceWorkerVersion,
                }
            }).then(function (engineInitializer) {
                return engineInitializer.initializeEngine();
            }).then(function (appRunner) {
                return appRunner.runApp();
            });
        });
    </script>
</body>

</html>
