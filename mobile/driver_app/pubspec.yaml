name: driver_app
description: CABI Drive - The professional driver app by CABI Africa.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_polyline_points: ^2.0.0
  google_maps_flutter: ^2.5.3
  amplify_flutter: ^1.0.0
  amplify_auth_cognito: ^1.0.0
  amplify_api: ^1.0.0
  core_models:
    path: ../../libs/core_models
  core_auth:
    path: ../../libs/core_auth
  core_location:
    path: ../../libs/core_location
  core_ui:
    path: ../../libs/core_ui
  core_ride_service:
    path: ../../libs/core_ride_service
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  flutter_riverpod: ^2.4.0
  cabi_maps:
    path: ../../libs/cabi_maps
  dio: ^5.4.0
  image_picker: ^1.0.4
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  permission_handler: ^11.3.0
  local_auth: ^2.2.0
  flutter_rating_bar: ^4.0.1
  geolocator: ^10.1.0
  intl: ^0.19.0
  web_socket_channel: ^2.4.0
  latlong2: ^0.9.1
  http: ^1.6.0
  google_fonts: ^6.3.3



  mockito: any
  qr_flutter: ^4.1.0
  carousel_slider: ^5.1.1
  sqlite3_flutter_libs: ^0.5.41
  socket_io_client: ^3.1.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  mocktail: ^1.0.3
  fake_async: ^1.3.3
  flutter_lints: ^3.0.0
  geolocator_platform_interface: ^4.2.6
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/cabi_logo.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/cabi_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml