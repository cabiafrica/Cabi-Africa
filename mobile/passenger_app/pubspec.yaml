name: passenger_app
description: Cabi Go - The passenger ride-hailing app by Cabi Africa.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  core_auth:
    path: ../../libs/core_auth
  core_location:
    path: ../../libs/core_location
  core_ui:
    path: ../../libs/core_ui
  core_models:
    path: ../../libs/core_models
  core_ride_service:
    path: ../../libs/core_ride_service
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  cabi_maps:
    path: ../../libs/cabi_maps
  google_maps_flutter: ^2.5.3
  amplify_flutter: ^1.0.1
  amplify_auth_cognito: ^1.0.1
  amplify_api: ^1.0.1
  image_picker: ^1.0.4
  geolocator: ^10.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  local_auth: ^2.2.0
  share_plus: ^7.1.0
  cached_network_image: ^3.3.0
  flutter_html: ^3.0.0-alpha.5
  flutter_contacts: ^1.1.0
  dio: ^5.4.0
  intl: ^0.19.0
  firebase_analytics: ^10.8.0
  latlong2: ^0.9.0
  socket_io_client: ^3.1.3
  qr_flutter: ^4.1.0
  http: ^1.6.0
  google_fonts: ^6.1.0
  sqlite3_flutter_libs: ^0.5.41
  carousel_slider: ^5.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/cabi_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - shorebird.yaml