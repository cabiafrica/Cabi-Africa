<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/apps/driver/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="CABI Drive — Official CABI Africa Driver Partner App">
    <meta property="og:title" content="CABI Drive — Driver App">
    <meta property="og:description" content="CABI Drive — Official CABI Africa Driver Partner App">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CABI Drive">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CABI Drive — Driver App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            background-color: #0A0A0A;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #cabi-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0A0A0A;
            color: #F5F5F5;
            z-index: 9998;
            transition: opacity 0.35s ease;
        }
        #cabi-loader .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #ios-install-banner {
            display: none;
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 420px;
            margin: 0 auto;
            background: rgba(18, 18, 18, 0.96);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 16px;
            padding: 12px 16px;
            color: #FFFFFF;
            z-index: 9999;
            box-shadow: 0 14px 32px rgba(0,0,0,0.65);
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            line-height: 1.4;
        }
        #ios-install-banner button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #D4AF37;
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
    <script>
        const serviceWorkerVersion = "2109068614" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA_ybfC1sxL4K92fKiuIsfHLkFK7sWl9-0&libraries=places"></script>
    <script src="flutter.js" defer></script>
</head>

<body>
    <div id="cabi-loader">
        <div class="spinner"></div>
        <div style="font-weight: 800; letter-spacing: 0.14em; font-size: 13px; color: #D4AF37;">CABI DRIVE</div>
        <div style="font-size: 12px; color: #9CA3AF; margin-top: 6px;">Launching Driver Workspace...</div>
    </div>

    <div id="ios-install-banner">
        <div>
            <strong style="color: #D4AF37;">Install CABI Drive on iPhone:</strong><br>
            Tap Safari <strong>Share (⬆️)</strong> then <strong>"Add to Home Screen"</strong> for full-screen app mode.
        </div>
        <button onclick="document.getElementById('ios-install-banner').style.display='none'">Got it</button>
    </div>

    <script>
        (function () {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            if (isIOS && !isStandalone) {
                var banner = document.getElementById('ios-install-banner');
                if (banner) banner.style.display = 'flex';
            }
        })();

        window.addEventListener('load', function () {
            _flutter.loader.loadEntrypoint({
                serviceWorker: {
                    serviceWorkerVersion: serviceWorkerVersion,
                }
            }).then(function (engineInitializer) {
                return engineInitializer.initializeEngine();
            }).then(function (appRunner) {
                var loader = document.getElementById('cabi-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(function () { loader.remove(); }, 350);
                }
                return appRunner.runApp();
            });
        });
    </script>
</body>

</html>
