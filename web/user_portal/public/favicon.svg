<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE088"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Obsidian Badge with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>
  
  <!-- Stylized Geometric Golden CABI Emblem (C monogram with central kinetic crest) -->
  <g filter="url(#glow)">
    <path d="M43 21 C39 16.5 32.5 15 25.5 16.5 C17.5 18.5 12.5 25.5 12.5 33 C12.5 41 18.5 47.5 26.5 47.5 C33.5 47.5 39.5 44 43 38.5" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="7" 
          stroke-linecap="round"/>
    <!-- Dynamic Mobility Center Dot -->
    <circle cx="33" cy="32.5" r="4" fill="url(#goldGrad)"/>
    <!-- Upper Kinetic Diamond Accent -->
    <circle cx="43" cy="21" r="2.5" fill="#FFE088"/>
  </g>
</svg>