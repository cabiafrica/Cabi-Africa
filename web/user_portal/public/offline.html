<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#D4AF37" />
  <title>Offline — CABI Africa</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0c;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 32px;
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: #141418;
    }
    h1 { color: #d4af37; margin: 0 0 12px; font-size: 24px; }
    p { color: #cbd5e1; line-height: 1.6; font-size: 14px; margin: 0 0 24px; }
    button {
      background: #d4af37;
      color: #0a0a0c;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <a href="#main" style="position:absolute;left:-9999px;" class="skip-link">Skip to main content</a>
  <main id="main" class="card">
    <h1>You Are Offline</h1>
    <p>CABI Africa requires an active connection to request live rides or sync trip updates. Reconnect and tap retry.</p>
    <button onclick="window.location.reload()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.location.reload();}">Retry Connection</button>
  </main>
</body>
</html>
