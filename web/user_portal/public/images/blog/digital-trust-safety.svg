<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <title>CABI Africa Digital Trust and Passenger Safety Infographic</title>
  <desc>Vector editorial illustration showing 4-digit start PIN verification lock and why users should stay securely on-app for emergency SOS and live GPS tracking.</desc>
  <defs>
    <linearGradient id="night-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="60%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#161824"/>
    </linearGradient>
    <linearGradient id="pin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="danger-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shield-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Night City Background -->
  <rect width="1600" height="900" fill="url(#night-bg)"/>

  <!-- Street Lantern Glow & Warm Light Cone -->
  <polygon points="460,0 350,900 650,900" fill="#FACC15" opacity="0.04"/>
  <circle cx="480" cy="120" r="12" fill="#FACC15" filter="url(#neon-glow)"/>
  <path d="M 480 0 L 480 120" stroke="#475569" stroke-width="6"/>

  <!-- Background Road markings -->
  <line x1="0" y1="620" x2="1600" y2="620" stroke="#262A3B" stroke-width="6"/>
  <line x1="100" y1="680" x2="400" y2="680" stroke="#FACC15" stroke-width="8" stroke-dasharray="30 20"/>
  <line x1="500" y1="680" x2="1100" y2="680" stroke="#FACC15" stroke-width="8" stroke-dasharray="30 20"/>
  <line x1="1200" y1="680" x2="1600" y2="680" stroke="#FACC15" stroke-width="8" stroke-dasharray="30 20"/>

  <!-- LEFT: The Shady "Hapa Kando" Alley Scene (Humorous Warning) -->
  <g transform="translate(100, 160)" filter="url(#shield-shadow)">
    <!-- Dark brick alley wall -->
    <rect x="0" y="0" width="340" height="480" rx="16" fill="#11131C" stroke="#252837" stroke-width="3"/>
    
    <!-- Shady Silhouette Figure with Sunglasses -->
    <g transform="translate(90, 60)">
      <circle cx="80" cy="50" r="32" fill="#1F2937"/>
      <!-- Dark Sunglasses -->
      <rect x="60" y="44" width="18" height="10" rx="3" fill="#000"/>
      <rect x="82" y="44" width="18" height="10" rx="3" fill="#000"/>
      <line x1="78" y1="48" x2="82" y2="48" stroke="#000" stroke-width="2"/>
      <!-- Trenchcoat / Collar -->
      <path d="M 40 100 Q 80 80, 120 100 L 140 200 L 20 200 Z" fill="#1E2330"/>
    </g>

    <!-- Cardboard Sign "Hapa Kando Deals" -->
    <g transform="translate(25, 230)">
      <polygon points="0,0 290,-5 285,150 5,145" fill="#D97706" stroke="#92400E" stroke-width="3"/>
      <!-- Handwritten look text -->
      <text x="145" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#78350F" text-anchor="middle">"HAPA KANDO SPECIAL!"</text>
      <text x="145" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#000" text-anchor="middle">50% Cheaper Boss! (Cancel App)</text>
      <text x="145" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#92400E" text-anchor="middle">"Cash direct, no receipt, trust me bro!"</text>
      
      <!-- Giant Red Prohibition Stamp -->
      <circle cx="145" cy="85" r="48" fill="none" stroke="#DC2626" stroke-width="6" opacity="0.9"/>
      <line x1="110" y1="55" x2="180" y2="115" stroke="#DC2626" stroke-width="6" opacity="0.9"/>
    </g>

    <!-- Danger Explainer Callout Box -->
    <rect x="20" y="395" width="300" height="65" rx="10" fill="#450A0A" stroke="#DC2626" stroke-width="1.5"/>
    <text x="170" y="418" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FCA5A5" text-anchor="middle">OFFLINE = SAFETY SYSTEM ZERO</text>
    <text x="170" y="435" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#FECACA" text-anchor="middle">No GPS Tracking &#8226; No SOS &#8226; Insurance Voided</text>
    <text x="170" y="449" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#EF4444" text-anchor="middle">A few saved coins are not worth your life!</text>
  </g>

  <!-- CENTER: The Giant Golden 4-Digit PIN Vault Shield -->
  <g transform="translate(480, 140)" filter="url(#shield-shadow)">
    <!-- Massive Golden Shield -->
    <path d="M 270 20 L 490 80 L 490 320 C 490 440, 270 510, 270 510 C 270 510, 50 440, 50 320 L 50 80 Z" fill="#131520" stroke="url(#pin-gold)" stroke-width="6"/>
    
    <!-- Inner Glowing Crest -->
    <path d="M 270 45 L 465 100 L 465 310 C 465 410, 270 475, 270 475 C 270 475, 75 410, 75 310 L 75 100 Z" fill="#1B1E2E" stroke="#FACC15" stroke-width="2" opacity="0.8"/>

    <!-- Padlock Graphic Header -->
    <circle cx="270" cy="130" r="32" fill="#D4AF37"/>
    <rect x="256" y="90" width="28" height="25" rx="6" fill="none" stroke="#D4AF37" stroke-width="6"/>
    <circle cx="270" cy="130" r="6" fill="#000"/>

    <text x="270" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FACC15" text-anchor="middle" letter-spacing="2">THE UNBREAKABLE LOCK</text>
    <text x="270" y="218" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" text-anchor="middle">Confirm before stepping into any vehicle</text>

    <!-- 4-Digit PIN Display Boxes -->
    <g transform="translate(95, 240)">
      <rect x="0" y="0" width="75" height="95" rx="14" fill="#0F172A" stroke="#FACC15" stroke-width="3"/>
      <text x="37" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FACC15" text-anchor="middle">5</text>

      <rect x="90" y="0" width="75" height="95" rx="14" fill="#0F172A" stroke="#FACC15" stroke-width="3"/>
      <text x="127" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FACC15" text-anchor="middle">8</text>

      <rect x="180" y="0" width="75" height="95" rx="14" fill="#0F172A" stroke="#FACC15" stroke-width="3"/>
      <text x="217" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FACC15" text-anchor="middle">2</text>

      <rect x="270" y="0" width="75" height="95" rx="14" fill="#0F172A" stroke="#FACC15" stroke-width="3"/>
      <text x="307" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FACC15" text-anchor="middle">1</text>
    </g>

    <!-- Verification Badge -->
    <rect x="95" y="360" width="350" height="48" rx="24" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <circle cx="125" cy="384" r="10" fill="#10B981"/>
    <text x="125" y="388" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFF" text-anchor="middle">✓</text>
    <text x="245" y="389" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#A7F3D0" text-anchor="middle">RIDE SECURED &amp; TRIP PIN VERIFIED</text>
    <text x="270" y="435" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#E2E8F0" text-anchor="middle">Live GPS Telemetry &#8226; SOS Active &#8226; Insured</text>
  </g>

  <!-- RIGHT: Verified Cabi Sedan with Humorous Mother Bumper Sticker -->
  <g transform="translate(1060, 240)" filter="url(#shield-shadow)">
    <!-- Cab Body -->
    <path d="M 40 180 L 100 80 L 320 80 L 400 180 L 440 220 L 440 290 L 0 290 L 0 220 Z" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <!-- Rear windshield -->
    <polygon points="110,95 240,95 230,170 80,170" fill="#0284C7" opacity="0.4" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Humorous Bumper Sticker on Rear Window -->
    <rect x="60" y="115" width="220" height="42" rx="6" fill="#FACC15" stroke="#000" stroke-width="2"/>
    <text x="170" y="133" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9.5" fill="#000" text-anchor="middle">VERIFIED TRIPS ONLY 🛡️</text>
    <text x="170" y="147" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" fill="#1E293B" text-anchor="middle">"Even my mother checks the PIN!"</text>

    <!-- License Plate Tag -->
    <rect x="120" y="235" width="160" height="34" rx="4" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
    <rect x="122" y="237" width="22" height="30" fill="#1D4ED8"/>
    <text x="133" y="256" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#FFF" text-anchor="middle">KE</text>
    <text x="210" y="258" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#000" text-anchor="middle" letter-spacing="2">KDG 782P</text>

    <!-- Wheels -->
    <circle cx="80" cy="290" r="38" fill="#0F172A" stroke="#64748B" stroke-width="6"/>
    <circle cx="80" cy="290" r="14" fill="#D4AF37"/>
    <circle cx="360" cy="290" r="38" fill="#0F172A" stroke="#64748B" stroke-width="6"/>
    <circle cx="360" cy="290" r="14" fill="#D4AF37"/>
  </g>

  <!-- Bottom Title Ribbon -->
  <g transform="translate(800, 855)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" letter-spacing="0.5">THE SACRED PROMISE OF EVERY JOURNEY</text>
    <text y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#D4AF37" letter-spacing="2">SAFETY IS A HUMAN RIGHT &#183; REJECT "HAPA KANDO" &#183; PROTECT EACH OTHER</text>
  </g>
</svg>