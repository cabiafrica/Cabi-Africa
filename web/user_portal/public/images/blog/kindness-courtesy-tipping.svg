<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <title>Warmth, Courtesy, and Tipping on CABI Africa</title>
  <desc>Editorial illustration depicting everyday courtesy, mutual respect between riders and chauffeurs, and 100 percent mobile money tip pass-through with zero platform deductions.</desc>
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1017"/>
      <stop offset="50%" stop-color="#151722"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE088"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="rain-city" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A26"/>
      <stop offset="100%" stop-color="#2D2327"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-grad)"/>

  <!-- African Geometric Pattern Header Grid (Subtle) -->
  <g opacity="0.08" stroke="#D4AF37" stroke-width="1.5" fill="none">
    <pattern id="afro-diamonds" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z"/>
      <circle cx="30" cy="30" r="4" fill="#D4AF37"/>
    </pattern>
    <rect width="1600" height="900" fill="url(#afro-diamonds)"/>
  </g>

  <!-- Windshield Outer Frame -->
  <path d="M 120 70 L 1480 70 L 1580 540 L 20 540 Z" fill="url(#rain-city)" stroke="#222533" stroke-width="6"/>

  <!-- Rain Bokeh Cityscape in Background (Through Windshield) -->
  <g opacity="0.4">
    <!-- Skyline silhouettes -->
    <rect x="250" y="240" width="90" height="300" fill="#12131D"/>
    <rect x="360" y="180" width="130" height="360" fill="#0D0E17"/>
    <polygon points="425,110 360,180 490,180" fill="#0D0E17"/>
    <rect x="520" y="280" width="110" height="260" fill="#12131D"/>
    <rect x="950" y="210" width="140" height="330" fill="#0F101A"/>
    <rect x="1120" y="260" width="100" height="280" fill="#141520"/>
    <rect x="1240" y="190" width="120" height="350" fill="#0D0E17"/>
    
    <!-- Street bokeh lights (Nairobi night rain) -->
    <circle cx="280" cy="380" r="28" fill="#F59E0B" opacity="0.25" filter="url(#glow)"/>
    <circle cx="450" cy="420" r="35" fill="#EF4444" opacity="0.2" filter="url(#glow)"/>
    <circle cx="680" cy="360" r="22" fill="#10B981" opacity="0.25" filter="url(#glow)"/>
    <circle cx="1020" cy="390" r="32" fill="#F59E0B" opacity="0.3" filter="url(#glow)"/>
    <circle cx="1200" cy="350" r="24" fill="#3B82F6" opacity="0.25" filter="url(#glow)"/>
    <circle cx="1380" cy="410" r="38" fill="#EF4444" opacity="0.25" filter="url(#glow)"/>
  </g>

  <!-- Car Ahead in Traffic (Humorous Bumper Sticker) -->
  <g transform="translate(620, 240)" filter="url(#subtle-shadow)">
    <!-- Car silhouette ahead -->
    <rect x="40" y="90" width="280" height="130" rx="20" fill="#1E212D" stroke="#363A4A" stroke-width="4"/>
    <path d="M 60 90 L 95 30 L 265 30 L 300 90 Z" fill="#141620" stroke="#363A4A" stroke-width="4"/>
    <!-- Taillights -->
    <rect x="50" y="110" width="45" height="24" rx="8" fill="#EF4444" opacity="0.9" filter="url(#glow)"/>
    <rect x="265" y="110" width="45" height="24" rx="8" fill="#EF4444" opacity="0.9" filter="url(#glow)"/>
    <!-- Bumper Sticker -->
    <rect x="80" y="155" width="200" height="42" rx="6" fill="#FACC15" stroke="#000" stroke-width="2"/>
    <text x="180" y="174" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10.5" fill="#000" text-anchor="middle" letter-spacing="0.5">KINDNESS IS FREE</text>
    <text x="180" y="188" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#1F2937" text-anchor="middle">TIPPING IS LEGENDARY! 🤝</text>
  </g>

  <!-- Wiper blade with water wipe streak -->
  <path d="M 280 520 L 780 180" stroke="#374151" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 880 520 L 1380 190" stroke="#374151" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- Lower Interior Dashboard -->
  <path d="M 0 520 C 500 500, 1100 500, 1600 520 L 1600 900 L 0 900 Z" fill="#111319" stroke="#2D313E" stroke-width="4"/>
  <!-- Dashboard Accent Gold Line -->
  <path d="M 0 545 C 500 525, 1100 525, 1600 545" stroke="url(#gold-grad)" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Left Feature: Humorous Door Warning Sticker -->
  <g transform="translate(140, 580)" filter="url(#subtle-shadow)">
    <!-- Car Door Panel Frame -->
    <rect x="0" y="0" width="310" height="250" rx="18" fill="#1A1C24" stroke="#2F3342" stroke-width="3"/>
    <!-- Interior Door Handle -->
    <rect x="25" y="30" width="120" height="35" rx="10" fill="#2A2D3A" stroke="#4B5563" stroke-width="2"/>
    <circle cx="120" cy="47" r="7" fill="#D4AF37"/>
    
    <!-- Humorous Warning Badge -->
    <rect x="25" y="90" width="260" height="135" rx="14" fill="#FFFDF0" stroke="#D4AF37" stroke-width="3"/>
    <!-- Header banner in sticker -->
    <rect x="25" y="90" width="260" height="36" rx="12" fill="#D4AF37"/>
    <text x="155" y="113" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#000" text-anchor="middle" letter-spacing="1">GENTLE HANDS CLUB 🪶</text>
    
    <!-- Body text with humor -->
    <text x="155" y="148" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#111827" text-anchor="middle">Please Close Gently!</text>
    <text x="155" y="172" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#4B5563" text-anchor="middle">"It is a comfortable car door,</text>
    <text x="155" y="190" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#D97706" text-anchor="middle">not a matatu tailgate!"</text>
    <circle cx="50" cy="202" r="5" fill="#10B981"/>
    <text x="62" y="206" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#10B981">Driver's Blood Pressure: Normal</text>
  </g>

  <!-- Center Feature: The Dashboard Smart Phone (Mobile Money Tip Notification) -->
  <g transform="translate(680, 470)" filter="url(#subtle-shadow)">
    <!-- Phone Mount & Stand -->
    <rect x="100" y="270" width="40" height="70" rx="6" fill="#1F232E"/>
    <ellipse cx="120" cy="335" rx="55" ry="14" fill="#0A0B0E"/>

    <!-- Phone Body -->
    <rect x="0" y="0" width="240" height="330" rx="28" fill="#181920" stroke="#3E4354" stroke-width="5"/>
    <rect x="8" y="8" width="224" height="314" rx="22" fill="url(#screen-grad)"/>

    <!-- Speaker Bar -->
    <rect x="95" y="16" width="50" height="6" rx="3" fill="#0F172A"/>

    <!-- App Header -->
    <rect x="8" y="8" width="224" height="52" rx="20" fill="#047857"/>
    <circle cx="36" cy="34" r="14" fill="#10B981"/>
    <text x="36" y="39" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#FFF" text-anchor="middle">M</text>
    <text x="60" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFF">MOBILE MONEY</text>

    <!-- Notification Card -->
    <rect x="20" y="76" width="200" height="160" rx="16" fill="#FFFFFF" filter="url(#subtle-shadow)"/>
    <circle cx="120" cy="108" r="22" fill="#ECFDF5"/>
    <!-- Checkmark Icon -->
    <path d="M 110 108 L 117 115 L 131 99" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="120" y="146" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#065F46" text-anchor="middle">TIP RECEIVED!</text>
    <text x="120" y="174" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#047857" text-anchor="middle">+ KES 100</text>
    
    <line x1="36" y1="188" x2="204" y2="188" stroke="#E5E7EB" stroke-width="1"/>
    <text x="120" y="206" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#4B5563" text-anchor="middle">From: Amina N. (5 ★)</text>
    <text x="120" y="222" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#059669" text-anchor="middle">"Asante sana for the safe ride!"</text>

    <!-- Instant 0% Cut Callout below -->
    <rect x="20" y="250" width="200" height="52" rx="12" fill="#0F172A" stroke="#FACC15" stroke-width="1.5"/>
    <text x="120" y="271" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#FACC15" text-anchor="middle">CABI 100% PASS-THROUGH</text>
    <text x="120" y="289" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#94A3B8" text-anchor="middle">0% Platform Deductions on Tips</text>
  </g>

  <!-- Right Feature: Chai Mug & Mandazi Plate (Human Warmth & Relatable African Humor) -->
  <g transform="translate(1080, 560)" filter="url(#subtle-shadow)">
    <!-- Mandazi Plate -->
    <ellipse cx="260" cy="180" rx="140" ry="45" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
    <ellipse cx="260" cy="177" rx="120" ry="36" fill="#F8FAFC"/>
    
    <!-- Golden Triangle Mandazis -->
    <polygon points="210,135 270,175 190,195" fill="#D97706" stroke="#92400E" stroke-width="2.5"/>
    <polygon points="260,130 330,165 250,190" fill="#F59E0B" stroke="#B45309" stroke-width="2.5"/>
    
    <!-- Little witty toothpick flag on mandazi -->
    <line x1="280" y1="130" x2="280" y2="70" stroke="#78350F" stroke-width="2.5"/>
    <rect x="280" y="70" width="130" height="32" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="345" y="86" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9.5" fill="#92400E" text-anchor="middle">TIP-POWERED</text>
    <text x="345" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" fill="#B45309" text-anchor="middle">Mandazi &amp; Fuel ☕</text>

    <!-- Kenyan Enamel Tin Mug (Kombe la Chai) -->
    <ellipse cx="110" cy="200" rx="55" ry="18" fill="#0A0B0E" opacity="0.6"/>
    <!-- Mug Body -->
    <path d="M 60 90 L 70 190 C 70 205, 150 205, 150 190 L 160 90 Z" fill="#F8FAFC" stroke="#0284C7" stroke-width="4"/>
    <ellipse cx="110" cy="90" rx="50" ry="16" fill="#0284C7"/>
    <ellipse cx="110" cy="90" rx="44" ry="13" fill="#78350F"/>
    <!-- Blue rim characteristic of African enamel mugs -->
    <ellipse cx="110" cy="88" rx="49" ry="15" fill="none" stroke="#0284C7" stroke-width="3"/>
    <!-- Mug Handle -->
    <path d="M 155 105 C 195 105, 195 170, 150 170" fill="none" stroke="#0284C7" stroke-width="8" stroke-linecap="round"/>

    <!-- Steam rising into heart curves -->
    <path d="M 95 70 C 85 40, 110 30, 95 10" stroke="#FFF" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 115 65 C 130 35, 105 25, 125 -5" stroke="#FACC15" stroke-width="3.5" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 130 70 C 145 45, 135 25, 145 10" stroke="#FFF" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Elegant Title Ribbon -->
  <g transform="translate(800, 845)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" letter-spacing="0.5">THE CULTURE OF WARMTH</text>
    <text y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#D4AF37" letter-spacing="2">COURTESY COSTS NOTHING &#183; TIPPING EXTENDS DIGNITY &#183; UBUNTU ON THE ROAD</text>
  </g>
</svg>