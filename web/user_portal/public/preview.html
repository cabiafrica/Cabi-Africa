<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CABI Africa — Driver & Passenger Side-by-Side Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      background: #111111;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d4af37;
    }
    .header span {
      font-size: 12px;
      color: #9ca3af;
    }
    .grid {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      padding: 20px 24px;
      height: calc(100vh - 49px);
      overflow: auto;
    }
    .device-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      height: 100%;
    }
    .device-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #e5e7eb;
    }
    .device-label a {
      font-size: 11px;
      color: #d4af37;
      text-decoration: none;
    }
    .device-label a:hover {
      text-decoration: underline;
    }
    .phone-frame {
      width: 390px;
      height: min(810px, calc(100vh - 115px));
      min-height: 600px;
      border-radius: 28px;
      border: 2px solid rgba(212, 175, 55, 0.45);
      overflow: hidden;
      background: #0a0a0a;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .phone-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <a href="#main" style="position:absolute;left:-9999px;">Skip to main content</a>
  <header class="header">
    <div>
      <h1>CABI Africa — Live App Preview</h1>
      <span>Passenger (CABI Go) &amp; Driver (CABI Drive)</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/dual_emulator.html" style="background: rgba(212,175,55,0.15); border: 1px solid #d4af37; color: #ffd700; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px;">
        <span>📱 Open Dual Interactive Studio</span> ↗
      </a>
    </div>
  </header>
  <main id="main" class="grid">
    <section class="device-col">
      <div class="device-label">
        <span>Passenger App — CABI Go</span>
        <a href="/apps/passenger/index.html" target="_blank">Open standalone ↗</a>
      </div>
      <div class="phone-frame">
        <iframe id="iframePassenger" src="/apps/passenger/index.html?v=6" title="CABI Go Passenger App"></iframe>
      </div>
    </section>
    <section class="device-col">
      <div class="device-label">
        <span>Driver App — CABI Drive</span>
        <a href="/apps/driver/index.html" target="_blank">Open standalone ↗</a>
      </div>
      <div class="phone-frame">
        <iframe id="iframeDriver" src="/apps/driver/index.html?v=6" title="CABI Drive Driver App"></iframe>
      </div>
    </section>
  </main>
</body>
</html>
