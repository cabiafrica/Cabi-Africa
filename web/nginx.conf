server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Handle /api proxying if not using absolute URLs
    # location /api/ {
    #     proxy_pass https://auth-gateway-746659778850.us-central1.run.app/api/;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
