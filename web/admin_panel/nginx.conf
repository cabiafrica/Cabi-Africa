server {
    listen 8080;
    server_name localhost;

    # Serve static SPA files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api calls to auth-gateway for components using relative paths
    location /api/ {
        proxy_pass https://auth-gateway-746659778850.us-central1.run.app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host auth-gateway-746659778850.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
