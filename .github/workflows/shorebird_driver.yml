name: Shorebird Driver App OTA Updates

on:
  push:
    branches:
      - main # Restore to trigger on main branch
    paths:
      - 'mobile/driver_app/**' # Only run when code in driver_app changes
  workflow_dispatch:

jobs:
  shorebird-patch:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile/driver_app

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 📦 Get Packages
        run: shorebird flutter pub get

      - name: 🚀 Publish Shorebird Patch
        run: shorebird patch android --force
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
