name: Shorebird Passenger App OTA Updates

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/passenger_app/**'
  workflow_dispatch:

jobs:
  shorebird-patch:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile/passenger_app

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 📦 Get Packages
        run: flutter pub get

      - name: 🚀 Publish Shorebird Patch
        if: secrets.SHOREBIRD_TOKEN != ''
        run: shorebird patch android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: ℹ️ Skip Shorebird Notice
        if: secrets.SHOREBIRD_TOKEN == ''
        run: echo "SHOREBIRD_TOKEN secret not set in repository secrets. Skipping OTA patch (production APK releases are handled by release_passenger_apk.yml)."
