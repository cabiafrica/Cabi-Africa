name: Shorebird Passenger App OTA Updates

on:
  push:
    branches:
      - main # Change this if your main branch has a different name
    paths:
      - 'mobile/passenger_app/**' # Only run when code in passenger_app changes

jobs:
  shorebird-patch:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile/passenger_app

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
          cache: true

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 📦 Get Packages
        run: flutter pub get

      - name: 🚀 Publish Shorebird Patch
        run: shorebird patch android --force
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
