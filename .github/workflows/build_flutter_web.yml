name: Build Flutter Web (Passenger & Driver)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/passenger_app/**'
      - 'mobile/driver_app/**'
      - '.github/workflows/build_flutter_web.yml'
  workflow_dispatch:

jobs:
  build-web:
    name: Build Passenger & Driver Web Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter Stable
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics

      - name: Build Passenger Flutter Web
        working-directory: ./mobile/passenger_app
        run: |
          flutter pub get
          flutter build web --release --base-href /apps/passenger/ --dart-define=IS_PRODUCTION=true --no-tree-shake-icons --no-wasm-dry-run

      - name: Build Driver Flutter Web
        working-directory: ./mobile/driver_app
        run: |
          flutter pub get
          flutter build web --release --base-href /apps/driver/ --dart-define=IS_PRODUCTION=true --no-tree-shake-icons --no-wasm-dry-run

      - name: Upload Passenger Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passenger-web-bundle
          path: mobile/passenger_app/build/web/

      - name: Upload Driver Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-web-bundle
          path: mobile/driver_app/build/web/

      - name: 📦 Stage Web Bundles into User Portal
        run: |
          mkdir -p web/user_portal/public/apps/passenger web/user_portal/public/apps/driver
          cp -r mobile/passenger_app/build/web/* web/user_portal/public/apps/passenger/
          cp -r mobile/driver_app/build/web/* web/user_portal/public/apps/driver/
          git config user.name "ibnke"
          git config user.email "ke.africabi@gmail.com"
          git add web/user_portal/public/apps
          if ! git diff --staged --quiet; then
            git commit -m "chore(dist): auto-stage compiled Flutter web bundles into user portal"
            git push origin HEAD:main
          fi
