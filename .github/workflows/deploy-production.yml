name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Quality checks
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run linting
        run: npx nx affected --target=lint --parallel=3 --base=origin/main

      - name: Run tests
        run: npx nx affected --target=test --parallel=3 --base=origin/main --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/**/coverage-final.json

  # Database migrations
  migrate-database:
    name: Run Database Migrations
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}

      - name: Generate Prisma Client
        run: npx prisma generate

  # Deploy ALL services via Cloud Build (backends + frontends)
  deploy-all-services:
    name: Deploy via Cloud Build
    needs: migrate-database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Trigger Cloud Build
        run: gcloud builds submit --config=cloudbuild.yaml --project=${{ secrets.GCP_PROJECT_ID }} --timeout=3600s

  # Health checks
  post-deployment-checks:
    name: Post-Deployment Health Checks
    needs: deploy-all-services
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployments to stabilize
        run: sleep 30

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Check Cloud Run service health
        run: |
          # Backend services
          for svc in auth-gateway verification-service referral-service sacco-service dispatch-service driver-lead-service; do
            URL=$(gcloud run services describe $svc --region=us-central1 --format='value(status.url)' 2>/dev/null)
            if [ -n "$URL" ]; then
              curl -sf "$URL/api/health" --max-time 10 && echo "✅ $svc is healthy" || echo "⚠️ $svc health check failed"
            else
              echo "⚠️ $svc not found on Cloud Run"
            fi
          done

          # Frontend services (check HTTP 200)
          for svc in admin-panel dispatch-panel user-portal; do
            URL=$(gcloud run services describe $svc --region=us-central1 --format='value(status.url)' 2>/dev/null)
            if [ -n "$URL" ]; then
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL" --max-time 10)
              if [ "$STATUS" = "200" ]; then
                echo "✅ $svc is healthy (HTTP $STATUS)"
              else
                echo "⚠️ $svc returned HTTP $STATUS"
              fi
            else
              echo "⚠️ $svc not found on Cloud Run"
            fi
          done

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

  # Notifications (optional - only runs if secrets are configured)
  notify:
    name: Send Deployment Notifications
    needs: post-deployment-checks
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Production deployment completed successfully!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status: Success* ✅\n\n*Commit:* ${{ github.sha }}\n*Branch:* ${{ github.ref_name }}\n*Deployed by:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Production deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status: Failed* ❌\n\n*Commit:* ${{ github.sha }}\n*Branch:* ${{ github.ref_name }}\n*Deployed by:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create Sentry release
        if: success() && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: cabi-africa
        with:
          version: ${{ github.sha }}
