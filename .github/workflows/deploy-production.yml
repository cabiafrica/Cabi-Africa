name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_launch:
        description: 'Purge test/mock data and initialize clean Super Admin for market launch'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '20'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Quality checks
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate --schema=libs/backend/database/prisma/schema.prisma

      - name: Run linting on changed TypeScript files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR HEAD~1 -- '*.ts' '*.tsx' | grep -v '^e2e/' || true)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs npx eslint --quiet
          else
            echo "No changed TS/TSX files to lint."
          fi

      - name: Run tests
        run: npx nx affected --target=test --parallel=3 --base=HEAD~1 --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/**/coverage-final.json

  # Database migrations
  migrate-database:
    name: Run Database Migrations
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=libs/backend/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}

      - name: Generate Prisma Client
        run: npx prisma generate --schema=libs/backend/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}

      - name: Prepare Clean Launch Database (if requested)
        if: ${{ github.event.inputs.prepare_launch == 'true' }}
        run: node scripts/prepare-for-launch.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}

  # Deploy backend microservices to DigitalOcean Droplet
  deploy-droplet:
    name: Deploy to DigitalOcean Droplet
    needs: migrate-database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER || 'deploy' }}
          key: ${{ secrets.DROPLET_SSH_KEY || secrets.DO_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -euo pipefail
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            cd /opt/cabi-africa
            git fetch origin main
            git reset --hard origin/main
            chmod -R 755 /opt/cabi-africa/web/user_portal/public/downloads
            # Build auth-gateway first so all backend services share the cached npm ci + prisma layer
            for svc in auth-gateway dispatch-service verification-service referral-service sacco-service user-portal admin-panel dispatch-panel; do
              echo "=== Building $svc ==="
              docker compose build "$svc"
            done
            docker compose up -d --no-build
            docker compose up -d --force-recreate caddy
            docker compose exec -T auth-gateway npx prisma migrate deploy --schema=libs/backend/database/prisma/schema.prisma

  # Production Health checks
  post-deployment-checks:
    name: Production Health Checks
    needs: deploy-droplet
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to stabilize
        run: sleep 10

      - name: Run health checks
        run: |
          set -euo pipefail
          echo "Verifying live production endpoints..."
          endpoints=(
            "https://cabi.africa/health"
            "https://api.cabi.africa/health"
            "https://cabi.africa"
          )
          failed=0
          for url in "${endpoints[@]}"; do
            echo "Checking $url..."
            status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "✅ $url is UP (HTTP $status)"
            else
              echo "::error::❌ $url returned HTTP $status"
              failed=1
            fi
          done
          exit $failed

  # Deployment notifications
  send-notifications:
    name: Send Deployment Notifications
    needs: [post-deployment-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        if: success()
        run: echo "Deployment successful!"
      - name: Notify Slack on Failure
        if: failure()
        run: echo "Deployment failed!"
