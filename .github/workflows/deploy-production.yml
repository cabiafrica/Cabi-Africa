name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Quality checks
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        run: npx nx affected --target=lint --parallel=3 --base=origin/main

      - name: Run tests
        run: npx nx affected --target=test --parallel=3 --base=origin/main --code-coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/**/coverage-final.json

  # Build frontend applications
  build-frontend:
    name: Build ${{ matrix.app }}
    needs: quality-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: admin-panel
            dir: admin_panel
          - app: dispatch-panel
            dir: dispatch_panel
          - app: user-portal
            dir: user_portal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build ${{ matrix.app }}
        run: npx nx build ${{ matrix.app }} --configuration=production
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: |
            web/${{ matrix.dir }}/dist
            web/${{ matrix.dir }}/.next
          retention-days: 7

  # Build backend services
  build-backend:
    name: Build Backend Services
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend services
        run: |
          npx nx run-many --target=build \
            --projects=auth-gateway,verification-service,dispatch-service,driver-lead-service,referral-service,sacco-service \
            --parallel=3 \
            --configuration=production

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-services
          path: dist/
          retention-days: 7

  # Database migrations
  migrate-database:
    name: Run Database Migrations
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Generate Prisma Client
        run: npx prisma generate

  # Deploy User Portal (Next.js to Vercel)
  deploy-user-portal:
    name: Deploy User Portal
    needs: migrate-database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: user-portal-build
          path: web/user_portal

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: web/user_portal
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_USER_PORTAL_PROJECT_ID }}

  # Deploy Admin Panel (to Vercel/S3/etc)
  deploy-admin-panel:
    name: Deploy Admin Panel
    needs: migrate-database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-build
          path: web/admin_panel

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: web/admin_panel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PANEL_PROJECT_ID }}

  # Deploy Dispatch Panel
  deploy-dispatch-panel:
    name: Deploy Dispatch Panel
    needs: migrate-database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dispatch-panel-build
          path: web/dispatch_panel

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: web/dispatch_panel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DISPATCH_PANEL_PROJECT_ID }}

  # Deploy backends via Cloud Build
  deploy-backends:
    name: Deploy Backends via Cloud Build
    needs: migrate-database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Trigger Cloud Build
        run: gcloud builds submit --config=cloudbuild.yaml --project=${{ secrets.GCP_PROJECT_ID }} --timeout=3600s

  # Health checks
  post-deployment-checks:
    name: Post-Deployment Health Checks
    needs: [deploy-user-portal, deploy-admin-panel, deploy-dispatch-panel, deploy-backends]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployments to stabilize
        run: sleep 30

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Check Cloud Run backend health
        run: |
          for svc in auth-gateway verification-service referral-service sacco-service dispatch-service driver-lead-service; do
            URL=$(gcloud run services describe $svc --region=us-central1 --format='value(status.url)' 2>/dev/null)
            if [ -n "$URL" ]; then
              curl -sf "$URL/api/health" --max-time 10 && echo "✅ $svc is healthy" || echo "⚠️ $svc health check failed"
            else
              echo "⚠️ $svc not found on Cloud Run"
            fi
          done

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

  # Notifications (optional - only runs if secrets are configured)
  notify:
    name: Send Deployment Notifications
    needs: post-deployment-checks
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Production deployment completed successfully!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status: Success* ✅\n\n*Commit:* ${{ github.sha }}\n*Branch:* ${{ github.ref_name }}\n*Deployed by:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Production deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Status: Failed* ❌\n\n*Commit:* ${{ github.sha }}\n*Branch:* ${{ github.ref_name }}\n*Deployed by:* ${{ github.actor }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create Sentry release
        if: success() && env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: cabi-africa
        with:
          environment: production
          version: ${{ github.sha }}
