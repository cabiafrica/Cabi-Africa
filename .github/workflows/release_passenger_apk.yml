name: Build and Release Mobile APKs (Driver & Passenger)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/driver_app/**'
      - 'mobile/passenger_app/**'
      - '.github/workflows/release_passenger_apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_MAPS_API_KEY: AIzaSyA_ybfC1sxL4K92fKiuIsfHLkFK7sWl9-0

jobs:
  build-and-release:
    name: Build & Publish Production APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter Stable
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: 🚖 Build CABI Drive (Driver App) Production APK
        working-directory: ./mobile/driver_app
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --target-platform android-arm,android-arm64 --dart-define=IS_PRODUCTION=true --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../../Cabi-Drive-Official.apk

      - name: 📱 Build CABI Go (Passenger App) Production APK
        working-directory: ./mobile/passenger_app
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --target-platform android-arm,android-arm64 --dart-define=IS_PRODUCTION=true --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../../Cabi-Go-Official.apk

      - name: 📦 Stage APKs into User Portal Public Downloads
        run: |
          git checkout main
          git pull --rebase origin main
          mkdir -p web/user_portal/public/downloads
          cp Cabi-Drive-Official.apk web/user_portal/public/downloads/Cabi-Drive-Official.apk
          cp Cabi-Go-Official.apk web/user_portal/public/downloads/Cabi-Go-Official.apk
          git config user.name "ibnke"
          git config user.email "ke.africabi@gmail.com"
          git add -f web/user_portal/public/downloads/Cabi-Drive-Official.apk web/user_portal/public/downloads/Cabi-Go-Official.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore(mobile): publish fresh production Android APKs to user_portal/public/downloads"
            git push origin HEAD:main
          fi

      - name: 📦 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cabi-africa-production-apks
          path: |
            Cabi-Drive-Official.apk
            Cabi-Go-Official.apk

      - name: 🚀 Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0-prod' }}
          name: CABI Africa Official Mobile Apps (Production)
          make_latest: true
          files: |
            Cabi-Drive-Official.apk
            Cabi-Go-Official.apk
          body: |
            ### 🚖 CABI Africa Official Production Mobile Releases
            Connected to live `https://www.cabi.africa/api` production services.

            - **CABI Drive (Driver App)**: `Cabi-Drive-Official.apk` (`africa.cabi.driver`)
            - **CABI Go (Passenger App)**: `Cabi-Go-Official.apk` (`africa.cabi.passenger`)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
