name: CI Security & Test Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-and-supply-chain:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run workspace security scanner
        run: python3 .agent/skills/vulnerability-scanner/scripts/security_scan.py .

      - name: Audit npm dependencies (high/critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Run Trivy filesystem & Dockerfile scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  backend-and-web-tests:
    name: Lint, Typecheck & Unit Tests (Nx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate --schema=libs/backend/database/prisma/schema.prisma

      - name: Run Nx Lint (fail on errors)
        run: npx nx affected --target=lint --parallel=3 --base=origin/main

      - name: Run Nx Unit Tests with Coverage
        run: npx nx affected --target=test --parallel=3 --base=origin/main --coverage --ci

  flutter-tests:
    name: Flutter Static Analysis & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - mobile/driver_app
          - mobile/passenger_app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install packages
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests with Coverage
        working-directory: ${{ matrix.app }}
        run: flutter test --coverage
