id: story-101.3
epic: driver-settings
slug: driver-manage-notifications
title: Driver Manage Notification Preferences
status: DONE
author: Sarah (po)
date: '2024-08-12T18:00:00Z'

description: >
  As a driver, I want to control which notifications I receive (e.g., new rides, promotions)
  and through which channels (Push, SMS, Email), so that I am not overwhelmed by irrelevant alerts.

acceptance_criteria:
  - The `SettingsScreen` must include a "Notifications" section.
  - Drivers can toggle "New Ride Offers" (Push).
  - Drivers can toggle "Promotions & Incentives" (Push/Email).
  - Drivers can toggle "System Updates" (Email).
  - Changes must be saved immediately to the `settings-service`.
  - The backend must respect these settings when dispatching notifications (mocked for now).

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart
  - libs/backend/settings-service/src/lib/settings.service.ts

dev_notes: >
  We will extend the existing `UserSettings` interface in the backend to include a `notifications` object.
  The frontend will use `SwitchListTile` widgets for the toggles.

tasks:
  - id: task-1
    description: Update backend settings schema.
    subtasks:
      - "[x] Update `UserSettings` interface in `settings.service.ts`."
      - "[x] Update mock data to include default notification preferences."
  - id: task-2
    description: Implement frontend notification toggles.
    subtasks:
      - "[x] Add notification switches to `settings_screen.dart`."
      - "[x] Wire up switches to the `updateSettings` API call."

