id: story-29.3
epic: lost-and-found
slug: lost-item-return-fee
title: Implement Lost Item Return Fee
status: Done
author: Bob (sm)
date: '2024-07-27T09:03:00Z'

description: >
  As a driver, I want to be compensated for my time and effort when I return
  a lost item to a passenger. As a passenger, I understand a fee may be
  charged for the return service.

acceptance_criteria:
  - When a "lost item" ticket is marked as "Item Returned" by a support agent (`story-29.2`), the system must trigger a fee transaction.
  - A configurable "return fee" must be charged to the passenger's default payment method via the `payment-service`.
  - The full amount of this fee must be credited to the driver's earnings wallet.
  - The `support-service` must initiate this transaction by calling the `payment-service`.
  - Both the passenger and driver must be notified of the fee transaction.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To trigger the fee on ticket resolution
  - libs/backend/payment-service/src/lib/payment.service.ts # To process the return fee and credit the driver

dev_notes: >
  This story adds a financial component to the lost and found workflow, creating a fair system that compensates drivers for going out of their way. The fee should be a fixed, configurable amount.