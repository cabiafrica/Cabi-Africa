id: story-68.1
epic: lost-and-found
slug: lost-item-shipping
title: Implement "Lost and Found" Shipping
status: Done
author: Bob (sm)
date: '2024-08-06T09:18:00Z'

description: >
  As a passenger who lost an item, if I cannot meet with the driver, I want
  the option to have the item shipped to me.

acceptance_criteria:
  - In the lost and found workflow (`story-29.1`), if direct contact fails, the support agent can offer a shipping option.
  - The passenger provides their shipping address and pays for the shipping cost plus a service fee.
  - The platform provides the driver with a pre-paid shipping label to send the item.
  - This requires integration with a shipping provider's API (e.g., Shippo, EasyPost).

files_to_be_created: []

files_to_be_modified:
  - apps/admin-panel/src/app/support/lost-and-found/page.tsx # To add the shipping option for agents
  - libs/backend/support-service/src/lib/support.service.ts # To integrate with shipping APIs

dev_notes: >
  This is the first story for a new `lost-and-found` epic. It provides a convenient resolution for lost items when a physical meetup isn't practical.