id: story-29.5
epic: lost-and-found
slug: lost-item-return-fee
title: Implement Lost Item Return Fee
status: DONE
author: Bob (sm)
date: '2024-08-09T16:15:00Z'

description: >
  As a driver, I want to be compensated with a standard fee for my time and
  effort in returning a lost item to a passenger.

acceptance_criteria:
  - A standard, fixed "Return Fee" is defined (e.g., $15).
  - After a driver successfully returns an item, they can tap a "Confirm Return" button in their app.
  - This action triggers the `payment-service` to charge the passenger the return fee and credit it to the driver's account.
  - The passenger is notified of the charge.
  - The support ticket is updated to show the item has been returned and the fee has been processed.

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle the fee transaction
  - Cabi Alpha/mobile/driver_app/lib/screens/newsfeed_screen.dart # To add the "Confirm Return" button

dev_notes: >
  This feature incentivizes drivers to participate in the lost and found process. The fee should be clearly communicated to the passenger when they first report the item.
