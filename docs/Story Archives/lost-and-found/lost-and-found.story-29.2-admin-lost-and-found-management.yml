id: story-29.2
epic: lost-and-found
slug: admin-lost-and-found-management
title: Admin Interface for Lost and Found Management
status: Done
author: Bob (sm)
date: '2024-07-26T10:01:00Z'

description: >
  As a customer support agent, I want an interface to view and manage all
  "lost and found" tickets, so that I can help facilitate the return of items
  when direct user contact fails.

acceptance_criteria:
  - A new "Lost & Found" page must be added to the "Support Center" in the `admin-panel`.
  - The page must list all lost and found tickets with their status (e.g., 'New', 'Contacting Driver', 'Item Returned', 'Closed').
  - Clicking a ticket must show the details, including the passenger, driver, trip information, and any messages exchanged.
  - The agent must be able to update the status of the ticket.
  - The agent must be able to add internal notes to the ticket.
  - The `support-service` must expose secure, admin-only endpoints to list and update these tickets.

files_to_be_created:
  - apps/admin-panel/src/app/support/lost-and-found/page.tsx

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.controller.ts # To add admin endpoints for lost & found
  - libs/backend/support-service/src/lib/support.service.ts # To implement management logic

dev_notes: >
  This story provides the necessary tooling for agents to handle escalations from the automated workflow in `story-29.1`. It's a crucial part of the customer support experience.