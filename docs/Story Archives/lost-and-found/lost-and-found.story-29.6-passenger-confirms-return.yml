id: story-29.6
epic: lost-and-found
slug: passenger-confirms-return
title: Allow Passenger to Confirm Item Return
status: Done
author: Bob (sm)
date: '2024-08-09T16:20:00Z'

description: >
  As a passenger, after my item is returned, I want to confirm in the app that
  I have received it, which will close the support ticket.

acceptance_criteria:
  - After a driver confirms the return (`story-29.5`), the passenger receives a notification asking them to confirm receipt.
  - The passenger can confirm or deny receipt of the item via a prompt in their app.
  - If confirmed, the support ticket is automatically moved to a "Resolved" status.
  - If denied, the support ticket is flagged for immediate manual review by a support agent.

files_to_be_modified:
  - apps/passenger-app/src/screens/trip_history_screen.dart # To add the confirmation prompt
  - libs/backend/support-service/src/lib/support.service.ts # To handle the final ticket status update

dev_notes: >
  This is the final step that closes the loop on the automated workflow. The "deny" path is a critical exception case that ensures a human agent can intervene if something goes wrong.