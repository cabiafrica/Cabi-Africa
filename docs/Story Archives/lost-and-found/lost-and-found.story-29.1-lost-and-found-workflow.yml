id: story-29.1
epic: lost-and-found
slug: lost-and-found-workflow
title: Implement "Lost and Found" Workflow
status: Done
author: Bob (sm)
date: '2024-07-25T09:04:00Z'

description: >
  As a passenger, if I realize I've left an item in a car, I want an easy way
  to report it and contact the driver through the app. As a driver, I want to
  be able to report that I've found an item.

acceptance_criteria:
  - In the `passenger-app`, on the `TripDetailScreen`, a "Report Lost Item" button must be present.
  - Tapping this button initiates a "lost item" ticket in the `support-service`.
  - The workflow should first attempt to connect the passenger and driver directly via an anonymized call or chat for a limited time (e.g., 24 hours post-trip).
  - If direct contact fails or is not possible, the ticket is escalated to a human support agent.
  - In the `driver-app`, a "Found an Item" option should be available on their `TripDetailScreen`.
  - This allows the driver to report finding an item for a specific trip, which also creates or updates a support ticket.
  - The `support-service` must manage the state of these lost and found tickets.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/trip_detail_screen.dart # To add "Report Lost Item"
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_detail_screen.dart # To add "Found an Item"
  - libs/backend/support-service/src/lib/support.service.ts # To manage lost and found tickets
  - libs/backend/notification-service/src/lib/notification.service.ts # To facilitate anonymized communication

dev_notes: >
  This is the first story for a new `lost-and-found` epic. This is a common and important support scenario. The ideal solution facilitates direct (but anonymized) communication between passenger and driver first, only involving a support agent when necessary to save resources.
