id: story-29.4
epic: lost-and-found
slug: coordinate-item-return
title: Coordinate Lost Item Return
status: DONE
author: Bob (sm)
date: '2024-08-09T16:10:00Z'

description: >
  As a support agent, after a driver confirms they have a passenger's lost
  item, I need a streamlined process to coordinate the return of the item.

acceptance_criteria:
  - When a driver responds "I found the item" (`story-29.3`), the support ticket in the `support-service` must be updated to a new status, like "Return Pending".
  - The `notification-service` must send a notification to the passenger informing them their item has been found.
  - The `support-service` must provide a secure, private communication channel (or a masked phone number) between the passenger and the driver to arrange a meetup.
  - The support ticket must remain open until the passenger confirms they have received their item.
  - Once the passenger confirms receipt, the support agent can close the ticket, which resolves the lost item report.

files_to_be_created:
  - apps/admin-panel/src/app/support/ticket-view.tsx # To add UI for managing the return process

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To handle the new ticket status and communication channel logic
  - libs/backend/notification-service/src/lib/notification.service.ts # To send the "Item Found" notification to the passenger

dev_notes: >
  This story bridges the gap between the driver finding an item and the passenger getting it back. The most critical part is establishing a secure and private way for the two parties to communicate without exposing personal contact information. A masked calling/messaging feature via a third-party service (like Twilio) is the recommended approach. This story focuses on the backend logic and the support agent's view; a later story will cover the passenger's UI for confirming receipt.

tasks:
  - id: task-1
    description: Update backend services to handle the item return workflow.
    subtasks:
      - "[x] Modify `handleDriverLostItemResponse` in `support.service.ts` to update the ticket status to 'Return Pending' when an item is found."
      - "[x] Integrate the `notification-service` to send a notification to the passenger when their item is found."
      - "[ ] Add logic to `support.service.ts` to facilitate secure communication (placeholder for now)."

