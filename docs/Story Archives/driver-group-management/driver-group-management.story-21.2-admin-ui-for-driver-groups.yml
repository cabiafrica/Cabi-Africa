id: story-21.2
epic: driver-group-management
slug: admin-ui-for-driver-groups
title: Implement Admin UI for Driver Groups
status: DONE
author: Bob (sm)
date: '2024-06-05T18:00:00Z'

description: >
  As an admin user, I want a basic UI in the user portal to view a list of
  existing driver groups and create new ones, so that I can manage driver
  groupings for organizational or payment purposes.

acceptance_criteria:
  - A new page/route for "Driver Groups" is created in the `user-portal` (Angular app).
  - The page displays a list of existing driver groups.
  - The page includes a form with a text input and a "Create Group" button.
  - Clicking "Create Group" with a name entered should add the new group to the list.
  - The list should update dynamically without a page reload.
  - For this story, the data can be managed in-memory within the component's state. No backend API integration is required yet.

files_to_be_created:
  - Cabi Alpha/web/user_portal/src/app/pages/driver-groups/driver-groups.component.ts
  - Cabi Alpha/web/user_portal/src/app/pages/driver-groups/driver-groups.component.html
  - Cabi Alpha/web/user_portal/src/app/pages/driver-groups/driver-groups.component.scss

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/app/app.routes.ts
  - Cabi Alpha/web/user_portal/src/app/app.component.html # To add navigation

dev_notes: >
  This story sets up the foundational UI for driver group management in the admin portal. The focus is on the frontend component structure and basic state management. We will use a simple in-memory array to simulate the data source. Future stories will connect this to a real backend service.
