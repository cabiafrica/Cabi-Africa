id: story-21.1
epic: driver-group-management
slug: backend-for-driver-groups
title: Implement Backend for Driver Group Hierarchy
status: DONE
author: Sarah (po)
date: '2024-07-24T10:00:00Z'

description: >
  As a backend developer, I need to implement the necessary data models and API
  endpoints to support a hierarchical structure for driver groups, so that
  administrators can organize drivers and the system can support MLM functionalities.

acceptance_criteria:
  - The Prisma schema must be updated to include a `DriverGroup` model as defined in the `architecture.md` document.
  - The `DriverGroup` model must support a self-referencing relationship to enable parent-child hierarchies (subgroups).
  - The `DriverProfile` model must be updated with a foreign key to link a driver to a `DriverGroup`.
  - The `MLM Service` must be updated with new REST API endpoints for CRUD (Create, Read, Update, Delete) operations on `DriverGroup` entities.
  - The API must allow assigning a driver to a group.
  - All new API endpoints must be documented in the OpenAPI specification.

files_to_be_created:
  # This will likely involve creating new controller/service/module files within the mlm-service app.
  - apps/mlm-service/src/driver-groups/driver-groups.controller.ts
  - apps/mlm-service/src/driver-groups/driver-groups.service.ts
  - apps/mlm-service/src/driver-groups/driver-groups.module.ts

files_to_be_modified:
  - docs/architecture.md # To add new endpoints to the OpenAPI spec and potentially update schema.

qa_results:
  - reviewer: Quinn
    date: '2024-07-26T15:00:00Z'
    decision: PASS
    summary: >-
      The backend implementation for the driver group hierarchy is complete. All API endpoints as defined in the architecture document have been implemented and are functioning as expected. The Prisma schema has been updated correctly. The story meets all acceptance criteria.
