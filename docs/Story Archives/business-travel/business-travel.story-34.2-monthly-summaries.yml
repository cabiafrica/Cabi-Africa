id: story-34.2
epic: business-travel
slug: monthly-summaries
title: Implement Monthly Business Travel Summaries
status: Done
author: Bob (sm)
date: '2024-08-09T19:00:00Z'

description: >
  As a passenger who uses a business profile, I want to receive a monthly
  summary of my business trips sent to my work email, so that I can easily
  file my expenses.

acceptance_criteria:
  - A new background job must be created, likely in a new `reporting-service`.
  - The job should run on the first day of each month.
  - It should find all users who have a business profile with a work email.
  - For each user, it should gather all their "Business" trips from the previous month.
  - The summary must be sent to the user's registered work email via the `notification-service`.

files_to_be_created:
  - libs/backend/reporting-service/src/lib/reporting.service.ts

dev_notes: >
  This builds on the business profiles feature. The main challenge is creating a scalable background job. For this implementation, we will simulate the job and focus on the logic for gathering data and triggering the email.

tasks:
  - id: task-1
    description: Implement backend service to generate and email monthly summaries.
    subtasks:
      - "[x] Create `libs/backend/reporting-service/src/lib/reporting.service.ts`."
      - "[x] Implement a `generateMonthlySummaries` method to simulate the background job."
      - "[x] The method should fetch users with business profiles and their business trips."
      - "[x] Integrate with a mock `notification-service` to send the summary email."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
