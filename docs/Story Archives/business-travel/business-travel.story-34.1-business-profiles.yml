id: story-34.1
epic: business-travel
slug: business-profiles
title: Implement Business Profiles for Passengers
status: Done
author: Bob (sm)
date: '2024-07-28T10:06:00Z'

description: >
  As a passenger who travels for work, I want to create a business profile
  with a separate payment method and email for receipts, so that I can easily
  manage and expense my business travel.

acceptance_criteria:
  - A new "Business Profile" section must be added to the `passenger-app` settings.
  - Users can create a business profile by adding a work email and a business payment method.
  - Before confirming a ride, the user must be able to select whether the trip is "Personal" or "Business".
  - If "Business" is selected, the ride must be charged to the business payment method, and the receipt sent to the work email.
  - The trip history must clearly label trips as "Personal" or "Business".
  - The `user-service` must be updated to store business profile information (work email, business payment method ID).
  - The `payment-service` must be able to charge a specific payment method provided with the payment request.

files_to_be_created:
  - apps/passenger-app/src/screens/business_profile_screen.dart

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_confirmation_panel.dart # To add the profile switcher
  - libs/backend/user-service/src/lib/user.service.ts # To store business profile data
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle charging a specific card

dev_notes: >
  This is the first story for a new `business-travel` epic. It's a key feature for attracting corporate customers. The main challenge is ensuring the correct payment method and email are used based on the user's selection for each trip.

tasks:
  - id: task-1
    description: Add a "Business Profile" section to the passenger's settings screen.
    subtasks:
      - "[x] Create `apps/passenger-app/src/screens/business_profile_screen.dart` with a form for work email, expense code, and payment method."
  - id: task-2
    description: Update backend to store and manage business profiles.
    subtasks:
      - "[x] Update the user data model in `user-service` to include business profile fields."
      - "[x] Create a `PUT /users/me/business-profile` endpoint in `user-service`."
      - "[x] Implement the service logic to save the profile data."
  - id: task-3
    description: Add a "Personal/Business" profile switcher to the ride confirmation UI.
    subtasks:
      - "[x] Create `apps/passenger-app/src/widgets/ride_confirmation_panel.dart` to include the switcher."

