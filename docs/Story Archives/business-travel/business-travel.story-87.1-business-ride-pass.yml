id: story-87.1
epic: business-travel
slug: business-ride-pass
title: Implement "Ride Pass" for Business Accounts
status: Done
author: Bob (sm)
date: '2024-08-08T11:18:00Z'

description: >
  As a corporate administrator, I want to be able to purchase a bulk "Ride
  Pass" for all my employees, giving them the benefits of the pass under our
  corporate account.

acceptance_criteria:
  - In the `corporate-portal`, an admin can purchase a subscription that applies Ride Pass benefits (`story-38.2`) to all employees linked to the account.
  - The `payment-service` must handle this corporate-level subscription billing.
  - When an employee books a ride under their business profile, the `ride-service` must check for and apply the corporate Ride Pass benefits.

files_to_be_created: []

files_to_be_modified:
  - apps/corporate-portal/src/app/billing/page.tsx # To add subscription management
  - libs/backend/ride-service/src/lib/fare.service.ts # To check for corporate subscriptions

dev_notes: >
  This makes our subscription product available to our B2B customers, creating a new, predictable revenue stream.