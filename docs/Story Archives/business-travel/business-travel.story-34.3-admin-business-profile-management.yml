id: story-34.3
epic: business-travel
slug: admin-business-profile-management
title: Admin Management of Business Profiles
status: Done
author: Bob (sm)
date: '2024-07-29T14:09:00Z'

description: >
  As an administrator, I want to view which users have created business
  profiles and manage corporate accounts, so that I can support our business clients.

acceptance_criteria:
  - The `admin-panel` must have a new "Business Accounts" page.
  - This page should list all corporate entities that have registered (from `story-33.2`).
  - It should also allow admins to view individual users who have set up a business profile (`story-34.1`).
  - Admins must be able to link individual business profiles to a parent corporate account.
  - Admins must be able to view all trips taken under a corporate account for billing and support purposes.

files_to_be_created:
  - apps/admin-panel/src/app/business/page.tsx

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To add logic for linking profiles to companies
  - libs/backend/user-service/src/lib/user.controller.ts # To add admin endpoints for management

dev_notes: >
  This story provides the necessary back-office tools for managing the B2B side of our platform. It connects the individual business profiles with the overarching corporate accounts.
