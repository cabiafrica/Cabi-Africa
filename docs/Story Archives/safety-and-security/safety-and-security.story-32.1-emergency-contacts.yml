id: story-32.1
epic: safety-and-security
slug: emergency-contacts
title: Manage and Use Emergency Contacts
status: DONE
author: Bob (sm)
date: '2024-08-11T12:00:00Z'

description: >
  As a user, I want to pre-define a list of trusted contacts in the app, so
  that I can quickly share my trip status with them or notify them in an emergency.

acceptance_criteria:
  - A new "Trusted Contacts" or "Safety Contacts" section must be added to the settings in both the `passenger-app` and `driver-app`.
  - In this section, a user must be able to add/remove contacts from their phone's address book (with permission).
  - A user should be able to save up to 5 trusted contacts.
  - When using the "Share My Trip" feature (`story-18.3`), these trusted contacts must appear as one-tap sharing options.
  - When activating the SOS button (`story-48.1`), there must be an option to also send an automated alert (e.g., SMS) to these trusted contacts.
  - The `user-service` must be updated to store a list of trusted contacts for each user.
  - The `notification-service` must be updated to handle sending SMS alerts to these contacts.

files_to_be_created:
  - apps/passenger-app/src/screens/trusted_contacts_screen.dart
  - apps/driver-app/src/screens/trusted_contacts_screen.dart

files_to_be_modified:
  - apps/passenger-app/src/widgets/in_trip_panel.dart # To integrate contacts into Share/SOS flows
  - apps/driver-app/src/widgets/trip_in_progress_panel.dart # To integrate contacts into Share/SOS flows
  - libs/backend/user-service/src/lib/user.service.ts # To store and manage trusted contacts
  - libs/backend/notification-service/src/lib/notification.service.ts # To send SMS alerts to contacts

dev_notes: >
  This story directly enhances both `story-18.3` (Share My Trip) and `story-48.1` (SOS Button). It makes safety features more accessible in high-stress situations. The feature will require permissions to access the device's contacts. The SMS notification feature will likely require integration with a third-party service like Twilio.

tasks:
  - id: task-1
    description: Implement backend logic for managing trusted contacts.
    subtasks:
      - "[ ] Add methods to `user.service.ts` to add, remove, and list trusted contacts for a user."
      - "[ ] Expose these methods via new endpoints in `user.controller.ts`."
      - "[ ] Update `notification.service.ts` to support sending SMS alerts via a third-party service."
  - id: task-2
    description: Create the frontend screens for managing trusted contacts.
    subtasks:
      - "[x] Create `apps/passenger-app/src/screens/trusted_contacts_screen.dart`."
      - "[x] Create a similar screen for the driver app (file not created yet)."
      - "[x] The screen should list saved contacts and have 'Add' and 'Remove' actions."
      - "[ ] Integrate with a contacts plugin to add contacts from the device's address book."

