id: story-32.1
epic: safety-and-security
slug: driver-manage-emergency-contacts
title: Driver Manage Emergency Contacts
status: DONE
author: Sarah (po)
date: '2024-08-10T20:30:00Z'

description: >
  As a driver, I want to add and manage trusted emergency contacts so that
  they can be notified in case of an emergency during a ride.

acceptance_criteria:
  - The Driver App must have an `EmergencyContactsScreen`.
  - Drivers can view a list of existing contacts.
  - Drivers can add a new contact by providing a Name and Phone Number.
  - Drivers can delete an existing contact.
  - The app must persist these contacts via the `safety-service`.
  - The UI should handle empty states (no contacts) gracefully.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/emergency_contacts_screen.dart
  - libs/backend/safety-service/src/lib/emergency-contact.service.ts
  - libs/backend/safety-service/src/lib/emergency-contact.controller.ts

dev_notes: >
  This is the configuration step for the safety feature. The actual "SOS" or
  "Share Ride Details" features will utilize the data stored by this story.

tasks:
