id: story-48.1
epic: safety-and-security
slug: in-app-emergency-button
title: Implement In-App Emergency (SOS) Button
status: DONE
author: Bob (sm)
date: '2024-08-11T11:00:00Z'

description: >
  As a passenger or driver, I want an easily accessible emergency button in the
  app during an active ride, so that I can quickly get help if I feel unsafe.

acceptance_criteria:
  - A prominent "SOS" or "Emergency" button must be visible on the in-trip screen for both the `passenger-app` and `driver-app`.
  - Tapping the button must present a confirmation dialog to prevent accidental activation.
  - Upon confirmation, the app must provide options to either call local emergency services (e.g., 911) or a dedicated 24/7 platform safety line.
  - When the button is activated, the `safety-service` must be silently notified in the background.
  - The notification to the `safety-service` must include the user's details, the current trip ID, and the device's last known GPS location.
  - This event must create a high-priority incident ticket in the `support-service` for immediate follow-up by a safety agent.

files_to_be_created:
  - libs/backend/safety-service/src/lib/safety.service.ts # To handle incoming SOS signals
  - libs/backend/safety-service/src/lib/safety.controller.ts

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/in_trip_panel.dart # To add the SOS button
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart # To add the SOS button
  - libs/backend/support-service/src/lib/support.service.ts # To handle high-priority incident creation

dev_notes: >
  This is the foundational story for the `safety-and-security` epic. It's a critical feature that must be highly reliable. The UI should be very clear and easy to use under stress. The backend event logging is crucial for the safety team's response. A new `safety-service` is proposed to encapsulate this and future safety-related logic.

tasks:
  - id: task-1
    description: Implement the backend safety-service and incident creation logic.
    subtasks:
      - "[x] Create `libs/backend/safety-service/src/lib/safety.service.ts` and `safety.controller.ts`."
      - "[x] Add a `handleSosSignal` method to the service."
      - "[x] The method should log the event and create a high-priority incident in the `support-service` (simulated for now)."
      - "[x] Expose this method via a `POST /safety/sos` endpoint."
  - id: task-2
    description: Implement the frontend SOS button for both apps.
    subtasks:
      - "[ ] Add a prominent SOS button to `Cabi Alpha/mobile/passenger_app/lib/widgets/in_trip_panel.dart`."
      - "[ ] Add a prominent SOS button to `Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart`."
      - "[ ] Implement a confirmation dialog to prevent accidental activation."
      - "[ ] On confirmation, call the new backend endpoint with trip and location data."

