id: story-64.2
epic: admin-and-permissions
slug: granular-permissions
title: Implement Granular Admin Permissions
status: DONE
author: Bob (sm)
date: '2024-08-06T09:14:00Z'

description: >
  As a senior administrator, I want to create custom roles with specific
  permissions (e.g., a "Payouts Manager" who can only access payout-related
  pages), so that I can enforce the principle of least privilege.

acceptance_criteria:
  - The `admin-panel` must have a "Roles & Permissions" management page.
  - An admin can create a new role and assign specific permissions to it (e.g., "view:drivers", "edit:drivers", "manage:payouts").
  - The backend APIs must be protected by these granular permissions.
  - The admin panel UI must dynamically show/hide pages and controls based on the logged-in user's permissions.

files_to_be_created: []

files_to_be_modified:
  - All backend controllers to add granular permission decorators.
  - All pages in `apps/admin-panel` to check for specific permissions.

dev_notes: >
  This story evolves our admin security from simple roles to a full-fledged Role-Based Access Control (RBAC) system. It's a significant undertaking but essential for a secure, large-scale operation.