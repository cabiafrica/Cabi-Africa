id: story-64.4
epic: admin-and-permissions
slug: admin-action-audit
title: Implement Admin Action Audit Log
status: DONE
author: Bob (sm)
date: '2024-08-08T11:10:00Z'

description: >
  As a senior administrator, I want a specific log of all state-changing
  actions taken by other administrators (e.g., issuing a refund, suspending a
  user), so that we have a clear audit trail for accountability.

acceptance_criteria:
  - This is a more focused version of the general audit log (`story-25.9`).
  - A new "Admin Actions" log must be created.
  - Every backend endpoint intended for admin use that modifies data must log the action, the admin who performed it, the target (e.g., `userId`), and the data that was changed.
  - This log must be tamper-proof and easily searchable in the admin panel.

files_to_be_created: []

files_to_be_modified:
  - All backend controllers with admin-only, state-changing endpoints.

dev_notes: >
  A critical security and accountability feature. This can be implemented with a NestJS interceptor or guard that logs the details of any request made by an authenticated admin.