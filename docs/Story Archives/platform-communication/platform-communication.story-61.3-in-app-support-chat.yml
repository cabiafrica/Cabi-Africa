id: story-61.3
epic: platform-communication
slug: in-app-support-chat
title: Enable Real-time In-App Chat for Support Tickets
status: DONE
author: Bob (sm)
date: '2024-08-09T15:05:00Z'

description: >
  As a user (passenger or driver), I want to chat with a support agent
  directly within the app about my support ticket, so that I can get help
  quickly and conveniently without relying on email.

acceptance_criteria:
  - When a user views a support ticket within the `passenger-app` or `driver-app`, a real-time chat interface must be available.
  - This interface must connect to the agent's view from `story-62.2`.
  - Messages must be sent and received in real-time (e.g., via WebSockets).
  - The `support-service` must be enhanced to facilitate this real-time communication.
  - Users must receive a push notification when an agent replies to their chat.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/support_chat_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/support_chat_screen.dart

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To integrate a real-time chat layer
  - libs/backend/support-service/src/lib/support.controller.ts # To handle chat connections
