id: story-61.7
epic: platform-communication
slug: admin-message-scheduling
title: Allow Admins to Schedule Newsfeed Messages
status: DONE
author: Bob (sm)
date: '2024-08-09T15:25:00Z'

description: >
  As an operations manager, I want to schedule newsfeed messages to be sent
  at a future date and time, so that I can plan communications in advance.

acceptance_criteria:
  - The `admin-panel` communications interface must be updated with a date/time picker to schedule a message.
  - When a message is scheduled, it should be stored in the `notification-service` with a "scheduled" status.
  - A background job or cron task must run periodically to check for scheduled messages that are due to be sent.
  - When a message is due, its status changes to "sent," and it is broadcast to the target audience (drivers or passengers).

files_to_be_modified:
  - apps/admin-panel/src/app/communications/page.tsx # To add scheduling UI
  - libs/backend/notification-service/src/lib/notification.service.ts # To handle scheduled state and a background job

dev_notes: >
  This requires a reliable background task runner (e.g., cron, BullMQ). The system must be resilient to server restarts and handle time zones correctly.
