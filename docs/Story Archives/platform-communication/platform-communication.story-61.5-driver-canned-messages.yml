id: story-61.5
epic: platform-communication
slug: driver-canned-messages
title: Enable Driver-to-Passenger Canned Messages
status: DONE
author: Bob (sm)
date: '2024-08-09T15:15:00Z'

description: >
  As a driver on my way to pick up a passenger, I want to send quick,
  pre-defined messages (e.g., "I'm here," "Stuck in traffic") to the
  passenger, so I can communicate safely while driving.

acceptance_criteria:
  - A "Message Passenger" button must be available in the `driver-app` after accepting a trip.
  - Tapping the button reveals a list of pre-defined, translatable messages (e.g., "I've arrived," "I'll be there in 5 minutes").
  - Sending a message triggers a push notification and an in-app message to the `passenger-app`.
  - The `notification-service` must be updated to route these trip-specific messages between users.

files_to_be_modified:
  - apps/driver-app/src/widgets/trip_in_progress_panel.dart # To add the message button
  - apps/passenger-app/src/widgets/driver_details_panel.dart # To display received messages
  - libs/backend/notification-service/src/lib/notification.service.ts # To handle peer-to-peer messaging

dev_notes: >
  This is the first step towards in-trip communication. Using canned messages is a safety feature to minimize driver distraction. The list of messages should be configurable and localized.
