id: story-61.4
epic: platform-communication
slug: driver-news-read-receipts
title: Implement Read Receipts for Driver Newsfeed Messages
status: DONE
author: Bob (sm)
date: '2024-08-09T15:10:00Z'

description: >
  As an operations manager, I want to see which drivers have read the
  messages I've sent to the newsfeed, so that I can track the reach of
  important announcements.

acceptance_criteria:
  - When a driver opens a message in the `driver-app` newsfeed, an event must be sent to the backend to mark it as "read".
  - The `notification-service` must store the read status for each driver and message.
  - In the `admin-panel`, when viewing a sent message, the admin must be able to see a list of drivers who have read it and the total read count.
  - The `driver-app` must visually distinguish between read and unread messages in the newsfeed list.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/newsfeed_screen.dart # To send read events and update UI
  - libs/backend/notification-service/src/lib/notification.service.ts # To store and expose read receipts
  - apps/admin-panel/src/app/communications/page.tsx # To display read receipt data

dev_notes: >
  This feature provides valuable feedback to the operations team. The implementation should be efficient to avoid overwhelming the backend with read events, possibly by batching them or sending them on a slight delay.
