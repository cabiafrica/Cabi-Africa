id: story-1.2
epic: core-ride-hailing-experience
slug: passenger-login
title: "Passenger: Log in with phone number and password"
status: DONE FOR REVIEW
author: Bob (sm)
date: '2024-08-14T14:00:00Z'

description: >
  As a returning passenger, I want to log in to the app using my phone number
  and password, so that I can access my account and book a ride.

acceptance_criteria:
  - The `LoginScreen` in the `passenger-app` must have input fields for "Phone Number" and "Password".
  - The form must validate that both fields are not empty before submission.
  - When the user submits the form, the app must call the backend login endpoint.
  - On successful authentication, the backend returns authentication tokens (e.g., JWT).
  - The app must securely store the tokens and navigate the user to the `HomeScreen`.
  - If authentication fails, the app must display a clear error message (e.g., "Invalid phone number or password").

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/login_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/api/auth_service.dart
  - Cabi Alpha/mobile/passenger_app/lib/providers/auth_provider.dart

dev_notes: >
  This is a re-creation of the core login story. The implementation should use the existing `AuthService` and `AuthProvider` to manage state and interact with the Cognito backend. The focus is on ensuring the login flow is robust and provides clear user feedback.

tasks:
  - id: task-1
    description: Implement Login UI and Logic.
    subtasks:
      - "[x] Update `LoginScreen` with form fields and validation."
      - "[x] Update `AuthService` to handle the `login` call to the live backend."
      - "[x] Ensure `AuthProvider` correctly handles the returned token and updates the app state."
      - "[x] Implement error handling for failed login attempts."
  - id: task-2
    description: Write comprehensive tests for the login flow.
    subtasks:
      - "[x] Write widget tests for `LoginScreen` to cover successful login, failed login, and form validation."

