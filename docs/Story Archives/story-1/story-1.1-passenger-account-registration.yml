id: story-1.1
epic: core-ride-hailing-experience
slug: passenger-account-registration
title: "Passenger: Register for an account using phone number and OTP"
status: DONE
author: Bob (sm)
date: '2024-08-14T10:00:00Z'

description: >
  As a new passenger, I want to register for an account using my phone number
  and a password, so that I can start using the service.

acceptance_criteria:
  - The Flutter `passenger-app` must have a registration screen with input fields for "Full Name", "Phone Number", and "Password".
  - The phone number field must validate input to match a Kenyan format (e.g., starts with `+254` or `07`/`01`).
  - The password must meet minimum complexity requirements.
  - When the user submits the form, the app must call the backend registration endpoint.
  - The system must send a One-Time Password (OTP) via SMS to the provided phone number.
  - The app must navigate to a new screen prompting the user to enter the received OTP.
  - Upon successful verification, a new user record must be created in the backend.
  - After successful registration and verification, the user must be automatically logged in and redirected to the passenger home screen.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/registration_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/otp_verification_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/api/auth_service.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/login_screen.dart

dev_notes: >
  This is a re-creation of a foundational story to align with our current architecture. The implementation should leverage the existing Cognito integration (`story-6.1`) for all authentication calls. The UI should be clean and the flow from registration to OTP verification must be seamless.

tasks:
  - id: task-1
    description: Implement Registration and OTP UI and Logic.
    subtasks:
      - "[x] Create `RegistrationScreen` with form fields and validation."
      - "[x] Create `OtpVerificationScreen` for OTP input."
      - "[x] Update `AuthService` to handle `register` and `verifyOtp` calls to the live backend."
      - "[x] Implement the navigation flow from registration to OTP to the home screen."
  - id: task-2
    description: Write comprehensive tests for the registration flow.
    subtasks:
      - "[x] Write widget tests for `RegistrationScreen` to cover form validation and submission."
      - "[x] Write widget tests for `OtpVerificationScreen` to cover OTP submission and error handling."

