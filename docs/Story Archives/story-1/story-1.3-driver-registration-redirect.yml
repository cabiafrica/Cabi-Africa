id: story-1.3
epic: core-ride-hailing-experience
slug: driver-registration-redirect
title: "Driver: Redirect to web portal for registration"
status: Done
author: Bob (sm)
date: '2024-08-14T16:00:00Z'

description: >
  As a prospective driver in the Driver App, I want to tap a "Register" button
  that redirects me to the CABI web portal, so that I can begin the official
  registration process.

acceptance_criteria:
  - The Flutter `driver-app`'s login screen must have a clearly visible "Register" or "Become a Driver" button.
  - When the button is tapped, the app must launch the device's default web browser.
  - The browser must open the URL for the driver registration page on the `web-portal`.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart
  - apps/driver-app/pubspec.yaml

dev_notes: >
  This is a simple but important story for driver acquisition. The implementation should use the `url_launcher` package. The URL for the web portal should be stored as a configurable environment variable, not hardcoded, to support different environments.

tasks:
  - id: task-1
    description: Implement the redirect functionality.
    subtasks:
      - "[x] Add the `url_launcher` package to the `driver-app`'s `pubspec.yaml`."
      - "[x] Add a 'Register to Drive' button to the `LoginScreen`."
      - "[x] Implement the logic to launch the driver registration URL when the button is tapped."
  - id: task-2
    description: Write tests for the redirect.
    subtasks:
      - "[x] Write a widget test for the `LoginScreen` to verify that tapping the button attempts to launch the correct URL."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  file_list:
    - Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart
    - apps/driver-app/pubspec.yaml
  change_log:
    - file: apps/driver-app/pubspec.yaml
      change: Added the `url_launcher` dependency.
    - file: Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart
      change: Added a 'Register to Drive' button that launches the configured web portal URL.

qa_results:
