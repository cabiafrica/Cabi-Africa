id: story-24.3
epic: customer-support
slug: admin-support-chat-interface
title: Implement Support Agent Chat Interface in Admin Panel
status: Done
author: Bob (sm)
date: '2024-07-22T10:01:00Z'

description: >
  As a customer support agent, I want a chat interface within the admin panel
  where I can view and respond to incoming support requests from users, so that
  I can provide timely assistance.

acceptance_criteria:
  - A new "Support Center" or "Live Chat" page must be added to the `admin-panel`.
  - This page must display a list of active and pending support conversations initiated by users via `story-24.2`.
  - The list should show the user's name, the start time of the conversation, and a status (e.g., 'New', 'Open', 'Resolved').
  - Clicking on a conversation must open a chat window displaying the full message history.
  - The agent must be able to type and send messages to the user from this interface.
  - The `support-service` must handle routing messages from the admin panel to the correct user's device via the app.
  - If a third-party chat solution (e.g., Zendesk) is used, this story involves embedding or integrating its agent dashboard into the `admin-panel`.

files_to_be_created:
  - apps/admin-panel/src/app/support/page.tsx

files_to_be_modified:
  - apps/admin-panel/src/components/layout/sidebar.tsx # To add link to the new page
  - libs/backend/support-service/src/lib/support.controller.ts # To add admin-facing endpoints for sending messages and fetching conversations
  - libs/backend/support-service/src/lib/support.service.ts # To implement agent-side chat logic

dev_notes: >
  This story is the administrative counterpart to the in-app chat feature from `story-24.2`. It closes the loop by providing the tools for support agents to do their work. The complexity will vary greatly depending on whether we build a basic internal tool or integrate a feature-rich third-party service.
