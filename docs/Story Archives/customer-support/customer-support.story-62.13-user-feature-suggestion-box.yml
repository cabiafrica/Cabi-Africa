id: story-62.13
epic: platform-feedback-and-suggestions
slug: user-feature-suggestion-box
title: Provide In-App Feature Suggestion Box
status: DONE
author: Bob (sm)
date: '2024-08-10T14:00:00Z'

description: >
  As a passenger or driver, I want a dedicated place in the app to submit
  feature suggestions or general feedback, so that I can contribute to the
  platform's improvement.

acceptance_criteria:
  - A new "Feedback & Suggestions" option must be added to the main menu/settings screen in both the `passenger-app` and `driver-app`.
  - This option should lead to a simple form with a text area for the user to write their feedback.
  - Submitting the form must create a new ticket in the `support-service` with a "Suggestion" category.
  - The user should receive a confirmation message after successfully submitting their feedback.
  - The `support-service` must store the suggestion and associate it with the user's ID.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/feedback_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/feedback_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/main_drawer.dart # To add the menu link
  - Cabi Alpha/mobile/driver_app/lib/widgets/main_drawer.dart # To add the menu link
  - libs/backend/support-service/src/lib/support.service.ts # To handle the new "Suggestion" ticket type
