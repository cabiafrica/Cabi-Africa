id: story-24.4
epic: customer-support
slug: user-view-past-tickets
title: Allow User to View Past Support Tickets and Replies
status: Done
author: Bob (sm)
date: '2024-07-14T09:00:00Z'

description: >
  As a user (driver or passenger), I want to view a list of my past support
  tickets and read the replies from the support team, so I can track the
  status of my issues and refer back to our conversations.

acceptance_criteria:
  - A new "My Tickets" or "Support History" option must be added to the `HelpCenterScreen` in both the `passenger-app` and `driver-app`.
  - This option must navigate to a new `TicketListScreen`.
  - The `TicketListScreen` must fetch and display a list of all tickets submitted by the current user from the `support-service`.
  - Each ticket in the list must show its subject, status (e.g., 'New', 'In Progress', 'Resolved'), and the date of the last update.
  - Tapping on a ticket must navigate to a `TicketDetailScreen`.
  - The `TicketDetailScreen` must display the full, chronological conversation history for that ticket, including the user's messages and the support agent's replies.
  - If a ticket's status is not 'Resolved', the user must be able to post a new reply from the `TicketDetailScreen`.
  - The `support-service` must expose new, secure, user-specific endpoints for fetching a list of tickets and the details of a single ticket.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/ticket_list_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/ticket_detail_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/ticket_list_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/ticket_detail_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/help_center_screen.dart # To add link to "My Tickets"
  - Cabi Alpha/mobile/driver_app/lib/screens/help_center_screen.dart # To add link to "My Tickets"
  - libs/backend/support-service/src/lib/support.controller.ts # To add user-facing endpoints
  - libs/backend/support-service/src/lib/support.service.ts # To implement logic for fetching user-specific tickets

dev_notes: >
  This story completes the two-way communication loop for the support feature. The new endpoints in the `support-service` are critical and must be secured to ensure a user can only ever access their own tickets. When a user adds a reply, the system should ideally notify the admin panel in real-time that a ticket has been updated. This story provides the user with a complete history of their interactions with the support team.
