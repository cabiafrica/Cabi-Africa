id: story-62.15
epic: platform-feedback-and-suggestions
slug: feedback-shipped-notification
title: Notify Users When Their Suggested Feature is Shipped
status: Done
author: Mary (analyst)
date: '2024-08-10T11:25:00Z'

description: >
  As a user who submitted feedback, I want to be notified when a feature I
  suggested is implemented, so I know my voice was heard and can start using
  the new feature.

acceptance_criteria:
  - When an admin changes the status of a feedback item to "Shipped" in the dashboard (`story-62.14`), a backend process is triggered.
  - The process must gather all user IDs associated with that feedback item, including any that were linked as duplicates.
  - The `notification-service` must then send a personalized push notification to each of these users.
  - The content of the notification should be configurable and should thank the user for their suggestion.

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To trigger the notification process on status change.
  - libs/backend/notification-service/src/lib/notification.service.ts # To handle sending the batch of personalized notifications.

dev_notes: >
  This feature is critical for closing the feedback loop and making users feel valued. It turns the feedback system from a simple collection tool into a powerful community engagement engine.
