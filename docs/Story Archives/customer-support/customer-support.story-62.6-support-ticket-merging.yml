id: story-62.6
epic: customer-support
slug: support-ticket-merging
title: Allow Agents to Merge Duplicate Support Tickets
status: Done
author: Bob (sm)
date: '2024-08-10T01:35:00Z'

description: >
  As a support agent, when a user submits multiple tickets about the same
  issue, I want to be able to merge them into a single ticket, so I can manage
  the conversation efficiently.

acceptance_criteria:
  - In the support agent dashboard (`story-62.1`), an agent must be able to select multiple tickets from the same user.
  - An action to "Merge Tickets" must be available.
  - When merged, the conversation history from all selected tickets is combined into one primary ticket, and the others are closed.

files_to_be_modified:
  - apps/admin-panel/src/app/support/page.tsx # To add the merge UI
  - libs/backend/support-service/src/lib/support.service.ts # To handle the merge logic

dev_notes: >
  This is a quality-of-life improvement for the support team that helps keep the ticket queue clean and conversations centralized.
