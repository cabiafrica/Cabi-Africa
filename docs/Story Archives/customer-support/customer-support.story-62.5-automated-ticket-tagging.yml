id: story-62.5
epic: customer-support
slug: automated-ticket-tagging
title: Implement Automated Support Ticket Tagging
status: Done
author: Bob (sm)
date: '2024-08-09T23:55:00Z'

description: >
  As a support manager, I want the system to automatically tag incoming
  support tickets based on keywords in the user's message, so they can be
  routed to the correct agent or prioritized more effectively.

acceptance_criteria:
  - The `support-service` must analyze the content of new support tickets.
  - Using a configurable set of keywords, the service should automatically apply tags (e.g., "payment," "safety," "lost item," "feedback").
  - The support agent dashboard (`story-62.1`) must allow agents to filter the ticket queue by these tags.

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To add the analysis and tagging logic
  - apps/admin-panel/src/app/support/page.tsx # To add filtering by tags

dev_notes: >
  This feature can dramatically improve the efficiency of the support team by automating the triage process. The initial implementation can use simple keyword matching, with the potential for ML-based classification later.
