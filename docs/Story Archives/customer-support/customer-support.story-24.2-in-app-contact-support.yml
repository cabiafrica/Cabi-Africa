id: story-24.2
epic: customer-support
slug: in-app-contact-support
title: Implement In-App Contact Support / Live Chat
status: Done
author: Bob (sm)
date: '2024-07-20T09:05:00Z'

description: >
  As a user (driver or passenger), I want to be able to contact customer
  support directly from within the app, so that I can get personalized
  assistance for issues not covered by FAQs.

acceptance_criteria:
  - A "Contact Support" or "Live Chat" option must be added to the `HelpCenterScreen` (`story-24.1`) in both apps.
  - Tapping this option must navigate to a new `SupportChatScreen`.
  - The `SupportChatScreen` must allow the user to send text messages to a support agent.
  - A new backend `support-service` must be created to manage support tickets and chat sessions.
  - The `support-service` should integrate with a third-party live chat solution (e.g., Zendesk Chat, Intercom) or provide a basic internal chat interface for agents.
  - Messages sent by the user must be routed to the support system, and responses from agents must be displayed in real-time in the app.
  - The chat history for an ongoing support conversation should be persistent.
  - The `support-service` must associate chat sessions with the user's ID and relevant `tripId` if the chat is initiated from an active trip context.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/support_chat_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/support_chat_screen.dart
  - libs/backend/support-service/src/lib/support.service.ts
  - libs/backend/support-service/src/lib/support.controller.ts
  - libs/backend/support-service/src/lib/support.module.ts

files_to_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/help_center_screen.dart # To add the contact support option
  - Cabi Alpha/mobile/driver_app/lib/screens/help_center_screen.dart # To add the contact support option

dev_notes: >
  This story moves beyond self-service to direct customer support. Integrating with a dedicated live chat solution is recommended for scalability and agent tooling. The `support-service` will act as an intermediary, routing messages and managing the lifecycle of support conversations.
