id: story-62.11
epic: customer-support
slug: knowledge-base-integration-for-agents
title: Integrate Help Center into Agent View
status: Done
author: Bob (sm)
date: '2024-08-10T05:25:00Z'

description: >
  As a support agent, when I'm viewing a ticket, I want to be able to quickly
  search our Help Center (`story-62.3`) and insert links to articles into my reply.

acceptance_criteria:
  - In the agent's ticket detail view, there must be a panel or button to search the Help Center knowledge base.
  - The agent can search for articles and with one click, insert a link to the article into their reply text.
  - This helps agents answer questions quickly and consistently by referring users to existing documentation.

files_to_be_modified:
  - apps/admin-panel/src/app/support/[ticketId]/page.tsx # To add the knowledge base search UI

dev_notes: >
  This feature improves agent efficiency and promotes the use of the self-service Help Center.
