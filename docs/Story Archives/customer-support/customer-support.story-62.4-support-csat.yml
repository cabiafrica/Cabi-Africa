id: story-62.4
epic: customer-support
slug: support-csat-survey
title: Implement Post-Support Interaction Survey (CSAT)
status: Done
author: Bob (sm)
date: '2024-08-09T22:30:00Z'

description: >
  As a user, after my support ticket is resolved, I want a simple way to rate
  my support experience, so I can provide feedback on the service I received.

acceptance_criteria:
  - After a support ticket is moved to "Resolved" status, the user receives a push notification or in-app prompt asking them to rate the support interaction.
  - The rating is a simple scale (e.g., 1-5 stars or a thumbs up/down).
  - The results of these surveys must be visible to admins in a new analytics section of the support dashboard, tied to the agent who handled the ticket.

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To trigger the survey
  - apps/admin-panel/src/app/support/page.tsx # To display CSAT analytics

dev_notes: >
  This closes the feedback loop for the support team, allowing managers to track agent performance and overall customer satisfaction with the support process.
