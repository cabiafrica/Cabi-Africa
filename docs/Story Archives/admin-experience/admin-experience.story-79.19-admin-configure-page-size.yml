id: story-79.19
epic: admin-experience
slug: admin-configure-page-size
title: "Admin: Configure Page Size on Approvals List"
status: DONE
author: Bob (sm)
date: '2024-08-20T18:30:00Z'

description: >
  As an administrator, I want to be able to change the number of items displayed
  per page on the approvals list, so that I can view more or fewer drivers at a
  time based on my preference.

acceptance_criteria:
  - The approvals page (`/approvals`) must have a dropdown or selector to choose the page size (e.g., 10, 25, 50).
  - The selected page size must be stored in the URL query parameters (e.g., `?limit=25`).
  - The number of drivers displayed on the page must match the selected limit.
  - Changing the page size should reset the current page to 1 to avoid being on a non-existent page.

files_to_be_modified:
  - apps/admin-panel/src/app/approvals/page.tsx # To add the page size selector.

dev_notes: >
  This is a small but useful UX enhancement building on the pagination feature. The backend already supports a `limit` parameter, so this is purely a frontend change. We'll add a selector and manage its state via URL search parameters, consistent with other filters on the page.

tasks:
  - id: task-1
    description: "Add a page size selector to the approvals list page."
  - id: task-2
    description: "Connect the selector to the URL state and API calls."