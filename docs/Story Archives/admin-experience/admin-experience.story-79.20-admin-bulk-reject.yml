id: story-79.20
epic: admin-experience
slug: admin-bulk-reject-documents
title: "Admin: Bulk Reject Documents"
status: DONE
author: Bob (sm)
date: '2024-09-05T14:05:00Z'

description: >
  As an admin, I want to reject multiple driver applications at once with a single, common reason,
  so that I can process the approval queue more efficiently, especially when dealing with common submission errors.

acceptance_criteria:
  - A new endpoint, `POST /admin/drivers/bulk-reject`, must be created in the backend.
  - The endpoint must accept a request body containing an array of `driverIds` and a `rejectionReason` string.
  - The endpoint must utilize the existing `documentService.bulkRejectDrivers` method to perform the operation.
  - The Admin Panel UI (the driver approval queue) must be updated to allow selecting multiple drivers via checkboxes.
  - A "Bulk Reject" action button should be available on the queue page.
  - Clicking "Bulk Reject" should open a modal prompting the admin to enter a rejection reason.
  - Submitting the modal should call the new endpoint with the selected driver IDs and the reason.
  - Upon successful completion, the driver list in the UI should be refreshed to reflect the changes.

files_to_be_modified:
  - libs/backend/document-service/src/lib/document.controller.ts # To add the new POST /admin/drivers/bulk-reject endpoint.
  - # The file for the driver approval queue view in the admin panel app (e.g., `apps/admin-panel/src/views/DriverApprovalQueue.vue`).

dev_notes: >
  The backend logic for this feature is already implemented in the `bulkRejectDrivers` method within `document.service.ts`. The primary work involves creating a new controller endpoint to expose this logic and then building the necessary UI components in the admin panel. This includes adding checkboxes to the driver list, a modal for inputting the reason, and the client-side logic to call the new API.