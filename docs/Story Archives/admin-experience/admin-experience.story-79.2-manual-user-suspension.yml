id: story-79.2
epic: admin-experience
slug: manual-user-suspension
title: Enable Manual User Suspension and Deactivation
status: Done
author: Bob (sm)
date: '2024-08-09T21:05:00Z'

description: >
  As a support or safety agent, I need the ability to manually suspend or
  deactivate a user's account (passenger or driver) in response to a serious
  safety incident or terms of service violation.

acceptance_criteria:
  - On the user detail page in the `admin-panel`, there must be buttons to "Suspend" and "Deactivate" a user.
  - "Suspend" should temporarily block the user from accessing the service, with the ability for an admin to lift the suspension.
  - "Deactivate" should be a more permanent action (though reversible by an admin).
  - An internal note must be required for any suspension or deactivation, explaining the reason.
  - The `user-service` must enforce the account status, blocking logins and ride requests for suspended/deactivated users.

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx # To add the action buttons
  - libs/backend/user-service/src/lib/user.service.ts # To handle the account status logic

dev_notes: >
  This is a critical safety and operations tool. All actions must be logged for auditing. The distinction between a temporary suspension and a deactivation is important.

tasks:
  - id: task-1
    description: Implement backend logic for user status changes.
    subtasks:
      - "[x] Add an `updateUserStatus` method to `user.service.ts`."
      - "[x] The method must require a `reason` for the change and log it."
      - "[x] Expose this method via a new `PUT /users/:id/status` endpoint in `user.controller.ts`."
  - id: task-2
    description: Implement frontend UI for suspending and deactivating users.
    subtasks:
      - "[x] Convert `apps/admin-panel/src/app/users/[userId]/page.tsx` to a client component to handle interaction."
      - "[x] Add 'Suspend' and 'Deactivate' buttons to the page."
      - "[x] Implement `onClick` handlers that prompt for a reason before calling the backend."
      - "[x] The UI should refresh to show the user's new status."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
    - >-
      All tasks are complete. The `user-service` has been updated to handle
      status changes with a mandatory reason for auditing. The user detail
      page in the admin panel now includes 'Suspend' and 'Deactivate' buttons
      that prompt for a reason and update the user's status via the new
      backend endpoint.
  file_list:
    - c:/Users/User/Desktop/Cabi-Flutter/user.service.ts
    - c:/Users/User/Desktop/Cabi-Flutter/user.controller.ts
    - c:/Users/User/Desktop/Cabi-Flutter/page.tsx
  change_log:
