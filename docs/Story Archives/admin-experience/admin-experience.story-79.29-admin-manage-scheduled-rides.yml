id: story-79.29
epic: admin-experience
slug: admin-manage-scheduled-rides
title: "Admin: Manage and Oversee Scheduled Rides"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T10:00:00Z'

description: >
  As an administrator, I need a dedicated section to view, manage, and oversee all scheduled rides,
  so that I can ensure operational efficiency and handle customer inquiries or cancellations.

acceptance_criteria:
  - A new "Scheduled Rides" section must be added to the `admin-panel`.
  - This section must display a paginated and filterable list of all rides with a status of 'scheduled'.
  - Filters should include date range and passenger name/ID.
  - Each ride in the list must show key details: Ride ID, Passenger Name, Pickup Time, Origin, Destination, and Status.
  - Clicking a ride must navigate to a detailed view.
  - From the detailed view, an admin must be able to cancel the scheduled ride.
  - The `ride-service` must expose new admin-protected endpoints for listing and canceling scheduled rides.

files_to_be_created:
  - apps/admin-panel/src/app/scheduled-rides/page.tsx
  - apps/admin-panel/src/app/scheduled-rides/[rideId]/page.tsx
  - libs/shared/dtos/src/lib/ride.dto.ts
  - docs/admin-experience.story-79.29-admin-manage-scheduled-rides.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This story provides a key operational tool for the admin team, allowing them to proactively manage the schedule. This is crucial for handling pre-booked VIP journeys, airport transfers, and addressing customer support requests related to future rides. The backend endpoints should be secured for admin access only.

