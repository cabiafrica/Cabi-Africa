id: story-79.6
epic: admin-experience
slug: admin-view-driver-document-history
title: "Admin: View Driver's Document Submission History"
status: DONE
author: Bob (sm)
date: '2024-08-20T15:10:00Z'

description: >
  As an administrator, when reviewing a driver's documents or profile, I need to
  see the full submission history for each of their documents, so that I can
  understand their previous attempts, identify recurring issues, and make a more
  informed approval or rejection decision.

acceptance_criteria:
  - On the admin document review page (`/approvals/[driverId]`), there must be a "View History" button or link for each document.
  - Clicking "View History" must open a modal or navigate to a view that displays a chronological list of all submissions for that specific document type and driver.
  - Each entry in the history log must display the submission date, the status it received (e.g., "Rejected", "Approved"), and the rejection reason if applicable.
  - The backend must expose an admin-protected endpoint to fetch the full submission history for a specific driver.

files_to_be_created:
  - apps/admin-panel/src/components/approvals/document_history_modal.tsx

files_to_be_modified:
  - apps/admin-panel/src/app/approvals/[driverId]/page.tsx # To add the "View History" button and modal.
  - libs/backend/document-service/src/lib/admin-document.controller.ts # To expose the history endpoint for admins.

dev_notes: >
  This feature provides crucial context for administrators. The backend logic for fetching history already exists in `document.service.ts` (`findHistoryForUser`). The main task is to expose this method through the `AdminDocumentController` and then build a frontend component (likely a modal for good UX) to display this data on the approvals page.

tasks:
  - id: task-1
    description: "Expose the `findHistoryForUser` method via a new admin-protected endpoint."
  - id: task-2
    description: "Create a `DocumentHistoryModal` component in the admin panel to display the historical data."
  - id: task-3
    description: "Integrate the modal into the main document review page, triggered by a 'View History' button."
