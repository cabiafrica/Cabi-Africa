id: story-79.21
epic: admin-experience
slug: admin-read-only-role
title: "Admin: Implement Read-Only Access Role"
status: DONE
author: Gemini Code Assist
date: '2025-12-03T15:00:00Z'

description: >
  As a super-administrator, I want to grant a 'Read-Only' role to certain admin users,
  so that they can view platform data and dashboards without being able to make any changes, ensuring data integrity and reducing operational risk.

acceptance_criteria:
  - A new 'ReadOnly' role must be added to the system's role-based access control (RBAC) configuration.
  - When an admin user with the 'ReadOnly' role is logged in, all UI elements that perform write actions (e.g., 'Save', 'Delete', 'Suspend', 'Approve', 'Reject' buttons, form inputs) must be disabled or hidden.
  - All backend API endpoints that perform write operations (POST, PUT, PATCH, DELETE) must be protected by a guard or middleware.
  - This guard must check the user's role and reject requests from users with the 'ReadOnly' role.
  - The backend must return a `403 Forbidden` status code if a read-only user attempts a write operation.
  - Read-only users must still be able to navigate all views, view lists of data (e.g., drivers, users), see detail pages, and access reports.

files_to_be_created:
  - libs/backend/auth/src/guards/roles.guard.ts # A new guard to check user roles on backend endpoints.

files_to_be_modified:
  - # All backend controllers with write operations (e.g., document.controller.ts, user.controller.ts) will need to be decorated with the new RolesGuard.
  - c:/Users/User/Desktop/Cabi-Flutter/docs/document.service.ts # Example: The DocumentController will need the new guard.
  - # The frontend components in `apps/admin-panel` will need to be updated to conditionally render/disable controls based on the user's role.
  - c:/Users/User/Desktop/Cabi-Flutter/docs/page.tsx # Example: The Bulk Reject button would be disabled for a read-only user.

dev_notes: >
  This story implements a critical security feature from the PRD (section 2.3). The implementation will have two main parts: backend enforcement and frontend UI adaptation.

  On the backend, a new `RolesGuard` should be created. This guard will be applied to all controllers or specific endpoints that perform mutations. It will inspect the role from the authenticated user's JWT or session and deny access if the role is 'ReadOnly'.

  On the frontend, the user's role should be available in a global state or context after login. Components with action buttons (like the `BulkRejectModal` in `page.tsx` or the suspend button in `story-79.3`) will need to check this role to disable or hide themselves accordingly. This provides a better user experience than just letting the user click a button and see an API error.
  PRD Reference: 2.3. Admin Panel -> Admin Read-Only Role