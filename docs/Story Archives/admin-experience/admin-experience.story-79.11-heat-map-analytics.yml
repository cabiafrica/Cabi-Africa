id: story-79.11
epic: admin-experience
slug: admin-heat-map-analytics
title: Create Heat Map Analytics View
status: DONE
author: Bob (sm)
date: '2024-08-10T05:10:00Z'

description: >
  As a city manager, I want to see heat maps of historical ride demand and
  driver supply, so I can identify patterns and areas of opportunity.

acceptance_criteria:
  - In the `admin-panel`, a new "Heat Maps" section must be available.
  - The admin can select a time range and view heat maps for: ride requests (demand), available drivers (supply), and surge pricing application.
  - This allows for analysis of where and when the market is imbalanced.

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To aggregate data for heat maps
  - apps/admin-panel/src/app/live-map/page.tsx # Or a new /heat-maps page

dev_notes: >
  This is a powerful data visualization tool for operations. It helps make informed decisions about where to direct driver incentives or run passenger promotions.