id: story-79.13
epic: admin-experience
slug: admin-simulation-mode
title: Create Marketplace Simulation Mode
status: Done
author: Bob (sm)
date: '2024-08-10T06:15:00Z'

description: >
  As an operations manager, I want to be able to run simulations on the
  platform (e.g., "What would happen if we increased the base fare by 10%?")
  to model the impact of pricing and incentive changes before deploying them.

acceptance_criteria:
  - A new "Simulation" section must be added to the `admin-panel`.
  - The admin can change various parameters (fares, surge caps, driver incentives) and run a simulation against historical data.
  - The `analytics-service` must run the simulation and produce a report showing the predicted impact on KPIs like driver earnings, passenger demand, and company revenue.

files_to_be_created:
  - apps/admin-panel/src/components/management/SimulationDashboard.tsx

files_to_be_modified:
  - apps/admin-panel/src/App.tsx # Add view
  - apps/admin-panel/src/services/adminService.ts # Mock implementation
  - libs/backend/analytics-service/src/lib/analytics.service.ts # Skipped (Mocked in adminService)

dev_notes: >
  This is a powerful decision-making tool that allows for data-driven policy changes. It requires a sophisticated modeling engine on the backend.
  Implemented as a mock simulation in the admin panel for demonstration purposes, allowing parametrisation and result visualization.

