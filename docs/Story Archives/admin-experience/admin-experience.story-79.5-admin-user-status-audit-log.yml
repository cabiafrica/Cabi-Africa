id: story-79.5
epic: admin-experience
slug: admin-user-status-audit-log
title: "Admin: View and Search User Status Audit Logs"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T09:30:00Z'

description: >
  As an administrator, I need to view and search an audit log of all user status changes (suspensions, reactivations),
  so that I can maintain accountability and investigate account-related incidents.

acceptance_criteria:
  - A new "Audit Log" > "User Status" section must be added to the `admin-panel`.
  - This section must display a paginated list of all user status change events.
  - Each log entry must show: Timestamp, Admin responsible, Target User, Action (Suspended/Activated), and Reason (if provided).
  - The list must be filterable by Admin ID, Target User ID, Action, and a date range.
  - The `user-service` must expose an admin-protected endpoint to query these audit logs with the specified filters.
  - A new DTO, `UserStatusAuditLogDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/audit-log/user-status/page.tsx
  - libs/shared/dtos/src/lib/audit.dto.ts
  - docs/admin-experience.story-79.5-admin-user-status-audit-log.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This story provides a crucial accountability and security feature. It builds upon the actions implemented in `story-79.3`. The backend service should ensure that every status change is logged transactionally. For now, the frontend will be built with mocked data.

