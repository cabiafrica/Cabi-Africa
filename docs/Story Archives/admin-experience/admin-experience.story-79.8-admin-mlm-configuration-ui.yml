id: story-79.8
epic: admin-experience
slug: admin-mlm-configuration-ui
title: Admin Panel UI for MLM Fee Formula Configuration
status: DONE
author: Bob (sm)
date: '2025-12-02T11:00:00Z'

description: >
  As an administrator, I want a user interface in the admin panel to view and modify the MLM registration fee distribution formula,
  so that I can control how referral commissions are calculated and paid out without requiring code changes.

acceptance_criteria:
  - A new page must be created in the `admin-panel` under a path like `/configuration/mlm`.
  - On page load, the UI must fetch the current MLM formula from the `mlm-service`'s `GET /admin/mlm/formula` endpoint and display the rules.
  - The interface must allow an admin to add, edit, and delete individual rules for the fee distribution.
  - Each rule in the UI must allow configuration of:
    - Recipient (`SPONSOR`, `UPLINE`, `COMPANY`)
    - Rule Type (`FIXED`, `PERCENTAGE`)
    - Value (a number)
    - Upline Level (a number, applicable only when the recipient is `UPLINE`)
  - The UI must include client-side validation (e.g., ensuring the total of percentage-based rules does not exceed 100%).
  - A "Save" or "Update" button must trigger a `PUT /admin/mlm/formula` call to the `mlm-service`, sending the complete, updated list of rules.
  - The page should display success or error notifications upon saving.

files_to_be_created:
  - apps/admin-panel/src/app/configuration/mlm/page.tsx # The UI for managing the MLM formula

files_to_be_modified:
  - apps/mlm-service/src/app/mlm.controller.ts # To ensure GET and PUT endpoints for the formula are implemented.
  - apps/mlm-service/src/app/mlm.service.ts # To ensure logic for getting/setting the formula is implemented.

dev_notes: >
  This story creates the administrative front-end for the feature requirement "Admin Configure MLM Fee Distribution" from the PRD. It builds on the backend work from `story-101.4` by providing a UI to interact with the `MlmFeeFormula` model. The focus is on creating a dynamic form that allows admins to build a set of rules that the `mlm-service` will use for its calculations. This decouples the business logic of fee distribution from the codebase, making it flexible.

tasks:
  - id: task-1
    description: "Implement the backend endpoints in `mlm-service` to get and update the fee formula."
  - id: task-2
    description: "Create the new page in the `admin-panel` to display the current MLM formula rules."
  - id: task-3
    description: "Implement the form logic to add, edit, delete, and save the formula rules, including validation."