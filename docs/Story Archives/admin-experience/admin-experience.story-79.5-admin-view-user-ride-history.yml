      change: Created a new component to fetch and display a user's ride history in a table format for the admin panel.
    - file: Cabi Alpha/mobile/passenger_app/lib/screens/ride.service.ts
      change: Implemented the `findForUser` method to retrieve a paginated list of rides for a specific user, searching both passenger and driver IDs.
    - file: Cabi Alpha/mobile/passenger_app/lib/screens/ride.controller.ts
      change: Exposed the new `findForUser` service method via a `GET /admin/users/:userId/rides` endpoint.
    - file: apps/admin-panel/src/app/users/[userId]/page.tsx
      change: Integrated the `RideHistoryList` component into the user detail page to display the user's ride history in a new card.
