id: story-79.24
epic: admin-experience
slug: admin-view-driver-applications
title: "Admin: View and Search Driver Applications"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T09:20:00Z'

description: >
  As an administrator, I need to be able to view and search through all driver applications,
  so that I can monitor the pipeline of new drivers and access their information.

acceptance_criteria:
  - A new "Drivers" > "Applications" section must be added to the `admin-panel`.
  - This section must display a paginated list of all driver applications.
  - Each application in the list must show the driver's Name, Email, City, Status, and Application Date.
  - The list must be filterable by application status and city.
  - Clicking on an application must navigate to a detailed view of that application (to be implemented in `story-79.25`).
  - The `user-service` or a new `driver-service` must expose an admin-protected endpoint to query these applications with filters.
  - A new DTO, `DriverApplicationDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/drivers/applications/page.tsx
  - docs/admin-experience.story-79.24-admin-view-driver-applications.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/driver.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature provides the main entry point for an admin to manage the driver onboarding pipeline. The backend service will need to join user and driver profile data to provide the required information. For now, the frontend will be built with mocked data.

