id: story-79.32
epic: admin-experience
slug: admin-manage-content
title: "Admin: Manage Content for In-App Help Center and Website"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T10:20:00Z'

description: >
  As an administrator, I need a content management system (CMS) within the admin panel to edit
  the content of the in-app help center (FAQs) and key static pages on the marketing website,
  so that I can keep information up-to-date without requiring a code deployment.

acceptance_criteria:
  - A new "Content Management" section must be added to the `admin-panel`.
  - Within this section, there must be a page for managing "Help Center FAQs".
  - On the FAQ management page, an admin must be able to create, edit, delete, and reorder FAQ items.
  - Each FAQ item consists of a "Question" and an "Answer".
  - The "Content Management" section must also allow editing of simple static pages (e.g., "About Us", "Privacy Policy").
  - The page editor should provide a simple text area for editing content (Markdown is acceptable).
  - All content changes must be persisted via a new `content-service` or by extending an existing service.
  - New DTOs for `FaqItem` and `PageContent` must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/content/help-center/page.tsx
  - apps/admin-panel/src/app/content/pages/[slug]/page.tsx
  - libs/shared/dtos/src/lib/content.dto.ts
  - docs/admin-experience.story-79.32-admin-manage-content.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature provides a basic, integrated CMS, which is crucial for operational agility. It allows non-technical team members to manage user-facing content. The backend service for this should be straightforward, essentially a CRUD interface for the content models. For now, the frontend will be built with mocked data.

