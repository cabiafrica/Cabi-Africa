id: story-79.3
epic: admin-experience
slug: admin-suspend-user
title: "Admin: Suspend or Activate User Account"
status: DONE
author: Bob (sm)
date: '2024-08-20T21:00:00Z'

description: >
  As an administrator, I want to suspend or re-activate a user's account from
  their profile page, so that I can manage access for problematic users or
  resolve suspensions when issues are corrected.

acceptance_criteria:
  - On the user profile page (`/users/[userId]`), there must be a button to change the user's account status.
  - If the user's status is 'Active', a "Suspend Account" button must be visible.
  - If the user's status is 'Suspended', an "Activate Account" button must be visible.
  - Clicking the button must open a confirmation modal to prevent accidental actions.
  - Confirming the action must call a new backend endpoint (e.g., `PATCH /admin/users/:userId/status`) with the desired new status.
  - The backend must update the user's status in the database.
  - After the action is complete, the UI on the profile page must update to show the new status and the corresponding action button (e.g., the "Suspend" button changes to "Activate").

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx # To add the suspend/activate button and confirmation logic.
  - libs/backend/user-service/src/lib/user.service.ts # To add the status update logic.
  - libs/backend/user-service/src/lib/user.controller.ts # To add the new status update endpoint.

dev_notes: >
  This is a key administrative action. The backend endpoint must be protected to ensure only admins can change a user's status. The frontend should use a confirmation modal to provide a safeguard against accidental clicks. The user's status should be fetched dynamically to ensure the correct action button is always displayed.

tasks:
  - id: task-1
    description: "Implement the `PATCH /admin/users/:userId/status` endpoint in the backend."
  - id: task-2
    description: "Add the suspend/activate button and confirmation modal to the user profile page."