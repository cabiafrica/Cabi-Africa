id: story-79.10
epic: admin-experience
slug: admin-audit-log
title: Admin Audit Log for High-Privilege Actions
status: DONE
author: Sarah (po)
date: '2024-08-26T09:00:00Z'

description: >
  As a security officer or lead administrator, I need a comprehensive and immutable
  audit log of all high-privilege actions taken within the admin panel, so that
  I can monitor for compliance, investigate incidents, and ensure accountability.

acceptance_criteria:
  - A new `AuditLog` model must be added to the database schema to record actions. It should include `adminId`, `actionType`, `targetId`, `targetType`, `details` (JSON), and a `timestamp`.
  - A new `AuditService` must be created to handle the creation of log entries.
  - All high-privilege actions must be logged via the `AuditService`. This includes, but is not limited to:
    - User impersonation start (`impersonateUser`).
    - Suspending/reactivating users.
    - Forcing a password reset (`forcePasswordResetForReportedLogin`).
    - Editing user details.
    - Dismissing a reported login.
  - A new "Audit Log" page must be created in the `admin-panel` under a "Security" section.
  - The page must display a paginated, sortable, and filterable list of all audit log entries.
  - Filters must include: Admin Email, Action Type, and a Date Range.
  - Each log entry should clearly display who did what to whom, and when.

files_to_be_created:
  - apps/admin-panel/src/app/security/audit-log/page.tsx
  - apps/driver-lead-service/src/audit/audit.service.ts
  - apps/driver-lead-service/src/audit/audit.module.ts

files_to_be_modified:
  - c:/Users/User/Desktop/Cabi-Flutter/docs/architecture.md # To add the AuditLog model to the Prisma schema
  - c:/Users/User/Desktop/Cabi-Flutter/docs/user-management.service.ts # To call the new AuditService
  - c:/Users/User/Desktop/Cabi-Flutter/apps/driver-lead-service/src/app.module.ts # To import the new AuditModule

dev_notes: >
  This is a foundational security feature. The `AuditService` should be a simple, injectable service that can be called from any other service where a high-privilege action occurs. The `details` JSON blob in the `AuditLog` model is crucial for storing context, like the "from" and "to" values of an edited field, or the IP address of the admin. The log should be treated as append-only.
