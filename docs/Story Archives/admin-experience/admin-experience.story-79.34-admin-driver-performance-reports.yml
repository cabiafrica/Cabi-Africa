id: story-79.34
epic: admin-experience
slug: admin-driver-performance-reports
title: "Admin: View Driver Performance Reports"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T11:00:00Z'

description: >
  As an administrator, I need to view performance reports for individual drivers or groups of drivers,
  so that I can assess productivity, identify top performers, and address underperformance.

acceptance_criteria:
  - A new "Reports" > "Driver Performance" section must be added to the `admin-panel`.
  - The page must provide filters for selecting a specific driver and a date range.
  - When the report is generated, it must display a summary of key performance indicators (KPIs) for the selected driver(s) and period.
  - KPIs must include: Total Rides Completed, Average Customer Rating, Ride Acceptance Rate, and Total Earnings.
  - The report data must be exportable to CSV.
  - The `ride-service` or a new `reporting-service` must expose an admin-protected endpoint to generate this report data.

files_to_be_created:
  - apps/admin-panel/src/app/reports/driver-performance/page.tsx
  - libs/shared/dtos/src/lib/report.dto.ts
  - docs/admin-experience.story-79.34-admin-driver-performance-reports.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This story provides a data-driven tool for the operations team to manage driver quality and performance. The backend will need to perform aggregations over a potentially large dataset, so performance should be a consideration when implementing the backend service. For now, the frontend will be built with mocked data.

