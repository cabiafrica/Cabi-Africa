id: story-79.13
epic: admin-experience
slug: admin-user-management-dashboard
title: "Admin: User Account Management Dashboard"
status: Done
author: Gemini Code Assist
date: '2025-12-09T12:05:00Z'

description: >
  As an administrator, I need a dashboard to search for and view all user accounts (both drivers and passengers),
  so that I can manage user profiles and access their details.

acceptance_criteria:
  - A new "Users" section must be added to the `admin-panel`.
  - The page must provide a search bar to find users by name or email.
  - The page must display a paginated list of users matching the search criteria.
  - Each user in the list must show their Name, Email, User Type (Driver/Passenger), and Account Status (e.g., "Active", "Suspended").
  - Clicking on a user must navigate to a detailed view of their account (to be implemented in `story-79.14`).
  - The `user-service` must expose an admin-protected endpoint to search for users.
  - A new DTO, `UserSearchResultDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/components/management/UserManagementDashboard.tsx # Renamed locally from PlatformUsers.tsx
  - libs/shared/dtos/src/lib/user.dto.ts
  - docs/admin-experience.story-79.13-admin-user-management-dashboard.yml

files_to_be_modified:
  - apps/admin-panel/src/components/management/PlatformUsers.tsx
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This dashboard is the primary entry point for an admin to manage any user on the platform. The backend search functionality should be efficient and indexed for performance.

