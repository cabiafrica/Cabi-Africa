id: story-79.31
epic: admin-experience
slug: admin-manage-roles-permissions
title: "Admin: Manage Roles and Permissions"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T10:15:00Z'

description: >
  As a super administrator, I need to manage roles and their associated permissions,
  so that I can enforce granular access control for different types of admin users.

acceptance_criteria:
  - A new "Settings" > "Roles & Permissions" section must be added to the `admin-panel`.
  - This section must list all available roles (e.g., "Administrator", "Support Agent", "Read-Only").
  - Clicking on a role must navigate to a detailed view where its permissions can be managed.
  - The detail view must display a list of all available permissions in the system, grouped by category (e.g., "Users", "Rides", "Reports").
  - The UI must use checkboxes to show which permissions are currently assigned to the selected role.
  - An admin must be able to check/uncheck permissions and save the changes.
  - Saving must call a new endpoint in the `auth-service` or `user-service` to update the role's permissions.
  - New DTOs for `Role` and `Permission` must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/settings/roles/page.tsx
  - apps/admin-panel/src/app/settings/roles/[roleId]/page.tsx
  - libs/shared/dtos/src/lib/role-management.dto.ts
  - docs/admin-experience.story-79.31-admin-manage-roles-permissions.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a critical security and administration feature. It allows the platform to scale its operations team by giving different users different levels of access. The backend implementation should be robust, ensuring that permission checks are enforced correctly across all protected endpoints. For now, the frontend will be built with mocked data.

