id: story-79.13
epic: admin-experience
slug: admin-manage-subgroups
title: Admin Panel UI for Managing Driver Subgroups
status: Done
author: Bob (sm)
date: '2025-12-02T15:30:00Z'

description: >
  As an administrator, I want to create, view, edit, and delete subgroups within a driver organization,
  so that I can help organization leaders structure their teams and manage their members effectively.

acceptance_criteria:
  - On the organization detail page in the `admin-panel`, there must be a new "Subgroups" section.
  - This section must display a hierarchical view of all subgroups belonging to the organization.
  - The UI must allow an admin to create a new subgroup under the main organization or under another subgroup.
  - The UI must allow an admin to edit a subgroup's name and description.
  - The UI must allow an admin to delete an existing subgroup.
  - The UI must allow an admin to view the members of a subgroup and add/remove drivers (who are already members of the parent organization) to/from it.
  - The `user-service` (or a dedicated organization service) must be updated with admin-protected endpoints to support full CRUD operations for subgroups and their memberships.

files_to_be_created:
  - apps/admin-panel/src/components/management/OrganizationManagement.tsx
  - apps/admin-panel/src/components/management/SubgroupManagement.tsx
  - apps/admin-panel/src/app/organizations/[orgId]/subgroups/page.tsx # Skipped in favor of SPA component structure

files_to_be_modified:
  - apps/admin-panel/src/App.tsx # To add the new subgroups management section.
  - apps/admin-panel/src/services/adminService.ts # Mocks
  - libs/backend/user-service/src/lib/user.controller.ts # Skipped (mock implementation)
  - libs/backend/user-service/src/lib/user.service.ts # Skipped (mock implementation)

dev_notes: >
  This story implements the administrative controls for the hierarchical `DriverGroup` model defined in the `architecture.md`. It provides the tools necessary for admins to manage the "Subgroup Management" requirement from the PRD. The backend logic in the `user-service` will need to correctly handle the parent-child relationships between groups. The frontend should provide an intuitive tree-like interface for visualising and managing the hierarchy.

