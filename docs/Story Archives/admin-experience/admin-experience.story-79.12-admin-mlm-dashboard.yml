id: story-79.12
epic: admin-experience
slug: admin-mlm-dashboard
title: "Admin: MLM Dashboard"
status: Done
author: Gemini Code Assist
date: '2025-12-09T12:00:00Z'

description: >
  As an administrator, I need a dashboard to view key performance indicators (KPIs) and trends for the MLM program,
  so that I can monitor its health and growth.

acceptance_criteria:
  - A new "MLM" > "Dashboard" section must be added to the `admin-panel`.
  - The dashboard must display key KPIs, including:
    - Total commissions paid (e.g., this month, all-time).
    - Number of new referred drivers in a given period.
    - Referral conversion rate.
    - Average referrals per active driver.
  - The dashboard must include charts to visualize trends, such as:
    - New referred drivers over time.
    - A leaderboard of top referrers.
  - The `organization-service` or a new `mlm-service` must provide an endpoint to fetch this aggregated data.
  - A new DTO, `MlmDashboardDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/components/management/MlmDashboard.tsx
  - libs/shared/dtos/src/lib/mlm-dashboard.dto.ts
  - docs/admin-experience.story-79.12-admin-mlm-dashboard.yml

files_to_be_modified:
  - apps/admin-panel/src/App.tsx
  - apps/mlm-service/src/app/mlm.controller.ts
  - apps/mlm-service/src/app/mlm.service.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This dashboard provides a high-level overview of the MLM program's performance, crucial for business intelligence and strategic planning. The backend service will need to perform several aggregations to produce this data.

