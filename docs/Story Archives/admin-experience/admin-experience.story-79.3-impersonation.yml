id: story-79.3
epic: admin-experience
slug: admin-user-impersonation
title: Implement Admin "Login as User" (Impersonation)
status: DONE
author: Bob (sm)
date: '2024-08-09T21:10:00Z'

description: >
  As a customer support agent, I want to be able to temporarily "log in as" a
  specific user to see the app exactly as they see it, so I can effectively
  troubleshoot their issues.

acceptance_criteria:
  - On the user detail page in the `admin-panel`, a "Login as User" button must be available (restricted to certain admin roles).
  - Clicking this generates a secure, single-use token that allows the admin to gain temporary access to the user's account on a web-based or debug version of the app.
  - The impersonation session must be clearly indicated in the UI (e.g., a banner "Viewing as John D.").
  - All actions taken during an impersonation session must be logged for security and auditing.

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx # To add the impersonation button
  - libs/backend/user-service/src/lib/auth.service.ts # To add logic for generating and validating impersonation tokens

dev_notes: >
  This is an extremely powerful and sensitive feature. It requires strict role-based access control and comprehensive audit logging. It is invaluable for debugging complex user-specific issues.