id: story-79.14
epic: admin-experience
slug: admin-suspend-reactivate-user
title: "Admin: Suspend or Reactivate User Account"
status: Done
author: Gemini Code Assist
date: '2025-12-09T12:10:00Z'

description: >
  As an administrator, from a user's detail page, I need to be able to suspend their account or reactivate a suspended account,
  so that I can manage user access based on policy violations or other issues.

acceptance_criteria:
  - The user detail page (`/users/[userId]`) must display action buttons based on the user's current status.
  - If the user's status is 'ACTIVE', a "Suspend Account" button must be visible.
  - Clicking "Suspend Account" must prompt the admin for a reason.
  - Upon confirming the suspension with a reason, a request must be sent to the `user-service` to update the user's status to 'SUSPENDED'.
  - If the user's status is 'SUSPENDED', a "Reactivate Account" button must be visible.
  - Clicking "Reactivate Account" must send a request to the `user-service` to update the user's status to 'ACTIVE'.
  - The `user-service` must be updated with an endpoint to handle these status changes.
  - A new DTO, `UpdateUserStatusDto`, must be created in the shared DTOs library.

files_to_be_created:
  - docs/admin-experience.story-79.14-admin-suspend-reactivate-user.yml

files_to_be_modified:
  - apps/admin-panel/src/components/management/PlatformUsers.tsx # Renamed to UserManagementDashboard.tsx locally
  - apps/admin-panel/src/services/adminService.ts # Mocks
  - libs/shared/dtos/src/lib/user.dto.ts

dev_notes: >
  This feature provides critical moderation capabilities. The backend service should log these administrative actions in an audit trail for accountability.

