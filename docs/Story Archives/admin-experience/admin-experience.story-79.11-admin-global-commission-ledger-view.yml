id: story-79.11
epic: admin-experience
slug: admin-global-commission-ledger-view
title: Admin Panel Global View of Commission Ledger Transactions
status: Done
author: Bob (sm)
date: '2025-12-02T14:00:00Z'

description: >
  As an administrator, I want a global, searchable view of all commission ledger transactions,
  so that I can audit financial activity, track overall commission payouts, and investigate discrepancies across the entire system.

acceptance_criteria:
  - A new "Commission Ledger" page must be created in the `admin-panel`, likely under a "Finance" or "MLM" section.
  - The page must display a paginated table of all entries from the `RegistrationFeeLedger`.
  - Each row in the table must display: Transaction ID, Date, New Driver Name/ID, Recipient Name/ID, Amount, and a note indicating if it was a manual adjustment (from `story-79.10`).
  - The page must provide filtering options for: Date Range, Recipient ID, and New Driver ID.
  - The `mlm-service` must expose a new, admin-protected endpoint (e.g., `GET /admin/mlm/ledger`) that provides paginated and filterable access to the `RegistrationFeeLedger` data.
  - The backend endpoint must be optimized to handle a large volume of transactions and should join with user data to return names for display.

files_to_be_created:
  - apps/admin-panel/src/components/management/CommissionLedger.tsx # The global view

files_to_be_modified:
  - apps/admin-panel/src/App.tsx # Navigation
  - apps/mlm-service/src/app/mlm.controller.ts # To add the new global ledger endpoint.
  - apps/mlm-service/src/app/mlm.service.ts # To add the logic for querying and filtering all ledger entries.

dev_notes: >
  This story provides a powerful, high-level audit tool for the entire MLM system. It's the macro view, whereas `story-79.10` (manual adjustments) is the micro view. The backend implementation will need to be performant, as this table could grow very large. Proper database indexing on the `RegistrationFeeLedger` table's filterable columns will be critical.

tasks:
  - id: task-1
    description: "Implement the admin-protected backend endpoint in `mlm-service` to fetch, filter, and paginate all ledger transactions."
    status: Done
  - id: task-2
    description: "Create the 'Commission Ledger' page in the `admin-panel`."
    status: Done
  - id: task-3
    description: "Implement the table view with pagination and connect it to the backend service."
    status: Done
  - id: task-4
    description: "Implement the frontend filtering controls (Date Range, Recipient, etc.) and connect them to the API query."
    status: Done