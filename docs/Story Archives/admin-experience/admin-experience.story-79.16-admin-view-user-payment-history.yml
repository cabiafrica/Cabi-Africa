id: story-79.16
epic: admin-experience
slug: admin-view-user-payment-history
title: "Admin: View User's Payment and Payout History"
status: DONE
author: Gemini Code Assist
date: '2025-12-09T12:20:00Z'

description: >
  As an administrator, from a user's detail page, I need to be able to view a complete history of their payments (if a passenger) or payouts (if a driver),
  so that I can investigate billing issues and track financial transactions.

acceptance_criteria:
  - From the user detail page (`/users/[userId]`), there must be a link or button to "View Payment History".
  - This link must navigate to a new page, `users/[userId]/payments`.
  - The payment history page must display a paginated list of all financial transactions for the user.
  - Each transaction in the list must show the Transaction ID, Date, Type (e.g., "Ride Payment", "Payout", "Refund"), Amount, and Status.
  - The `payment-service` must expose an admin-protected endpoint to fetch the financial transaction history for a specific user.
  - A new DTO, `UserPaymentHistoryEntryDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/users/[userId]/payments/page.tsx
  - docs/admin-experience.story-79.16-admin-view-user-payment-history.yml

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx
  - libs/shared/dtos/src/lib/payment.dto.ts

dev_notes: >
  This feature provides financial visibility for support and admin staff. It's crucial for resolving payment disputes. The backend service will need to query a transaction ledger.

