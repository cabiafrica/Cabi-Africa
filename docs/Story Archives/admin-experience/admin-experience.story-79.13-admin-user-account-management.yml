id: story-79.13
epic: admin-experience
slug: admin-user-account-management
title: "Admin: User Account Management"
status: DONE
author: Gemini Code Assist
date: '2025-12-09T12:05:00Z'

description: >
  As an administrator, I need a central place to search for and view any user account (driver or passenger),
  so that I can access their profile and take administrative actions.

acceptance_criteria:
  - A new "Users" section must be added to the `admin-panel`.
  - The page must display a list of all users, with a search bar to filter by name or email.
  - Each user in the list must show their Name, Email, User Type (Driver/Passenger), and Account Status (e.g., Active, Suspended).
  - Clicking on a user must navigate to a detailed view of their account.
  - The detail view must display all key user information (e.g., name, email, phone, registration date, status).
  - The `user-service` must expose admin-protected endpoints to search for users and retrieve detailed user profiles.
  - New DTOs, `UserSearchResultDto` and `UserDetailDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/users/page.tsx
  - apps/admin-panel/src/app/users/[userId]/page.tsx
  - libs/shared/dtos/src/lib/user.dto.ts
  - docs/admin-experience.story-79.13-admin-user-account-management.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a fundamental admin feature, providing a single source of truth for user information. It will be the entry point for many other administrative actions, such as suspending an account or viewing a user's ride history.

