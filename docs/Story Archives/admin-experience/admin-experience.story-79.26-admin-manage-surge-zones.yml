id: story-79.26
epic: admin-experience
slug: admin-manage-surge-zones
title: "Admin Panel: Manage Surge Pricing Zones"
status: DONE
author: Gemini Code Assist
date: '2025-12-05T11:30:00Z'

description: >
  As an administrator, I need a map-based interface to draw, edit, and delete geographic surge pricing zones,
  and to set the surge multiplier for each zone, so I can dynamically manage pricing based on demand.

acceptance_criteria:
  - A new "Surge Zones" page must be created in the `admin-panel`.
  - The page must display a map with tools to draw polygonal zones.
  - Admins must be able to click on a zone to edit its properties (e.g., surge multiplier, name).
  - Admins must be able to save these zones to the backend via a new set of CRUD endpoints (e.g., `POST /admin/surge-zones`).
  - The dispatch and pricing services must be able to consume this zone data to apply surge pricing to rides.

files_to_be_created:
  - apps/admin-panel/src/app/pricing/surge-zones/page.tsx

files_to_be_modified:
  - # A backend service (e.g., a new `pricing-service`) will need to be created to store and serve surge zone data.

dev_notes: >
  This story implements the "Admin Surge Zones" requirement from the PRD (section 2.3). It's a highly interactive feature. The frontend will need a map library with drawing tools. The backend will need to store geographic data (e.g., using PostGIS with PostgreSQL) and provide APIs for the admin panel to manage it and for the dispatch system to consume it.
  PRD Reference: 2.3. Admin Panel -> Content & Configuration Management -> Admin Surge Zones