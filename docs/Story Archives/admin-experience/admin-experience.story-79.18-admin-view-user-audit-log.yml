id: story-79.18
epic: admin-experience
slug: admin-view-user-audit-log
title: "Admin: View User's Audit Log"
status: DONE
author: Gemini Code Assist
date: '2025-12-09T12:30:00Z'

description: >
  As an administrator, from a user's detail page, I need to be able to view a log of all significant actions taken on their account by administrators (e.g., status changes, profile edits),
  so that I can have a clear audit trail for accountability and investigation.

acceptance_criteria:
  - From the user detail page (`/users/[userId]`), there must be a link or button to "View Audit Log".
  - This link must navigate to a new page, `users/[userId]/audit`.
  - The audit log page must display a paginated list of all administrative actions taken on that user's account.
  - Each log entry must show the Timestamp, Admin Name/ID, Action Taken (e.g., "Account Suspended"), and any relevant details or reason.
  - The `audit-service` must expose an admin-protected endpoint to fetch the audit log for a specific user.
  - A new DTO, `UserAuditLogEntryDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/users/[userId]/audit/page.tsx
  - docs/admin-experience.story-79.18-admin-view-user-audit-log.yml

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx
  - libs/shared/dtos/src/lib/audit.dto.ts

dev_notes: >
  This feature is crucial for security, accountability, and compliance. The backend service will need to be integrated into various other services to capture these events as they happen and store them in a dedicated audit log table.

