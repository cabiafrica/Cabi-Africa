id: story-79.15
epic: admin-experience
slug: admin-view-user-ride-history
title: "Admin: View User's Ride History"
status: DONE
author: Gemini Code Assist
date: '2025-12-09T12:15:00Z'

description: >
  As an administrator, from a user's detail page, I need to be able to view a complete history of their rides,
  so that I can investigate issues, answer questions, and understand their activity on the platform.

acceptance_criteria:
  - From the user detail page (`/users/[userId]`), there must be a link or button to "View Ride History".
  - This link must navigate to a new page, `users/[userId]/rides`.
  - The ride history page must display a paginated list of all rides taken by the user (if a passenger) or given by the user (if a driver).
  - Each ride in the list must show the Ride ID, Date, Pickup & Destination, Fare, and Status.
  - The `ride-service` must expose an admin-protected endpoint to fetch the ride history for a specific user.
  - A new DTO, `UserRideHistoryEntryDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/users/[userId]/rides/page.tsx
  - docs/admin-experience.story-79.15-admin-view-user-ride-history.yml

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx
  - libs/shared/dtos/src/lib/ride.dto.ts

dev_notes: >
  This feature provides crucial context for support and moderation tasks. The backend service will need to query the rides table and join with other data to provide a comprehensive history.

