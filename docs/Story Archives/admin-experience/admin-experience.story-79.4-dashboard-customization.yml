id: story-79.4
epic: admin-experience
slug: dashboard-customization
title: Implement Admin Dashboard Customization
status: Done
author: Bob (sm)
date: '2024-08-09T10:12:00Z'

description: >
  As an administrator, I want to be able to rearrange, add, or remove
  widgets on my main dashboard, so that I can create a view that is most
  relevant to my specific role.

acceptance_criteria:
  - The admin dashboard (`story-25.4`) must enter an "edit mode".
  - In edit mode, an admin can drag and drop widgets to reorder them.
  - A gallery of available widgets can be shown, allowing admins to add or remove them from their personal dashboard layout.
  - The user's layout preference must be saved in the `user-service`.

files_to_be_created: []

files_to_be_modified:
  - apps/admin-panel/src/app/page.tsx # To add edit mode and layout management

dev_notes: >
  This feature makes the admin panel more flexible and user-friendly, especially as we add more and more data widgets.
