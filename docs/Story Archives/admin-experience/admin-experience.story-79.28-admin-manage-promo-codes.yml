id: story-79.28
epic: admin-experience
slug: admin-manage-promo-codes
title: "Admin: Create and Manage Promo Codes"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T09:45:00Z'

description: >
  As an administrator, I need to create and manage promotional codes,
  so that I can run marketing campaigns to attract new users and retain existing ones.

acceptance_criteria:
  - A new "Marketing" > "Promo Codes" section must be added to the `admin-panel`.
  - This section must display a list of all existing promo codes with key details (Code, Type, Value, Uses, Status).
  - The page must have a "Create New Promo Code" button that leads to a creation form.
  - The creation form must allow an admin to define:
    - The code itself (e.g., "WELCOME20").
    - The type (percentage vs. fixed amount).
    - The value (e.g., 20 for 20% or 5 for $5).
    - An optional expiration date.
    - An optional maximum number of uses.
    - The scope (e.g., all users, new users only).
    - An active/inactive status.
  - Submitting the form must create the promo code via a new `promo-code-service` or by extending an existing service.
  - New DTOs for `PromoCode` and `CreatePromoCode` must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/marketing/promo-codes/page.tsx
  - apps/admin-panel/src/app/marketing/promo-codes/new/page.tsx
  - libs/shared/dtos/src/lib/promo-code.dto.ts
  - docs/admin-experience.story-79.28-admin-manage-promo-codes.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature is a core marketing tool. The backend service will need to handle the logic for validating and applying these codes during the booking or payment process, which will be covered in other stories. This story focuses on the admin's ability to create and manage the codes themselves.

