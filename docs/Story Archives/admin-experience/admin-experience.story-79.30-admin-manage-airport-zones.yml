id: story-79.30
epic: admin-experience
slug: admin-manage-airport-zones
title: "Admin: Define and Manage Airport Geofenced Zones"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T20:15:00Z'

description: >
  As an administrator, I need a map-based interface to draw, edit, and manage the geofenced polygons for airport "waiting zones"
  and "pickup zones", so I can configure the areas where the virtual queue logic applies.

acceptance_criteria:
  - A new "Airport Zones" page must be created in the `admin-panel`.
  - The page must display a map with tools to draw and edit polygonal geofences.
  - Admins must be able to create a new zone, name it, and assign it a type ("Waiting Zone" or "Pickup Zone").
  - Admins must be able to associate a waiting zone with one or more pickup zones.
  - All created zones must be displayed on the map.
  - Saving a zone must call a backend endpoint to store its geographic data (e.g., GeoJSON).

files_to_be_created:
  - apps/admin-panel/src/app/operations/airport-zones/page.tsx

files_to_be_modified:
  - # A new backend service (or existing one like `pricing-service`) will need to store and manage geofenced zone data.

dev_notes: >
  This story is the administrative prerequisite for `story-50.4` (Dispatch: Implement Airport Virtual Queue). It provides the configuration tool for defining the physical areas where the special airport logic will be active. This feature is very similar to `story-79.26` (Admin: Manage Surge Pricing Zones) and can likely reuse many of the same frontend components (map, drawing tools). The backend will need to store this geographic data in a database that supports geospatial queries, like PostGIS.
  PRD Reference: 2.5. Dispatch System -> Airport Operations -> Airport-Specific Pickup Zones