id: story-79.24
epic: admin-experience
slug: admin-global-search
title: "Admin Panel: Implement Global Search"
status: DONE
author: Gemini Code Assist
date: '2025-12-05T11:20:00Z'

description: >
  As an administrator, I want a global search bar in the admin panel header that allows me to search
  across different entities like users, drivers, and rides, so I can quickly find information without navigating through multiple pages.

acceptance_criteria:
  - A search bar must be added to the main header of the `admin-panel`.
  - As the admin types, the search should trigger a call to a new backend endpoint (e.g., `GET /admin/search?q=...`).
  - The backend service must perform a federated search across multiple data sources (Users, Rides, etc.).
  - The search results must be displayed in a dropdown/overlay, grouped by entity type (e.g., "Users", "Rides").
  - Clicking a search result must navigate the admin to the corresponding detail page (e.g., user profile, ride details).

files_to_be_created:
  - # A new backend service, `search-service`, might be appropriate to handle federated search logic.

files_to_be_modified:
  - # The main layout/header component of `apps/admin-panel` to add the search bar and results display.

dev_notes: >
  This story implements the "Admin Global Search" requirement from the PRD (section 2.3). The main complexity is on the backend. A dedicated `search-service` is recommended to orchestrate queries across multiple other services (`user-service`, `ride-service`, etc.) and aggregate the results. The frontend will need a robust autocomplete component to display the categorized results.
  PRD Reference: 2.3. Admin Panel -> Operational Dashboards & Tools -> Admin Global Search