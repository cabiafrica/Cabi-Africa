id: story-79.7
epic: admin-experience
slug: admin-support-ticket-queue
title: Admin Panel for Support Ticket Management
status: IN_PROGRESS
author: Bob (sm)
date: '2024-08-11T14:00:00Z'

description: >
  As a support agent, I need a centralized queue in the admin panel to view,
  assign, and manage all support tickets, so that I can efficiently address
  user issues and inquiries.

acceptance_criteria:
  - A new "Support" or "Tickets" section must be added to the `admin-panel`.
  - This section must display a paginated list of all support tickets from the `support-service`.
  - The list should be filterable by status (e.g., "New", "Open", "Closed") and category (e.g., "Lost Item", "Suggestion", "Payment Dispute").
  - Each ticket in the list must show the ticket ID, subject, user who created it, status, and creation date.
  - Clicking a ticket must navigate to a detailed ticket view page.
  - In the detail view, an admin must be able to:
    - View the full conversation history.
    - Add internal notes.
    - Reply to the user.
    - Change the ticket's status.
  - The `support-service` must expose new admin-protected endpoints for listing, viewing, and updating tickets.

files_to_be_created:
  - apps/admin-panel/src/app/support/page.tsx # The main ticket queue page
  - apps/admin-panel/src/app/support/[ticketId]/page.tsx # The detailed ticket view page

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To add admin-level ticket management logic
  - libs/backend/support-service/src/lib/support.controller.ts # To expose the new admin endpoints

dev_notes: >
  This story provides the core interface for the customer support team. It aggregates tickets created from various parts of the user-facing apps into a single, manageable queue. This is a foundational feature for platform operations and support.

