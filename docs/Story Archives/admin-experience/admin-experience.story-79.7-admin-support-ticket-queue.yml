      - "[x] Display detailed ticket information, including conversation history."
      - "[x] Add UI elements for replying, adding internal notes, and changing status."
  - id: task-3
    description: Implement backend endpoints in the support-service for admin ticket management.
    subtasks:
      - "[x] Create `libs/backend/support-service/src/lib/support.controller.ts` and `support.service.ts`."
