id: story-79.6
epic: admin-experience
slug: admin-view-document-history
title: "Admin: View Driver's Document Submission History"
status: DONE
author: Bob (sm)
date: '2024-09-05T14:00:00Z'

description: >
  As an admin, I need to view the complete submission history for a specific driver's documents,
  so that I can understand their application journey, see previous rejections, and make more informed approval decisions.

acceptance_criteria:
  - A new endpoint, `GET /admin/drivers/:userId/document-history`, must be created in the backend.
  - This endpoint must utilize the existing `documentService.findHistoryForUser` method to retrieve all document submissions for a given driver.
  - The response must be a list of submissions, sorted from newest to oldest.
  - Each item in the list must include the document type, submission date, status ('Approved', 'Rejected', 'Pending Review'), and rejection reason (if any).
  - A new view or section in the Admin Panel must be created to display this history.
  - The UI should clearly present the historical list of submissions for a selected driver, likely accessible from their main profile page.

files_to_be_created:
  - # A new file for the document history view in the admin panel app (e.g., `apps/admin-panel/src/views/DriverDocumentHistory.vue`).

files_to_be_modified:
  - libs/backend/document-service/src/lib/document.controller.ts # To add the new `GET /admin/drivers/:userId/document-history` endpoint.

dev_notes: >
  The core backend logic for this story already exists in `document.service.ts` with the `findHistoryForUser` method. The main work involves exposing this method through a new controller endpoint and building the corresponding UI in the admin panel to consume and display the data. This provides essential context for admins reviewing document submissions.