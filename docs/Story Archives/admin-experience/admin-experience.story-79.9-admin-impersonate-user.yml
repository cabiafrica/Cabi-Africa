id: story-79.9
epic: admin-experience
slug: admin-impersonate-user
title: Admin Ability to Impersonate a User
status: DONE
author: Sarah (po)
date: '2024-08-25T14:00:00Z'

description: >
  As an administrator, I need to be able to temporarily impersonate a user,
  so that I can effectively troubleshoot their issues, see the application from
  their perspective, and verify their reported problems.

acceptance_criteria:
  - A new "Impersonate" button must be added to the user detail page in the `admin-panel`.
  - Clicking this button must call a new, admin-only backend endpoint (e.g., `POST /admin/users/:userId/impersonate`).
  - The backend must generate a special, short-lived (e.g., 30 minutes) JWT specifically for impersonation.
  - This impersonation token must contain claims identifying both the impersonated user (`sub`) and the impersonating admin (`impersonatorId`).
  - Upon receiving the token, the admin panel frontend should store it and redirect the admin to the main user-facing application (e.g., the settings/dashboard page).
  - The main application must have a clear, persistent visual indicator (e.g., a banner) that an impersonation session is active.
  - This banner must include a "Stop Impersonating" button, which clears the impersonation token and returns the admin to their original admin session.
  - All sensitive actions performed during impersonation must be auditable, linking back to the impersonating admin.

files_to_be_created:
  - Cabi Alpha/web/user_portal/src/components/impersonation-banner.tsx # A new component for the user-facing app

files_to_be_modified:
  - c:/Users/User/Desktop/Cabi-Flutter/apps/admin-panel/src/app/users/[userId]/page.tsx # To add the impersonate button
  - c:/Users/User/Desktop/Cabi-Flutter/apps/driver-lead-service/src/admin/admin-security.controller.ts # To add the impersonation endpoint
  - c:/Users/User/Desktop/Cabi-Flutter/docs/user-management.service.ts # To add the impersonation logic
  - c:/Users/User/Desktop/Cabi-Flutter/auth-token.service.ts # To generate the special token (file not in context, will assume changes)
  - Cabi Alpha/web/user_portal/src/app/settings/layout.tsx # To display the banner

dev_notes: >
  This is a high-privilege feature. The impersonation endpoint must be strictly protected. The audit trail is critical for security. The frontend will need to handle token switching carefully. When the admin clicks "Impersonate", the frontend should save the original admin token, use the new impersonation token, and then restore the admin token when "Stop Impersonating" is clicked.
