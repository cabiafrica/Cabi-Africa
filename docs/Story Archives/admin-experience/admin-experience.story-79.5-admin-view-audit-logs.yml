id: story-79.5
epic: admin-experience
slug: admin-view-audit-logs
title: "Admin: View and Search User Status Audit Logs"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T18:15:00Z'

description: >
  As a super-administrator, I need an interface to view and search the audit log of all user status changes
  (suspensions and activations), so I can monitor administrative actions for compliance and security.

acceptance_criteria:
  - A new "Audit Log" page must be created in the `admin-panel`.
  - The page must display a paginated table of all user status change events from the audit log.
  - Each log entry must show: Timestamp, Admin ID/Name, Target User ID/Name, Action ('Suspended'/'Activated'), and Reason (if provided).
  - The page must provide filter options for Admin ID, Target User ID, Action, and a date range.
  - The UI must call the `GET /admin/users/audit-log` endpoint (from story-79.4) to fetch the data, supporting pagination and filtering.

files_to_be_created:
  - apps/admin-panel/src/app/audit-log/page.tsx

files_to_be_modified:
  - # The main navigation in `admin-panel` to add a link to the new Audit Log page.
  - # The AdminUserService in `document.service.ts` already has the backend logic, but may need refinement for filtering.

dev_notes: >
  This story creates the user interface for the backend logging functionality implemented in `story-79.4`. It's a critical feature for platform governance and security. The frontend work will involve creating a new page with a data table and a comprehensive set of filter controls. The backend endpoint for fetching logs already exists but may need to be enhanced to support the full range of filtering options required by the UI.
  PRD Reference: 2.3. Admin Panel -> User & Permissions Management -> Admin Action Audit Log