id: story-79.2
epic: admin-experience
slug: admin-global-search
title: Implement Global User Search in Admin Panel
status: DONE
author: Bob (sm)
date: '2024-08-09T10:01:00Z'

description: >
  As an administrator, I want a global search bar that lets me find any user
  (driver or passenger) by name, email, or phone number, so that I can
  quickly locate user profiles without navigating through lists.

acceptance_criteria:
  - A persistent search bar must be added to the `admin-panel`'s main header/navigation.
  - As an admin types, the search bar should show a dropdown of real-time results for both drivers and passengers.
  - The search must query against the user's name, email, and phone number fields.
  - Search results in the dropdown must clearly distinguish between drivers and passengers (e.g., with an icon or label).
  - Clicking a search result must navigate the admin directly to that user's detail page.
  - A new, optimized backend endpoint must be created in the `user-service` to handle this multi-field, real-time search query.

files_to_be_created:
  - apps/admin-panel/src/components/layout/global_search.tsx

files_to_be_modified:
  - apps/admin-panel/src/components/layout/header.tsx # Or equivalent, to integrate the new search component
  - libs/backend/user-service/src/lib/user.controller.ts # To add the new search endpoint
  - libs/backend/user-service/src/lib/user.service.ts # To implement the search logic, using database indexes for performance

dev_notes: >
  This is a major quality-of-life improvement for all admin users. The backend search endpoint needs to be highly performant to provide a good "search-as-you-type" experience. For a large user base, this may require creating specific database indexes on the name, email, and phone number columns.