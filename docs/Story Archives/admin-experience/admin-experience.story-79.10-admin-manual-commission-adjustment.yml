id: story-79.10
epic: admin-experience
slug: admin-manual-commission-adjustment
title: Admin Panel UI for Manual Commission Ledger Adjustments
status: Done
author: Bob (sm)
date: '2025-12-02T13:30:00Z'

description: >
  As an administrator, I want to manually add or reverse entries in a driver's commission ledger,
  so that I can correct payment errors, issue manual bonuses, or handle financial disputes.

acceptance_criteria:
  - A new "Ledger Adjustments" section must be added to the driver's detail page in the `admin-panel`.
  - The UI must provide a form to create a new ledger entry (a credit or a debit).
  - The form must include fields for an amount (positive for credit, negative for debit), an adjustment type (e.g., "Manual Credit", "Correction", "Bonus"), and a mandatory "Reason" text field.
  - Submitting the form must call a new, admin-protected endpoint on the `mlm-service` (e.g., `POST /admin/mlm/adjust-ledger`).
  - The `mlm-service` endpoint must create a new record in the `RegistrationFeeLedger` table.
  - The new ledger entry must clearly identify the driver receiving the adjustment and the admin who performed it.
  - All manual adjustments must be clearly identifiable in the driver's commission view in the Driver App (`story-103.1`).
  - All manual adjustments must be captured in the Admin Action Audit Log as per the PRD.

files_to_be_modified:
  - apps/admin-panel/src/components/management/PlatformUsers.tsx # Driver detail view
  - apps/admin-panel/src/components/management/DriverLedgerAdjustment.tsx # New component
  - apps/mlm-service/src/app/mlm.controller.ts # To add the new admin endpoint for ledger adjustments.
  - apps/mlm-service/src/app/mlm.service.ts # To add the business logic for creating a manual ledger entry.
  - apps/driver-app/lib/screens/mlm_payouts_screen.dart # To ensure manual adjustments are displayed clearly.

dev_notes: >
  This is a critical administrative function for financial control and auditing. It builds on the `RegistrationFeeLedger` (CommissionLedger) model. The backend uses `CommissionLedger` table. The frontend uses a new `DriverLedgerAdjustment` component embedded in `PlatformUsers` detail view.

tasks:
  - id: task-1
    description: "Implement the admin-protected backend endpoint in `mlm-service` for creating manual ledger entries."
    status: Done
  - id: task-2
    description: "Create the UI form in the `admin-panel` on the driver detail page for submitting adjustments."
    status: Done
  - id: task-3
    description: "Ensure the driver's commission view in the Driver App can correctly display these manual adjustments with a clear description (e.g., 'Manual Bonus')."
    status: Done