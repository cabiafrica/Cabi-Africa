id: story-79.6
epic: admin-experience
slug: admin-view-ride-details
title: Admin View of Detailed Ride Information
status: DONE
author: Bob (sm)
date: '2024-08-11T13:30:00Z'

description: >
  As an administrator, after clicking on a specific ride from a user's history,
  I want to see a detailed view of that ride, so I can get all the context
  needed to resolve a support ticket or incident.

acceptance_criteria:
  - A new dynamic route/page (e.g., `/rides/[rideId]`) must be created in the `admin-panel`.
  - This page must fetch and display all details for a specific ride from the `ride-service`.
  - Displayed information must include:
    - Passenger and Driver names (with links to their respective user detail pages).
    - Ride status (Completed, Cancelled, etc.).
    - Date and time of the ride.
    - Pickup and destination addresses.
    - A map showing the actual route taken.
    - A full fare breakdown (base fare, distance, time, tip, fees, final total).
    - Any ratings or reviews associated with the ride.
  - The `ride-service` must expose a new, admin-protected endpoint to fetch the detailed data for a single ride by its ID.

files_to_be_created:
  - apps/admin-panel/src/app/rides/[rideId]/page.tsx # The detailed ride view page

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To add logic to fetch detailed ride data for an admin
  - libs/backend/ride-service/src/lib/ride.controller.ts # To expose the new admin-only endpoint

dev_notes: >
  This story builds directly on `story-79.5` (Admin View of User's Ride History). It provides the drill-down view that is essential for any investigation. This page will need to aggregate data from multiple services: `ride-service` for trip data, `user-service` for participant names, and `rating-service` for feedback.
