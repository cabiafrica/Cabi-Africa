id: story-79.20
epic: admin-experience
slug: admin-bulk-reject-documents
title: "Admin: Bulk Reject Documents"
status: DONE
author: Bob (sm)
date: '2024-08-20T19:00:00Z'

description: >
  As an administrator, I want to select multiple drivers from the approvals list
  and reject all their pending documents with a single, common reason, so that I
  can efficiently handle common issues like poor image quality.

acceptance_criteria:
  - On the approvals page (`/approvals`), when one or more drivers are selected, a "Bulk Reject" button must become visible/enabled.
  - Clicking "Bulk Reject" must open a modal prompting the admin for a common rejection reason.
  - Confirming the action must call a new backend endpoint (e.g., `POST /admin/documents/bulk-reject`) with the list of selected driver IDs and the rejection reason.
  - The backend must process each driver, reject all their 'Pending Review' documents with the provided reason, and send the appropriate notifications.
  - After the bulk action is complete, the UI should refresh, and the rejected drivers should now appear in the "Action Required" filter.

files_to_be_modified:
  - apps/admin-panel/src/app/approvals/page.tsx # To add the bulk reject button and modal logic.
  - libs/backend/document-service/src/lib/document.service.ts # To add the bulk rejection logic.
  - libs/backend/document-service/src/lib/admin-document.controller.ts # To add the new bulk rejection endpoint.

dev_notes: >
  This feature mirrors the bulk approve functionality but requires an extra step for the rejection reason. The backend will iterate through the provided driver IDs, find all their pending documents, and call the existing `reviewDocument` logic for each one with a 'Rejected' status and the common reason. This ensures all existing notification and status update logic is reused.

tasks:
  - id: task-1
    description: "Implement the `POST /admin/documents/bulk-reject` endpoint in the backend."
  - id: task-2
    description: "Add the 'Bulk Reject' button to the approvals page and integrate a modal for entering the rejection reason."