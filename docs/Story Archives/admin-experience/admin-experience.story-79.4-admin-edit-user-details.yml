id: story-79.4
epic: admin-experience
slug: admin-edit-user-details
title: Admin Ability to Edit User Profile Details
status: DONE
author: Bob (sm)
date: '2024-08-11T12:30:00Z'

description: >
  As an administrator, I want to be able to edit certain details of a user's
  profile from the admin panel, so that I can correct errors or update
  information on their behalf.

acceptance_criteria:
  - On the user detail page (`story-79.2`), an "Edit Profile" button must be available.
  - Clicking this button should make key fields editable, such as "Full Name" and "Phone Number".
  - Critical identifiers like the user's Email and Registration Date must remain read-only.
  - In edit mode, "Save" and "Cancel" buttons must be displayed.
  - Clicking "Save" must call a new endpoint in the `user-service` to persist the changes.
  - The `user-service` must validate the updated information before saving.
  - The UI on the user detail page must update to reflect the saved changes.

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx # To add edit mode, input fields, and save/cancel logic
  - libs/backend/user-service/src/lib/user.service.ts # To add logic for an admin to update user details
  - libs/backend/user-service/src/lib/user.controller.ts # To expose the new endpoint for updating user details

dev_notes: >
  This story builds on the user detail view (`story-79.2`) and user status management (`story-79.3`). It provides a necessary tool for customer support agents to handle common user issues like typos in a name or an outdated phone number. It's important to be selective about which fields are editable to maintain data integrity.
