id: story-95.1
epic: admin-experience
slug: admin-bulk-actions
title: Implement "Admin Bulk Actions"
status: DONE
author: Bob (sm)
date: '2024-08-09T10:19:00Z'

description: >
  As an administrator, on list views like the drivers or passengers page, I
  want to be able to select multiple users and apply a bulk action to them
  (e.g., "Suspend Selected", "Send Message to Selected").

acceptance_criteria:
  - All major list views in the `admin-panel` (drivers, passengers, trips) must have checkboxes next to each item.
  - When items are selected, a "Bulk Actions" dropdown appears.
  - The available actions will depend on the context.
  - The backend must be updated with new endpoints that can accept a list of IDs to perform an action on.

files_to_be_created: []

files_to_be_modified:
  - All list pages in `apps/admin-panel` (e.g., `/app/drivers/page.tsx`).

dev_notes: >
  A major efficiency improvement for admins, allowing them to manage the platform at scale instead of one item at a time.