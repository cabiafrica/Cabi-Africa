id: story-79.25
epic: admin-experience
slug: admin-manage-driver-application
title: "Admin: View and Manage Individual Driver Application"
status: DONE
author: Gemini Code Assist
date: '2025-12-07T09:25:00Z'

description: >
  As an administrator, after selecting a driver application from the list, I need to see a detailed view of that application,
  so that I can review their submitted documents and approve or reject them.

acceptance_criteria:
  - A new dynamic route `drivers/applications/[applicationId]` must be created in the `admin-panel`.
  - This page must display all the information for the selected driver application (Name, Email, City, Status, etc.).
  - The page must list all documents submitted by the applicant.
  - Each document in the list must show its type, status, and a link to view the actual file.
  - If the application status is 'PENDING_REVIEW', the admin must be presented with "Approve" and "Reject" buttons.
  - Clicking "Approve" must update the application status to 'ACTIVE'.
  - Clicking "Reject" must prompt the admin for a rejection reason and then update the application status to 'REJECTED'.
  - The `user-service` or `driver-service` must be updated with endpoints to fetch detailed application data and to update an application's status.
  - New DTOs, `DriverApplicationDetailDto` and `UpdateApplicationStatusDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/drivers/applications/[applicationId]/page.tsx
  - docs/admin-experience.story-79.25-admin-manage-driver-application.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/driver.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is the action screen for the driver onboarding pipeline. The admin makes the final decision here. The backend will need to handle the status change and potentially trigger other workflows, like sending a welcome email on approval or an explanation email on rejection.

