id: story-79.17
epic: admin-experience
slug: admin-view-user-documents
title: "Admin: View User's Documents and Status"
status: DONE
author: Gemini Code Assist
date: '2025-12-09T12:25:00Z'

description: >
  As an administrator, from a user's detail page, I need to be able to view all documents submitted by that user (if a driver) and their current approval status,
  so that I can quickly assess their compliance and troubleshoot onboarding issues.

acceptance_criteria:
  - From the user detail page (`/users/[userId]`), there must be a link or button to "View Documents".
  - This link must navigate to a new page, `users/[userId]/documents`.
  - This page must display all documents submitted by the user (if a driver).
  - For each document, the page must show its type (e.g., "Driver's License"), current status (e.g., "Approved", "Pending Review", "Rejected"), and any rejection reason.
  - A link to view the actual uploaded document file must be provided.
  - The `document-service` must expose an admin-protected endpoint to fetch all documents for a specific user.
  - A new DTO, `UserDocumentInfoDto`, must be created in the shared DTOs library, extending `UserDetailDto` and including a list of `DriverDocumentDto`s.

files_to_be_created:
  - apps/admin-panel/src/app/users/[userId]/documents/page.tsx
  - docs/admin-experience.story-79.17-admin-view-user-documents.yml

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx
  - libs/shared/dtos/src/lib/user.dto.ts

dev_notes: >
  This feature provides a quick overview of a driver's compliance status, which is essential for support and onboarding teams. It leverages the existing `DriverDocumentDto` for document details.

