id: story-7.2
epic: driver-earnings-and-history
slug: driver-trip-history
title: Implement Driver Trip History Screen
status: Done
author: Bob (sm)
date: '2024-05-30T16:00:00Z'

description: >
  As a driver, I want to view a list of my completed trips, so that I can
  track my work history and review the details of past jobs.

acceptance_criteria:
  - A new `TripHistoryScreen` is created for the driver app.
  - The driver's `ProfileScreen` should be updated with a button or link (e.g., "View Trip History") that navigates to the `TripHistoryScreen`.
  - The `TripHistoryScreen` must fetch and display a list of the driver's completed trips from a new `getTripHistory()` method in the `RideService`.
  - Each item in the list should display key information, such as the date of the trip, the destination, and the driver's earnings for that trip.
  - The screen must properly handle loading and empty states (e.g., display a message like "No completed trips yet" if the list is empty).
  - Tapping on a trip in the list is not required to do anything for this story, but it should be structured to allow for future navigation to a detailed trip view.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_history_screen.dart
  - apps/driver-app/test/screens/trip_history_screen_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/api/ride_service.dart

dev_notes: >
  This story continues the `driver-earnings-and-history` epic. It will require a new method in the `RideService` to fetch a list of past rides. For this initial implementation, the service can return a hardcoded list of mock `Ride` objects to simulate a backend response. This feature is foundational for a future, more detailed earnings dashboard.
