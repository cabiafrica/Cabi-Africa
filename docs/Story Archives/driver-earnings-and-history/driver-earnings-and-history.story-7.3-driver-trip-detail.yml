id: story-7.3
epic: driver-earnings-and-history
slug: driver-trip-detail
title: Implement Driver Trip Detail View
status: Done
author: Bob (sm)
date: '2024-07-23T14:02:00Z'

description: >
  As a driver, after viewing my trip history, I want to tap on a specific
  trip to see a detailed breakdown of that trip, including the route map and
  earnings details.

acceptance_criteria:
  - Tapping on a trip in the `TripHistoryScreen` (`story-7.2`) must navigate to a new `TripDetailScreen`.
  - The `TripDetailScreen` must display a static map showing the route taken for the trip.
  - The screen must show a detailed earnings breakdown: Base Fare, Tip (if any), Bonus (if any), Commission, and Final Earnings.
  - It should also display other trip details like date, time, duration, and distance.
  - The `RideService` must be updated with a `getTripDetails(tripId)` method that fetches this comprehensive data from the backend.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_detail_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_history_screen.dart # To handle tap navigation
  - Cabi Alpha/mobile/driver_app/lib/api/ride_service.dart # To add the getTripDetails method
  - libs/backend/ride-service/src/lib/ride.service.ts # To provide detailed trip data

dev_notes: >
  This story adds depth to the trip history feature from `story-7.2`. It provides drivers with full transparency on their earnings for each trip. The backend will need to aggregate data from multiple sources (ride details, payment transactions) to provide a complete picture for a single trip.
