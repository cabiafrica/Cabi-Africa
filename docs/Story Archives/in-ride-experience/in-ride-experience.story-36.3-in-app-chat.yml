id: story-36.3
epic: in-ride-experience
slug: in-app-chat
title: Implement In-App Chat Between Passenger and Driver
status: Done
author: Bob (sm)
date: '2024-07-30T10:13:00Z'

description: >
  As a passenger or driver, I want to be able to send simple messages to the
  other person after a ride is accepted but before pickup, so that we can
  coordinate the pickup location (e.g., "I'm wearing a red jacket").

acceptance_criteria:
  - After a ride is accepted, a chat icon must appear on the in-trip screen for both passenger and driver.
  - Tapping the icon opens a simple chat interface.
  - Users can send and receive messages. To simplify, the feature can be limited to pre-defined canned messages (e.g., "I'm here", "I'll be right there").
  - The `chat-service` (or `support-service`) must be used to relay messages between the two users for the duration of the trip.
  - The communication channel must be temporary and tied to the `tripId`.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/trip_in_progress_view.dart # To add chat UI
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart # To add chat UI
  - libs/backend/support-service/src/lib/support.service.ts # To handle P2P chat relay

dev_notes: >
  This feature improves the pickup experience by allowing for easy coordination. Using canned messages initially can simplify the implementation and avoid moderation issues.
