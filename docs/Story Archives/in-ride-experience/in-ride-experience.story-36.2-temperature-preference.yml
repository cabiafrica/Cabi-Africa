id: story-36.2
epic: in-ride-experience
slug: temperature-preference
title: Implement In-Ride Temperature Preference
status: Done
author: Bob (sm)
date: '2024-07-30T10:01:00Z'

description: >
  As a passenger, I want to set a preference for the in-car temperature
  (e.g., cool, warm, no preference), so the driver is aware of my comfort level.

acceptance_criteria:
  - Under the "Ride Preferences" section (`story-36.1`), options for temperature must be available (e.g., using icons for cool, warm).
  - The selected preference must be passed with the ride request.
  - The `driver-app` must display this preference to the driver upon accepting the trip.
  - This is a non-binding preference to facilitate a better experience.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_confirmation_panel.dart # To add temperature options
  - libs/backend/ride-service/src/lib/ride.service.ts # To store the preference
  - Cabi Alpha/mobile/driver_app/lib/widgets/ride_request_panel.dart # To display the preference

dev_notes: >
  Another simple but effective feature to improve the in-ride experience. It adds another small piece of information to help drivers provide better service.
