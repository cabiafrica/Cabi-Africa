id: story-36.1
epic: in-ride-experience
slug: quiet-ride-preference
title: Implement "Quiet Ride" Preference
status: Done
author: Bob (sm)
date: '2024-07-29T14:07:00Z'

description: >
  As a passenger, I want the option to indicate that I prefer a quiet ride
  when I book my trip, so that the driver is aware of my preference for
  minimal conversation.

acceptance_criteria:
  - On the `RideConfirmationPanel`, a new "Ride Preferences" option must be available.
  - Under preferences, a "Quiet Ride" toggle should be present.
  - If selected, this preference must be passed along with the ride request.
  - The `driver-app` must display a clear, discreet notification (e.g., "Passenger prefers a quiet ride") when the driver accepts the trip.
  - This is a non-binding preference and should not be part of the rating system.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_confirmation_panel.dart # To add the preference toggle
  - libs/backend/ride-service/src/lib/ride.service.ts # To store the preference with the ride
  - Cabi Alpha/mobile/driver_app/lib/widgets/ride_request_panel.dart # To display the preference to the driver

dev_notes: >
  This is the first story for a new `in-ride-experience` epic. It's a simple feature that can significantly improve passenger comfort and satisfaction by setting clear expectations.
