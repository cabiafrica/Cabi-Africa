id: story-10.2
epic: driver-profile-and-settings
slug: view-driver-profile
title: Implement Driver Profile Screen
status: DONE
author: Bob (sm)
date: '2024-05-30T12:00:00Z'

description: >
  As a driver, I want to access a profile screen where I can view my personal
  and vehicle information, so that I can ensure my details are correct and
  manage my account.

acceptance_criteria:
  - A new `ProfileScreen` is created for the driver app.
  - The `HomeScreen` should have a new icon button or drawer item that navigates to the `ProfileScreen`.
  - The `ProfileScreen` must display the driver's name and phone number, fetched via the shared `AuthService`.
  - The screen must display the driver's vehicle information (car model, license plate).
  - The screen must display the driver's profile picture, fetched from S3 via the shared `AuthService`.
  - The screen should include a "Sign Out" button that calls the shared `AuthService.signOut()` method and navigates the user back to the `LoginScreen`.
  - For this initial version, the profile information will be read-only.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart
  - apps/driver-app/test/screens/profile_screen_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart
  - libs/shared/auth/lib/src/auth_service.dart # May need a method to get profile picture URL

dev_notes: >
  This story provides drivers with a much-needed profile view, mirroring the functionality recently added to the passenger app. It focuses on *viewing* data, as driver details are often managed by an admin process. The key functionality here is fetching and displaying user attributes and their profile picture from Cognito/S3 and providing a clear sign-out path.
