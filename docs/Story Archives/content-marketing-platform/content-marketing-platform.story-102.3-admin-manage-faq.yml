id: story-102.3
epic: content-marketing-platform
slug: admin-manage-faq
title: Admin Panel UI for Managing FAQ Page Content
status: Done
author: Bob (sm)
date: '2025-12-02T17:15:00Z'

description: >
  As an administrator or content manager, I want a user interface in the admin panel to manage the questions and answers on the FAQ page,
  so that I can keep the information accurate and helpful for prospective drivers without needing a developer.

acceptance_criteria:
  - A new "FAQ Management" page must be created in the `admin-panel`, likely under the "Content" section.
  - The page must display a list of all current FAQ items (question and answer pairs).
  - The UI must allow an admin to create a new FAQ item, edit an existing one, and delete one.
  - The UI should support reordering the FAQ items to control their display order on the public site.
  - The `content-service` must be extended to support full CRUD and reordering operations for FAQ items.
  - The public-facing FAQ page on the `marketing-website` (from `story-101.1`) must be refactored to fetch its content from the `content-service` API instead of using placeholder content.

files_to_be_created:
  - apps/admin-panel/src/app/content/faq/page.tsx # The admin UI for managing FAQ items.

files_to_be_modified:
  - apps/content-service/src/app/content.controller.ts # To add new endpoints for FAQ CRUD.
  - apps/content-service/src/app/content.service.ts # To add business logic for FAQ CRUD.
  - Cabi Alpha/web/user_portal/app/faq/page.tsx # To refactor the page to fetch live data from the API.
  - apps/admin-panel/src/components/layout/Sidebar.tsx # Or similar, to add a link to the new FAQ management page.

dev_notes: >
  This story makes the static FAQ page dynamic, fulfilling the "Content Management System" requirement from the PRD for FAQs. It follows the same pattern as the blog management story (`story-102.2`) by extending the `content-service` to act as a headless CMS for another content type. The answer field in the admin UI should ideally be a rich-text editor to allow for formatting like links and bold text.

tasks:
  - id: task-1
    description: "Extend the `content-service` with endpoints and logic for FAQ item CRUD and reordering."
  - id: task-2
    description: "Create the FAQ management page in the `admin-panel` with functionality to create, edit, delete, and reorder items."
  - id: task-3
    description: "Refactor the public FAQ page on the `marketing-website` to fetch and display the content from the `content-service`."
  - id: task-4
    description: "Add a link to the new FAQ management page in the admin panel's navigation."
