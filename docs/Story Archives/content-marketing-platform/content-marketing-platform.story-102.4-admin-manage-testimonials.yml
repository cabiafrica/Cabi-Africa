id: story-102.4
epic: content-marketing-platform
slug: admin-manage-testimonials
title: Admin Panel UI for Managing Driver Testimonials
status: Done
author: Bob (sm)
date: '2025-12-02T17:45:00Z'

description: >
  As an administrator or content manager, I want a user interface in the admin panel to add, edit, and feature driver testimonials,
  so that I can showcase positive and authentic driver experiences on the marketing website to attract new prospects.

acceptance_criteria:
  - A new "Testimonials" management page must be created in the `admin-panel` under the "Content" section.
  - The UI must allow an admin to create a new testimonial with fields for: Driver's Name, the testimonial quote/text, and an optional driver photo.
  - The UI must allow an admin to edit and delete existing testimonials.
  - Each testimonial must have a "Featured" toggle, allowing admins to control which testimonials are displayed on the public website.
  - The `content-service` must be extended to support full CRUD operations for testimonials.
  - The `marketing-website` homepage (or another relevant page like "Why Drive with Us?") must be refactored to fetch and display all "Featured" testimonials from the `content-service`.

files_to_be_created:
  - apps/admin-panel/src/app/content/testimonials/page.tsx # The admin UI for managing testimonials.

files_to_be_modified:
  - apps/content-service/src/app/content.controller.ts # To add new endpoints for testimonial CRUD.
  - apps/content-service/src/app/content.service.ts # To add business logic for testimonial CRUD.
  - Cabi Alpha/web/user_portal/app/page.tsx # To refactor the page to fetch and display live testimonials.
  - apps/admin-panel/src/components/layout/Sidebar.tsx # Or similar, to add a link to the new testimonials management page.

dev_notes: >
  This story continues to build out our headless CMS capabilities within the `content-service`, making the marketing site more dynamic and manageable by non-developers. It directly addresses the PRD requirement for driver testimonials (R1.1). The "Featured" flag is a key part of this, as it gives the marketing team control over which testimonials are live without having to delete them.

tasks:
  - id: task-1
    description: "Extend the `content-service` with endpoints and logic for testimonial CRUD operations."
  - id: task-2
    description: "Create the testimonial management page in the `admin-panel` with a form for creating/editing and a list view."
  - id: task-3
    description: "Implement the 'Featured' toggle functionality on both the frontend and backend."
  - id: task-4
    description: "Refactor the `marketing-website` homepage to dynamically fetch and display the featured testimonials."
