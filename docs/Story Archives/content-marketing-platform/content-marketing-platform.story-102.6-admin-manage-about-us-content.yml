id: story-102.6
epic: content-marketing-platform
slug: admin-manage-about-us-content
title: Admin Panel UI for Managing "About Us" Page Content
status: Done
author: Bob (sm)
date: '2025-12-02T18:30:00Z'

description: >
  As an administrator or content manager, I want a user interface in the admin panel to edit the content of the "About Us" page,
  so that I can keep our company story, mission, and values up-to-date without needing a developer.

acceptance_criteria:
  - A new "About Us" management page must be created in the `admin-panel` under the "Content" section.
  - The page must display the current content of the "About Us" page in an editable format.
  - The UI must provide a rich-text editor for the main content area to allow for formatted text, images, and links.
  - An admin must be able to save their changes, which will update the public-facing page.
  - The `content-service` must be extended to support fetching and updating the content for this specific page.
  - The `marketing-website`'s "About Us" page (`Cabi Alpha/web/user_portal/app/about/page.tsx` from `story-101.1`) must be refactored to fetch its content from the `content-service` API instead of using static placeholder content.

files_to_be_created:
  - apps/admin-panel/src/app/content/about-us/page.tsx # The admin UI for managing the "About Us" page content.

files_to_be_modified:
  - apps/content-service/src/app/content.controller.ts # To add new endpoints for this page's content.
  - apps/content-service/src/app/content.service.ts # To add business logic for fetching/updating this page's content.
  - Cabi Alpha/web/user_portal/app/about/page.tsx # To refactor the page to fetch live data from the API.
  - apps/admin-panel/src/components/layout/Sidebar.tsx # Or similar, to add a link to the new management page.

dev_notes: >
  This story continues our effort to convert static marketing pages into dynamically managed content via our headless `content-service`. It directly addresses the PRD requirement for an "About Us" page (R1.2) by making it fully manageable. The implementation will be very similar to the "Why Drive with Us?" management story (`story-102.5`), handling a single block of content for the page.

tasks:
  - id: task-1
    description: "Extend the `content-service` with endpoints and logic for fetching and updating the 'About Us' page content."
  - id: task-2
    description: "Create the 'About Us' management page in the `admin-panel` with a rich-text editor."
  - id: task-3
    description: "Refactor the public 'About Us' page on the `marketing-website` to fetch and display the content from the `content-service`."
  - id: task-4
    description: "Add a link to the new management page in the admin panel's navigation."
