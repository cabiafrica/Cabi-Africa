id: story-23.1
epic: vehicle-management
slug: driver-multi-vehicle-management
title: Allow Drivers to Manage and Switch Between Multiple Vehicles
status: Done
author: Bob (sm)
date: '2024-08-09T20:30:00Z'

description: >
  As a driver who owns or operates multiple vehicles, I want to register all
  of them on the platform and easily select which vehicle is active for taking
  trips, so I can use the right car for the job.

acceptance_criteria:
  - The "My Vehicle" screen (`story-12.6`) in the `driver-app` must be updated to support a list of vehicles instead of just one.
  - Drivers must be able to add new vehicles, each of which must go through the document verification process (`story-23.2`).
  - Before going online, if a driver has more than one approved vehicle, they must be prompted to select which one they are currently driving.
  - The selected vehicle's information (make, model, license plate) is the information passed to passengers during a ride.
  - The `user-service` data model must be updated to support an array of vehicles for each driver.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/vehicle_details_screen.dart # To be updated to a vehicle list/management screen
  - libs/backend/user-service/src/lib/user.service.ts # To update the data model from a single vehicle to a list
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart # To add the vehicle selection prompt before going online

dev_notes: >
  This is a foundational feature for supporting fleet owners and professional drivers who may use different vehicles. The most critical part is the data model change on the backend.
