id: story-23.8
epic: vehicle-management
slug: vehicle-specific-documents
title: Support Vehicle-Specific Document Uploads
status: Done
author: Bob (sm)
date: '2024-08-10T03:55:00Z'

description: >
  As a fleet owner, I need to upload and manage documents that are specific
  to each vehicle (like commercial insurance or inspection certificates), not
  just tied to a driver.

acceptance_criteria:
  - This enhances the multi-vehicle feature (`story-23.1`).
  - In the "My Vehicles" section of the `driver-app`, each vehicle must have its own document management sub-section.
  - The `user-service` must be updated to associate uploaded documents with a specific vehicle ID, not just the driver's user ID.
  - The admin document review panel (`story-12.2`) must be updated to handle vehicle-specific documents.

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To update the document data model

dev_notes: >
  This is a critical feature for supporting fleet partners and ensuring compliance for commercial vehicles, which often have different documentation requirements than personal vehicles.