id: story-23.3
epic: vehicle-management
slug: driver-select-vehicle-category
title: Allow Driver to Select Active Ride Categories
status: Done
author: Bob (sm)
date: '2024-07-10T09:00:00Z'

description: >
  As a driver with a vehicle eligible for multiple ride types (e.g., an SUV
  for 'Standard' and 'XL'), I want to select which categories I am available
  for before going online, so I can control the types of ride requests I receive.

acceptance_criteria:
  - The `vehicle-service` must be updated to store a list of `eligibleCategories` for each vehicle (e.g., ['Standard', 'XL']). This can be managed by an admin.
  - A new UI element (e.g., a set of toggles or a multi-select dropdown) must be added to the `driver-app`'s home screen, visible before the driver goes online.
  - This UI must display the eligible categories for the driver's currently active vehicle and allow them to select one or more.
  - When the driver taps "Go Online", their selection of active categories must be sent to the backend.
  - The `user-service` should store the driver's current `activeCategories` as part of their session or availability status.
  - The `ride-service`'s driver matching logic must be updated to only consider drivers who have the passenger's requested ride category in their `activeCategories` list.
  - If a driver switches their active vehicle, the category selection UI must update to show the categories for the newly selected vehicle.

files_to_be_created:
  - apps/admin-panel/src/app/vehicle-types/page.tsx # For admins to manage categories and eligibility rules

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart # To add the category selection UI
  - libs/backend/vehicle-service/src/lib/vehicle.service.ts # To manage eligible categories per vehicle
  - The database schema for the `vehicle-service` to add an `eligibleCategories` field to the vehicle model.
  - libs/backend/user-service/src/lib/user.service.ts # To manage a driver's currently selected active categories
  - libs/backend/ride-service/src/lib/ride.service.ts # To update the driver matching algorithm

dev_notes: >
  This story gives drivers more control and flexibility. It requires a new concept of vehicle "categories" or "tiers" to be managed, likely by an admin. The core of the work is updating the driver matching logic in the `ride-service` to filter drivers based on this new preference. The driver's selection should persist for their session but be re-evaluated each time they go online.