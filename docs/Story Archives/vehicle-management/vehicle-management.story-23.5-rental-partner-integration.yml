id: story-23.5
epic: vehicle-management
slug: rental-partner-integration
title: Implement Vehicle Rental Partner Integration
status: Done
author: Bob (sm)
date: '2024-08-10T01:25:00Z'

description: >
  As a person who wants to become a driver but doesn't own a qualifying car, I
  want the app to connect me with vehicle rental partners, so I can easily
  rent a car and start driving.

acceptance_criteria:
  - A new "Rent a Vehicle" section must be added to the driver onboarding flow and driver app.
  - This section displays offers from third-party vehicle rental partners.
  - Tapping an offer takes the user to the partner's website or app (via a deep link) to complete the rental process.
  - The system should use a referral link to track drivers who came from our platform.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/onboarding/signup_screen.dart # To add the rental option

dev_notes: >
  This is a key strategy for growing driver supply by removing the barrier of car ownership. It requires business development deals with rental companies.

tasks:
  - id: task-1
    description: Create frontend UI to display vehicle rental partners.
    subtasks:
      - "[x] Create a new screen `Cabi Alpha/mobile/driver_app/lib/screens/vehicle_rental_screen.dart` to display partner offers."
      - "[x] Implement logic to launch partner websites with a referral link."
  - id: task-2
    description: Integrate the rental screen into the onboarding flow.
    subtasks:
      - "[x] Add a link or button on the `signup_screen.dart` that navigates to the new rental screen."

