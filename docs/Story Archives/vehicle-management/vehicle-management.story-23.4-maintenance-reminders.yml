id: story-23.4
epic: vehicle-management
slug: maintenance-reminders
title: Implement Vehicle Maintenance Reminders
status: Done
author: Bob (sm)
date: '2024-08-10T00:40:00Z'

description: >
  As a driver, I want the app to help me track my vehicle's maintenance needs
  based on mileage, so I can keep my car in good condition.

acceptance_criteria:
  - In the "My Vehicle" section, a driver can input their vehicle's current mileage and set reminders for common maintenance tasks (e.g., "Oil change every 5000 miles").
  - The system tracks the mileage driven on trips.
  - When the vehicle is approaching a maintenance interval, the driver receives an in-app notification.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/vehicle_details_screen.dart # To add maintenance tracking UI
  - libs/backend/user-service/src/lib/user.service.ts # To store maintenance rules
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To track mileage and trigger reminders

dev_notes: >
  This is a value-add feature that helps drivers manage their primary business asset. It can improve vehicle safety and reliability on the platform.
