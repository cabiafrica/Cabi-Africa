id: story-10.3
epic: epic-10.0
slug: chat-with-support
title: Implement In-App Chat with Support
status: 'Ready for Dev'
author: Sarah (po)
date: '2024-06-28T15:35:00Z'

description: >
  As a user (driver or passenger), I want to start a chat session with a
  customer support agent directly from the app, so that I can get help with
  issues without leaving the app.

acceptance_criteria:
  - A "Help & Support" section must be available in both the `passenger-app` and `driver-app` (e.g., in the main menu or profile screen).
  - Within the "Help" section, there must be a "Chat with Support" option.
  - Tapping this option opens a chat screen and creates a new support ticket in the `support-service`.
  - The app connects to the `chat-service` and joins a unique room for that support ticket (e.g., `support-{ticketId}`).
  - The `chat-service` must be updated to handle these support rooms.
  - The `admin-panel`'s support ticket view (`story-79.7`) must be updated to show a "Join Chat" button for tickets that originated from an in-app chat.
  - Clicking "Join Chat" in the admin panel should allow a support agent to join the user's support room and communicate in real-time.
  - Messages sent by the support agent from the admin panel must appear in the user's mobile app, and vice-versa.

files_to_be_created:
  - docs/stories/story-10.3-chat-with-support.yml

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart # To add a "Help" button
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To add a "Help" button
  - libs/backend/chat-service/src/lib/chat.gateway.ts # To handle support rooms
  - libs/backend/support-service/src/lib/support.service.ts # To create tickets from chat sessions
  - apps/admin-panel/src/app/support/[ticketId]/page.tsx # To add the "Join Chat" functionality for agents

dev_notes: >
  This feature connects our real-time chat infrastructure to our support
  ticketing system. It requires coordination between the mobile apps, the
  `chat-service`, the `support-service`, and the `admin-panel`. The support
  agent's experience in the admin panel is a key part of this story, allowing
  them to seamlessly transition from viewing a ticket to engaging in a live
  chat.