id: story-46.2
epic: web-and-accessibility
slug: voice-commands
title: Implement Voice Commands for Booking (Accessibility)
status: DONE
author: Bob (sm)
date: '2024-08-01T09:09:00Z'

description: >
  As a user with a motor impairment, I want to be able to book a ride using
  voice commands, so that I can use the app hands-free.

acceptance_criteria:
  - The `passenger-app` must integrate with the OS's native speech-to-text capabilities.
  - A microphone icon on the `HomeScreen` should activate listening mode.
  - The user should be able to say commands like "Book a ride to [address]" or "Get me a car to [saved place]".
  - The app must parse the command, populate the destination, and bring the user to the confirmation screen.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add voice command activation and processing

dev_notes: >
  An important accessibility feature. The complexity lies in the natural language processing (NLP) required to accurately parse user commands. Initially, this can be limited to a very strict command format.
