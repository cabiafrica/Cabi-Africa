id: story-49.1
epic: emergency-and-roadside-assist
slug: emergency-pickup
title: Implement "Emergency Pickup" Feature
status: Done
author: Bob (sm)
date: '2024-08-01T09:13:00Z'

description: >
  As a user stranded with a broken-down car, I want a special button to
  request an emergency pickup for myself and indicate I may have extra needs
  (e.g., need space for car parts).

acceptance_criteria:
  - A new "Roadside Assist" or similar button should be available in the `passenger-app`.
  - This initiates a special ride request type.
  - The request is broadcast with high priority to nearby drivers.
  - The request information clearly indicates it's a non-standard, urgent pickup.
  - The pricing for this service may include a special surcharge.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add the new entry point
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle the new request type

dev_notes: >
  This is the first story for a new `emergency-and-roadside-assist` epic, another potential vertical. It leverages our network for high-urgency situations.
