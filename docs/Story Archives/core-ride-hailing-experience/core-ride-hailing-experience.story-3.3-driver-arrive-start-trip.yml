id: story-3.3
epic: core-ride-hailing-experience
slug: driver-arrive-start-trip
title: 'Driver: Arrive at Pickup and Start Trip'
status: DONE
author: Sarah (po)
date: '2024-06-01T14:00:00Z'

description: >
  As a driver, after arriving at the pickup location, I want to notify the
  passenger of my arrival and have the ability to start the trip once they are
  in the car, so I can begin the journey to their destination.

acceptance_criteria:
  - Tapping the "I Have Arrived" button on the `RideNavigationScreen` must trigger a notification to the passenger app (mocked for now).
  - The UI on the `RideNavigationScreen` must update to an "Arrived" state.
  - The "Start Navigation" button should be disabled or hidden.
  - The "I Have Arrived" button must be replaced by a "Start Trip" button.
  - A visual indicator, like "Waiting for passenger...", should be displayed.
  - Tapping "Start Trip" must call a `rideService.startTrip()` method to update the ride status on the backend.
  - After starting the trip, the app must transition to the "in-trip" view, showing the route to the final destination (this will be handled in Story 3.4).

files_to_be_created:
  # No new files, this story modifies existing screens and services.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/ride_navigation_screen.dart # To handle the new "Arrived" state and "Start Trip" button.
  - Cabi Alpha/mobile/driver_app/lib/services/ride_service.dart # To add notifyArrival() and startTrip() methods.
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart # To handle the "Driver Arrived" notification from the driver.

dev_notes: >
  This story bridges the "en route to pickup" and "in-trip" states. The passenger notification can be a mock event for now. The main focus is the state change on the driver's screen (from "Arrived" to "Start Trip") and the trigger to begin the main leg of the journey. This completes the pickup phase.
