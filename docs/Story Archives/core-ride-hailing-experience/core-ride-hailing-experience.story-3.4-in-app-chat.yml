id: story-3.4
epic: core-ride-hailing-experience
slug: in-app-chat
title: Implement In-App Chat Between Passenger and Driver
status: DONE
author: Bob (sm)
date: '2024-06-15T12:00:00Z'

description: >
  As a passenger or driver, I want to send and receive text messages to and
  from the other party within the app, so I can communicate important
  information (e.g., "I'm running a bit late", "I'm wearing a red jacket")
  without leaving the app or sharing my personal phone number.

acceptance_criteria:
  - A "Chat" button must be present on the driver's `DriverEnRoutePanel` and the passenger's `DriverDetailsPanel`.
  - Tapping the "Chat" button must open a new `ChatScreen` in both the `driver-app` and `passenger-app`.
  - The `ChatScreen` must display a real-time, scrollable history of messages for the active ride.
  - The screen must include a text input field and a "Send" button.
  - A new backend `chat-service` must be created to manage real-time messaging using WebSockets.
  - The mobile apps must connect to the `chat-service` to send and receive messages scoped to the active `rideId`.
  - Messages sent by the user must appear instantly on their screen and be sent to the backend.
  - Messages received from the other party must appear in real-time.
  - A notification badge should appear on the "Chat" button when there are unread messages.
  - The simulated `ChatService.dart` in the passenger app must be removed and replaced with this real implementation.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/chat_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/chat_screen.dart
  - libs/backend/chat-service/src/lib/chat.gateway.ts # For WebSocket communication
  - libs/backend/chat-service/src/lib/chat.service.ts
  - libs/backend/chat-service/src/lib/chat.module.ts

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/driver_en_route_panel.dart # To add Chat button
  - Cabi Alpha/mobile/passenger_app/lib/widgets/driver_details_panel.dart # To add Chat button
  - Cabi Alpha/mobile/driver_app/lib/navigation/app_router.dart # To add chat screen route
  - Cabi Alpha/mobile/passenger_app/lib/navigation/app_router.dart # To add chat screen route

files_to_be_deleted:
  - Cabi Alpha/mobile/passenger_app/lib/screens/chat_service.dart # Replaced by backend service

dev_notes: >
  This story introduces real-time, two-way communication, a significant new capability. The new `chat-service` should use a WebSocket library like Socket.IO via NestJS Gateways. All communication must be namespaced by `rideId` to ensure messages are only delivered to the correct participants. The existing `ChatService.dart` provides a good starting point for the UI simulation but will be entirely replaced by a client that communicates with the new backend service.