id: story-3.4
epic: core-ride-hailing-experience
slug: driver-navigate-destination
title: "'Driver: Navigate to Destination and End Trip'"
status: DONE
author: Sarah (po)
date: '2024-06-01T15:00:00Z'

description: >
  As a driver, after the trip has started, I want to see the route to the
  passenger's destination and be able to end the trip upon arrival.

acceptance_criteria:
  - After tapping "Start Trip" on the `RideNavigationScreen`, the UI must update to an "in-trip" state.
  - The screen's title should update to "On Trip to Destination".
  - The displayed address must now be the passenger's final destination.
  - The "Start Trip" button must be replaced by an "End Trip" button.
  - The "Start Navigation" button's action should now launch the external navigation app with the *final destination* address.
  - Tapping "End Trip" must call a `rideService.completeTrip()` method.
  - After completing the trip, the app must navigate to a new `TripCompletionScreen` to handle fare calculation and payment confirmation.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_completion_screen.dart
  - apps/driver-app/test/screens/trip_completion_screen_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/ride_navigation_screen.dart # To handle the "in-trip" state and navigate to the completion screen.
  - Cabi Alpha/mobile/driver_app/lib/services/ride_service.dart # To add a `completeTrip` method.

dev_notes: >
  This story completes the driver's journey. The `RideNavigationScreen` will be updated to handle its final state. The new `TripCompletionScreen` will be responsible for showing the final fare and confirming payment (initially mocked). This sets the stage for the rating and earnings flow.
