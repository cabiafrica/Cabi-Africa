id: story-2.1
epic: core-ride-hailing-experience
slug: passenger-home-screen-map-setup
title: 'Implement Passenger Home Screen with Map Display'
status: Done
author: Bob (sm)
date: '2024-05-24T11:00:00Z'

qa_results:
  - reviewer: Quinn
    date: '2024-05-26T18:00:00Z'
    decision: CONCERNS
    summary: >-
      The implementation in `apps/driver-app/home_screen.dart` correctly sets up the map and location services.
      However, it lacks robustness due to missing error handling for location fetching and has no widget test coverage,
      which is a critical gap for a core screen.
    concerns:
      - id: C-2.1-1
        severity: Medium
        description: The `_goToCurrentUserLocation` method does not handle potential exceptions from `Geolocator.getCurrentPosition()`, which could lead to an unhandled error if location services fail.
        recommendation: Wrap the logic in `_goToCurrentUserLocation` in a `try-catch` block to gracefully handle errors.
      - id: C-2.1-2
        severity: High
        description: There are no widget tests for the `HomeScreen` to verify that the map, search bar, and floating action button are rendered correctly.
        recommendation: Create a `home_screen_test.dart` file and add tests for the initial UI state and basic interactions.
  - reviewer: Quinn
    date: '2024-05-26T19:00:00Z'
    decision: PASS
    summary: >-
      The previously identified concerns have been addressed. Error handling has been added to the location fetching logic (C-2.1-1),
      and a new widget test file (`home_screen_test.dart`) has been created, providing initial test coverage for the screen (C-2.1-2).
      The story now meets quality standards.
  - reviewer: Quinn
    date: '2024-05-27T14:00:00Z'
    decision: FAIL
    summary: >-
      Critical architectural mismatch detected. The story requires the implementation of the Passenger Home Screen,
      but the `HomeScreen` and its tests were incorrectly implemented within the `driver-app` module. This misplacement
      violates the core acceptance criteria and modular design of the applications.
    concerns:
      - id: C-2.1-3
        severity: Blocker
        description: The `HomeScreen` was created at `apps/driver-app/home_screen.dart` instead of the required `Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart`.
        recommendation: Move `apps/driver-app/home_screen.dart` to `Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart` and update all relevant imports and dependencies.
      - id: C-2.1-4
        severity: Blocker
        description: The corresponding test file `home_screen_test.dart` was also created in the `driver-app` directory.
        recommendation: Move `apps/driver-app/home_screen_test.dart` to `apps/passenger-app/test/screens/home_screen_test.dart` and correct its imports to align with the passenger app's structure.
  - reviewer: Quinn
    date: '2024-05-27T15:00:00Z'
    decision: PASS
    summary: >-
      The critical architectural mismatch has been resolved. The `HomeScreen` and its test file have been moved to the correct
      `passenger-app` module, addressing concerns C-2.1-3 and C-2.1-4. The implementation now aligns with the story's acceptance
      criteria, including navigation from the OTP screen and initial map setup. The original concerns (C-2.1-1, C-2.1-2) also
      remain resolved. The story now meets all quality standards.

description: >
  As a passenger, after I successfully log in, I want to see a home screen
  with a map centered on my current location, so that I can see my surroundings
  and begin the process of booking a ride.

acceptance_criteria:
  - A new `HomeScreen` widget is created in `Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart`.
  - The `google_maps_flutter` and `geolocator` packages are added to the `passenger-app`'s `pubspec.yaml`.
  - The `OtpVerificationScreen` navigates to the new `HomeScreen` upon successful OTP verification.
  - On first load, the `HomeScreen` requests location permissions from the user.
  - Once permission is granted, the `GoogleMap` widget animates to the user's current location.
  - The map displays the standard "My Location" blue dot.
  - A placeholder UI element (e.g., a search bar or a "Where to?" button) is present on the screen for initiating a ride request in a future story.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart

files_to_be_modified:
  - apps/passenger-app/pubspec.yaml
  - Cabi Alpha/mobile/passenger_app/lib/screens/otp_verification_screen.dart
  # Android and iOS configuration files will also need modification for map and location permissions.
  - apps/passenger-app/android/app/src/main/AndroidManifest.xml
  - apps/passenger-app/ios/Runner/Info.plist
