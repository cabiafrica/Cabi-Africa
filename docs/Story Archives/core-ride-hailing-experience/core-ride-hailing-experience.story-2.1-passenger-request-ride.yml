id: story-2.1
epic: core-ride-hailing-experience
slug: passenger-request-ride
title: "Passenger: Select locations and request a ride"
status: DONE
author: Sarah (po)
date: '2024-06-01T11:00:00Z'

description: >
  As a passenger, I want to select my pickup and drop-off locations on a map,
  view the estimated fare, and confirm my ride request, so that I can find a
  driver to take me to my destination.

acceptance_criteria:
  - The `HomeScreen` must display an interactive map (e.g., using `google_maps_flutter`).
  - The user must be able to set a pickup and a destination location, for instance by tapping on the map or using a search bar.
  - After setting both locations, a `RideConfirmationPanel` must appear.
  - The `RideConfirmationPanel` must display the selected pickup/drop-off addresses, estimated distance, and estimated fare.
  - The panel must have a "Confirm Ride" button.
  - Tapping "Confirm Ride" must call a new `requestRide()` method in the `RideService`.
  - The `requestRide()` method should send a request to the `dispatch-service` backend.
  - After requesting, the UI must update to show a "Finding a driver..." state.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_confirmation_panel.dart
  - apps/passenger-app/test/widgets/ride_confirmation_panel_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/api/ride_service.dart

dev_notes: >
  This is the core feature of the passenger app. The implementation should focus on the user flow of selecting points and confirming the request. For the MVP, location selection can be simplified (e.g., long-press on map). The fare estimation can be a simple mock calculation (e.g., distance * rate). The backend call to `dispatch-service` should align with the API defined in `story-22.4`.
