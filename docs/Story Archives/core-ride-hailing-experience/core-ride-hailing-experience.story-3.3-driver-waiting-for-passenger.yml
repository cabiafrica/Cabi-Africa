id: story-3.3
epic: core-ride-hailing-experience
slug: driver-waiting-for-passenger
title: Implement Driver Waiting for Passenger Panel
status: DONE
author: Quinn
date: '2024-05-27T18:00:00Z'

description: >
  As a driver, after I have accepted a ride request, I want to see a panel
  with the passenger's details and a button to start the trip, so that I can
  navigate to the pickup location and manage the trip state.

acceptance_criteria:
  - After the driver accepts a ride, the `HomeScreen` state should update to `enRouteToPassenger`.
  - The `RideRequestModal` should be replaced by a new `WaitingForPassengerPanel` widget.
  - The `WaitingForPassengerPanel` must display the passenger's name and pickup location.
  - The panel must contain a primary action button, "Start Trip".
  - Tapping "Start Trip" should call a new `rideService.startTrip()` method.
  - After the trip is successfully started, the UI should transition to the in-trip view (handled in story-3.3).
  - Note: The reference to 'story-3.3' in the last criterion should now be considered 'story-3.4'.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/widgets/waiting_for_passenger_panel.dart
  - apps/driver-app/test/widgets/waiting_for_passenger_panel_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/api/ride_service.dart

qa_results:
  - reviewer: Quinn
    date: '2024-05-27T19:00:00Z'
    decision: PASS
    summary: >-
      The implementation successfully meets all acceptance criteria. The driver's `HomeScreen` now correctly manages the `enRouteToPassenger` state and displays the `WaitingForPassengerPanel`. The "Start Trip" functionality is correctly wired to the `RideService`. The new widget is covered by tests. The story is complete and meets all quality standards.

dev_notes: >
  This story bridges the gap between accepting a ride and starting the trip. It requires adding a new state to the driver's `HomeScreen` state machine. The `RideService` will need a `startTrip` method. The `WaitingForPassengerPanel` will display key information to the driver before they begin the journey.
