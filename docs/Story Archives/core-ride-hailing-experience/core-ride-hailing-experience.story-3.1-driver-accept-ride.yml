id: story-3.1
epic: core-ride-hailing-experience
slug: driver-accept-ride
title: "Driver: View and Accept Ride Requests"
status: DONE
author: Sarah (po)
date: '2024-06-01T12:00:00Z'

description: >
  As a driver, I want to receive notifications of nearby ride requests and view
  the trip details (pickup location, estimated earnings) so that I can decide
  whether to accept the job.

acceptance_criteria:
  - The app must listen for incoming ride request events (mocked via a Service for now).
  - When a request is received, an `IncomingRideScreen` (or modal) must be displayed.
  - The screen must show: Pickup Address, Estimated Distance to Pickup, and Estimated Fare/Earnings.
  - Include "Accept" and "Decline" buttons.
  - Include a countdown timer (e.g., 15 seconds) to create urgency.
  - Tapping "Accept" calls the backend to assign the ride to this driver.
  - On successful assignment, navigate to the `RideNavigationScreen` (to be created in a future story).
  - Tapping "Decline" or timeout dismisses the screen.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/incoming_ride_screen.dart
  - apps/driver-app/test/screens/incoming_ride_screen_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/services/ride_request_service.dart # New service to handle incoming events

dev_notes: >
  For this story, we will simulate the incoming ride event. You can add a button to the Driver Home Screen (dev-only) to "Simulate Incoming Ride" to trigger the screen. The focus is on the UI of the offer and the Accept/Decline interaction.
