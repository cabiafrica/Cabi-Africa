id: story-88.1
epic: driver-support
slug: driver-view-faqs
title: Driver View FAQs and Help Center
status: DONE
author: Sarah (po)
date: '2024-08-12T12:00:00Z'

description: >
  As a driver, I want to browse and search Frequently Asked Questions (FAQs)
  so that I can resolve common issues without needing to contact support.

acceptance_criteria:
  - The Driver App must have a `FAQScreen` accessible from the Home Screen.
  - The screen must display a list of FAQs fetched from the `support-service`.
  - Each FAQ item should be expandable to show the answer.
  - A search bar must allow filtering questions by keywords.
  - The UI should be clean and text-focused.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/faq_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart
  - libs/backend/support-service/src/lib/support.service.ts
  - libs/backend/support-service/src/lib/support.controller.ts

dev_notes: >
  This is the first step in the support epic. Future stories will add ticket creation
  functionality if the FAQ doesn't resolve the user's issue.

tasks:
  - id: task-1
    description: Implement backend FAQ retrieval.
    subtasks:
      - "[x] Create `support.service.ts` with mock FAQ data."
      - "[x] Create `support.controller.ts` exposing `GET /support/faqs`."
  - id: task-2
    description: Implement frontend Help Center.
    subtasks:
      - "[x] Create `faq_screen.dart` with search and expansion tiles."
      - "[x] Add navigation icon to `home_screen.dart`."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
