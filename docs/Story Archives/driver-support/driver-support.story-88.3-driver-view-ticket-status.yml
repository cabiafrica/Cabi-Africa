id: story-88.3
epic: driver-support
slug: driver-view-ticket-status
title: Driver View Support Ticket Status
status: DONE
author: Sarah (po)
date: '2024-08-12T14:00:00Z'

description: >
  As a driver, I want to view a list of my submitted support tickets and their
  current status (Open, In Progress, Resolved), so that I know if my issues are being addressed.

acceptance_criteria:
  - The `FAQScreen` (Help Center) must have a "My Tickets" action/button.
  - Tapping it opens the `TicketListScreen`.
  - The screen must display a list of tickets submitted by the driver.
  - Each list item must show: Subject, Date Submitted, and Status.
  - Status must be color-coded (e.g., Orange for Open, Green for Resolved).
  - The app must fetch this data from the `support-service`.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/ticket_list_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/faq_screen.dart
  - libs/backend/support-service/src/lib/support.service.ts
  - libs/backend/support-service/src/lib/support.controller.ts

dev_notes: >
  This closes the loop for the basic support workflow. Drivers can now self-serve (FAQ),
  report issues (Create Ticket), and track progress (View Status).

tasks:
  - id: task-1
    description: Implement backend ticket retrieval.
    subtasks:
      - "[x] Update `support.service.ts` to filter tickets by driver ID."
      - "[x] Update `support.controller.ts` to expose `GET /support/tickets`."
  - id: task-2
    description: Implement frontend ticket list.
    subtasks:
      - "[x] Create `ticket_list_screen.dart`."
      - "[x] Add navigation from `faq_screen.dart` AppBar."

