id: story-88.2
epic: driver-support
slug: driver-create-support-ticket
title: Driver Create Support Ticket
status: DONE
author: Sarah (po)
date: '2024-08-12T13:00:00Z'

description: >
  As a driver, I want to submit a support ticket with details about my issue
  when the FAQs do not resolve my problem, so that the support team can assist me.

acceptance_criteria:
  - The `FAQScreen` must have a "Contact Support" button.
  - Tapping the button opens the `CreateTicketScreen`.
  - The screen must contain a form with: Category (Dropdown), Subject, and Description.
  - Submitting the form must send the data to the `support-service`.
  - The user should receive a confirmation message (SnackBar/Dialog) upon success.
  - The backend must store the ticket with an "OPEN" status.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/create_ticket_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/faq_screen.dart
  - libs/backend/support-service/src/lib/support.service.ts
  - libs/backend/support-service/src/lib/support.controller.ts

dev_notes: >
  This provides the "escape hatch" for users who can't find answers in the self-service
  section. Future stories will handle viewing the status of these tickets.

tasks:
  - id: task-1
    description: Implement backend ticket creation.
    subtasks:
      - "[x] Update `support.service.ts` to store tickets in memory."
      - "[x] Update `support.controller.ts` to expose `POST /support/tickets`."
  - id: task-2
    description: Implement frontend ticket form.
    subtasks:
      - "[x] Create `create_ticket_screen.dart` with validation."
      - "[x] Add navigation from `faq_screen.dart`."

