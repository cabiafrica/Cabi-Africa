id: driver-support
slug: driver-support
title: Driver Support and Help Center
status: DONE
owner: Sarah (po)
description: >
  This epic covers the tools and interfaces required to provide support to drivers.
  It aims to reduce support costs through self-service (FAQs) and streamline
  the resolution of issues that require human intervention.
  
  Key capabilities include:
  - In-app Help Center with searchable FAQs.
  - Ticket creation for specific issues (e.g., "Fare Review", "Account Issue").
  - In-app messaging/chat with support agents.
  - Status tracking for open support tickets.
tags:
