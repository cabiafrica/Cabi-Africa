id: story-58.1
epic: driver-privacy
slug: driver-incognito
title: Implement "Driver Incognito" Mode
status: Done
author: Bob (sm)
date: '2024-08-05T09:07:00Z'

description: >
  As a driver, I want an "incognito" mode that masks my precise location from
  the passenger app's idle map view, so that my privacy is protected when I'm
  not on a trip.

acceptance_criteria:
  - A new "Privacy" section in the `driver-app` settings must have an "Incognito Mode" toggle.
  - When enabled, the driver's location data sent to the passenger app's "nearby cars" view should be generalized or jittered to a less precise area.
  - The driver's exact location is only used once they have accepted a trip and are navigating to the passenger.
  - The `ride-service` must be updated to provide this generalized location data for idle drivers.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle location generalization

dev_notes: >
  This is the first story for a new `driver-privacy` epic. It addresses driver concerns about being constantly tracked by anyone with the passenger app open.
