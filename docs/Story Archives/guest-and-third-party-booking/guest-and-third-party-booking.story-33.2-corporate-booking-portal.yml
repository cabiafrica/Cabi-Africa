id: story-33.2
epic: guest-and-third-party-booking
slug: corporate-booking-portal
title: Implement Corporate Booking Portal
status: DONE
author: Bob (sm)
date: '2024-07-29T14:01:00Z'

description: >
  As a corporate administrator, I want a web-based portal where I can book
  and manage rides for my employees and guests, with billing centralized to
  the company account.

acceptance_criteria:
  - A new web application, `corporate-portal`, must be created.
  - It must have its own authentication for corporate admin users.
  - Once logged in, an admin can book a ride for a guest by providing the guest's name, phone number, and pickup/destination details.
  - The booking flow must be similar to the "Ride for a Friend" feature (`story-33.1`), sending an SMS to the guest with trip details.
  - All rides booked through the portal must be billed to a central corporate account.
  - The portal must have a dashboard to view the history and status of all company-booked rides.
  - The `ride-service` and `payment-service` must be updated to support company-level accounts and billing.

files_to_be_created:
  - apps/corporate-portal/src/app/page.tsx
  - apps/corporate-portal/src/app/dashboard/page.tsx

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle rides booked by a corporate entity
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle corporate billing

dev_notes: >
  This is a significant new product offering. It builds on the concepts of third-party booking but adds layers of corporate account management, authentication, and centralized billing. It will require significant changes to how we model users and payments.
