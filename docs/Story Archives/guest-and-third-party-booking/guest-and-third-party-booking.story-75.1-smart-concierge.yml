id: story-75.1
epic: guest-and-third-party-booking
slug: smart-concierge
title: Implement "Smart Concierge" for Hotels
status: DONE
author: Bob (sm)
date: '2024-08-07T09:20:00Z'

description: >
  As a hotel guest, I want to be able to book a ride to or from the hotel
  through the hotel's TV or a lobby kiosk, with the charge automatically
  added to my room.

acceptance_criteria:
  - This requires creating a simplified, kiosk-friendly version of the booking portal (`story-66.1`).
  - It needs an API that can be integrated into third-party systems like hotel TVs or tablets.
  - The user identifies themselves with their room number and last name.
  - The booking is made, and the charge is posted to the hotel's PMS.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.controller.ts # To add a new set of APIs for third-party integrators

dev_notes: >
  A deep B2B integration that embeds our service directly into the hospitality experience, creating a seamless booking channel.
