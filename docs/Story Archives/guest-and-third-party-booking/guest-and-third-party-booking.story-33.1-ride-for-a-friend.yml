id: story-33.1
epic: guest-and-third-party-booking
slug: ride-for-a-friend
title: Implement "Ride for a Friend"
status: DONE
author: Bob (sm)
date: '2024-07-28T10:04:00Z'

description: >
  As a user, I want to book a ride for another person (a guest), so that I
  can arrange travel for a friend or family member using my account.

acceptance_criteria:
  - On the `RideBookingPanel`, an option must be available to specify that the ride is for someone else.
  - This should allow the user to select a contact from their address book or manually enter the guest's name and phone number.
  - When the ride is booked, the guest must receive an SMS with the trip details: driver name, photo, vehicle info, license plate, and a live tracking link.
  - The driver must be clearly informed that the ride is for a guest and see the guest's name.
  - The user who booked the ride must be able to track the trip's progress in their own app.
  - The `ride-service` must be updated to handle a guest rider, storing both the booker's and the guest's information.
  - The `notification-service` must be responsible for sending the SMS to the guest.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_booking_panel.dart # To add the "for a friend" option
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle guest rides
  - libs/backend/notification-service/src/lib/notification.service.ts # To send SMS to guest

dev_notes: >
  This is the first story for a new `guest-and-third-party-booking` epic. It's a popular feature that expands the use case of the app. The key challenges are the three-way communication (booker, guest, driver) and ensuring the guest receives all necessary information without needing the app installed.
