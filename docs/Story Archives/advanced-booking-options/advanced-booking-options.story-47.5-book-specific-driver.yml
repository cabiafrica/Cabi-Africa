id: story-47.5
epic: advanced-booking-options
slug: book-specific-driver
title: Implement "Book with a Specific Driver"
status: DONE
author: Bob (sm)
date: '2024-08-07T09:10:00Z'

description: >
  As a passenger, I want to be able to request a ride directly from one of my
  Favorite Drivers, so that I can ride with someone I trust and like.

acceptance_criteria:
  - On the `FavoriteDriversScreen` (`story-35.2`), if a favorite driver is online, a "Request Ride" button is visible.
  - Tapping it sends a direct, exclusive ride request to that specific driver.
  - The driver has a short window (e.g., 60 seconds) to accept or decline.
  - If they decline or the request expires, the passenger is notified and can then send the request to the general driver pool.
  - The `ride-service` must be updated to handle these direct, single-driver requests.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/favorite_drivers_screen.dart # To add the request button
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle direct-to-driver requests

dev_notes: >
  This enhances the "Favorite Driver" feature, giving passengers more control and top drivers more direct business. It changes the matching flow from a broadcast to a direct offer.