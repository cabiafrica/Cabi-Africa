id: story-110.2
epic: mlm-and-organizations
slug: admin-manage-driver-groups
title: "Admin: Manage Driver Groups and Subgroups"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:05:00Z'

description: >
  As an administrator, I need to be able to create and manage a hierarchical structure of driver groups and subgroups,
  so that I can organize drivers for the MLM program.

acceptance_criteria:
  - A new "MLM" > "Driver Groups" section must be added to the `admin-panel`.
  - The page must list all top-level driver groups.
  - Each group in the list must show its name and the number of members.
  - The page must provide a way to create a new top-level group.
  - An admin must be able to click on a group to view its details.
  - The group detail view must show the group's name, description, and a list of its direct subgroups.
  - The group detail view must provide a way to create a new subgroup under the current group.
  - The `organization-service` must be updated with endpoints to create, retrieve, and manage these groups.
  - New DTOs, `DriverGroupDto` and `CreateDriverGroupDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/groups/page.tsx
  - apps/admin-panel/src/app/mlm/groups/[groupId]/page.tsx
  - docs/mlm-and-organizations.story-110.2-admin-manage-driver-groups.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature is the backbone of the MLM organizational structure. The backend will need to support a hierarchical (parent-child) relationship for the groups.

