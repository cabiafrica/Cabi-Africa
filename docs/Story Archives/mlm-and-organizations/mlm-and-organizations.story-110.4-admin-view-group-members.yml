id: story-110.4
epic: mlm-and-organizations
slug: admin-view-group-members
title: "Admin: View Group Members and Hierarchy"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:15:00Z'

description: >
  As an administrator, I need to be able to view the members of a specific group and see its position within the overall hierarchy,
  so that I can understand the structure of the organization.

acceptance_criteria:
  - The group detail page (`/mlm/groups/[groupId]`) must display a list of all drivers who are members of that group.
  - Each member in the list must show their name and the date they joined the group.
  - The page must display a breadcrumb trail or similar UI to show the group's hierarchical path (e.g., "Top-Level Groups > Top Eagles > Team Alpha").
  - The `organization-service` must be updated to provide member lists and hierarchy information for a group.
  - The `DriverGroupDto` must be updated to include the list of members and the hierarchy path.

files_to_be_created:
  - docs/mlm-and-organizations.story-110.4-admin-view-group-members.yml

files_to_be_modified:
  - apps/admin-panel/src/app/mlm/groups/[groupId]/page.tsx
  - libs/shared/dtos/src/lib/organization.dto.ts

dev_notes: >
  This feature adds crucial visibility into the MLM structure for administrators. The backend will need to perform a recursive query or store path information to efficiently generate the hierarchy breadcrumbs.

