id: story-121.3
epic: mlm-and-organizations
slug: driver-join-organization
title: "Driver App: Join an Organization"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T11:25:00Z'

description: >
  As a driver, I want to be able to join an existing organization by providing an organization ID or code,
  so that I can become part of a fleet.

acceptance_criteria:
  - A new "Join an Organization" option must be available in the `driver-app`.
  - This option should lead to a simple form where the driver can enter an organization ID/code.
  - Submitting the form must send a request to the `organization-service` to join the specified organization.
  - The driver should see a confirmation message upon successful joining.
  - The existing `JoinOrganizationRequestDto` should be used for the request.

files_to_be_created:
  - apps/driver-app/src/screens/join_organization_screen.dart
  - docs/mlm-and-organizations.story-121.3-driver-join-organization.yml

files_to_be_modified: []

dev_notes: >
  This feature provides a direct way for drivers to join a fleet, complementing the admin-driven assignment from `story-111.2`.

