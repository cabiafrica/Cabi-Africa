id: story-110.1
epic: mlm-and-organizations
slug: admin-configure-mlm-fee-formula
title: "Admin: Configure MLM Fee Distribution Formula"
status: Done
author: Gemini Code Assist
date: '2025-12-09T09:00:00Z'

description: >
  As an administrator, I need to configure the distribution formula for the MLM registration fee,
  so that I can control how much commission is paid to upline drivers and how much is retained by the platform.

acceptance_criteria:
  - A new "MLM" > "Settings" > "Fee Distribution" section must be added to the `admin-panel`.
  - The page must provide input fields to set the percentage of the fee for:
    - Level 1 Upline (the direct referrer).
    - Level 2 Upline (the referrer's referrer).
    - Platform Fee.
  - The UI must validate that the sum of all percentages equals 100%.
  - Saving the form must update the configuration in the `organization-service` or `payment-service`.
  - A new DTO, `MlmFeeDistributionDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/settings/fee-distribution/page.tsx
  - docs/mlm-and-organizations.story-110.1-admin-configure-mlm-fee-formula.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/mlm.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a core configuration for the MLM system's financial model. The backend service will store these percentages and use them whenever a registration fee is processed to calculate the correct commission payouts.

