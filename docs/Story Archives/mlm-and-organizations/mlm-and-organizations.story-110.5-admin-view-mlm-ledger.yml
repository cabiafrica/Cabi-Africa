id: story-110.5
epic: mlm-and-organizations
slug: admin-view-mlm-ledger
title: "Admin: View MLM Registration Fee Ledger"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:20:00Z'

description: >
  As an administrator, I need to view a ledger of all MLM registration fee transactions,
  so that I can audit commission payouts and track revenue.

acceptance_criteria:
  - A new "MLM" > "Ledger" section must be added to the `admin-panel`.
  - The page must display a paginated list of all registration fee transactions.
  - Each entry must show the transaction ID, date, paying driver, amount, recipient of the commission, and commission amount.
  - The list must be filterable by driver name (either paying or recipient) and by date range.
  - The `organization-service` must be updated with an endpoint to provide this ledger data with filtering capabilities.
  - The existing `MlmRegistrationFeeLedgerEntryDto` should be used.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/ledger/page.tsx
  - docs/mlm-and-organizations.story-110.5-admin-view-mlm-ledger.yml

files_to_be_modified: []

dev_notes: >
  This feature provides financial auditability for the MLM program. The backend will need to query the transaction ledger and allow for robust filtering.

