id: story-110.3
epic: mlm-and-organizations
slug: admin-approve-organizations
title: "Admin: Review and Approve New Driver Organizations"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:15:00Z'

description: >
  As an administrator, I need to be able to review and approve or reject new driver organization requests,
  so that I can maintain quality control over the organizations forming on the platform.

acceptance_criteria:
  - A new "MLM" > "Pending Organizations" section must be added to the `admin-panel`.
  - This section must display a list of all organization requests that are pending approval.
  - Each request in the list must show the proposed Organization Name and the name of the Driver who submitted it.
  - Each request must have "Approve" and "Reject" buttons.
  - Clicking "Approve" must call an endpoint in the `organization-service` to change the organization's status to active.
  - Clicking "Reject" must call an endpoint to delete or mark the request as rejected.
  - A new DTO, `PendingOrganizationDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/organizations/pending/page.tsx
  - docs/mlm-and-organizations.story-110.3-admin-approve-organizations.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a key gatekeeping function for the MLM feature. The backend service will manage the state of these organization requests. Upon approval, a new organization is officially created.

