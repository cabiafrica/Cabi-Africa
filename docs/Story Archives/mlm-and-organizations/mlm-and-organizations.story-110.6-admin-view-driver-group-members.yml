id: story-110.6
epic: mlm-and-organizations
slug: admin-view-driver-group-members
title: "Admin: View Members of a Driver Group"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T10:00:00Z'

description: >
  As an administrator, I need to be able to view a list of all drivers who are members of a specific driver group,
  so that I can manage group rosters and understand the structure of the organization.

acceptance_criteria:
  - A "View Members" action must be available for each group listed on the "Manage Driver Groups" page (`story-110.2`).
  - Clicking "View Members" must navigate to a new page displaying the list of drivers in that group.
  - The members list must be paginated and show the Driver's Name, Driver ID, and the date they joined the group.
  - The `organization-service` must expose an admin-protected endpoint to retrieve the members of a given group.
  - A new DTO, `DriverGroupMemberDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/groups/[groupId]/members/page.tsx
  - docs/mlm-and-organizations.story-110.6-admin-view-driver-group-members.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature provides visibility into the composition of driver groups, which is essential for MLM administration. The backend will need to query the relationship between drivers and groups.

