id: story-112.1
epic: mlm-and-organizations
slug: org-owner-manage-drivers
title: "Organization Owner: View and Manage Drivers"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T11:30:00Z'

description: >
  As an organization owner, I need a dashboard in the driver app to view my drivers, manage pending join requests, and remove drivers from my organization,
  so that I can effectively manage my fleet.

acceptance_criteria:
  - A new "My Organization" section must be available in the `driver-app` for users with the `organization-owner` role.
  - The screen must display a list of drivers who are currently members of the organization.
  - For each member, the owner must see their name and have an option to "Remove" them.
  - The screen must also display a list of pending requests from drivers who want to join the organization.
  - For each pending request, the owner must have "Approve" and "Deny" actions.
  - The `organization-service` must be updated with endpoints for an owner to get their dashboard data, approve/deny requests, and remove members.
  - New DTOs for `OrganizationManagementDashboardDto`, `OrganizationDriverDto`, `OrganizationJoinRequestDto`, and `UpdateJoinRequestDto` must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/organization_management_screen.dart
  - docs/mlm-and-organizations.story-112.1-org-owner-manage-drivers.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts

dev_notes: >
  This feature empowers fleet owners by giving them direct control over their organization's membership within the app. This is a key feature for supporting fleet partners.

