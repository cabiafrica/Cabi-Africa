id: story-110.3
epic: mlm-and-organizations
slug: admin-assign-driver-to-group
title: "Admin: Manually Assign Driver to Group"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:10:00Z'

description: >
  As an administrator, I need to be able to manually assign a driver to a specific group or subgroup,
  so that I can manage group memberships and correct organizational structures.

acceptance_criteria:
  - From a group's detail page in the `admin-panel`, there must be an option to "Assign Driver".
  - This should lead to a page where an admin can search for a driver (e.g., by name or email).
  - After selecting a driver from the search results, the admin can confirm the assignment.
  - Upon confirmation, the driver must be added as a member of the group.
  - The `organization-service` must be updated with an endpoint to handle this assignment, likely `POST /admin/groups/{groupId}/members`.
  - The existing `AssignDriverToGroupDto` should be used for the request body.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/groups/[groupId]/assign/page.tsx
  - docs/mlm-and-organizations.story-110.3-admin-assign-driver-to-group.yml

files_to_be_modified:
  - apps/admin-panel/src/app/mlm/groups/[groupId]/page.tsx

dev_notes: >
  This feature provides a direct way for admins to manage the composition of MLM groups. The search functionality will be important for usability.

