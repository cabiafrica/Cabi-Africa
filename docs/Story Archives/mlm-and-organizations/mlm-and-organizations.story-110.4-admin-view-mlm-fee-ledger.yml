id: story-110.4
epic: mlm-and-organizations
slug: admin-view-mlm-fee-ledger
title: "Admin: View MLM Registration Fee Ledger"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:30:00Z'

description: >
  As an administrator, I need to view a detailed ledger of all MLM registration fee transactions,
  so that I can audit payments, track commission distributions, and resolve financial discrepancies.

acceptance_criteria:
  - A new "MLM" > "Fee Ledger" section must be added to the `admin-panel`.
  - This section must display a paginated and filterable list of all registration fee transactions.
  - Filters should include date range, paying driver, and recipient driver.
  - Each ledger entry must show: Transaction ID, Date, Paying Driver, Total Amount, Recipient Driver, and Commission Amount.
  - The `organization-service` or `payment-service` must expose an admin-protected endpoint to query this ledger.
  - A new DTO, `MlmRegistrationFeeLedgerEntryDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/fee-ledger/page.tsx
  - docs/mlm-and-organizations.story-110.4-admin-view-mlm-fee-ledger.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a critical financial auditing tool for the MLM component. The backend will need to record each leg of the fee distribution as a separate transaction in a ledger table for full transparency.

