id: story-110.5
epic: mlm-and-organizations
slug: admin-assign-driver-to-group
title: "Admin: Manually Assign a Driver to a Group"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:45:00Z'

description: >
  As an administrator, I need to be able to manually assign a driver to a specific driver group,
  so that I can manage team structures and correct any organizational misalignments.

acceptance_criteria:
  - An "Assign Driver" action must be available on the "Manage Driver Groups" page (`story-110.2`).
  - This action should lead to a form where an admin can enter a Driver ID.
  - Submitting the form must call an admin-protected endpoint in the `organization-service` with the group ID and driver ID.
  - The `organization-service` must add the driver to the specified group.
  - The UI should provide feedback on success or failure.
  - A new DTO, `AssignDriverToGroupDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/groups/[groupId]/assign-driver/page.tsx
  - docs/mlm-and-organizations.story-110.5-admin-assign-driver-to-group.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a direct administrative action for managing MLM structures. The backend will handle the logic of creating the association between the driver and the group.

