id: story-111.2
epic: mlm-and-organizations
slug: admin-assign-driver-to-org
title: "Admin: Manually Assign Driver to Organization"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:30:00Z'

description: >
  As an administrator, I need to be able to manually assign a driver to a specific organization,
  so that I can manage fleet memberships.

acceptance_criteria:
  - From an organization's detail page in the `admin-panel`, there must be an option to "Assign Driver".
  - This should lead to a page where an admin can search for a driver (e.g., by name or email).
  - After selecting a driver from the search results, the admin can confirm the assignment.
  - Upon confirmation, the driver must be added as a member of the organization.
  - The `organization-service` must be updated with an endpoint to handle this assignment, likely `POST /admin/organizations/{orgId}/members`.
  - A new DTO, `AssignDriverToOrganizationDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/organizations/[orgId]/assign/page.tsx
  - docs/mlm-and-organizations.story-111.2-admin-assign-driver-to-org.yml

files_to_be_modified:
  - apps/admin-panel/src/app/organizations/[orgId]/page.tsx
  - libs/shared/dtos/src/lib/organization.dto.ts

dev_notes: >
  This feature provides a direct way for admins to manage the composition of fleet organizations. The search functionality will be important for usability.

