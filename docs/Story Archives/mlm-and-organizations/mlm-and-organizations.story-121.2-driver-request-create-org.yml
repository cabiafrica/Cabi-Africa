id: story-121.2
epic: mlm-and-organizations
slug: driver-request-create-org
title: "Driver App: Request to Create an Organization"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T11:20:00Z'

description: >
  As a driver who wants to become a fleet owner, I want to be able to submit a request to create a new organization from within the driver app,
  so that I can start building my own fleet.

acceptance_criteria:
  - A new "Create an Organization" or "Become a Fleet Owner" option must be available in the `driver-app`.
  - This option should lead to a simple form where the driver can enter the desired name for their organization.
  - Submitting the form must send a request to the `organization-service`.
  - The `organization-service` must create a pending organization request record.
  - The driver should see a confirmation message indicating their request has been submitted for review.
  - A new DTO, `CreateOrganizationRequestDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/create_organization_screen.dart
  - docs/mlm-and-organizations.story-121.2-driver-request-create-org.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature allows drivers to initiate the process of becoming fleet owners. It's the driver-facing part of the workflow managed by admins in `story-111.3`.

