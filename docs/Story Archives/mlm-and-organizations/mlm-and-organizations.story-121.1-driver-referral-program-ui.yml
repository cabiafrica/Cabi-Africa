id: story-121.1
epic: mlm-and-organizations
slug: driver-referral-program-ui
title: "Driver App: Driver Referral Program UI"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T11:15:00Z'

description: >
  As a driver, I want to access my unique referral code and share it with prospective drivers,
  so that I can earn referral bonuses and build my downline.

acceptance_criteria:
  - A new "Referral Program" section must be available in the `driver-app`, accessible from the main menu or earnings dashboard.
  - The screen must prominently display the driver's unique referral code.
  - A "Share" button must be present, which opens the native device sharing dialog to easily send the code to others.
  - The screen must also display a list of drivers who have signed up using this referral code.
  - For each referred driver, the list should show their name and current status (e.g., "Pending", "Active").
  - The `user-service` or `organization-service` must provide an endpoint to fetch the driver's referral code and the status of their referrals.
  - New DTOs for `DriverReferralInfo` and `ReferredDriver` must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/referral_program_screen.dart
  - libs/shared/dtos/src/lib/referral.dto.ts
  - docs/mlm-and-organizations.story-121.1-driver-referral-program-ui.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a core UI for the MLM growth loop. It empowers drivers to act as recruiters. The backend will need to track the relationship between referring and referred drivers.

