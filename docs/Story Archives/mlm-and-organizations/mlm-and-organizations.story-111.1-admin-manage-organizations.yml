id: story-111.1
epic: mlm-and-organizations
slug: admin-manage-organizations
title: "Admin: Create and Manage Organizations"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:25:00Z'

description: >
  As an administrator, I need to create, view, and manage driver organizations,
  so that I can support fleet owners and larger driver groups that are not part of the MLM structure.

acceptance_criteria:
  - A new "Organizations" section must be added to the `admin-panel`.
  - The page must list all existing organizations, showing their name, the owner's name, and the member count.
  - The page must include a form to create a new organization, requiring a name and an existing driver's ID to be assigned as the owner.
  - An admin must be able to click on an organization to view its details.
  - The organization detail view must show the organization's name, owner, and a list of all its members.
  - The `organization-service` must be updated with endpoints for creating, listing, and viewing organizations and their members.
  - New DTOs for `OrganizationDto`, `CreateOrganizationDto`, and `OrganizationDetailDto` must be created or updated in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/organizations/page.tsx
  - apps/admin-panel/src/app/organizations/[orgId]/page.tsx
  - docs/mlm-and-organizations.story-111.1-admin-manage-organizations.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature provides the administrative backbone for managing formal driver organizations, distinct from the MLM groups. This is key for supporting fleet partners.

