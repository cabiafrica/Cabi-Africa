id: story-111.3
epic: mlm-and-organizations
slug: admin-approve-organization-requests
title: "Admin: Approve or Deny Organization Requests"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-09T09:35:00Z'

description: >
  As an administrator, I need to review and approve or deny requests from drivers to create new organizations,
  so that I can control the creation of formal fleet structures on the platform.

acceptance_criteria:
  - A new "Organizations" > "Requests" section must be added to the `admin-panel`.
  - The page must list all pending organization creation requests.
  - Each request in the list must show the proposed organization name and the name of the driver who requested it.
  - The admin must have "Approve" and "Deny" buttons for each request.
  - Clicking "Approve" must create the new organization and assign the requesting driver as the owner.
  - Clicking "Deny" must remove the request from the pending queue.
  - The `organization-service` must be updated with an endpoint to handle these approval/denial actions.
  - A new DTO, `UpdateOrganizationRequestStatusDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/organizations/requests/page.tsx
  - docs/mlm-and-organizations.story-111.3-admin-approve-organization-requests.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/organization.dto.ts

dev_notes: >
  This feature creates the administrative workflow for vetting and creating new fleet organizations. It's the gatekeeping step for the feature implemented in `story-121.2`.

