id: story-29.2
epic: internationalization
slug: i18n-driver-app
title: Internationalize Driver App and Add Swahili Language Support
status: DONE
author: Bob (sm)
date: '2024-08-01T09:00:00Z'

description: >
  As a product manager, I want to internationalize the driver app and provide a
  Swahili language option, so that we can ensure a consistent, localized
  experience for our Swahili-speaking drivers.

acceptance_criteria:
  - An internationalization framework (like `flutter_localizations` with ARB files) must be set up for the `driver-app`.
  - All user-facing strings in the `driver-app` must be extracted from the code and moved into a default English ARB file (`app_en.arb`).
  - A corresponding Swahili ARB file (`app_sw.arb`) must be created with translations for all strings.
  - A language switcher must be added to the `ProfileScreen` in the `driver-app`, allowing users to toggle between English and Swahili.
  - The selected language preference must be persisted on the device (e.g., using `shared_preferences`).
  - The app must re-render with the selected language's strings immediately upon selection without requiring an app restart.
  - The `MaterialApp` widget must be configured to use the localization delegates.

files_to_be_created:
  - apps/driver-app/lib/l10n/app_en.arb
  - apps/driver-app/lib/l10n/app_sw.arb
  - apps/driver-app/l10n.yaml # Configuration for Flutter's i18n tool

files_to_be_modified:
  - apps/driver-app/pubspec.yaml # To add flutter_localizations and intl
  - Cabi Alpha/mobile/driver_app/lib/main.dart # To configure MaterialApp for localization
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To add the language switcher
  - All screen and widget files in `driver-app` containing hardcoded user-facing strings will need to be refactored to use the localization framework (e.g., `AppLocalizations.of(context)!.myString`).

dev_notes: >
  This story is the counterpart to `story-29.1` and applies the same internationalization pattern to the `driver-app`. It involves a significant refactoring to externalize all strings. The goal is to provide a fully localized experience for drivers, consistent with the passenger app.
