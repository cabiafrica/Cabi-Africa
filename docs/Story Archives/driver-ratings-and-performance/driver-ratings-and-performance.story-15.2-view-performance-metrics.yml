id: story-15.2
epic: driver-ratings-and-performance
slug: view-performance-metrics
title: Display Driver Performance Metrics
status: DONE
author: Bob (sm)
date: '2024-06-03T10:00:00Z'

description: >
  As a driver, I want to see key performance metrics like my acceptance rate,
  cancellation rate, and total trips completed, so that I can get a
  comprehensive overview of my activity and performance on the platform.

acceptance_criteria:
  - The existing `RatingsScreen` is updated to include a new section for "Performance Stats".
  - This new section must display the following metrics:
    - Acceptance Rate (e.g., "95%")
    - Cancellation Rate (e.g., "3%")
    - Total Trips Completed (e.g., "128")
  - The `getDriverPerformance()` method in the `RideService` is updated to include these new metrics in its response.
  - The UI should present these stats clearly, perhaps using cards or a grid layout.
  - The existing test for `RatingsScreen` should be updated to verify that the new metrics are displayed.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/ratings_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/api/ride_service.dart
  - apps/driver-app/test/screens/ratings_screen_test.dart

dev_notes: >
  This story enhances the existing `RatingsScreen` to provide drivers with more actionable data. The `RideService` will continue to return mock data for now, but we will add the new fields to the simulated response. This feature is important for driver engagement and helps in setting performance expectations.
