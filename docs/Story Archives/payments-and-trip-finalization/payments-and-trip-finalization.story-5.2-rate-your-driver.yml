id: story-5.2
epic: payments-and-trip-finalization
slug: rate-your-driver
title: Implement Driver Rating and Feedback
status: DONE
author: Quinn
date: '2024-05-28T18:00:00Z'

description: >
  As a passenger, after I have paid for my trip, I want to be able to rate my
  driver and provide optional feedback, so I can share my experience and help
  maintain service quality.

acceptance_criteria:
  - After successful payment in the `TripSummaryPanel`, the UI should transition to a new `RatingPanel`.
  - The `RatingPanel` must display the driver's name and a placeholder for their photo.
  - The panel must include a star-based rating system (1 to 5 stars), utilizing the `flutter_rating_bar` package.
  - The panel must include an optional multi-line text field for providing detailed feedback.
  - A "Submit Rating" button must be present.
  - Tapping "Submit Rating" should call a new `rideService.submitRating()` method with the rating and feedback.
  - After submitting the rating, the UI should reset to the initial `HomeScreen` state.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/rating_panel.dart
  - apps/passenger-app/test/widgets/rating_panel_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/api/ride_service.dart

qa_results:
  - reviewer: Quinn
    date: '2024-05-28T19:00:00Z'
    decision: PASS
    summary: >-
      The implementation successfully meets all acceptance criteria. The app now transitions to a rating view after payment, allowing users to submit a star rating and optional feedback. The `RatingPanel` widget is well-implemented and tested. The `HomeScreen` state machine and `RideService` have been correctly updated. This completes the post-ride passenger workflow.

dev_notes: >
  This story completes the post-ride passenger workflow. The `HomeScreen` state machine will need a new `awaitingRating` state to manage the UI transition after payment. The `flutter_rating_bar` package is already included in the `pubspec.yaml` and should be used for the star rating UI. The `RideService` will need a new method to handle the submission of the rating.
