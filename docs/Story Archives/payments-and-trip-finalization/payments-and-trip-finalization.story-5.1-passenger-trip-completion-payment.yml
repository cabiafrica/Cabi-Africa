id: story-5.1
epic: payments-and-trip-finalization
slug: passenger-trip-completion-payment
title: Implement Passenger Trip Completion and Payment Prompt
status: 'Ready for Review'
author: Quinn
date: '2024-05-28T16:00:00Z'

description: >
  As a passenger, when my trip ends, I want to see a summary of the trip,
  including the final fare, and be prompted to pay and add a tip, so I can
  complete the transaction.

acceptance_criteria:
  - When the driver ends the trip, a "trip ended" notification should trigger a state change in the passenger's `HomeScreen` to `tripCompleted`.
  - The `DriverDetailsPanel` (or current panel) should be replaced by a new `TripSummaryPanel`.
  - The `TripSummaryPanel` must display the final fare, trip duration, and distance.
  - The panel must include an option to add a tip (e.g., predefined percentages or a custom amount).
  - The panel must have a "Pay Now" button.
  - Tapping "Pay Now" should call a `rideService.processPayment()` method.
  - After successful payment simulation, the UI should transition to a "Rate Your Driver" view (to be handled in the next story).

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/trip_summary_panel.dart
  - apps/passenger-app/test/widgets/trip_summary_panel_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/api/ride_service.dart

qa_results:
  - reviewer: Quinn
    date: '2024-05-28T17:00:00Z'
    decision: PASS
    summary: >-
      The implementation successfully meets all acceptance criteria. The passenger's app now correctly handles the trip completion event, displaying a `TripSummaryPanel` with fare and tipping options. The payment simulation flow is functional and resets the UI as required. The new widget is covered by comprehensive tests. The story meets all quality standards.

dev_notes: >
  This story initiates the post-ride flow for the passenger. The `HomeScreen` state machine will need a new `tripCompleted` state. The `RideService` will need to be updated to handle a "trip ended" notification from the backend and provide a method for processing payment. The actual payment gateway integration is out of scope; a simple mocked success/fail response is sufficient.
