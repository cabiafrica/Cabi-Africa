id: story-5.2
epic: payments-and-trip-finalization
slug: backend-payment-processing
title: Backend Implementation for Trip Payment Processing
status: DONE
author: Bob (sm)
date: '2024-07-19T11:01:00Z'

description: >
  As the system, I need to process the final payment from a passenger at the
  end of a trip, including fare and tip, and record the transaction, so that
  the passenger is charged and the driver's earnings are updated.

acceptance_criteria:
  - The `payment-service` must expose a new endpoint (e.g., POST `/payments/charge`) for processing end-of-trip payments.
  - This endpoint must be called by the passenger app after the "Pay Now" action in `story-5.1`.
  - The endpoint must accept a `tripId` and `tipAmount`.
  - The service must look up the final fare from the `ride-service` using the `tripId`.
  - The `payment-service` must integrate with a payment gateway (e.g., Stripe) to charge the passenger's stored payment method for the total amount (fare + tip).
  - Upon successful payment, the service must record separate transactions for the fare, the tip, and the company's commission.
  - These transactions must be associated with the driver and marked as 'unpaid' in their earnings ledger.
  - The service must return a success response to the passenger app, allowing it to proceed to the rating screen (`story-20.2`).

files_to_be_created: []

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.controller.ts # To add the new /charge endpoint
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement payment gateway logic and transaction recording
  - libs/backend/ride-service/src/lib/ride.service.ts # To expose an internal method for fetching final fare

dev_notes: >
  This story is the backend counterpart to `story-5.1` and a critical piece of the payment flow. It connects our system to a real payment gateway. The logic for splitting the payment into fare, tip, and commission is central to our business model and must be accurate.
