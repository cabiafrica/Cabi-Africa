id: story-5.3
epic: payments-and-trip-finalization
slug: process-driver-tip
title: Process and Allocate Driver Tips
status: DONE
author: Bob (sm)
date: '2024-06-20T09:00:00Z'

description: >
  As a passenger, I want to add a tip for the driver when I pay for my ride,
  so that I can reward them for excellent service.

acceptance_criteria:
  - The `TripSummaryPanel` in the `passenger-app` must allow the user to select a tip (predefined or custom amount) as defined in `story-5.1`.
  - When the passenger confirms payment, the selected tip amount must be sent to the backend along with the fare details.
  - The `payment-service` endpoint for processing payments must be updated to accept an optional `tipAmount`.
  - The `payment-service` must charge the passenger's payment method for the total amount (fare + tip).
  - The `payment-service` must record the tip as a separate transaction or line item in the driver's earnings ledger, clearly distinguishing it from the base fare.
  - The transaction log must associate the tip with the specific ride ID and driver ID.
  - The driver's total pending payout balance must reflect the addition of the tip amount.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/trip_summary_panel.dart # To ensure tip value is passed to the service
  - libs/backend/payment-service/src/lib/payment.controller.ts # To update the payment endpoint DTO
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement the logic for processing and recording the tip
  - The database schema for the `payment-service` to add a `tip_amount` field to the transactions table.

dev_notes: >
  This story focuses on the backend processing of tips. The UI for selecting a tip is already part of `story-5.1`. The key work here is in the `payment-service` to correctly handle the financial transaction, ensuring the tip is properly allocated to the driver's earnings. A subsequent story could cover notifying the driver in real-time that they have received a tip.
