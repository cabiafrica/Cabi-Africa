id: story-110.4
epic: mlm-and-group-management
slug: admin-view-mlm-ledger
title: "Admin: View MLM Registration Fee Ledger"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T15:05:00Z'

description: >
  As an administrator, I need to view a detailed, searchable log of all MLM registration fee distributions,
  so I can audit transactions, resolve payment disputes, and verify that commissions are being paid out correctly.

acceptance_criteria:
  - A new "MLM Ledger" page must be created in the `admin-panel`.
  - The page must display a searchable and filterable table of all records from the `RegistrationFeeLedger`.
  - Filters must be available for `recipientId`, `newDriverId`, and a date range.
  - Each row in the table must display the transaction timestamp, new driver's name, recipient's name, and the commission amount.
  - The UI must call a new backend endpoint on the `MLM Service` (e.g., `GET /admin/mlm/ledger`) that provides paginated and filterable ledger data.

files_to_be_created:
  - apps/admin-panel/src/app/mlm/ledger/page.tsx

files_to_be_modified:
  - # The backend MLM Service controller/service will need a new endpoint to query and return data from the RegistrationFeeLedger table.

dev_notes: >
  This story provides the administrative interface to audit the financial transactions generated by the MLM system, as defined in the architecture document (section 9).

  The backend work in the `MLM Service` will involve creating a new endpoint that can perform complex queries against the `RegistrationFeeLedger` table, including joins with the `User` table to fetch names and support for filtering and pagination.

  The frontend will be a standard data table with robust filtering controls to allow admins to easily find the information they need.
  Architecture Reference: 9. Database Schema (RegistrationFeeLedger)
