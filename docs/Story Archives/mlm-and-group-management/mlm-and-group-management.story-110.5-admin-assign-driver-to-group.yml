id: story-110.5
epic: mlm-and-group-management
slug: admin-assign-driver-to-group
title: "Admin: Manually Assign a Driver to a Group"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T15:10:00Z'

description: >
  As an administrator, I need the ability to assign or change a driver's group from their profile page,
  so I can manage driver organization membership manually for corrections or special cases.

acceptance_criteria:
  - On the admin's driver detail view (`/users/[userId]`), a "Group Membership" section must be displayed.
  - This section must show the driver's current group name or "None".
  - An "Edit" or "Change Group" button must be present.
  - Clicking the button must open a modal with a searchable dropdown of all available `DriverGroup` entities.
  - Selecting a group and saving must call a backend endpoint (e.g., `PATCH /admin/drivers/:userId/group`) with the new `groupId`.
  - The backend must update the `groupId` on the driver's `DriverProfile`.
  - The UI on the driver detail view must refresh to show the new group assignment.

files_to_be_created:
  # No new pages, this modifies an existing page.

files_to_be_modified:
  - # The admin driver detail page (e.g., apps/admin-panel/src/app/users/[userId]/page.tsx) to add the new UI section.
  - # The backend User Management Service or MLM Service needs a new endpoint to handle updating a driver's group.

dev_notes: >
  This story adds a direct administrative control for managing driver group membership, as required by the PRD (section 2.3). This is an essential tool for correcting assignments or managing drivers who did not join a group during registration. The backend endpoint will be a simple update operation on the `DriverProfile` model. The frontend work involves adding a new interactive section to the existing driver detail page.
  PRD Reference: 2.3. Admin Panel -> Admin User Detail View
