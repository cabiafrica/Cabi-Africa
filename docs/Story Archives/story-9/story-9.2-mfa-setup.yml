id: story-9.2
epic: epic-9.0
slug: mfa-setup
title: Implement Multi-Factor Authentication (MFA)
status: Done
author: Sarah (po)
date: '2024-06-28T12:05:00Z'

description: >
  As a security-conscious user, I want to enable Multi-Factor Authentication
  (MFA) on my account, so that I can add an extra layer of security and
  prevent unauthorized access.

acceptance_criteria:
  - A new "Security" section is added to the user profile screen in both the `passenger-app` and `driver-app`.
  - In the "Security" section, a user can choose to "Enable Multi-Factor Authentication".
  - The setup process must use a Time-based One-Time Password (TOTP) algorithm (compatible with apps like Google Authenticator, Authy, etc.).
  - The `auth-service` must generate a secret and a corresponding QR code for the user to scan.
  - The app must display the QR code and the secret key (for manual entry).
  - To complete the setup, the user must enter a valid code from their authenticator app.
  - Once MFA is enabled, the login flow must be updated: after a successful password login, the user must be prompted to enter their MFA code.
  - The `auth-service` must be updated to validate the MFA code during login.
  - The `user-service` must be updated to store whether MFA is enabled for a user and the associated secret.

files_to_be_created:
  - docs/stories/story-9.2-mfa-setup.yml
  - Cabi Alpha/mobile/passenger_app/lib/screens/security_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/mfa_setup_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/security_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/mfa_setup_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/login_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart
  - libs/backend/auth-service/src/lib/auth.service.ts
  - libs/backend/auth-service/src/lib/auth.controller.ts
  - libs/backend/user-service/src/lib/user.service.ts

dev_notes: >
  This is a major security enhancement. The backend will need a library like
  `otplib` or `speakeasy` to handle TOTP generation and validation. The MFA
  secret must be stored securely, encrypted at rest, and associated with the
  user's record in the `user-service`.

tasks:
  - id: task-1
    description: "Implement backend services for MFA."
    subtasks:
      - "[x] Update `user-service` to store MFA secret and status for a user."
      - "[x] Update `auth-service` with methods to generate a secret/QR code, verify a token to enable MFA, and validate a token during login."
      - "[x] Update `auth-controller` to expose the new MFA endpoints."
  - id: task-2
    description: "Implement frontend screens and flows for MFA."
    subtasks:
      - "[x] Create `security_screen.dart` and `mfa_setup_screen.dart` for both passenger and driver apps."
      - "[x] Update the `login_screen.dart` in both apps to handle the second-factor authentication step."

