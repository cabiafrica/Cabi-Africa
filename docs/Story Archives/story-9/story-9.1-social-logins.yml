id: story-9.1
epic: epic-9.0
slug: social-logins
title: Implement Social Logins (Google)
status: Done
author: Sarah (po)
date: '2024-06-28T11:35:00Z'

description: >
  As a new user, I want to sign up or log in using my Google account, so that
  I can access the platform quickly without having to create and remember a
  new password.

acceptance_criteria:
  - A "Sign in with Google" button must be added to the login and registration screens of both the `passenger-app` and `driver-app`.
  - Tapping the button must initiate the Google OAuth 2.0 flow.
  - Upon successful authentication with Google, the `auth-service` must receive the user's profile information (name, email, profile picture).
  - If the user's email does not exist in the `user-service`, a new user account must be created.
  - The user's role (passenger or driver) must be determined based on which app initiated the login.
  - If a new driver signs up via social login, their user status must be set to `pending_onboarding`.
  - After a successful social login (for both new and existing users), the user must be logged into the app and redirected to the appropriate home screen.
  - The `auth-service` must be updated to handle the OAuth callback from Google and issue a JWT for the user session.

files_to_be_created:
  - docs/stories/story-9.1-social-logins.yml

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/login_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart
  - libs/backend/auth-service/src/lib/auth.controller.ts
  - libs/backend/auth-service/src/lib/auth.service.ts
  - libs/backend/user-service/src/lib/user.service.ts

dev_notes: >
  This feature will significantly reduce friction for new user acquisition. We'll
  start with Google as the first provider. The implementation will require
  setting up OAuth 2.0 credentials in the Google Cloud Platform console and
  securely storing the client ID and secret on our backend.

tasks:
  - id: task-1
    description: Implement backend logic for Google social login.
    subtasks:
      - "[x] Add `findOrCreateSocialUser` method to `libs/backend/user-service/src/lib/user.service.ts`."
      - "[x] Add `googleLogin` method to `libs/backend/auth-service/src/lib/auth.service.ts` to mock token verification, create/find user, and generate JWT."
      - "[x] Expose `POST /auth/google/login` endpoint in `libs/backend/auth-service/src/lib/auth.controller.ts`."
  - id: task-2
    description: Implement frontend UI and logic for Google social login.
    subtasks:
      - "[x] Add 'Sign in with Google' button to `Cabi Alpha/mobile/passenger_app/lib/screens/login_screen.dart`."
      - "[x] Add 'Sign in with Google' button to `Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart`."
      - "[x] Implement logic to simulate `idToken` acquisition and send it to the backend."
      - "[x] Handle successful login (token storage, navigation) and error states in both apps."

