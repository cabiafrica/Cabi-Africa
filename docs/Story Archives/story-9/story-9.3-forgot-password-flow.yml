    description: "Implement backend services for password reset."
    subtasks:
      - "[x] Create `notification.service.ts` to simulate sending reset emails."
      - "[x] Update `auth.service.ts` with `forgotPassword` and `resetPassword` methods."
      - "[x] Update `auth.controller.ts` to expose the new endpoints."
  - id: task-2
    description: "Implement frontend flows for mobile and web."
    subtasks:
      - "[x] Create `forgot_password_screen.dart` for both passenger and driver apps."
      - "[x] Add 'Forgot Password?' links to the login screens in both mobile apps."
      - "[x] Create the `reset-password.tsx` page in the `user-portal` to handle the token and new password submission."

