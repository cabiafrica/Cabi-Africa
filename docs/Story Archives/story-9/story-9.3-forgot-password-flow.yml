id: story-9.3
epic: epic-9.0
slug: forgot-password-flow
title: Implement "Forgot Password" Flow
status: Done
author: Sarah (po)
date: '2024-06-28T12:10:00Z'

description: >
  As a user who has forgotten my password, I want a secure way to reset it,
  so that I can regain access to my account.

acceptance_criteria:
  - A "Forgot Password?" link is added to the login screens of both the `passenger-app` and `driver-app`.
  - Tapping the link leads to a screen where the user enters their registered email address.
  - The `auth-service` must generate a secure, single-use, time-limited password reset token.
  - The `notification-service` must send an email to the user containing a unique link to a password reset page.
  - A new page is created in the `user-portal` at `/reset-password` to handle the password reset.
  - This page must validate the token from the URL.
  - If the token is valid, the user must be prompted to enter and confirm a new password.
  - The `auth-service` must be updated to validate the token and securely update the user's password.
  - The user must be notified of the successful password change.

files_to_be_created:
  - docs/stories/story-9.3-forgot-password-flow.yml
  - Cabi Alpha/mobile/passenger_app/lib/screens/forgot_password_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/forgot_password_screen.dart
  - Cabi Alpha/web/user_portal/src/pages/reset-password.tsx

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/login_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart
  - libs/backend/auth-service/src/lib/auth.service.ts
  - libs/backend/auth-service/src/lib/auth.controller.ts
  - libs/backend/notification-service/src/lib/notification.service.ts

dev_notes: >
  This is a standard but critical security feature. The reset token must be
  single-use and expire after a short period (e.g., 1 hour). The `auth-service`
  will need to store a hash of the token and its expiry, associated with the
  user. Using the `user-portal` for the reset page simplifies the flow, as it
  avoids complex deep-linking into the mobile apps.

tasks:
