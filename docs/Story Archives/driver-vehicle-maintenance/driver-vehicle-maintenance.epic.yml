description: >
  This epic covers the features allowing drivers to track their vehicle's health
  and maintenance schedules. Regular maintenance is crucial for safety and
  vehicle longevity.
  
  Key capabilities include:
  - Setting reminders for service intervals (e.g., Oil Change every 5000km).
  - Logging maintenance activities and costs.
  - Uploading receipts for tax/expense tracking.
  - Viewing maintenance history.
