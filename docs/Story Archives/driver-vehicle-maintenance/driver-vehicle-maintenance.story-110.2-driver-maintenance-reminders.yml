id: story-110.2
epic: driver-vehicle-maintenance
slug: driver-maintenance-reminders
title: Driver Maintenance Reminders
status: DONE
author: Sarah (po)
date: '2024-08-13T11:00:00Z'

description: >
  As a driver, I want to set reminders for recurring maintenance tasks (e.g., Oil Change every 5000km)
  so that I don't forget important service intervals and keep my vehicle safe.

acceptance_criteria:
  - The Driver App must have a `MaintenanceRemindersScreen`.
  - Drivers can view a list of active reminders.
  - Drivers can add a new reminder by specifying the Service Type and Interval (km).
  - Drivers can delete a reminder.
  - Reminders must be persisted to the `maintenance-service`.
  - Navigation to this screen should be accessible from the `LogMaintenanceScreen`.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/log_maintenance_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/maintenance_reminders_screen.dart
  - libs/backend/maintenance-service/src/lib/maintenance.service.ts
  - libs/backend/maintenance-service/src/lib/maintenance.controller.ts

dev_notes: >
  This story implements the configuration of reminders. The actual *triggering* of a notification
  (checking if current odometer > last service + interval) would typically happen when a new
  maintenance log is submitted or when the vehicle odometer is updated via the ride service.

tasks:
  - id: task-1
    description: Implement backend reminder CRUD.
    subtasks:
      - "[x] Update `maintenance.service.ts` to store reminders."
      - "[x] Update `maintenance.controller.ts` to expose reminder endpoints."
  - id: task-2
    description: Implement frontend reminder management.
    subtasks:
      - "[x] Create `maintenance_reminders_screen.dart`."
      - "[x] Add navigation action to `log_maintenance_screen.dart`."

