id: story-51.3
epic: family-and-teen-accounts
slug: family-spending-limits
title: Set Spending Limits for Family Members
status: Done
author: Bob (sm)
date: '2024-08-02T10:18:00Z'

description: >
  As a family organizer, I want to set monthly spending limits for each
  member of my family profile, so that I can control our transportation budget.

acceptance_criteria:
  - In the `FamilyProfileScreen`, the organizer can set a monthly spending limit for each member.
  - The `user-service` must store these limits.
  - Before a family member can book a ride, the `ride-service` must check if the estimated fare would exceed their monthly limit.
  - If the limit would be exceeded, the booking is blocked, and the user is notified.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/family_profile_screen.dart # To add the limit-setting UI
  - libs/backend/user-service/src/lib/user.service.ts # To store the limits
  - libs/backend/ride-service/src/lib/ride.service.ts # To enforce the limits during booking

dev_notes: >
  This gives the family organizer more control and makes the Family Profile feature more appealing for budget management.