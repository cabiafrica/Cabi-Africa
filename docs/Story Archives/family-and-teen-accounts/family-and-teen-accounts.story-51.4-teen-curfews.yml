id: story-51.4
epic: family-and-teen-accounts
slug: teen-curfews
title: Implement Teen Account Curfews and Geofences
status: Done
author: Bob (sm)
date: '2024-08-07T09:11:00Z'

description: >
  As a parent, I want to set rules for my teen's account, such as time-of-day
  curfews or approved zones, so that I have more control over their travel.

acceptance_criteria:
  - In the Family Profile settings, the organizer can set policies for each teen account.
  - Policies can include: "No rides between 10 PM and 6 AM", or "Rides must start and end within the home city".
  - The `ride-service` must validate any ride request from a teen account against these policies before matching a driver.
  - If a policy is violated, the booking is blocked with an informative message.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/family_profile_screen.dart # To add policy UI
  - libs/backend/ride-service/src/lib/ride.service.ts # To enforce teen policies

dev_notes: >
  This adds another layer of safety and control to the Teen Accounts feature, making it more attractive to parents.

