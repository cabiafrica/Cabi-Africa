id: story-51.4
epic: family-and-teen-accounts
slug: teen-spending-limits
title: Allow Family Organizer to Set Spending Limits
status: Done
author: Bob (sm)
date: '2024-08-09T21:55:00Z'

description: >
  As a Family Organizer, I want to be able to set monthly spending limits for
  each member of my Family Profile, so I can control our family's transportation budget.

acceptance_criteria:
  - On the `family_profile_screen`, the organizer can select a member and set a monthly spending limit for them.
  - When a family member attempts to book a ride using the Family Profile, the `payment-service` must check if the ride's cost would exceed their monthly limit.
  - If the limit would be exceeded, the booking is blocked, and the user is prompted to use a personal payment method instead.
  - The spending limits reset on the first day of each month.

files_to_be_modified:
  - apps/passenger-app/src/screens/family_profile_screen.dart # To add the spending limit UI
  - libs/backend/payment-service/src/lib/payment.service.ts # To enforce the spending limits

dev_notes: >
  This is a key feature for making parents comfortable with adding their teens and others to a shared payment method. It provides essential financial control.