id: story-51.1
epic: family-and-teen-accounts
slug: family-profiles
title: Implement "Family Profiles"
status: Done
author: Bob (sm)
date: '2024-08-02T10:06:00Z'

description: >
  As a parent, I want to create a family profile where I can add my family
  members (e.g., spouse, teenagers), so that we can share a single payment
  method and I can monitor their trips.

acceptance_criteria:
  - A new "Family Profile" section must be added to the `passenger-app` settings.
  - A user can become a "Family Organizer" and invite other users to join their family.
  - Invited members must accept the invitation.
  - All rides taken by family members are charged to the organizer's default payment method.
  - The organizer can view the trip history of all family members.
  - The organizer receives real-time notifications when a family member starts and ends a trip.

files_to_be_created:
  - apps/passenger-app/src/screens/family_profile_screen.dart

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To manage family relationships
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle centralized family billing
  - libs/backend/notification-service/src/lib/notification.service.ts # To send notifications to the organizer

dev_notes: >
  This is the first story for a new `family-and-teen-accounts` epic. It's a major feature that expands our user base and requires careful implementation of permissions and data privacy.