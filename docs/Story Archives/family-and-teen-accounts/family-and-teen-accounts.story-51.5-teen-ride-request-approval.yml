id: story-51.5
epic: family-and-teen-accounts
slug: teen-ride-request-approval
title: Implement Ride Request Approval for Teens
status: Done
author: Bob (sm)
date: '2024-08-09T23:00:00Z'

description: >
  As a Family Organizer, I want the option to require my approval before my
  teen can confirm a ride request, so I have ultimate control over their travel.

acceptance_criteria:
  - In the Family Profile settings, the organizer can enable "Ride Approval" for specific members.
  - When a member with this setting enabled requests a ride, the request is put on hold.
  - The Family Organizer receives an interactive push notification with the trip details (pickup, dropoff, fare) and "Approve" / "Deny" buttons.
  - If approved, the ride request proceeds to matching. If denied, the request is cancelled.

files_to_be_modified:
  - apps/passenger-app/src/screens/family_profile_screen.dart # To add the approval setting
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle the approval workflow state
  - libs/backend/notification-service/src/lib/notification.service.ts # To send the interactive notification

dev_notes: >
  This provides the highest level of control for parents and guardians, making them more comfortable with the service. The interactive notification is key to making the experience seamless.