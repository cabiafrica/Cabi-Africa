id: story-90.1
epic: passenger-peace-of-mind
slug: report-incorrect-fare
title: Implement "Report Incorrect Fare" Button
status: DONE
author: Bob (sm)
date: '2024-08-09T10:10:00Z'

description: >
  As a passenger, if I believe my final fare was incorrect (e.g., wrong
  surcharge applied, toll error), I want a simple way to dispute the charge.

acceptance_criteria:
  - In the `TripDetailScreen` of the `passenger-app`, a "Report Fare Issue" button must be available.
  - The user can select a reason (e.g., "Incorrect route taken", "Wrong fee applied") and add a comment.
  - This creates a high-priority support ticket in the `support-service` with all relevant trip and payment data attached.
  - An agent can then review the claim and issue a refund if necessary.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/trip_detail_screen.dart # To add the report button
  - libs/backend/support-service/src/lib/support.service.ts # To handle the fare dispute ticket type

dev_notes: >
  This is the first story for a new `passenger-peace-of-mind` epic. It provides a clear and trusted path for passengers to resolve financial disputes, which is critical for customer trust.
