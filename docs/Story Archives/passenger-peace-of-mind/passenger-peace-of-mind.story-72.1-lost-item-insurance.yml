id: story-72.1
epic: passenger-peace-of-mind
slug: lost-item-insurance
title: Implement "Lost Item" Insurance
status: DONE
author: Bob (sm)
date: '2024-08-07T09:17:00Z'

description: >
  As a passenger, I want the option to add a small insurance fee to my ride
  that covers the value of my belongings, so that I have peace of mind in
  case I leave something valuable behind.

acceptance_criteria:
  - On the ride confirmation screen, an "Add Item Insurance" toggle is available for a small fee.
  - This requires a partnership with a third-party insurance provider.
  - If a passenger with insurance reports a lost item that cannot be recovered, they can file a claim.
  - The app will facilitate the first step of the claim process before handing off to the insurance partner.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_confirmation_panel.dart # To add the insurance toggle
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle the insurance fee

dev_notes: >
  This is the first story for a new `passenger-peace-of-mind` epic. It's a financial product that can generate ancillary revenue and improve trust, but requires a complex insurance partnership.
