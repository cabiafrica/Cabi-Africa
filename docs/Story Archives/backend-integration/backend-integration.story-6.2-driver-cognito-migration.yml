id: story-6.2
epic: backend-integration
slug: driver-cognito-migration
title: Migrate Driver App to AWS Cognito
status: DONE
author: Quinn
date: '2024-05-28T22:00:00Z'

description: >
  As a developer, I want to migrate the driver app's authentication to use the
  same AWS Cognito User Pool as the passenger app, so that both apps share a
  unified, secure, and production-ready authentication backend.

acceptance_criteria:
  - The `amplify_flutter` and `amplify_auth_cognito` packages are added to the `driver-app`'s `pubspec.yaml`.
  - An `amplifyconfiguration.dart` file is created in the driver app's `lib` directory, using the same configuration as the passenger app.
  - The driver app's entry point (`main.dart`) is created/updated to initialize the Amplify library on startup.
  - An `AuthService` is created for the driver app to handle sign-in logic using `Amplify.Auth.signIn`.
  - A simple `LoginScreen` is created for the driver app to allow drivers to sign in with their phone number and password.
  - Upon successful sign-in, the driver is navigated to the `HomeScreen`.

files_to_be_created:
  - apps/driver-app/lib/main.dart
  - apps/driver-app/lib/amplifyconfiguration.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/api/auth_service.dart

files_to_be_modified:
  - apps/driver-app/pubspec.yaml

dev_notes: >
  This story aligns the driver app with the new backend infrastructure. It will reuse the same Cognito User Pool as the passenger app. For simplicity, we assume drivers are pre-registered or registered through an admin process. This story focuses only on the sign-in flow.