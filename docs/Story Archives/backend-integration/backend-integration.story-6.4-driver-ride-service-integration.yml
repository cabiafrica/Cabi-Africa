id: story-6.4
epic: backend-integration
slug: driver-ride-service-integration
title: Integrate Driver App Ride Service with Backend API
status: DONE
author: Bob (sm)
date: '2024-07-19T10:31:00Z'

description: >
  As a developer, I want to connect the driver app's `RideService` to the
  real backend API Gateway, so that drivers can receive, accept, and manage
  ride requests from the live system.

acceptance_criteria:
  - The `RideService` in the `driver-app` must be refactored to use the `core_network` package for making authenticated HTTP requests.
  - The driver app must be able to fetch available ride requests from a backend endpoint (e.g., GET `/rides/requests`).
  - The driver must be able to accept a ride request by calling a backend endpoint (e.g., POST `/rides/{rideId}/accept`).
  - The driver must be able to update the ride status (e.g., "arrived", "started", "completed") by calling an endpoint (e.g., PUT `/rides/{rideId}/status`).
  - The app must correctly handle API responses and errors, updating the driver's UI accordingly.
  - All mocked data and logic for ride management in the driver app must be removed.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/api/ride_service.dart # To replace mocked calls with real HTTP requests
  - apps/driver-app/pubspec.yaml # To add dependency on the core_network package

dev_notes: >
  This story mirrors `story-6.3` but for the driver app. It leverages the `core_network` package for consistent, authenticated API communication. This change will allow for true end-to-end testing of the ride booking flow, from passenger request to driver completion. The backend `ride-service` will need to support all the endpoints for driver interaction.