id: story-6.3
epic: backend-integration
slug: passenger-ride-service-integration
title: Integrate Passenger Ride Service with Backend API
status: DONE
author: Bob (sm)
date: '2024-07-19T10:30:00Z'

description: >
  As a developer, I want to connect the passenger app's `RideService` to the
  real backend API Gateway, so that ride requests and status updates are
  handled by the live system instead of mocked data.

acceptance_criteria:
  - The `RideService` in the `passenger-app` must be refactored to make real HTTP requests to the backend API Gateway.
  - All requests to the API Gateway must include the JWT token obtained from Cognito for authentication.
  - The `requestRide` method must now send a POST request to a `/rides` endpoint with the pickup and destination details.
  - The `getRideStatus` method (or equivalent) must poll a `/rides/{rideId}` endpoint to get updates.
  - The `processPayment` method in `RideService` (from `story-5.1`) must now call a `/rides/{rideId}/payment` endpoint on the backend.
  - The app must correctly parse the JSON responses from the backend and update the UI state accordingly.
  - The `core_network` package should be created or updated to include a shared, configured HTTP client that automatically attaches the auth token to requests.

files_to_be_created:
  - packages/core_network/lib/src/network_client.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/api/ride_service.dart # To replace mocked calls with real HTTP requests
  - apps/passenger-app/pubspec.yaml # To add dependency on the new core_network package

dev_notes: >
  This is a major step in making the passenger app functional. It replaces the core mock logic with live backend communication. A new `core_network` package is proposed to centralize the HTTP client configuration, including base URL and auth token injection. This will be reusable by the driver app in a subsequent story (`story-6.4`). The backend endpoints (`/rides`, etc.) are assumed to be defined and implemented by the `ride-service` backend library.