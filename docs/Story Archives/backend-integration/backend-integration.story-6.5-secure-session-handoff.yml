title: Secure Session Hand-off from Web to Mobile App
epic: backend-integration
story_id: backend-integration.story-6.5
type: Story
state: Done
owner: John (pm)
jira_ref: CABI-6-5
area: Backend
description: >
  As a new driver prospect who has just completed web registration, I want my session to be securely and automatically transferred to the mobile app so that I don't have to log in again after downloading it.
acceptance_criteria:
  - After successful web registration, the user is presented with a clear deep link to the Cabi Driver App.
  - When the user opens the app via the deep link, the app receives a secure, single-use token.
  - The app uses this token to authenticate the user without requiring them to enter their credentials.
  - The token must be expired or invalidated immediately after its first use to prevent replay attacks.
  - The entire hand-off process must be secure, protecting the user's account from unauthorized access.
  - If the user already has the app installed, the deep link should open the app directly. If not, it should take them to the appropriate app store.
technical_notes: >
  This can be implemented using a short-lived, single-use authentication token.
  1.  After the `Driver Lead Service` creates the "Prospect" user, it generates a secure, random token and stores it (e.g., in Redis or the user's record in the database) with an expiry of a few minutes.
  2.  The marketing website constructs a deep link URL containing this token (e.g., `cabi://auth?token=TOKEN_HERE`).
  3.  The mobile app must be configured to handle this deep link scheme.
  4.  When the app launches from the deep link, it extracts the token and sends it to a new endpoint on the `Authentication Service` (e.g., `POST /auth/exchange-token`).
  5.  The `Authentication Service` validates the token, marks it as used, and returns a standard authentication token (e.g., JWT) to the mobile app.
  6.  The mobile app is now authenticated and can proceed with the onboarding flow.
  This approach ensures the user doesn't have to re-enter their password and maintains a high level of security.
dependencies:
  - backend-integration.story-6.4-driver-ride-service-integration
  - driver-onboarding.story-12.5-in-app-onboarding-tutorial
