id: story-19.3
epic: user-account-management
slug: user-delete-account
title: Allow User to Permanently Delete Their Account
status: Done
author: Bob (sm)
date: '2024-06-18T10:00:00Z'

description: >
  As a user (driver or passenger), I want to permanently delete my account and
  all associated personal data, so that I can exercise my right to be forgotten.

acceptance_criteria:
  - A "Delete Account" option must be added to the `ProfileScreen` in both the `driver-app` and `passenger-app`, clearly marked as a destructive action.
  - Tapping "Delete Account" must open a confirmation dialog or screen explaining that the action is irreversible.
  - To prevent accidental deletion, the user must type a confirmation phrase (e.g., "DELETE") into a text field to enable the final delete button.
  - Upon final confirmation, the app must call a new `deleteAccount()` method in the shared `core_auth` package.
  - The backend `user-service` must have a new secure endpoint to handle the deletion request.
  - The `user-service` must orchestrate the deletion of the user's account in the authentication provider (Cognito).
  - The `user-service` should then publish a `UserDeleted` event with the user's ID.
  - Other services (e.g., `ride-service`, `payment-service`, `document-service`) must listen for the `UserDeleted` event to anonymize or delete associated data.
  - After the deletion is confirmed, the user is logged out and returned to the `LoginScreen`.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To add delete option and confirmation flow
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart # To add delete option and confirmation flow
  - libs/shared/auth/lib/src/auth_service.dart # To add the deleteAccount method
  - libs/backend/user-service/src/lib/user.controller.ts # To add a DELETE endpoint
  - libs/backend/user-service/src/lib/user.service.ts # To implement deletion logic and publish event
  - Other services (e.g., `payment-service`, `ride-service`) will need to be modified to subscribe to the `UserDeleted` event.

dev_notes: >
  This is a security-critical and highly destructive feature that must be handled with extreme care to comply with data privacy regulations (e.g., GDPR). The multi-step confirmation on the frontend is mandatory. An event-driven approach for cascading deletes/anonymization is crucial for microservice data consistency. For financial or legal reasons, some data (like payment transactions) may need to be anonymized rather than hard-deleted. The implementation should favor anonymization of PII (Personally Identifiable Information) while retaining transactional integrity.