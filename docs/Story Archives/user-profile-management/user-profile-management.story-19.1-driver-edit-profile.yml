id: story-19.1
epic: user-profile-management
slug: driver-edit-profile
title: Enable Driver to Edit Name and Profile Picture
status: Done
author: Bob (sm)
date: '2024-06-16T10:00:00Z'

description: >
  As a driver, I want to edit my name and profile picture from my profile
  screen, so that I can manage my identity and ensure my information is
  up-to-date for passengers.

acceptance_criteria:
  - The `ProfileScreen` in the `driver-app` must be updated from read-only to support editing.
  - Tapping on the profile picture area should allow the driver to select a new image from their device's gallery using the `image_picker` package.
  - The driver's name field should be made editable.
  - A "Save Changes" or "Update Profile" button must be added to the screen.
  - When "Save Changes" is tapped, the app must call the existing `updateProfile` method in the shared `AuthService`.
  - The `AuthService` will handle uploading the new image to S3 and updating the user attributes in Cognito.
  - After a successful update, the new name and profile picture should be reflected on the `ProfileScreen` and in the `UserProfileAvatar` widget in the header.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart
  - apps/driver-app/pubspec.yaml # To add image_picker if not already present
  - libs/shared/auth/lib/src/auth_service.dart # To confirm updateProfile method meets driver needs

dev_notes: >
  This story brings the driver's profile editing capabilities in line with the passenger's (`story-10.1`). It leverages the existing `updateProfile` functionality in the shared `core_auth` package, promoting code reuse. The main effort will be in modifying the `driver-app`'s `ProfileScreen` UI to enable editing and handle the state changes. This is the first story in the new consolidated `user-profile-management` epic.