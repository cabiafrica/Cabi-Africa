id: story-19.2
epic: user-profile-management
slug: user-change-phone-number
title: Allow User to Change Phone Number with OTP Verification
status: Done
author: Bob (sm)
date: '2024-06-17T09:00:00Z'

description: >
  As a user (driver or passenger), I want to securely change the phone number
  associated with my account by verifying the new number with an OTP, so that I
  can keep my contact information current and maintain account security.

acceptance_criteria:
  - A "Change Phone Number" option must be added to the `ProfileScreen` in both the `driver-app` and `passenger-app`.
  - Tapping this option must start a verification flow on a new screen.
  - The flow requires the user to first enter their new phone number.
  - After submitting the new number, the backend must send an OTP SMS to that new number.
  - The app must then present a screen for the user to enter the OTP they received.
  - The app validates the entered OTP with the backend.
  - Upon successful OTP validation, the user's phone number attribute is updated and verified in the authentication system (e.g., Cognito).
  - The updated phone number should be reflected on the user's `ProfileScreen`.
  - The shared `core_auth` package must be updated with new methods to handle this multi-step flow (e.g., `requestPhoneNumberChange`, `confirmPhoneNumberChange`).

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/change_phone_number_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/change_phone_number_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To add link to the new screen
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart # To add link to the new screen
  - libs/shared/auth/lib/src/auth_service.dart # To add methods for the change phone number flow
  - libs/backend/user-service/src/lib/user.controller.ts # To add endpoints for initiating and confirming the change
  - libs/backend/user-service/src/lib/user.service.ts # To orchestrate the OTP logic with Cognito/Auth provider

dev_notes: >
  This is a security-critical feature that applies to both user-facing apps. The logic should be centralized in the `core_auth` package for the frontend and the `user-service` for the backend. The backend will need to interface with the auth provider (Cognito) to trigger the update and verification flow. The flow must handle error cases, such as incorrect OTP entry or requesting too many OTPs in a short period.