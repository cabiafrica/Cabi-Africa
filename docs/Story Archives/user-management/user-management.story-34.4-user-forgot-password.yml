id: story-34.4
epic: user-management
slug: user-forgot-password
title: "User: Implement Forgot Password Flow"
status: Done
author: Gemini Code Assist
date: '2025-12-06T19:05:00Z'

description: >
  As a user who has forgotten my password, I want to be able to request a password reset via my email address,
  so I can regain access to my account securely.

acceptance_criteria:
  - A "Forgot Password?" link must be present on the login screens of both the passenger and driver apps.
  - Tapping the link must lead to a screen where the user can enter their registered email address.
  - Upon submission, the backend `auth-service` must generate a secure, single-use, time-limited password reset token.
  - The `notification-service` must send an email to the user containing a unique link to a password reset page on the marketing website.
  - The web page must allow the user to enter and confirm a new password.
  - Submitting the new password must call a backend endpoint that validates the token and, if valid, updates the user's password hash in the `user-service`.
  - The reset token must be invalidated after its first use or after it expires.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/forgot_password_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/forgot_password_screen.dart
  - Cabi Alpha/web/user_portal/app/reset-password/[token]/page.tsx

files_to_be_modified:
  - # The login screens in both mobile apps to add the "Forgot Password?" link.
  - # The backend auth-service needs new endpoints for requesting a reset and submitting a new password.
  - libs/backend/notification-service/src/lib/notification.service.ts # To add a method for sending the reset email.

dev_notes: >
  This is a critical security workflow required by the PRD (section 2.4). The security of the reset token is paramount. It should be a cryptographically random string stored in the database with an expiry date and a 'used' flag. The flow involves coordination between the mobile apps (to initiate), the backend (to orchestrate), the notification service (to communicate), and the web app (to complete the action).
  PRD Reference: 2.4. User Management -> Core User Accounts & Profiles -> Login & Authentication