id: story-34.1
epic: user-management
slug: self-serve-account-deletion
title: "User Management: Implement Self-Serve Account Deletion"
status: Done
author: Gemini Code Assist
date: '2025-12-05T11:35:00Z'

description: >
  As a user (passenger or driver), I want the ability to permanently delete my account and all associated
  personal data from within the app, so I can control my private information.

acceptance_criteria:
  - A "Delete Account" option must be available in the user's profile/settings screen in both the passenger and driver apps.
  - Tapping the button must trigger a multi-step confirmation flow to prevent accidental deletion (e.g., type "DELETE" to confirm).
  - Upon final confirmation, the app must call a new backend endpoint `DELETE /users/me`.
  - The backend `User Management Service` must initiate a data deletion/anonymization process across all relevant services, in compliance with data retention policies.
  - After the process is initiated, the user must be logged out and their session invalidated.

files_to_be_created:
  # No new files, modifies existing screens and services.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart # To add the delete option.
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To add the delete option.
  - # The backend User Management Service will need a new controller/service to handle the DELETE /users/me request and orchestrate data deletion.

dev_notes: >
  This story implements a crucial data privacy requirement from the PRD (section 2.4). The process must be irreversible and comprehensive. The backend `User Management Service` will act as an orchestrator, sending events or making API calls to other services (ride history, payments, etc.) to request the deletion or anonymization of the user's data. This is a complex, cross-cutting concern.
  PRD Reference: 2.4. User Management -> Core User Accounts & Profiles -> Self-Serve Account Deletion