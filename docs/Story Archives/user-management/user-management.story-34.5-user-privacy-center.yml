id: story-34.5
epic: user-management
slug: user-privacy-center
title: "User: Implement Privacy Center with Marketing Communication Controls"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T19:10:00Z'

description: >
  As a user, I want a dedicated "Privacy Center" in my settings where I can manage my privacy preferences,
  starting with the ability to opt-in or opt-out of marketing communications.

acceptance_criteria:
  - A new "Privacy Center" screen must be created in both the passenger and driver apps, accessible from the main settings.
  - The screen must contain a toggle switch labeled "Receive Marketing Communications" (or similar).
  - The user's choice must be saved to their profile via an endpoint on the `user-service`.
  - The `notification-service` and any other marketing-related services must check this preference before sending any non-transactional communications (e.g., newsletters, promotional offers).
  - The Privacy Center should also contain links to the "Download My Data" and "Delete Account" features.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/privacy_center_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/privacy_center_screen.dart

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To add a field for the marketing preference on the user profile.
  - libs/backend/notification-service/src/lib/notification.service.ts # To check the user's preference before sending marketing emails.

dev_notes: >
  This story establishes the foundation for the Privacy Center required by the PRD (section 2.4). For this first version, we focus on the marketing opt-out, which is a common legal requirement. The backend `user-service` will be the source of truth for this preference. All services that send promotional content MUST query this setting before dispatching messages. This screen will serve as the hub for all future privacy controls.
  PRD Reference: 2.4. User Management -> Data Privacy & Compliance -> Privacy Center & Manage Marketing Communications
