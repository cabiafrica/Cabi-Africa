id: story-88.7
epic: shared-rides-and-pooling
slug: shared-ride-wait-time-fee
title: Implement Wait Time Fee for Shared Ride Pickups
status: DONE
author: Bob (sm)
date: '2024-08-10T02:30:00Z'

description: >
  As a driver on a shared ride, if a passenger is late for their pickup, I
  want the system to automatically charge them a wait-time fee, so that my
  time is compensated and other passengers in the car are not unduly delayed.

acceptance_criteria:
  - When a driver arrives at a shared ride pickup point, a timer starts.
  - After a short grace period (e.g., 2 minutes), a per-minute wait-time fee is automatically charged to the late passenger.
  - The `fare-service` must handle this additional charge.
  - The driver and the late passenger must be notified in-app that the wait-time fee is being applied.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/fare.service.ts # To calculate and apply wait time fees

dev_notes: >
  This is critical for the viability of pooling. One late passenger can ruin the experience for everyone else. The policy must be strict and clearly communicated to passengers.
