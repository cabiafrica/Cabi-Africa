id: story-88.6
epic: shared-rides-and-pooling
slug: shared-ride-smart-pickup-points
title: Implement Smart Pickup Points for Shared Rides
status: DONE
author: Bob (sm)
date: '2024-08-10T01:40:00Z'

description: >
  As a passenger booking a shared ride, I am willing to walk a short distance
  to a designated pickup spot (like a street corner) if it makes my trip
  cheaper and faster.

acceptance_criteria:
  - When a user requests a Shared ride, the `ride-service` algorithm should identify an optimal pickup point that is a short walk for the passenger but on the driver's main route.
  - The `passenger-app` must clearly display the walking directions to this smart pickup point.
  - The driver is directed to the smart pickup point, not the passenger's exact location.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To add smart pickup point calculation to the pooling algorithm
  - apps/passenger-app/src/screens/home_screen.dart # To display walking directions to the pickup spot

dev_notes: >
  This is a key optimization for pooling efficiency. It minimizes detours for the driver, leading to faster and more reliable trips for all passengers in the car.
