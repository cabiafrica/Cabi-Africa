id: story-88.9
epic: shared-rides-and-pooling
slug: shared-ride-rating-logic
title: Implement Fair Rating Logic for Shared Rides
status: DONE
author: Bob (sm)
date: '2024-08-10T04:10:00Z'

description: >
  As a passenger on a shared ride, I want my rating of the driver to only
  reflect my portion of the journey, not delays caused by other passengers.

acceptance_criteria:
  - The rating screen for a shared ride must be contextual.
  - If the ride had a significant delay due to another passenger (e.g., long wait time at pickup), the app should prompt the user with "It looks like there was a delay with another rider. Should we exclude this trip from the driver's rating?".
  - The `analytics-service` must be able to flag and exclude these ratings from the driver's overall score to ensure fairness.

files_to_be_modified:
  - apps/passenger-app/src/screens/rate_driver_screen.dart # To add contextual rating logic
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To handle rating exclusion

dev_notes: >
  This is a critical fairness feature for both drivers and passengers in a pooling system. It ensures drivers aren't punished for other riders' behavior.
