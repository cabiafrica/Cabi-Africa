id: story-88.10
epic: shared-rides-and-pooling
slug: shared-ride-social-matching
title: Implement Social Matching for Shared Rides
status: DONE
author: Bob (sm)
date: '2024-08-10T05:40:00Z'

description: >
  As a passenger on a shared ride, I would prefer to be matched with other
  riders who have similar interests or work at the same company, to make the
  ride more enjoyable or productive.

acceptance_criteria:
  - Users can optionally add interests or their workplace to their profile.
  - The pooling algorithm in the `ride-service` can use this information as a "soft" preference, prioritizing matches between users with shared attributes when all other factors (like route overlap) are equal.
  - This feature must be opt-in and managed from the Privacy Center.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To add social data as a factor in the pooling algorithm

dev_notes: >
  This is an advanced, "delight" feature for pooling. It can transform a simple commute into a networking opportunity or a more pleasant social experience. Privacy is a key consideration.
