id: story-88.3
epic: shared-rides-and-pooling
slug: shared-ride-driver-incentives
title: Implement Driver Incentives for Shared Rides
status: DONE
author: Bob (sm)
date: '2024-08-10T00:00:00Z'

description: >
  As a driver, I want to receive extra earnings or bonuses for completing
  pooled trips, to compensate for the added complexity of multiple pickups and drop-offs.

acceptance_criteria:
  - The `incentive-service` must define a new bonus structure specifically for shared rides.
  - This could be a per-pickup bonus, a multiplier for having 2+ riders in the car, or inclusion in specific quests.
  - The `fare-service` must calculate the driver's total earnings for a shared ride to include these incentives.
  - The driver's earnings breakdown (`story-45.2`) must clearly itemize any bonuses earned from shared rides.

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To define and calculate pooling bonuses
  - libs/backend/ride-service/src/lib/fare.service.ts # To apply bonuses to driver payout

dev_notes: >
  Driver acceptance is key to the success of pooling. Without proper incentives, drivers may avoid these more complex trips. The incentive structure should be configurable to allow for market-by-market adjustments.
