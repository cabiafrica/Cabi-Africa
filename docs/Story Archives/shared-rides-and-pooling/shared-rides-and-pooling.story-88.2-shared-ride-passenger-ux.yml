id: story-88.2
epic: shared-rides-and-pooling
slug: shared-ride-passenger-ux
title: Enhance Passenger UX for In-Progress Shared Rides
status: DONE
author: Bob (sm)
date: '2024-08-09T23:40:00Z'

description: >
  As a passenger on a shared ride, I want to see the full, updated route
  including other passengers' pickups and drop-offs, so I have a clear
  understanding of my journey and ETA.

acceptance_criteria:
  - The in-app map for a shared ride must display the entire multi-stop route, including upcoming pickups and drop-offs.
  - The passenger's ETA must dynamically update as new riders are added or the route is re-optimized.
  - The app should show anonymized status updates like "Picking up another rider" or "Dropping off another rider".

files_to_be_modified:
  - apps/passenger-app/src/widgets/driver_details_panel.dart # To handle multi-stop UI
  - libs/backend/ride-service/src/lib/ride.service.ts # To provide the multi-stop route data to the client

dev_notes: >
  This is crucial for managing passenger expectations during a shared ride. Transparency about the route and ETA is key to a positive experience.
