id: story-201.1
epic: ride-dispatch
slug: driver-accept-ride
title: Driver Accept Ride Request
status: DONE
author: Sarah (po)
date: '2024-08-14T09:00:00Z'

description: >
  As a driver, I want to receive ride requests with clear details (pickup location,
  estimated earnings) and have the option to accept or decline them, so that I can
  decide which trips to take.

acceptance_criteria:
  - The Driver App must display a "New Ride Request" screen/modal when a request is received.
  - The screen must show: Pickup Location, Estimated Distance to Pickup, and Estimated Fare.
  - A countdown timer (e.g., 15 seconds) must be visible.
  - Two buttons must be provided: "Accept" and "Decline".
  - Tapping "Accept" sends a confirmation to the `ride-service`.
  - Upon success, the app transitions to the "Navigation to Pickup" screen.
  - If the timer expires or "Decline" is tapped, the request disappears and the driver returns to the "Online" state.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/ride_request_screen.dart
  - libs/backend/ride-service/src/lib/ride.gateway.ts # WebSocket gateway for real-time events

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart # To listen for incoming requests
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle acceptance logic

dev_notes: >
  This story requires real-time communication. We will use a WebSocket Gateway (NestJS)
  to push the 'ride-offer' event to the driver.
  For the MVP, we can simulate an incoming request via a button in the DevTools or a
  timer on the Home Screen, rather than building the full geospatial matcher immediately.

