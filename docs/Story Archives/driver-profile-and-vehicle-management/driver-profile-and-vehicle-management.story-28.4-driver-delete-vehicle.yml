id: story-28.4
epic: driver-profile-and-vehicle-management
slug: driver-delete-vehicle
title: Allow Driver to Delete a Registered Vehicle
status: DONE
author: Bob (sm)
date: '2024-08-11T10:30:00Z'

description: >
  As a driver, I want to be able to remove a vehicle from my registered list,
  so that my vehicle information is accurate and I don't accidentally get
  assigned rides for a car I no longer use.

acceptance_criteria:
  - On the `VehicleManagementScreen` (`story-28.1`), each registered vehicle must have a "Delete" option.
  - Tapping "Delete" must show a confirmation dialog to prevent accidental deletion.
  - Upon confirmation, the `driver-app` must call a new endpoint in the `vehicle-service` to remove the vehicle.
  - The `vehicle-service` must prevent the deletion of a vehicle if it is currently the driver's *only* registered vehicle.
  - If the vehicle to be deleted is currently the driver's *active* vehicle, the system must first deactivate it (or prompt the driver to select another active vehicle if available).
  - After successful deletion, the `VehicleManagementScreen` must update to reflect the change.

files_to_be_modified:
  - apps/driver-app/src/screens/vehicle_management_screen.dart # To add the delete UI/logic
  - libs/backend/vehicle-service/src/lib/vehicle.service.ts # To add logic for deleting a vehicle
  - libs/backend/vehicle-service/src/lib/vehicle.controller.ts # To expose the delete endpoint

dev_notes: >
  This story completes the basic CRUD operations for vehicle management. The backend logic for deletion must handle edge cases, such as preventing deletion of the only vehicle or the currently active vehicle. If a driver deletes their last vehicle, the system should prevent them from going online until a new vehicle is registered, potentially by updating their status in the `user-service`.
