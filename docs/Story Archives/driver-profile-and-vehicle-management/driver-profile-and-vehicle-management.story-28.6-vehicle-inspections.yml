id: story-28.6
epic: driver-profile-and-vehicle-management
slug: vehicle-inspections
title: Implement Vehicle Inspection Requirements
status: Done
author: Bob (sm)
date: '2024-07-29T14:02:00Z'

description: >
  As an administrator, I want to require drivers to submit periodic vehicle
  inspections to ensure all cars on the platform meet our safety standards.

acceptance_criteria:
  - Admins must be able to define a "Vehicle Inspection" document type.
  - This document must have an expiry date.
  - The `document-service` must be updated to handle documents with expiry dates.
  - Drivers must upload their vehicle inspection certificate as a vehicle-specific document (`story-28.3`).
  - A vehicle cannot be used if its inspection certificate is expired or not approved.
  - A scheduled job must run daily to check for upcoming document expirations.
  - The `notification-service` must automatically notify drivers whose vehicle documents are expiring soon (e.g., 30 days, 7 days).

files_to_be_created: []

files_to_be_modified:
  - libs/backend/document-service/src/lib/document.service.ts # To add expiry date logic
  - libs/backend/document-service/src/lib/document.scheduler.ts # To check for expirations
  - Cabi Alpha/mobile/driver_app/lib/screens/vehicle_management_screen.dart # To display inspection status and expiry

dev_notes: >
  This feature adds a critical layer of safety and compliance. It extends the document management system to handle time-sensitive documents, requiring a scheduler and a notification system to manage the lifecycle of these documents proactively.
