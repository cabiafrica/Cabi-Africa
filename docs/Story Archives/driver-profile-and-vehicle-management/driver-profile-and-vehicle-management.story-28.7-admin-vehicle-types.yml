id: story-28.7
epic: driver-profile-and-vehicle-management
slug: admin-vehicle-types
title: Admin Management of Vehicle Types
status: Done
author: Bob (sm)
date: '2024-07-30T10:02:00Z'

description: >
  As an administrator, I want to define different vehicle types (e.g.,
  "Standard", "XL", "Luxury"), so that we can offer different service tiers
  to passengers.

acceptance_criteria:
  - A new "Vehicle Types" page must be added to the `admin-panel`.
  - On this page, an admin must be able to create, edit, and delete vehicle types.
  - Each vehicle type must have a name, description, and capacity (number of seats).
  - The `vehicle-service` must be updated to store and manage these vehicle types.

files_to_be_created:
  - apps/admin-panel/src/app/vehicles/types/page.tsx

files_to_be_modified:
  - libs/backend/vehicle-service/src/lib/vehicle.service.ts # To add CRUD operations for vehicle types
  - The database schema for `vehicle-service` to add a `vehicle_types` table.

dev_notes: >
  This story is the foundation for offering tiered services. It decouples the concept of a "vehicle" from the "service level" it can provide.
