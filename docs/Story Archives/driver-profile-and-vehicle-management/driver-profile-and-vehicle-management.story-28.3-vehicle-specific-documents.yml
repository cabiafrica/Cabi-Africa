id: story-28.3
epic: driver-profile-and-vehicle-management
slug: vehicle-specific-documents
title: Implement Vehicle-Specific Document Uploads
status: Done
author: Bob (sm)
date: '2024-07-27T09:00:00Z'

description: >
  As a driver, I need to upload documents specific to each of my vehicles
  (e.g., vehicle registration, insurance), so that I can be compliant and
  use that vehicle on the platform.

acceptance_criteria:
  - On the `VehicleManagementScreen`, each vehicle must have a "Documents" section.
  - This section must list required documents for a vehicle (e.g., "Vehicle Insurance", "Logbook").
  - The document upload and status tracking flow must reuse the components and logic from the driver document upload feature (`story-12.1`).
  - The `document-service` must be updated to associate uploaded documents with a `vehicleId` in addition to a `driverId`.
  - A vehicle cannot be selected for driving (`story-28.2`) unless all its required documents are in an "Approved" state.
  - The admin panel must be updated to allow for reviewing and approving vehicle-specific documents.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/vehicle_management_screen.dart # To add document management per vehicle
  - libs/backend/document-service/src/lib/document.service.ts # To handle vehicle-associated documents
  - apps/admin-panel/src/app/approvals/[driverId]/page.tsx # To include vehicle documents in the review process

dev_notes: >
  This story refines the document model by linking documents to the specific asset they belong to. This is a critical step for compliance and risk management. It leverages the existing document management infrastructure but extends it to the vehicle entity.
