id: story-4.2
epic: passenger-ride-booking
slug: fare-estimation-tier-selection
title: Implement Fare Estimation and Ride Tier Selection
status: DONE
author: Quinn
date: '2024-05-28T12:00:00Z'

description: >
  As a passenger, after I select a destination, I want to see the estimated fare
  for different ride tiers and the route on the map, so I can choose the ride
  that best suits my needs and budget.

acceptance_criteria:
  - After a destination is selected on the `HomeScreen`, the app should automatically fetch a fare estimate and route from a service.
  - The map must display a polyline showing the route from the current location to the destination.
  - A new UI panel, `RideConfirmationPanel`, should be displayed at the bottom of the screen, replacing the placeholder.
  - The `RideConfirmationPanel` must display the estimated fare.
  - The panel must include selectable chips for different ride tiers (e.g., 'Standard', 'Comfort').
  - Selecting a different ride tier should trigger a re-fetch of the fare estimate for that tier and update the UI.
  - The panel must have a "Confirm Ride" button. The action for this button will be implemented in a subsequent story.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_confirmation_panel.dart
  - apps/passenger-app/test/widgets/ride_confirmation_panel_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/api/ride_service.dart # Will need a method to get fare estimates
  - apps/passenger-app/pubspec.yaml # To add flutter_polyline_points

dev_notes: >
  This story builds directly on the 'destinationSelected' state from story-4.1. The `HomeScreen` will need to be enhanced to call a ride service for fare/route data and then display the `RideConfirmationPanel`. The panel itself will manage the state for tier selection. A mock ride service should be sufficient for now.
