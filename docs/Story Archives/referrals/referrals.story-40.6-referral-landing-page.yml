id: story-40.6
epic: referrals
slug: referral-landing-page
title: Create a Web Landing Page for Referral Links
status: DONE
author: Bob (sm)
date: '2024-08-09T17:30:00Z'

description: >
  As a new user who clicks a referral link, I want to see a landing page that
  confirms the referral offer and explains the service before I download the
  app, so I know the link worked and what to expect.

acceptance_criteria:
  - The link shared in `story-40.5` should point to a simple, public web page.
  - The landing page should dynamically display the name of the referrer (e.g., "Bob has invited you to try Cabi!").
  - It must clearly state the referral bonus (e.g., "Sign up now and get $10 off your first ride.").
  - The page must have prominent buttons to download the app from the iOS App Store and Google Play Store.
  - The referral code should be passed into the app upon installation (using deep linking/deferred deep linking).

files_to_be_created:
  - apps/marketing-web/src/app/refer/[referralCode]/page.tsx # A new page in a web app

dev_notes: >
  This story bridges the gap between the share action and the app install, creating a much smoother user acquisition funnel. It requires a web component and a deep linking strategy.
