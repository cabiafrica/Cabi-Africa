id: story-40.3
epic: referrals
slug: user-referral-status-tracking
title: Implement Referral Status Tracking for Users
status: Done
author: Bob (sm)
date: '2024-08-09T17:15:00Z'

description: >
  As a user (passenger or driver), I want to see a list of people I've
  referred and their current status (e.g., "Signed Up," "First Ride/Trip
  Completed," "Bonus Paid"), so I can track my referral success.

acceptance_criteria:
  - The "Referrals" screen in both the `passenger-app` and `driver-app` must be updated to show a list of referred users.
  - Each entry should display the referred person's name (or a masked version for privacy) and their current status in the referral funnel.
  - The `incentive-service` must track and expose these statuses.
  - The list should also show the total credits/bonuses earned from referrals.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/referral_screen.dart # To add the status list
  - Cabi Alpha/mobile/driver_app/lib/screens/referral_screen.dart # To add the status list
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To track and expose referral statuses

dev_notes: >
  Providing visibility into referral progress is a key engagement loop. We must consider user privacy when displaying names of referred individuals.
