id: story-40.2
epic: referrals
slug: driver-referrals
title: Implement Driver Referral Program
status: Done
author: Bob (sm)
date: '2024-08-09T16:30:00Z'

description: >
  As a driver, I want to refer new drivers to the platform, so that I can earn
  a significant bonus when they meet their initial trip targets.

acceptance_criteria:
  - Each driver must have a unique, shareable referral code in their app.
  - A new driver applicant must be able to enter a referral code during the onboarding process.
  - The `incentive-service` must track the referred driver's progress towards a specific goal (e.g., "complete 50 trips in 30 days").
  - Once the referred driver meets the goal, a one-time bonus must be automatically credited to the referring driver's earnings.

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To manage driver referral logic
  - Cabi Alpha/mobile/driver_app/lib/screens/onboarding/signup_screen.dart # To add referral code input

dev_notes: >
  Driver supply is critical, making this a high-impact feature. The referral bonus and trip requirements should be configurable on the backend per city or region.
