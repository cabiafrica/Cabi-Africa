id: story-40.5
epic: referrals
slug: enhanced-social-sharing
title: Enhance Referral Sharing with Pre-populated Messages
status: Done
author: Bob (sm)
date: '2024-08-09T17:25:00Z'

description: >
  As a user, when I share my referral code, I want the app to generate a
  pre-populated message with a link that I can easily send via WhatsApp, SMS,
  or other social apps.

acceptance_criteria:
  - The "Share" button on the referral screen should use the native device sharing sheet.
  - The shared content must include a pre-written message explaining the offer, the user's unique referral code, and a direct link to the app store.
  - The message content should be configurable in the `admin-panel`.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/referral_screen.dart # To implement native sharing
  - Cabi Alpha/mobile/driver_app/lib/screens/referral_screen.dart # To implement native sharing

dev_notes: >
  A well-crafted default message can significantly increase the conversion rate of shared referrals. This is a low-effort, high-impact improvement.
