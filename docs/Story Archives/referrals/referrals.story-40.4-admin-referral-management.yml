id: story-40.4
epic: referrals
slug: admin-referral-management
title: Create Admin Interface for Referral Program Management
status: DONE
author: Bob (sm)
date: '2024-08-09T17:20:00Z'

description: >
  As a marketing manager, I need to configure the rules and rewards for the
  passenger and driver referral programs, so I can adjust them based on
  business needs and campaign goals.

acceptance_criteria:
  - A new "Referral Programs" section must be added to the `admin-panel`.
  - Admins must be able to set the credit/bonus amount for both the referrer and the referred user for both passenger and driver programs.
  - Admins must be able to define the conditions for a successful driver referral (e.g., number of trips, timeframe).
  - These settings must be stored and used by the `incentive-service` when processing referrals.

files_to_be_modified:
  - apps/admin-panel/src/app/promotions/page.tsx # Or a new /referrals page
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To use configurable rules instead of hardcoded values

dev_notes: >
  This moves the core business logic of the referral program out of the code and into a configurable system, providing essential flexibility for the marketing team.
