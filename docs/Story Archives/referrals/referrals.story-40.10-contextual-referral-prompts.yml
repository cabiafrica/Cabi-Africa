id: story-40.10
epic: referrals
slug: contextual-referral-prompts
title: Implement Contextual Prompts to Refer
status: DONE
author: Bob (sm)
date: '2024-08-09T18:10:00Z'

description: >
  As a passenger, after I have a great experience like giving a 5-star
  rating, I want the app to prompt me to share my referral code, so I can
  easily share the positive experience with friends.

acceptance_criteria:
  - After a passenger submits a 5-star rating on the `RateDriverScreen`, a non-intrusive prompt or button should appear.
  - The prompt should say something like "Enjoying Cabi? Share with a friend and you both get a credit!".
  - Tapping the prompt should take the user directly to the referral sharing screen (`story-40.5`).

files_to_be_modified:
  - apps/passenger-app/src/screens/rate_driver_screen.dart # To add the contextual prompt

dev_notes: >
  This is a classic growth-hacking technique. The key is to trigger the prompt at a "moment of delight" to maximize the chance of a share.
