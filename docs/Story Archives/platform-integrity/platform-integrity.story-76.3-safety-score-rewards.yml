id: story-76.3
epic: platform-integrity
slug: safety-score-rewards
title: Implement Driver Safety Score Rewards
status: DONE
author: Bob (sm)
date: '2024-08-09T10:02:00Z'

description: >
  As a consistently safe driver, I want to be rewarded for my high safety
  score with perks like priority access to airport queues or bonus incentives.

acceptance_criteria:
  - This story connects the Driver Safety Score (`story-76.1`) to tangible rewards.
  - The `incentive-service` and `ride-service` must be able to check a driver's safety score.
  - Drivers with a score above a certain threshold could receive:
    - A higher priority in matching algorithms.
    - A "bump" in the virtual airport queue (`story-53.2`).
    - Eligibility for exclusive, safety-focused bonus challenges.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To incorporate safety score into matching/queuing
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To create safety-based challenges

dev_notes: >
  This closes the loop on the safety score, turning it from a metric into a positive incentive and reinforcing the importance of safe driving.
