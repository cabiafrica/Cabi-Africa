id: story-76.2
epic: platform-integrity
slug: safety-score-coaching
title: Implement Driver Safety Score Coaching
status: DONE
author: Bob (sm)
date: '2024-08-08T11:09:00Z'

description: >
  As a driver with a low safety score, I want the app to give me specific,
  actionable tips on how to improve, so that I can become a safer driver.

acceptance_criteria:
  - In the `driver-app`, on the Safety Score screen (`story-76.1`), if the score is below a certain threshold, a "How to Improve" section appears.
  - This section provides context-specific advice. For example, if the score is low due to hard braking, it might link to a training module on smooth driving.
  - This connects the data from the `analytics-service` with the content from the Learning Center (`story-62.3`).

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/screens/profile_screen.dart # To add the coaching UI

dev_notes: >
  This feature closes the loop on the Safety Score, making it a constructive tool for improvement rather than just a grade.
