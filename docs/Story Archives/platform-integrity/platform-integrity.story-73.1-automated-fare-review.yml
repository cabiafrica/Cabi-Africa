id: story-73.1
epic: platform-integrity
slug: automated-fare-review
title: Implement Automated Fare Review for Inefficient Routes
status: DONE
author: Bob (sm)
date: '2024-08-07T09:18:00Z'

description: >
  As a passenger, if my driver takes a very inefficient route, I want the
  system to automatically detect it and adjust my fare, so that I'm not
  overcharged.

acceptance_criteria:
  - After a trip is completed, the `analytics-service` compares the actual route taken with the optimal route suggested by the mapping provider.
  - If the actual distance/time is significantly longer (e.g., >25%) than the optimal route without a good reason (like traffic), the trip is flagged.
  - A support ticket is automatically created for an agent to review the fare and potentially issue a partial refund to the passenger.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To implement the route comparison logic

dev_notes: >
  A proactive customer service and fairness feature. This helps build passenger trust by showing that the platform is looking out for them.
