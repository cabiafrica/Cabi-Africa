id: story-85.1
epic: platform-integrity
slug: driver-fatigue
title: Implement "Driver Fatigue" Warnings and Lockouts
status: DONE
author: Bob (sm)
date: '2024-08-08T11:16:00Z'

description: >
  As a system administrator, I want to enforce driving time limits to prevent
  driver fatigue, in compliance with local regulations and for safety.

acceptance_criteria:
  - The system must track a driver's "online" or "driving" time over a rolling period (e.g., 12 hours of driving in a 24-hour period).
  - When a driver approaches the limit, they must receive a warning notification.
  - Once the limit is reached, the driver is automatically taken offline and locked out for a mandatory rest period (e.g., 8 hours).
  - The `user-service` or `ride-service` must track this time and enforce the lockout.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To track driving time
  - libs/backend/user-service/src/lib/user.service.ts # To enforce the lockout

dev_notes: >
  A critical safety and regulatory feature. The logic for accurately tracking "driving time" (excluding breaks) is the most important part.
