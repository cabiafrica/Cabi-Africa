id: story-73.2
epic: platform-integrity
slug: harsh-driving-detection
title: Detect and Flag Harsh Driving Events
status: DONE
author: Bob (sm)
date: '2024-08-08T10:00:00Z'

description: >
  As a system administrator, I want to detect harsh driving events like rapid
  acceleration, hard braking, and sharp turns, so we can identify and coach
  unsafe or uncomfortable driving styles.

acceptance_criteria:
  - The `analytics-service` must consume driver GPS and, if available, accelerometer data during trips.
  - It must analyze the data to identify events that exceed configurable thresholds for acceleration, braking, and cornering forces.
  - Each detected event (e.g., "Hard Brake", "Rapid Acceleration") should be logged against the trip record.
  - Drivers who accumulate a high number of harsh driving events over a period should be flagged in a report for review.
  - This data can be used for driver feedback, coaching, or as part of a future "Driver Safety Score".

files_to_be_created: []

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To implement the harsh driving detection logic
  - apps/driver-app/src/services/location_service.dart # To ensure accelerometer data is collected and sent if available

dev_notes: >
  This story builds directly on the work from `story-52.4` (Speeding Detection). It uses telematics data to get a more nuanced view of driver safety beyond just speed. This can improve passenger comfort and reduce accident risk.
