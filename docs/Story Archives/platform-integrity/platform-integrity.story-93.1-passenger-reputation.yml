id: story-93.1
epic: platform-integrity
slug: passenger-reputation
title: Implement "Passenger Reputation Score"
status: DONE
author: Bob (sm)
date: '2024-08-09T10:17:00Z'

description: >
  As a driver, I want to see a reputation score for a passenger before I
  accept a ride, based on factors beyond just their star rating, so that I
  can avoid problematic riders.

acceptance_criteria:
  - The `analytics-service` will calculate a reputation score for passengers.
  - Factors will include their star rating, history of cancellations, and any reports filed against them (e.g., for not wearing a mask, making a mess).
  - This score will be displayed to the driver on the ride request screen (`story-86.1`).
  - Passengers with very low scores may be warned or suspended.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To calculate the passenger score
  - Cabi Alpha/mobile/driver_app/lib/widgets/ride_request_panel.dart # To display the score

dev_notes: >
  This creates a two-way reputation system, giving drivers more information and incentivizing good behavior from passengers.
