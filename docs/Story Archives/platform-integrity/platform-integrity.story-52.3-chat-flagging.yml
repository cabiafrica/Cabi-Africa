id: story-52.3
epic: platform-integrity
slug: chat-flagging
title: Automated flagging of inappropriate chat messages
status: DONE
author: Bob (sm)
date: '2024-08-02T10:19:00Z'

description: >
  As a system administrator, I want the system to automatically flag and
  report inappropriate messages in the driver-passenger chat, so that we can
  proactively address safety and conduct issues.

acceptance_criteria:
  - The `chat-service` (or `support-service`) must pass all messages through a content moderation service (e.g., AWS Comprehend, or a simpler keyword filter).
  - If a message is flagged for containing abusive, threatening, or inappropriate content, a high-priority ticket must be created in the `support-service`.
  - A support agent is immediately alerted to review the conversation.
  - This applies to all chat features: driver-passenger, driver community, and mentor-mentee.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/support-service/src/lib/support.service.ts # To integrate with a content moderation tool

dev_notes: >
  A critical safety and trust feature. As we add more chat functionality, automated moderation becomes essential to scale our safety operations.
