id: story-50.3
epic: dispatch-and-scheduling
slug: dispatch-manage-scheduled-rides
title: "Dispatch: Manage and Assign Scheduled Rides"
status: Done
author: Gemini Code Assist
date: '2025-12-08T10:00:00Z'

description: >
  As a dispatcher, I need a view to see all upcoming scheduled rides and manually assign available drivers to them,
  so that I can ensure all scheduled rides are covered and optimize driver allocation.

acceptance_criteria:
  - A new "Scheduled Rides" view must be added to the dispatch console (within the `admin-panel`).
  - This view must list all upcoming rides with a status of 'SCHEDULED'.
  - The list should be filterable by date range.
  - Each ride in the list must show key details and its current assignment status (Assigned/Unassigned).
  - A dispatcher must be able to select an unassigned ride and assign a specific driver to it (e.g., by entering a driver ID).
  - When a ride is assigned, the `dispatch-service` must be notified to update the ride record.
  - The assigned driver must receive a notification (e.g., push notification) about their new assignment.
  - A new DTO, `AssignDriverToScheduledRideDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/admin-panel/src/app/dispatch/scheduled-rides/page.tsx
  - apps/admin-panel/src/app/dispatch/scheduled-rides/[rideId]/page.tsx
  - docs/dispatch-and-scheduling.story-50.3-dispatch-manage-scheduled-rides.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/ride.dto.ts
  - libs/shared/dtos/src/lib/dispatch.dto.ts

dev_notes: >
  This feature provides dispatchers with a critical tool for managing pre-booked rides. It's the manual override and planning component of the dispatch system. The backend `dispatch-service` will handle the core logic, while the `notification-service` will be triggered to inform the driver.

