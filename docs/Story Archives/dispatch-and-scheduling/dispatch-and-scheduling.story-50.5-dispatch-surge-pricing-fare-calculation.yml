id: story-50.5
epic: dispatch-and-scheduling
slug: dispatch-surge-pricing-fare-calculation
title: "Dispatch: Integrate Surge Zone Data into Fare Calculation"
status: Done
author: Gemini Code Assist
date: '2025-12-08T10:30:00Z'

description: >
  As a dispatcher, I need the system to automatically apply surge pricing multipliers to fare estimates and final calculations
  when a ride originates in an active surge zone, so that pricing accurately reflects real-time demand.

acceptance_criteria:
  - The `ride-service` must be updated to check if a ride's origin falls within an active surge pricing zone.
  - This check should happen both when a fare estimate is requested and when the final fare is calculated.
  - If the origin is in a surge zone, the final fare calculation must include the surge multiplier (e.g., `final_fare = base_fare * surge_multiplier`).
  - The `dispatch-service` (or a new `surge-service`) must provide a way to query for active surge zones and their boundaries.
  - A `SurgeZoneDto` must be created in the shared DTOs library to define the data structure for a surge zone, including its geofence polygon and multiplier.

files_to_be_created:
  - libs/shared/dtos/src/lib/surge.dto.ts
  - docs/dispatch-and-scheduling.story-50.5-dispatch-surge-pricing-fare-calculation.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts
  - libs/backend/ride-service/src/lib/ride.service.ts # To incorporate surge logic into fare calculation.

dev_notes: >
  This story implements the backend logic for one of the platform's key dynamic pricing features. The `ride-service` will need to perform a point-in-polygon check to determine if a ride's origin is inside a surge zone. This story focuses on the calculation; the admin-facing UI for *creating* these zones is handled in `story-79.26`.

