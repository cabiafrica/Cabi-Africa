id: story-50.2
epic: dispatch-and-scheduling
slug: dispatch-rejection-cascade
title: "Dispatch: Implement Job Offer Rejection Cascade"
status: Done
author: Gemini Code Assist
date: '2025-12-08T12:15:00Z'

description: >
  As a dispatcher, when a driver rejects a job offer, I need the system to automatically
  offer the job to the next-best available driver, so that the ride request is fulfilled quickly without manual intervention.

acceptance_criteria:
  - When a driver receives a trip offer on their `driver-app`, they must have an option to "Decline".
  - Tapping "Decline" must send a `reject-offer` event or API call to the `dispatch-service`.
  - The `reject-offer` payload must include the trip ID and a reason for rejection (e.g., "Too far", "End of shift").
  - Upon receiving a rejection, the `dispatch-service` must remove the rejecting driver from the pool of candidates for that specific trip.
  - The `dispatch-service` must then immediately re-evaluate the remaining available drivers (based on the logic from `story-50.1`) and offer the trip to the new top-ranked driver.
  - This cascade process should continue until a driver accepts the offer or the pool of available drivers is exhausted.
  - New DTOs for `TripOffer` and `RejectOffer` must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_offer_widget.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/driver_home_screen.dart
  - docs/dispatch-and-scheduling.story-50.2-dispatch-rejection-cascade.yml

files_to_be_modified:
