  - libs/shared/dtos/src/index.ts

dev_notes: >
  This story automates a core part of the dispatch loop, making the system more efficient and scalable. The backend logic is the most critical part. It needs to be fast and reliable to ensure a good passenger experience. The frontend part is about providing the decline option and sending the rejection event.

