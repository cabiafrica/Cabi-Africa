epic: "Driver Acquisition & Onboarding"
story_id: "111.1"
title: "MLM Driver Registration & Fee Distribution"
description: "As an admin, I want to configure a fee distribution structure for new driver registrations that come through the MLM referral system, so that sponsors and other stakeholders are compensated automatically."

persona: "Admin"

acceptance_criteria:
  - "An admin can configure a multi-level fee distribution formula for new driver registration fees."
  - "The system can handle a total registration fee (e.g., 1200) and divide it among multiple parties based on the configured formula."
  - "Example Formula (based on a 1200 total fee):
      - System/Company receives: 1050
      - Direct Referrer receives: 100
      - Referrer's Referrer (Upline) receives: 50"
  - "When a new driver pays the registration fee, the system automatically calculates and records the distribution of the fee to the respective parties' accounts/ledgers. This MLM data may also be used for future rewards programs."
  - "The distribution is tied to the driver's referral code used during registration."
  - "The admin can view a report of all fee distributions."

technical_requirements:
  - "A new backend service or module ('MLM Service') is required to handle the fee distribution logic."
  - "The 'MLM Service' must be able to read the fee distribution formula configured by the admin."
  - "The registration endpoint in the `Driver Lead Service` should trigger the fee distribution process upon successful registration."
  - "Database schema needs to be updated to support:
      - Storing the fee distribution formula.
      - A ledger or transaction table to record the fee distributions for each registration."

out_of_scope:
  - "The actual payment processing of the registration fee (assumed handled by a separate Payment Service)."
  - "Payouts of the distributed fees to the drivers' bank accounts (this story only covers the internal ledger/recording of the distribution)."
