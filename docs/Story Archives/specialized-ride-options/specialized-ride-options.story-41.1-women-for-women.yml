id: story-41.1
epic: specialized-ride-options
slug: women-for-women
title: Implement "Women for Women" Ride Preference
status: Done
author: Bob (sm)
date: '2024-07-30T10:16:00Z'

description: >
  As a female passenger or driver, I want the option to be matched only with
  other women, so that I can feel safer and more comfortable.

acceptance_criteria:
  - A new "Women for Women" preference must be available in the settings for users who identify as female.
  - When a female passenger with this preference enabled requests a ride, the matching algorithm must only consider female drivers.
  - When a female driver with this preference enabled goes online, she must only receive requests from female passengers.
  - The user's gender must be a field collected during sign-up (with appropriate privacy considerations).
  - The `ride-service` matching logic must be updated to enforce this preference.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/settings_screen.dart # To add the preference
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # To add the preference
  - libs/backend/ride-service/src/lib/ride.service.ts # To update matching logic
  - libs/backend/user-service/src/lib/user.service.ts # To store gender identity

dev_notes: >
  This is the first story for a new `specialized-ride-options` epic. It's a powerful safety and marketing feature but has significant legal and ethical implications that must be reviewed. The implementation requires storing user gender and heavily modifying the matching algorithm.
