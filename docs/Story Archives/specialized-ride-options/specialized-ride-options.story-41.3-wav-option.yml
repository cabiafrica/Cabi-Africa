id: story-41.3
epic: specialized-ride-options
slug: wav-option
title: Implement Wheelchair Accessible Vehicle (WAV) Option
status: Done
author: Bob (sm)
date: '2024-07-31T11:08:00Z'

description: >
  As a passenger with mobility needs, I want to be able to request a
  wheelchair accessible vehicle (WAV), so that I can use the service safely.

acceptance_criteria:
  - A "WAV" vehicle type must be created in the system.
  - Drivers must be able to register their vehicle as a WAV, likely requiring administrative verification of the vehicle's modifications.
  - Passengers must be able to select the "WAV" option when booking a ride.
  - The matching algorithm must only consider available WAV-certified drivers for these requests.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/vehicle-service/src/lib/vehicle.service.ts # To add a WAV certification flag to vehicles
  - apps/admin-panel/src/app/vehicles/[vehicleId]/page.tsx # To allow admins to certify WAVs
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_booking_panel.dart # To add WAV as a ride option

dev_notes: >
  A critical accessibility feature. This requires a strict verification process for vehicles to ensure they meet safety standards for wheelchair accessibility.
