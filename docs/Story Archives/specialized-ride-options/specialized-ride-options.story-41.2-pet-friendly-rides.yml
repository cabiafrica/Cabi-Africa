id: story-41.2
epic: specialized-ride-options
slug: pet-friendly-rides
title: Implement "Pet-Friendly" Ride Option
status: Done
author: Bob (sm)
date: '2024-07-31T11:04:00Z'

description: >
  As a passenger, I want to request a pet-friendly ride, so I can travel
  with my animal companion. As a driver, I want to opt-in to offering
  pet-friendly rides.

acceptance_criteria:
  - A "Pet-Friendly" toggle must be available for drivers in their settings, allowing them to opt-in.
  - A "Pet-Friendly" ride option must be available for passengers when booking, possibly as a separate vehicle type or a ride preference.
  - A small surcharge may be applied for pet-friendly trips.
  - When a passenger requests a pet-friendly ride, the matching algorithm must only consider drivers who have opted in.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # To add the opt-in toggle
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_booking_panel.dart # To add the request option
  - libs/backend/ride-service/src/lib/ride.service.ts # To update matching logic
  - libs/backend/user-service/src/lib/user.service.ts # To store driver's pet-friendly preference

dev_notes: >
  This feature caters to a specific user need and can be a valuable differentiator. It requires a two-sided opt-in from both drivers and passengers to function correctly.
