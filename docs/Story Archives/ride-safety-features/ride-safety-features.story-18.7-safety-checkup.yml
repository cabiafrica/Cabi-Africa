id: story-18.7
epic: ride-safety-features
slug: safety-checkup
title: Implement "Safety Checkup" Feature
status: Done
author: Bob (sm)
date: '2024-08-10T05:15:00Z'

description: >
  As a user, I want a "Safety Checkup" tool that guides me through enabling
  and using all the available safety features, so I can be sure my account is secure.

acceptance_criteria:
  - A new "Safety Checkup" item must be added to the app's main menu or settings.
  - It should be a guided flow that checks if the user has enabled key features like Trusted Contacts (`story-18.3`) and PIN Verification (`story-18.6`).
  - If a feature is not enabled, the checkup should guide the user on how to set it up.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/safety_checkup_screen.dart

dev_notes: >
  This proactively encourages adoption of our most important safety features, improving user safety and demonstrating our commitment to it.