id: story-18.3
epic: ride-safety-features
slug: manage-trusted-contacts
title: Allow Users to Manage Trusted Contacts
status: Done
author: Bob (sm)
date: '2024-08-09T12:05:00Z'

description: >
  As a user (passenger or driver), I want to designate and manage a list of
  "Trusted Contacts" within the app, so that I can easily share my trip
  status with them in the future.

acceptance_criteria:
  - A new "Trusted Contacts" or "Safety Settings" section must be added to the app's settings screen for both `passenger-app` and `driver-app`.
  - Users must be able to add contacts from their phone's address book.
  - Users must be able to manually add contacts by name and phone number.
  - Users must be able to edit or remove contacts from this list.
  - The list of trusted contacts must be stored against the user's profile in the `user-service`.

files_to_be_created:
  - apps/passenger-app/src/screens/trusted_contacts_screen.dart
  - apps/driver-app/src/screens/trusted_contacts_screen.dart

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To add storage for trusted contacts
  - libs/backend/user-service/src/lib/user.controller.ts # To add endpoints for managing contacts