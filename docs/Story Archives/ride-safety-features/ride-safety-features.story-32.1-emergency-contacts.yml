id: story-32.1
epic: ride-safety-features
slug: emergency-contacts
title: Implement Passenger "Emergency Contacts"
status: Done
author: Bob (sm)
date: '2024-07-28T10:03:00Z'

description: >
  As a passenger, I want to designate one or more trusted contacts from my
  phone's address book as "Emergency Contacts", so that I can quickly share
  my trip status with them or have them notified in an emergency.

acceptance_criteria:
  - A new "Emergency Contacts" screen must be added to the `passenger-app` settings.
  - The user must be able to add contacts from their device's address book.
  - The "Share My Trip" feature (`story-18.3`) must be updated to show these contacts as primary sharing targets.
  - The SOS button feature (`story-18.2`) must be enhanced: after calling emergency services, the app should automatically send a pre-defined SMS to all emergency contacts with the trip details and a tracking link.
  - The `user-service` must be updated to store a list of emergency contacts for the user.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/emergency_contacts_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/trip_in_progress_view.dart # To integrate with SOS and Share features
  - libs/backend/user-service/src/lib/user.service.ts # To store contacts

dev_notes: >
  This story significantly enhances the "Share My Trip" and "SOS" features. It makes safety features more accessible and proactive. Accessing device contacts requires user permission.