id: story-18.1
epic: ride-safety-features
slug: driver-sos-button
title: Implement Driver In-Trip SOS Button
status: Done
author: Bob (sm)
date: '2024-06-12T11:00:00Z'

description: >
  As a driver, I want a prominent and easily accessible SOS button during a
  trip, so that I can quickly get help in an emergency situation.

acceptance_criteria:
  - An "SOS" button must be present and clearly visible on the `TripInProgressPanel` widget, which is displayed when a trip is active.
  - The button should be styled to be immediately recognizable as an emergency feature (e.g., using a red color and a distinct icon).
  - Tapping the SOS button must trigger a confirmation dialog to prevent accidental activation (e.g., "Are you sure you want to trigger the emergency alert? This will call emergency services.").
  - Upon confirmation, the app must use the `url_launcher` package to open the phone's native dialer with a pre-filled emergency number.
  - The `TripInProgressPanel` widget test file must be updated or created to verify the presence, appearance, and function of the SOS button, including mocking the confirmation dialog and the `url_launcher` call.
  - The emergency number must be retrieved from a remote configuration service (e.g., Firebase Remote Config) to allow for regional differences, rather than being hardcoded.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart
  - apps/driver-app/test/widgets/trip_in_progress_panel_test.dart

dev_notes: >
  This is the first story in the new "Ride Safety Features" epic. While some SOS functionality was included in the initial in-trip experience (`story-3.3`), this story formalizes its requirements and ensures it is treated as a first-class safety feature. The implementation should be robust and rely on the platform's native dialer for maximum reliability. Future stories in this epic could expand this to include features like sharing live trip details with trusted contacts.

tasks:
  - id: task-1
    description: Add and style the SOS button in the `TripInProgressPanel`.
    subtasks:
      - "[x] Add the `url_launcher` package to the `driver-app`'s `pubspec.yaml`."
      - "[x] Add a prominent SOS button to the `trip_in_progress_panel.dart` widget."
      - "[x] Style the button with a red color and a suitable icon to indicate an emergency."
  - id: task-2
    description: Implement the SOS button's confirmation and dialing logic.
    subtasks:
      - "[x] Create a method to show a confirmation dialog when the SOS button is tapped."
      - "[x] Upon confirmation, implement the call to the native dialer using `url_launcher` with a pre-filled emergency number."
  - id: task-3
    description: Write widget tests for the SOS button functionality.
    subtasks:
      - "[x] Update `trip_in_progress_panel_test.dart` to verify the SOS button's presence and appearance."
      - "[x] Add a test to mock and verify that the confirmation dialog appears on tap."
      - "[x] Add a test to mock the `url_launcher` call and confirm it is triggered after dialog confirmation."

