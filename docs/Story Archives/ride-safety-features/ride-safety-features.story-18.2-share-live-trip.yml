id: story-18.2
epic: ride-safety-features
slug: share-live-trip-details
title: Share Live Trip Details with a Trusted Contact
status: Done
author: Bob (sm)
date: '2024-06-13T10:00:00Z'

description: >
  As a driver or passenger, I want to share my live trip details with a
  trusted contact, so that someone I know can monitor my journey in real-time
  for added safety and peace of mind.

acceptance_criteria:
  - A new "Trusted Contacts" screen must be added to the profile/settings section of both the `driver-app` and `passenger-app`.
  - On this screen, users must be able to add and remove trusted contacts (name and phone number), possibly by picking from their device's contacts.
  - During an active trip, a "Share Trip" button must be available on the in-trip panels for both apps.
  - Tapping "Share Trip" allows the user to select one or more of their saved trusted contacts.
  - Upon selection, the `notification-service` must send an SMS to the chosen contact(s).
  - The SMS must contain a unique, secure link to a public-facing, mobile-friendly web page.
  - This web page must display a real-time map showing the vehicle's current location, the trip route, pickup point, and destination. It must not require a login.
  - The `ride-service` must be enhanced to generate and serve the data for these temporary, shareable trip-tracking pages.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/trusted_contacts_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/trusted_contacts_screen.dart
  - A new public web app for trip viewing, e.g., `apps/trip-viewer-web`
  - libs/backend/ride-service/src/lib/trip-sharing.controller.ts
  - libs/backend/ride-service/src/lib/trip-sharing.service.ts

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart # To add 'Share Trip' button
  - Cabi Alpha/mobile/passenger_app/lib/widgets/driver_details_panel.dart # To add 'Share Trip' button
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To link to Trusted Contacts screen
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart # To link to Trusted Contacts screen
  - libs/backend/user-service/src/lib/user.service.ts # To manage storing/retrieving trusted contacts
  - libs/backend/notification-service/src/lib/notification.service.ts # To integrate with an SMS gateway

dev_notes: >
  This is a major safety feature enhancement that applies to both drivers and passengers. It requires significant work across the stack: frontend changes in two apps, backend logic in multiple services, and a new public-facing web application. The `notification-service` will need to be integrated with an SMS provider like Twilio. The public trip-viewing URL must use a long, unguessable token to ensure privacy.