id: story-18.2
epic: ride-safety-features
slug: passenger-sos-button
title: Implement Passenger In-Trip SOS Button
status: Done
author: Bob (sm)
date: '2024-08-09T12:00:00Z'

description: >
  As a passenger, I want a prominent and easily accessible SOS button during a
  trip, so that I can quickly get help in an emergency situation.

acceptance_criteria:
  - An "SOS" button must be present and clearly visible on the `DriverDetailsPanel` in the `passenger-app` when a trip is active.
  - The button must be styled identically to the driver's SOS button for consistency (red, distinct icon).
  - Tapping the button must trigger a confirmation dialog to prevent accidental activation.
  - Upon confirmation, the app must use `url_launcher` to open the phone's native dialer with a pre-filled emergency number. The number should be retrieved from the remote config service created in `story-18.1.1`.

files_to_be_modified:
  - apps/passenger-app/src/widgets/driver_details_panel.dart

dev_notes: >
  This story is the passenger-side equivalent of `story-18.1`. It ensures feature parity for our core safety tools. The implementation should be nearly identical to the driver's version, promoting code reuse and consistency.
