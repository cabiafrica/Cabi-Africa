id: story-18.1.1
epic: ride-safety-features
slug: fix-sos-remote-config
title: '[Bug] Fix SOS Button to Use Remote Config for Emergency Number'
status: Done
author: Bob (sm)
date: '2024-08-15T20:15:00Z'

description: >
  This story addresses a bug identified during the QA review of `story-18.1`.
  The in-trip SOS button was implemented with a hardcoded emergency number,
  failing a key acceptance criterion. This prevents us from customizing the
  number for different regions or updating it without a full app release.

acceptance_criteria:
  - This story fixes the `FAIL` status in the QA review of `story-18.1`.
  - A new `ConfigService` must be created in the `driver-app` to handle fetching values from a remote configuration source (e.g., Firebase Remote Config).
  - The `TripInProgressPanel` widget must be refactored to use this `ConfigService` to retrieve the emergency number.
  - The logic must gracefully handle cases where the remote configuration is unavailable, falling back to a default, hardcoded number.
  - The widget test for `TripInProgressPanel` must be updated to mock the `ConfigService` and verify that the number it provides is the one passed to the `url_launcher`.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/services/config_service.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart
  - apps/driver-app/test/widgets/trip_in_progress_panel_test.dart

dev_notes: >
  This is a high-priority bug fix to address the scalability and maintenance issues with the SOS feature. The new `ConfigService` should be designed as a reusable utility for fetching any remote configuration values we may need in the future. For this story, a mock implementation that returns a predefined value is sufficient, but it should be structured to easily integrate with a real service like Firebase Remote Config later.

tasks:
  - id: task-1
    description: Create a `ConfigService` to fetch the emergency number.
    subtasks:
      - "[x] Create `Cabi Alpha/mobile/driver_app/lib/services/config_service.dart`."
      - "[x] Implement a method to get the emergency number with a fallback."
  - id: task-2
    description: Refactor the `TripInProgressPanel` to use the `ConfigService`.
    subtasks:
      - "[x] Instantiate the `ConfigService` in the widget."
      - "[x] Update the SOS button's action to call the service for the number."
  - id: task-3
    description: Update widget tests to mock the `ConfigService` and verify its usage.
    subtasks:
      - "[x] Create a mock version of the `ConfigService` for testing."
      - "[x] Provide the mock service to the widget under test."
      - "[x] Verify that the number from the mock service is used in the `url_launcher` call."

