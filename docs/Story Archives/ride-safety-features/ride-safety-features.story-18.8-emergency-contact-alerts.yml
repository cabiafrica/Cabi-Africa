id: story-18.8
epic: ride-safety-features
slug: emergency-contact-alerts
title: Implement Automated Emergency Contact Alerts
status: DONE
author: Bob (sm)
date: '2024-08-10T07:25:00Z'

description: >
  As a user, if I use the in-app SOS button, I want my Trusted Contacts to be
  automatically notified with my location and trip details.

acceptance_criteria:
  - This enhances the SOS button feature (`story-18.1`, `story-18.2`).
  - After a user confirms they want to contact emergency services, a parallel notification must be sent to their designated Trusted Contacts (`story-18.3`).
  - The notification should be an SMS containing a message like "[User Name] has triggered an SOS alert" and a link to the live trip tracking page.

files_to_be_modified:
  - libs/backend/notification-service/src/lib/notification.service.ts # To send alerts to trusted contacts

dev_notes: >
  This closes a critical loop in the SOS feature, ensuring that the user's personal safety net is informed immediately in an emergency.