id: story-4.7
epic: ride-booking
slug: passenger-select-vehicle-type
title: Allow Passenger to Select Vehicle Type
status: Done
author: Bob (sm)
date: '2024-07-30T10:04:00Z'

description: >
  As a passenger, I want to choose from different vehicle types (e.g.,
  "Standard", "XL") when booking a ride, so that I can select an option that
  fits my needs for space or comfort.

acceptance_criteria:
  - The `RideBookingPanel` in the `passenger-app` must be updated to show a horizontal list of available vehicle types.
  - For each type, it should display the estimated fare and capacity.
  - The passenger must be able to tap on a vehicle type to select it.
  - The selected `vehicleTypeId` must be passed with the ride request.
  - The driver matching algorithm must only consider drivers who are in a vehicle of the selected type.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_booking_panel.dart # To add the vehicle type selector UI
  - libs/backend/ride-service/src/lib/ride.service.ts # To filter drivers by vehicle type during matching

dev_notes: >
  This story brings the tiered service offering to the passenger, closing the loop started in `story-28.7`. The fare estimation and driver matching logic will need significant updates to accommodate this.