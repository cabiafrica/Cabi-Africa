id: story-85.5
epic: airport-experience
slug: airport-kerbside-coordination
title: Implement Airport Kerbside Coordination Feature
status: DONE
author: Bob (sm)
date: '2024-08-10T01:15:00Z'

description: >
  As a passenger at a busy airport pickup zone, I want a way to easily spot
  my driver's car among many others.

acceptance_criteria:
  - When the driver is approaching the designated airport pickup zone, the passenger's app displays a "Spot Your Ride" button.
  - Tapping this button makes the passenger's phone screen flash a specific, bright color.
  - The `driver-app` is simultaneously told what color to look for (e.g., "Look for the passenger holding up a flashing green screen").

files_to_be_modified:
  - apps/passenger-app/src/widgets/driver_details_panel.dart # To add the "Spot Your Ride" feature
  - apps/driver-app/src/widgets/trip_in_progress_panel.dart # To display the color instruction

dev_notes: >
  This is a low-tech but highly effective solution to the "needle in a haystack" problem at crowded airport pickup curbs. It reduces stress and pickup times.