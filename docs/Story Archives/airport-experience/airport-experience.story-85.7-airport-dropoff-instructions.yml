id: story-85.7
epic: airport-experience
slug: airport-dropoff-instructions
title: Provide Airport-Specific Drop-off Guidance
status: Done
author: Bob (sm)
date: '2024-08-10T02:55:00Z'

description: >
  As a driver taking a passenger to the airport, I want the in-app navigation
  to guide me to the correct departures level and airline door, so I can
  provide a seamless drop-off experience.

acceptance_criteria:
  - When a passenger sets an airport as their destination, they should be prompted to select their airline.
  - The `map-service` or navigation provider must use this information to route the driver to the correct terminal and departures door.
  - The in-app navigation (`story-96.3`) must provide these specific instructions.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add airline selection for airport destinations
  - libs/backend/map-service/src/lib/map.service.ts # To get airline-specific dropoff points

dev_notes: >
  Drop-offs can be just as confusing as pickups at large airports. This feature improves the experience for both driver and passenger.
