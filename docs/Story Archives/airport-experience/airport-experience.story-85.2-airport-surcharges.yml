id: story-85.2
epic: airport-experience
slug: airport-surcharges
title: Handle Airport-Specific Surcharges
status: DONE
author: Bob (sm)
date: '2024-08-09T22:05:00Z'

description: >
  As an operations manager, I need the system to automatically add mandatory
  airport fees or surcharges to trips originating from or ending at an airport,
  so we can comply with airport regulations and manage costs.

acceptance_criteria:
  - In the `admin-panel`, when defining an airport zone, an admin must be able to specify a fixed surcharge amount for pickups and/or drop-offs.
  - When a trip starts or ends within a zone with a surcharge, the `fare-service` must automatically add this fee to the total fare.
  - The surcharge must be itemized on the passenger's receipt (`story-55.4`).

files_to_be_modified:
  - apps/admin-panel/src/app/pricing/page.tsx # To add surcharge configuration
  - libs/backend/ride-service/src/lib/fare.service.ts # To apply the surcharge

dev_notes: >
  This is a necessary financial feature for operating legally at most airports. The fee must be transparent to the passenger on their final receipt.