id: story-85.8
epic: airport-experience
slug: luggage-assist-option
title: Introduce Luggage Assistance Option
status: Done
author: Bob (sm)
date: '2024-08-10T03:45:00Z'

description: >
  As a passenger with heavy luggage, especially at an airport, I want to be
  able to request a driver who is willing and able to help with my bags.

acceptance_criteria:
  - A "Luggage Assistance" toggle must be available on the ride request screen.
  - Drivers must be able to opt-in to providing luggage assistance in their app settings.
  - When a passenger requests this, the `ride-service` should prioritize matching them with drivers who have opted in.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart # To add the toggle
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # For driver opt-in

dev_notes: >
  This is a service enhancement that can greatly improve the experience for travelers. It's a "soft" preference, meaning if no opted-in driver is available, a regular driver can still be matched.
