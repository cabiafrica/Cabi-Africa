id: story-13.3
epic: driver-app-features
slug: implement-back-to-back-trips
title: "Driver App: Implement Back-to-Back Trips"
status: Done
author: Gemini Code Assist
date: '2025-12-07T14:00:00Z'

description: >
  As a driver, when I am nearing the end of my current trip, I want to be able to receive and accept
  a new trip request, so that I can minimize my downtime and efficiently move from one fare to the next.

acceptance_criteria:
  - When a driver is on an active trip and nearing their destination, the `dispatch-service` can send them a new trip offer.
  - The `driver-app` must display this new trip offer as an overlay on the current in-trip screen.
  - The offer overlay must show key details of the new trip (e.g., time and distance to the next pickup).
  - The driver must have the option to "Accept" or "Decline" the new trip from the overlay.
  - If the driver accepts, the `dispatch-service` is notified, and the trip is added to their queue.
  - If the driver declines, the offer is dismissed, and the `dispatch-service` is notified to offer the trip to another driver.
  - A new DTO, `BackToBackTripOfferDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/widgets/back_to_back_offer_widget.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_in_progress_screen.dart
  - libs/shared/dtos/src/lib/dispatch.dto.ts
  - docs/driver-app-features.story-13.3-back-to-back-trips.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature is a key driver efficiency and earnings optimization tool. The frontend implementation will focus on the UI overlay and the user interaction (accept/decline). The backend logic in the `dispatch-service` will be complex, involving geolocation and timing heuristics to determine when to send an offer. For now, the frontend will simulate receiving an offer.

