id: story-13.2
epic: driver-app-features
slug: implement-in-app-navigation
title: "Driver App: Implement In-App Navigation"
status: Done
author: Gemini Code Assist
date: '2025-12-07T13:30:00Z'

description: >
  As a driver, I want to see a map with a route drawn on it within the app when I accept a trip,
  so that I can navigate to the pickup and destination points without needing to switch to an external navigation app.

acceptance_criteria:
  - The `driver-app`'s in-trip screen must be updated to include a map view.
  - A map SDK (e.g., `google_maps_flutter`) must be integrated into the app.
  - When a trip is active, the `dispatch-service` must provide the route (as an encoded polyline) to the `driver-app`.
  - The app must display the route from the driver's current location to the pickup point, and then to the destination.
  - Markers for the pickup and destination points must be displayed on the map.
  - The map must show the driver's live location and update as they move.
  - A new DTO, `RouteDetailsDto`, must be created in the shared DTOs library to carry the polyline and other route info.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/in_app_navigation_screen.dart
  - libs/shared/dtos/src/lib/route.dto.ts
  - docs/driver-app-features.story-13.2-in-app-navigation.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts
  - apps/driver-app/pubspec.yaml # To add google_maps_flutter dependency

dev_notes: >
  This feature significantly improves the driver experience by keeping them within our app's ecosystem. The backend `dispatch-service` will need to integrate with a mapping provider's Directions API (e.g., Google Maps, Mapbox) to generate the route polyline. The frontend will focus on rendering this data. For now, the frontend will use a mocked polyline.

