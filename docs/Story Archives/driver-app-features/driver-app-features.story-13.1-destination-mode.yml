id: story-13.1
epic: driver-app-features
slug: implement-destination-mode
title: "Driver App: Implement Destination Mode"
status: Done
author: Gemini Code Assist
date: '2025-12-08T16:30:00Z'

description: >
  As a driver, I want to set a destination and an arrival time (e.g., "Home by 5 PM"),
  so that the app only offers me trips that are along my route and help me reach my destination on time.

acceptance_criteria:
  - A new "Destination Mode" feature must be available in the `driver-app`.
  - The driver must be able to enter a destination address and an optional desired arrival time.
  - Once destination mode is active, the `dispatch-service` must only send the driver trip offers that are generally in the direction of their set destination.
  - The trip offer UI should indicate that it's a "Destination Trip".
  - The driver must be able to clear or cancel destination mode at any time.
  - The `dispatch-service` must be updated to handle this new driver state and filter trips accordingly.
  - A new DTO, `SetDestinationModeDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/destination_mode_screen.dart
  - docs/driver-app-features.story-13.1-destination-mode.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/driver.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a highly requested driver feature that improves flexibility. The backend logic in the `dispatch-service` will be the most complex part, requiring route and ETA comparisons. The frontend will provide the UI for setting the destination.

