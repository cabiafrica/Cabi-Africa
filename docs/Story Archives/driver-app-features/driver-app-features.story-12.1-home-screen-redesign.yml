id: story-12.1
epic: driver-app-features
slug: home-screen-redesign
title: "Driver App: Home Screen Redesign"
status: Done for Review
author: Gemini Code Assist
date: '2025-12-08T16:15:00Z'

description: >
  As a driver, I need a redesigned home screen that is map-centric and provides quick access to essential functions,
  so that I can efficiently manage my online status and see my location at a glance.

acceptance_criteria:
  - The `driver-app` home screen must be redesigned to feature a large, prominent map view as the background.
  - A large, easy-to-tap "Go Online" / "Go Offline" button/toggle must be present on the screen.
  - When online, the screen should display a status indicating the driver is waiting for trips.
  - When a trip offer is received, it should be displayed as an overlay on the map (leveraging `story-50.2`).
  - The screen must provide quick access icons or buttons to navigate to key areas like "Earnings" and "Account/Profile".
  - The `user-service` or `driver-service` must provide an endpoint to fetch the driver's initial home screen state (e.g., online status).
  - A new DTO, `DriverHomeStatusDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart
  - docs/driver-app-features.story-12.1-home-screen-redesign.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/driver.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This story overhauls the primary driver interface to be more modern and functional, centering the experience around the map. It will serve as the main hub for the driver's active work loop.

