id: story-14.1
epic: driver-app-features
slug: document-submission-ui
title: "Driver App: Implement Document Submission UI"
status: Done
author: Gemini Code Assist
date: '2025-12-08T15:30:00Z'

description: >
  As a prospective driver, I need a screen in the app where I can upload my required documents (e.g., driver's license, vehicle registration),
  so that I can complete my application and get approved to drive.

acceptance_criteria:
  - A new "Documents" section must be available in the `driver-app`, likely as part of the registration flow.
  - The screen must list all required document types (e.g., "Driver's License", "Vehicle Registration", "Proof of Insurance").
  - Each document must display its current status (e.g., "Missing", "Pending Review", "Approved", "Rejected").
  - If a document is rejected, the reason for rejection must be displayed.
  - The user must be able to tap on a "Missing" or "Rejected" document to open their device's camera or photo gallery to select an image.
  - After selecting an image, it must be uploaded to a secure storage service (e.g., AWS S3).
  - The `user-service` or a new `document-service` must be updated with endpoints to handle document uploads and status updates.
  - New DTOs for `DriverDocument` must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/document_submission_screen.dart
  - libs/shared/dtos/src/lib/document.dto.ts
  - docs/driver-app-features.story-14.1-document-submission-ui.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a critical step in the driver onboarding process. The backend will need to handle file uploads securely and manage the state of each document. The frontend will use a package like `image_picker` to access the device's camera/gallery.

