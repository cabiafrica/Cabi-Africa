id: story-15.1
epic: driver-app-features
slug: track-driving-hours
title: "Driver App: Track and Display Driving Hours"
status: Done
author: Gemini Code Assist
date: '2025-12-07T12:00:00Z'

description: >
  As a driver, I need to see a summary of my driving hours for the day and week,
  so that I can comply with local regulations and manage my work-life balance.

acceptance_criteria:
  - A new "Driving Hours" section must be accessible from the main menu of the `driver-app`.
  - This section must display "Time Online Today" and "Time Online This Week".
  - The screen must also show a countdown or remaining time until the driver reaches their maximum allowed weekly driving limit.
  - A new endpoint must be created in the backend (e.g., in `user-service`) to provide this data.
  - A new DTO, `DrivingHoursDto`, must be created in the shared DTOs library to define the data structure.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/driving_hours_screen.dart
  - docs/driver-app-features.story-15.1-track-driving-hours.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/driver.dto.ts
  - libs/shared/dtos/src/index.ts
  - libs/backend/user-service/src/lib/user.service.ts # Or a new driver-focused service
  - libs/backend/user-service/src/lib/user.controller.ts # Or a new driver-focused controller

dev_notes: >
  This feature is important for driver compliance and well-being. The backend will need a mechanism to track a driver's online status changes to accurately calculate these durations. For the initial implementation, we can mock this calculation. The frontend will be a simple display screen.

