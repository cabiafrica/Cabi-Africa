id: story-27.3
epic: destinations-and-saved-places
slug: recent-destinations
title: Show Recent Destinations as Suggestions
status: Done
author: Bob (sm)
date: '2024-07-25T09:00:00Z'

description: >
  As a passenger, I want to see a list of my recent destinations when I search
  for a place, so that I can quickly re-book a common trip without searching
  or saving it as a favorite.

acceptance_criteria:
  - When a ride is completed, the `ride-service` must publish a `RideCompleted` event that includes the destination details (address, lat/lng).
  - The `user-service` must listen for this event and store the destination in a list of `recentDestinations` for that passenger.
  - The list of recent destinations should be capped at a configurable number (e.g., 5) and should not contain duplicates. If a destination is visited again, it should be moved to the top of the list.
  - When the user interacts with the "Where to?" destination search on the `HomeScreen`, the list of recent destinations must be displayed as suggestions, separate from "Saved Places".
  - Tapping a recent destination suggestion must select it as the destination and transition the app to the ride confirmation state.
  - The `user-service` must expose a new endpoint for the `passenger-app` to fetch the current user's list of recent destinations.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart # To fetch and display recent destinations
  - libs/backend/ride-service/src/lib/ride.service.ts # To ensure RideCompleted event includes destination
  - libs/backend/user-service/src/lib/user.service.ts # To listen for event and manage the recent destinations list
  - libs/backend/user-service/src/lib/user.controller.ts # To add endpoint for fetching recent destinations
  - The database schema for the `user-service` to add a field for storing recent destinations (e.g., a JSONB array).

dev_notes: >
  This story further improves the booking speed for frequent users. The logic for managing the list of recent places in the `user-service` is key; it should be an ordered list where the most recent destination is always first, and the list size is capped. The event-driven update from the `ride-service` to the `user-service` ensures the services remain decoupled. The UI should clearly distinguish between "Saved Places" and "Recent Destinations" to avoid user confusion.
