id: story-27.2
epic: destinations-and-saved-places
slug: custom-saved-places
title: Allow Passenger to Save Custom Places
status: Done
author: Bob (sm)
date: '2024-07-24T09:00:00Z'

description: >
  As a passenger, I want to save any frequent location with a custom name
  (e.g., "Gym", "Mom's House"), so that I can quickly select them as
  destinations without having to search each time.

acceptance_criteria:
  - The `SavedPlacesScreen` must be updated to include an "Add a Place" button.
  - Tapping "Add a Place" should initiate a flow where the user first searches for an address using the `SearchScreen`.
  - After selecting an address, the user must be prompted to give it a custom name (e.g., "Gym").
  - The `SavedPlacesScreen` must display a list of these custom saved places, below "Home" and "Work".
  - The user must be able to edit the name/address of a custom place or delete it from the list.
  - When the user interacts with the "Where to?" destination search on the `HomeScreen`, their custom saved places should appear as quick suggestions.
  - The persistence strategy chosen in `story-27.1` must be extended to support a list of custom places. If using the backend, the `user-service` must be updated to store an array of custom place objects (name, address details).

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/edit_saved_place_screen.dart # For adding/editing a custom place

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/saved_places_screen.dart # To add list of custom places and "Add" button
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart # To show custom places as suggestions
  - libs/backend/user-service/src/lib/user.service.ts # If backend persistence is chosen, to manage a list of places
  - libs/backend/user-service/src/lib/user.controller.ts # To expose endpoints for CRUD on saved places
  - The database schema for the `user-service` to add a field for custom saved places (e.g., a JSONB array).

dev_notes: >
  This story generalizes the "Saved Places" feature. Using the backend `user-service` for persistence is strongly recommended here, as it allows the list of places to sync across a user's devices. The data model in the `user-service` should support an array of objects, where each object contains a `name`, `address`, `latitude`, and `longitude`. The UI on the `HomeScreen` should present these saved places in an accessible way when the user is ready to choose a destination.
