id: story-27.1
epic: destinations-and-saved-places
slug: saved-home-work-places
title: Allow Passenger to Save 'Home' and 'Work' Addresses
status: Done
author: Bob (sm)
date: '2024-07-23T09:00:00Z'

description: >
  As a passenger, I want to save my "Home" and "Work" addresses in the app,
  so that I can select them as a destination with a single tap instead of
  searching for them every time.

acceptance_criteria:
  - A new "Saved Places" option must be added to the passenger's `ProfileScreen`.
  - Tapping "Saved Places" navigates to a new `SavedPlacesScreen`.
  - The `SavedPlacesScreen` allows the user to set or edit their "Home" and "Work" addresses by launching the `SearchScreen`.
  - Once an address is selected, it must be saved and displayed on the `SavedPlacesScreen`.
  - On the `HomeScreen`, two prominent shortcut buttons, "Home" and "Work", must be displayed below the "Where to?" search bar.
  - Tapping a shortcut button (e.g., "Home") must immediately select that saved address as the destination and transition the app to the ride confirmation state.
  - The saved addresses must be persisted, either locally on the device or in the backend `user-service`.

files_to_be_created:
  - apps/passenger-app/src/screens/saved_places_screen.dart

files_to_be_modified:
  - apps/passenger-app/src/screens/profile_screen.dart # To add link to Saved Places
  - apps/passenger-app/src/screens/home_screen.dart # To add the Home/Work shortcut buttons
  - libs/backend/user-service/src/lib/user.service.ts # If backend persistence is chosen

dev_notes: >
  This is the foundational story for the new "Destinations & Saved Places" epic. It's a high-value convenience feature for passengers. The implementation will need to decide on a persistence strategy: local storage (like `shared_preferences`) for simplicity, or backend storage via the `user-service` for a more robust solution that syncs across devices. The main challenge will be integrating these shortcuts seamlessly into the `HomeScreen` UI and state flow. This story supersedes the previous `story-10.7`.
