id: story-5.1
epic: epic-5.0
slug: testimonials-section
title: Add Testimonials Section to Landing Pages
status: Done
author: Sarah (po)
date: '2024-06-20T09:05:00Z'

description: >
  As a prospective user (driver or passenger), I want to see testimonials
  from current users, so that I can build trust in the service and be
  encouraged to sign up.

acceptance_criteria:
  - A new reusable "Testimonials" component is created in the `user-portal`.
  - The component should display a quote, the person's name, and their role (e.g., "Driver in Nairobi").
  - The new Testimonials component is added to the 'For Drivers' page (`/drivers`).
  - The new Testimonials component is added to the 'For Passengers' page (`/passengers`).
  - The component should be populated with 2-3 placeholder testimonials for each user type.
  - The section must be visually appealing and responsive.

files_to_be_created:
  - docs/stories/story-5.1-testimonials-section.yml
  - Cabi Alpha/web/user_portal/src/components/marketing/Testimonials.tsx

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/pages/drivers.tsx
  - Cabi Alpha/web/user_portal/src/pages/passengers.tsx

dev_notes: >
  This is a key social proof feature. The component should be designed to be
  easily reusable on other pages, like the homepage, in the future.

tasks:
  - id: task-1
    description: Implement the Testimonials component and add to landing pages.
    subtasks:
      - "[x] Create a new reusable `Testimonials.tsx` component."
      - "[x] Add the Testimonials component to the `/drivers` page with placeholder content."
      - "[x] Add the Testimonials component to the `/passengers` page with placeholder content."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
