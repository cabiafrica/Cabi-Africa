id: story-5.2
epic: epic-5.0
slug: social-media-links-footer
title: Add Social Media Links to Footer
status: Done
author: Sarah (po)
date: '2024-06-21T11:00:00Z'

description: >
  As a site visitor, I want to easily find and follow CABI on social media,
  so that I can stay updated with the latest news, announcements, and be part
  of the community.

acceptance_criteria:
  - The site-wide footer component (`Footer.tsx`) is updated to include a section for social media links.
  - Icons for Facebook, Twitter (X), and Instagram are added to the footer.
  - Each icon must be a link that opens the corresponding social media profile in a new tab.
  - The links should point to placeholder URLs (e.g., `https://facebook.com/cabi`, `https://twitter.com/cabi`, `https://instagram.com/cabi`).
  - The icons should be visually aligned with the existing footer content and be responsive.

files_to_be_created:
  - docs/stories/story-5.2-social-media-links-footer.yml

files_to_be_modified:
  - apps/user-portal/src/components/layout/Footer.tsx

dev_notes: >
  This is a straightforward but important task for community engagement. We should use standard, recognizable SVG icons for each platform to ensure brand consistency and quick recognition.

tasks:
  - id: task-1
    description: Implement social media links in the footer.
    subtasks:
      - "[x] Update the `Footer.tsx` component to include social media icons and links."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
    - >-
      All tasks for this story are complete. Social media links for Facebook,
      Twitter (X), and Instagram have been added to the site-wide footer,
      using SVG icons and pointing to placeholder URLs. The feature is now
      ready for QA review.
  file_list:
    - apps/user-portal/src/components/layout/Footer.tsx
  change_log:
