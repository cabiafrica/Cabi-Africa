id: story-88.4
epic: driver-earnings
slug: driver-track-expenses
title: "Driver: Track Business-Related Expenses"
status: Done
author: Gemini Code Assist
date: '2025-12-08T13:15:00Z'

description: >
  As a driver, I want to be able to log and categorize my business-related expenses (e.g., fuel, maintenance, tolls),
  so that I can accurately track my net income and prepare for tax season.

acceptance_criteria:
  - A new "Expenses" section must be available in the `driver-app`'s earnings dashboard.
  - The screen must allow a driver to add a new expense, including:
    - Description (e.g., "Gas fill-up").
    - Amount.
    - Category (e.g., "Fuel", "Maintenance", "Tolls", "Other").
    - Date of expense.
  - The screen must display a list of all logged expenses, sortable by date or category.
  - The `earnings-service` must be updated with endpoints to add, retrieve, and potentially edit/delete expenses.
  - New DTOs, `ExpenseDto` and `CreateExpenseDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/expense_tracking_screen.dart
  - libs/shared/dtos/src/lib/expense.dto.ts
  - docs/driver-earnings.story-88.4-driver-track-expenses.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature provides a valuable tool for drivers to manage their finances. The backend will need to store these expenses, likely associated with the driver's user ID. The frontend will provide a simple form and list view.

