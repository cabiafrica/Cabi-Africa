id: story-85.0
epic: driver-earnings
slug: driver-basic-earnings-dashboard
title: "Driver App: Implement Basic Earnings Dashboard"
status: Done
author: Gemini Code Assist
date: '2025-12-08T16:00:00Z'

description: >
  As a driver, I need a main earnings dashboard that shows my current available balance and provides access to all other earnings-related features,
  so that I have a central place to manage my finances.

acceptance_criteria:
  - A new "Earnings" screen must be created in the `driver-app` to serve as the main dashboard.
  - The dashboard must prominently display the driver's "Available Balance".
  - The dashboard must include a button for "Instant Payout" (linking to `story-86.1`).
  - The dashboard must provide clear navigation links to:
    - Earnings History & Trends (`story-88.1`)
    - Download Statements (`story-88.2`)
    - Set Earnings Goals (`story-88.3`)
    - Track Expenses (`story-88.4`)
  - The `earnings-service` must be updated with an endpoint to provide the data for this dashboard.
  - A new DTO, `EarningsDashboardDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_dashboard_screen.dart
  - docs/driver-earnings.story-85.0-driver-basic-earnings-dashboard.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/earnings.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This story creates the central hub for all driver earnings features. It aggregates key information and provides navigation to more detailed screens.

