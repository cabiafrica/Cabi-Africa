id: story-87.1
epic: driver-earnings
slug: driver-view-mlm-payouts
title: "Driver App: View MLM Commission Payouts"
status: Done for Review
author: Gemini Code Assist
date: '2025-12-09T11:00:00Z'

description: >
  As a driver participating in the MLM program, I want to see a list of my commission payouts,
  so that I can track the earnings I'm generating from my downline.

acceptance_criteria:
  - A new "Commissions" or "MLM Payouts" section must be available in the `driver-app`'s earnings dashboard.
  - The screen must display a list of all commission payout transactions.
  - Each entry in the list must show the date, the source of the commission (e.g., "From Driver John D."), and the amount.
  - The `earnings-service` or `organization-service` must be updated with an endpoint to provide this payout history.
  - A new DTO, `MlmCommissionPayoutDto`, must be created in the shared DTOs library.

files_to_be_created:
  - apps/driver-app/src/screens/mlm_payouts_screen.dart
  - libs/shared/dtos/src/lib/mlm.dto.ts
  - docs/driver-earnings.story-87.1-driver-view-mlm-payouts.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature provides drivers with visibility into their MLM earnings, which is a key motivator for participation. The backend will need to query a commission ledger or transaction table.

