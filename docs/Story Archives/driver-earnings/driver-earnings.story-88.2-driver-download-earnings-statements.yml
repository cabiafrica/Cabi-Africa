id: story-88.2
epic: driver-earnings
slug: driver-download-earnings-statements
title: "Driver: Download Weekly/Monthly Earnings Statements"
status: Done
author: Gemini Code Assist
date: '2025-12-08T12:45:00Z'

description: >
  As a driver, I want to be able to download my weekly or monthly earnings statements as PDF files,
  so that I can keep them for my records or for tax purposes.

acceptance_criteria:
  - A new "Statements" section must be available in the `driver-app`'s earnings dashboard.
  - The screen must list all available weekly and monthly earnings statements.
  - Each statement in the list must show the period it covers (e.g., "Week of Aug 19, 2024", "Month of July 2024").
  - Each item in the list must have a "Download" button.
  - Tapping "Download" must initiate the download of a PDF file of the statement.
  - The `earnings-service` must be updated with an endpoint to list available statements and provide download links.
  - A new DTO, `EarningsStatementDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_statements_screen.dart
  - docs/driver-earnings.story-88.2-driver-download-earnings-statements.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/earnings.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature is important for driver accounting and record-keeping. The backend will need to be able to generate PDF documents on the fly or from a template, which can be a complex task. For now, the frontend will simply link to a mock URL.

