id: story-88.1
epic: driver-earnings
slug: driver-view-earnings-history
title: "Driver: View Earnings History and Trends"
status: Done
author: Gemini Code Assist
date: '2025-12-08T12:30:00Z'

description: >
  As a driver, I want to see a summary of my earnings for the day and week, as well as a list of recent transactions,
  so that I can understand how much I'm making and where the money is coming from.

acceptance_criteria:
  - A new "My Earnings" section must be created in the `driver-app`.
  - The screen must display a summary of total earnings for "Today" and "This Week".
  - The screen must display a list of recent transactions (e.g., last 10-20).
  - Each transaction in the list must show the date, type (e.g., "Trip Fare", "Commission", "Payout"), description, and amount.
  - The `earnings-service` must be updated with an endpoint to provide this summary and transaction data.
  - New DTOs, `EarningsSummaryDto` and `TransactionDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_history_screen.dart
  - docs/driver-earnings.story-88.1-driver-view-earnings-history.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/earnings.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is the main dashboard for driver earnings. The backend service will need to aggregate data from trip and commission ledgers to produce the summary and transaction list. For now, the frontend will be built with mocked data.

