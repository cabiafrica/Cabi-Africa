id: story-88.3
epic: driver-earnings
slug: driver-set-earnings-goals
title: "Driver: Set and Track Earnings Goals"
status: Done
author: Gemini Code Assist
date: '2025-12-08T13:00:00Z'

description: >
  As a driver, I want to set a weekly earnings goal and track my progress towards it,
  so that I can stay motivated and plan my work schedule effectively.

acceptance_criteria:
  - A new "Earnings Goal" section must be available in the `driver-app`'s earnings dashboard.
  - The screen must allow a driver to input a numerical weekly earnings goal.
  - The screen must display the driver's current progress towards the set goal (e.g., using a progress bar).
  - The progress display must show the current earnings for the week and the total goal amount.
  - The driver's goal must be saved and persisted across app sessions.
  - The `earnings-service` must be updated with endpoints to get and set the driver's earnings goal.
  - New DTOs, `EarningsGoalDto` and `SetEarningsGoalDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_goal_screen.dart
  - libs/shared/dtos/src/lib/earnings.dto.ts
  - docs/driver-earnings.story-88.3-driver-set-earnings-goals.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a motivational and planning tool for drivers. The backend will need to store the goal preference per driver and provide an endpoint that returns both the goal and the current week's aggregated earnings.

