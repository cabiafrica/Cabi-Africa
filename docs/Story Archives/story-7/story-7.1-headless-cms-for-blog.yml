id: story-7.1
epic: epic-7.0
slug: headless-cms-for-blog
title: Integrate Headless CMS for Blog
status: Done
author: Sarah (po)
date: '2024-06-26T09:05:00Z'

description: >
  As a marketing manager, I want the blog content to be managed through a
  headless CMS, so that I can create, update, and publish articles without
  needing developer assistance.

acceptance_criteria:
  - The mock API route at `Cabi Alpha/web/user_portal/src/pages/api/content/[...slug].ts` is removed.
  - The `user-portal` app is configured to fetch blog content from a headless CMS (e.g., Strapi, Contentful, etc.).
  - The `/blog` page is refactored to fetch the list of post summaries from the CMS.
  - The `/blog/[postId]` page is refactored to fetch the content for a single post from the CMS.
  - The data structure from the CMS is mapped to the existing `BlogPost` and `BlogPostSummary` interfaces to minimize frontend changes.
  - Environment variables are used to store the CMS URL and any necessary API keys/tokens.

files_to_be_deleted:
  - Cabi Alpha/web/user_portal/src/pages/api/content/[...slug].ts

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/pages/blog/index.tsx
  - Cabi Alpha/web/user_portal/src/pages/blog/[postId].tsx

dev_notes: >
  This is a major step in empowering the marketing team. We will need to choose a headless CMS, set up a content model for blog posts, and then refactor the existing blog pages to use the new data source. This will decouple content from the codebase.

tasks:
  - id: task-1
    description: "CMS Setup and Configuration"
    subtasks:
      - "[x] Choose and set up a headless CMS (e.g., Strapi, Contentful, Sanity)."
      - "[x] Create a 'Blog Post' content type in the CMS with fields matching the existing `BlogPost` interface."
      - "[x] Add sample blog posts in the CMS for development and testing."
      - "[x] Configure environment variables for the CMS API URL and access tokens."
  - id: task-2
    description: "Refactor Data Fetching Logic"
    subtasks:
      - "[x] Create a new service/utility file (e.g., `Cabi Alpha/web/user_portal/src/lib/cms.ts`) to handle all communication with the CMS API."
      - "[x] Implement functions to fetch all blog post summaries and a single blog post by its ID/slug."
      - "[x] Refactor `getServerSideProps` in `Cabi Alpha/web/user_portal/src/pages/blog/index.tsx` to use the new CMS service."
      - "[x] Refactor `getServerSideProps` in `Cabi Alpha/web/user_portal/src/pages/blog/[postId].tsx` to use the new CMS service."
  - id: task-3
    description: "Cleanup"
    subtasks:
      - "[x] Delete the mock API directory at `Cabi Alpha/web/user_portal/src/pages/api/content/`."

