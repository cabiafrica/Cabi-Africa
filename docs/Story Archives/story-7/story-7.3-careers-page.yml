id: story-7.3
epic: epic-7.0
slug: careers-page
title: Create Careers Page
status: Done
author: Sarah (po)
date: '2024-06-26T10:00:00Z'

description: >
  As a job seeker, I want to view a "Careers" page with a list of current
  job openings, so that I can explore opportunities and apply to join the
  CABI team.

acceptance_criteria:
  - A new page is created in the `user-portal` app at the `/careers` route.
  - The page should display a list of open positions fetched from a backend service.
  - For this story, a new mock API route will be created at `Cabi Alpha/web/user_portal/src/pages/api/careers.ts` to simulate the backend.
  - Each job listing must display the job title, location (e.g., "Nairobi"), and a brief description.
  - Each listing must have an "Apply Now" button that links to a placeholder URL (`#`).
  - The page must be responsive and consistent with the site's overall design.
  - A "Careers" link is added to the site-wide footer.

files_to_be_created:
  - docs/stories/story-7.3-careers-page.yml
  - Cabi Alpha/web/user_portal/src/pages/careers.tsx
  - Cabi Alpha/web/user_portal/src/pages/api/careers.ts

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/components/layout/Footer.tsx

dev_notes: >
  This page will be a key asset for attracting talent. The initial implementation
  will use a mock API, but it should be designed to easily switch to a real HR
  system or backend service in the future.

tasks:
  - id: task-1
    description: Implement the "Careers" page and mock API.
    subtasks:
      - "[x] Create the new mock API route at `Cabi Alpha/web/user_portal/src/pages/api/careers.ts`."
      - "[x] Create the new page file at `Cabi Alpha/web/user_portal/src/pages/careers.tsx`."
      - "[x] Update the `Footer.tsx` component to add the 'Careers' link."

