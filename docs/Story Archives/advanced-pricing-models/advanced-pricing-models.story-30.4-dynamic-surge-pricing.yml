id: story-30.4
epic: advanced-pricing-models
slug: dynamic-surge-pricing
title: Implement Dynamic, Algorithm-Based Surge Pricing
status: DONE
author: Bob (sm)
date: '2024-07-29T14:06:00Z'

description: >
  As an operations manager, I want the system to automatically adjust fare
  multipliers in real-time based on the supply of available drivers versus
  passenger demand in a given area, so that we can balance the marketplace
  dynamically without manual intervention.

acceptance_criteria:
  - This story replaces the manual surge zone creation from `story-26.3`.
  - A new job in the `pricing-service` (or `incentive-service`) must run every few minutes.
  - The job must divide the map into a grid (e.g., S2 cells).
  - For each cell, it must calculate the ratio of recent ride requests vs. the number of available drivers.
  - Based on this ratio, it must automatically generate a surge multiplier (e.g., 1.1x, 1.5x, 2.0x).
  - This data must be stored and made available to the `ride-service` for fare estimation.
  - The driver app's heatmap must now display this dynamically generated surge data.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/peak_hours.service.ts # To be replaced or refactored
  - libs/backend/incentive-service/src/lib/surge.scheduler.ts # New scheduler to calculate dynamic surge

dev_notes: >
  This is a highly complex but powerful feature that is core to modern ride-sharing platforms. It requires significant backend processing to analyze geospatial data in near real-time. The algorithm for converting demand/supply ratios into multipliers will need careful tuning.