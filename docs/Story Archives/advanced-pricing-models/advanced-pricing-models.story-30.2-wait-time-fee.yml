id: story-30.2
epic: advanced-pricing-models
slug: wait-time-fee
title: Implement Per-Minute Wait Time Fee
status: DONE
author: Bob (sm)
date: '2024-07-28T10:02:00Z'

description: >
  As a driver, I want to be compensated for my time if I have to wait for a
  passenger for an extended period at the pickup location.

acceptance_criteria:
  - When a driver taps "Arrived" in the `driver-app`, a timer must start on the backend.
  - A configurable grace period must be defined (e.g., 2 minutes).
  - After the grace period, the system must start charging a per-minute wait time fee.
  - The `ride-service` must track this wait time.
  - The `passenger-app` must display a notification that wait time fees are now active.
  - The total wait time fee must be added to the final fare calculated by the `payment-service`.
  - The driver's earnings breakdown must show the amount earned from wait time.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To track wait time
  - libs/backend/payment-service/src/lib/payment.service.ts # To add wait time fee to final charge
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart # To reflect that the timer has started
  - Cabi Alpha/mobile/passenger_app/lib/widgets/trip_in_progress_view.dart # To notify the passenger

dev_notes: >
  This feature ensures drivers are compensated for their time and encourages passengers to be prompt. The logic for starting and stopping the timer accurately (e.g., stopping when the trip starts) is critical.

tasks:
  - id: task-1
    description: Implement backend logic to track wait time.
    subtasks:
      - "[x] Modify `ride-service` to start a timer when a driver 'arrives'."
      - "[x] Calculate the chargeable wait time fee after a grace period."
      - "[x] Add the fee to the ride's total fare upon completion."
  - id: task-2
    description: Update payment service to include wait time fee.
    subtasks:
      - "[x] Ensure `payment-service` includes the `totalWaitTimeFee` in the final charge."
  - id: task-3
    description: Implement frontend UI updates for wait time.
    subtasks:
      - "[x] Modify `driver-app` to indicate that the wait time timer is active."
      - "[x] Modify `passenger-app` to notify the passenger that wait time fees are accruing."

