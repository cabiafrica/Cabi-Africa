id: story-30.5
epic: advanced-pricing-models
slug: pricing-tiers
title: Implement Pricing Tiers for Vehicle Types
status: DONE
author: Bob (sm)
date: '2024-07-30T10:05:00Z'

description: >
  As an administrator, I want to set different base fares and per-km/per-minute
  rates for each vehicle type, so that we can price our service tiers appropriately.

acceptance_criteria:
  - The `admin-panel` must allow admins to set pricing rules (base fare, per-km, per-minute) for each vehicle type defined in `story-28.7`.
  - The `pricing-service` (or `ride-service`) must store these pricing tiers.
  - When estimating a fare, the `ride-service` must use the pricing rules corresponding to the selected vehicle type.

files_to_be_created: []

files_to_be_modified:
  - apps/admin-panel/src/app/vehicles/types/page.tsx # To add pricing rule inputs
  - libs/backend/ride-service/src/lib/fare.service.ts # To use tiered pricing in calculations

dev_notes: >
  This story adds the financial model on top of the vehicle types. The fare calculation logic will now be dependent on the vehicle type selected by the passenger.