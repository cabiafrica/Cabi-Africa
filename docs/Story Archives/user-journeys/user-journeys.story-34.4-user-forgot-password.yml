id: story-34.4
epic: user-journeys
slug: user-forgot-password
title: "User: Implement Forgot Password Flow"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T11:00:00Z'

description: >
  As a user (driver or passenger), I want to be able to reset my password if I forget it,
  so that I can regain access to my account.

acceptance_criteria:
  - A "Forgot Password?" link must be present on the login screens of both the `driver-app` and `passenger-app`.
  - Tapping the link must lead to a screen where the user can enter their registered email address.
  - Upon submitting the email, a `forgot-password` endpoint in the `user-service` must be called.
  - The backend must generate a secure, single-use reset token and (simulate) sending a password reset email to the user.
  - The user must be able to use a separate screen to enter the reset token and their new password.
  - Submitting the token and new password must call a `reset-password` endpoint in the `user-service` to validate the token and update the password.
  - New DTOs, `ForgotPasswordDto` and `ResetPasswordDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/forgot_password_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/reset_password_screen.dart
  - docs/user-journeys.story-34.4-user-forgot-password.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/user.dto.ts
  - libs/backend/user-service/src/lib/user.service.ts # To add forgot/reset password logic
  - libs/backend/user-service/src/lib/user.controller.ts # To expose the new endpoints

dev_notes: >
  This is a standard but critical security and user experience feature. The backend implementation should ensure tokens are securely generated, stored (hashed), and have a limited expiry time. For now, the frontend will be built with mocked API calls, and the backend logic already exists in a mock state.

