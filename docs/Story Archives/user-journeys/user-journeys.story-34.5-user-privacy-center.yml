id: story-34.5
epic: user-journeys
slug: user-privacy-center
title: "User: Implement Privacy Center with Marketing Communication Controls"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T11:45:00Z'

description: >
  As a user, I want a privacy center where I can control my communication preferences,
  so that I can choose what marketing messages I receive from the platform.

acceptance_criteria:
  - A "Privacy Center" or "Communication Preferences" section must be available in the user's account settings in both the `driver-app` and `passenger-app`.
  - The screen must display toggles for controlling marketing communications (e.g., "Marketing Emails", "Promotional Push Notifications").
  - The initial state of these toggles must be fetched from the `user-service`.
  - When a user changes a toggle, the app must call an endpoint in the `user-service` to update their preference.
  - The user's preferences must be persisted in the database.
  - New DTOs, `UserPrivacySettingsDto` and `UpdatePrivacySettingsDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/privacy_center_screen.dart
  - docs/user-journeys.story-34.5-user-privacy-center.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/user.dto.ts
  - libs/shared/dtos/src/index.ts
  - libs/backend/user-service/src/lib/user.service.ts # To add get/set privacy settings logic
  - libs/backend/user-service/src/lib/user.controller.ts # To expose the new endpoints

dev_notes: >
  This feature is important for user trust and regulatory compliance (e.g., GDPR, CCPA). The backend implementation should be straightforward, involving adding new boolean fields to the user model and creating simple getter/setter endpoints.

