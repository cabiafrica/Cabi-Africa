id: story-34.6
epic: user-journeys
slug: driver-join-organization
title: "Driver: Search for and Request to Join an Organization"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T12:00:00Z'

description: >
  As a driver, I want to be able to search for and request to join an existing driver organization,
  so that I can become part of a team and participate in its benefits.

acceptance_criteria:
  - A "Join Organization" section must be available in the `driver-app`.
  - The screen must provide a search bar to find organizations by name.
  - As the driver types, a list of matching organizations must be displayed.
  - Each organization in the list must show its name and description.
  - Each item in the list must have a "Request to Join" button.
  - Tapping the button must send a join request to the `user-service` or a new `organization-service`.
  - The UI must provide feedback that the request has been sent and is pending approval.
  - New DTOs for `Organization` and `JoinOrganizationRequest` must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/join_organization_screen.dart
  - libs/shared/dtos/src/lib/organization.dto.ts
  - docs/user-journeys.story-34.6-driver-join-organization.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature is a key part of the MLM/team-building functionality. It allows drivers to self-organize. The backend will need to store the join request and notify the organization's admin for approval. This story focuses on the driver's initial request action.

