id: story-34.3
epic: user-journeys
slug: user-manage-profile-picture
title: "User: Upload and Manage Profile Picture"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T11:30:00Z'

description: >
  As a user (driver or passenger), I want to upload and manage my profile picture,
  so that other users can easily identify me.

acceptance_criteria:
  - A "Profile Picture" section must be available on the user's profile/account management screen in both the `driver-app` and `passenger-app`.
  - The screen must display the user's current profile picture or a placeholder if none is set.
  - The user must have an option to upload a new picture from their device's gallery or camera.
  - After selecting a picture, the app should show a preview and confirmation step.
  - Upon confirmation, the image must be uploaded to a secure storage service (e.g., AWS S3).
  - The `user-service` must be updated with an endpoint to handle the image upload and update the user's profile with the new picture URL.
  - The user must have an option to remove their current profile picture.
  - A new DTO, `ProfilePictureDto`, must be created to return the updated user profile with the new picture URL.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_picture_screen.dart
  - docs/user-journeys.story-34.3-user-manage-profile-picture.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/user.dto.ts
  - libs/shared/dtos/src/index.ts
  - libs/backend/user-service/src/lib/user.service.ts # To add upload/remove logic
  - libs/backend/user-service/src/lib/user.controller.ts # To expose the new endpoints

dev_notes: >
  This is a key personalization feature. The backend implementation will be the most complex part, involving file handling (multipart/form-data), image resizing/optimization, and interaction with a cloud storage service like S3. The frontend will use a package like `image_picker` to access the device's camera/gallery.

