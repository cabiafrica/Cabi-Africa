id: story-10.6
epic: user-profile-and-settings
slug: passenger-payment-methods
title: Implement Passenger Payment Method Management
status: Done
author: Bob (sm)
date: '2024-07-22T10:02:00Z'

description: >
  As a passenger, I want to add, view, and remove my payment methods (e.g.,
  credit cards) in the app, so that I can manage how I pay for rides.

acceptance_criteria:
  - A new "Payment Methods" option must be added to the `passenger-app`'s settings or profile screen.
  - This option navigates to a `PaymentMethodsScreen`.
  - The screen must list the user's saved payment methods (e.g., "Visa ending in 4242").
  - The screen must have an "Add New Card" button. Tapping it should launch a secure form to enter card details.
  - This form should be provided by the payment gateway's SDK (e.g., Stripe SDK) to ensure PCI compliance.
  - The `payment-service` must have an endpoint to receive the tokenized card information from the app and save it to the payment gateway's customer object.
  - Users must be able to select a default payment method from their list.
  - Users must be able to delete a saved payment method.

files_to_be_created:
  - apps/passenger-app/src/screens/payment_methods_screen.dart

files_to_be_modified:
  - apps/passenger-app/src/screens/profile_screen.dart # Or settings, to add the navigation link
  - libs/backend/payment-service/src/lib/payment.controller.ts # To add endpoints for managing payment methods
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement logic for adding/deleting/listing methods via the payment gateway API

dev_notes: >
  This is a critical user-facing feature for managing payments. Direct handling of card numbers must be avoided. The implementation must rely on the payment gateway's SDK and tokenization process to maintain security and PCI compliance. The `payment-service` will orchestrate these interactions with the gateway's API.