id: story-10.7
epic: user-profile-and-settings
slug: saved-places
title: Implement "Saved Places" for Home and Work
status: Done
author: Bob (sm)
date: '2024-06-01T10:00:00Z'

description: >
  As a passenger, I want to save my "Home" and "Work" addresses in the app,
  so that I can select them as a destination with a single tap instead of
  searching for them every time.

acceptance_criteria:
  - A new "Saved Places" option is added to the passenger's `ProfileScreen`.
  - Tapping "Saved Places" navigates to a new `SavedPlacesScreen`.
  - The `SavedPlacesScreen` allows the user to set or edit their "Home" and "Work" addresses. Tapping on "Set Home" or "Set Work" should open the `SearchScreen`.
  - Once an address is selected from the `SearchScreen`, it should be saved and displayed on the `SavedPlacesScreen`.
  - On the `HomeScreen`, two prominent shortcut buttons, "Home" and "Work", should be displayed below the "Where to?" search bar.
  - Tapping a shortcut button (e.g., "Home") should immediately select that saved address as the destination and transition the app to the ride confirmation state (`HomeState.destinationSelected`).

files_to_be_created:
  - apps/passenger-app/src/screens/saved_places_screen.dart
  - apps/passenger-app/test/screens/saved_places_screen_test.dart

files_to_be_modified:
  - apps/passenger-app/src/screens/profile_screen.dart
  - apps/passenger-app/src/screens/home_screen.dart

dev_notes: >
  This is a high-value feature for user convenience. It will require a way to persist the saved places locally on the device (e.g., using `shared_preferences`) or, for a more robust solution, saving them as user attributes in Cognito. For this initial story, local persistence is acceptable. The main challenge will be integrating these shortcuts seamlessly into the `HomeScreen` UI and state flow.