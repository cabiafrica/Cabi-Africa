id: story-10.1
epic: user-profile-and-settings
slug: view-and-edit-profile
title: Implement Passenger Profile Screen
status: DONE
author: Bob (sm)
date: '2024-05-30T10:00:00Z'

description: >
  As a passenger, I want to access a profile screen where I can view and
  update my personal information, such as my name and profile picture, so that
  I can manage my identity within the app.

acceptance_criteria:
  - A new `ProfileScreen` is created.
  - The `HomeScreen` should have a new icon button (e.g., in the `AppBar`) that navigates to the `ProfileScreen`.
  - The `ProfileScreen` must display the user's current name and phone number, fetched via the shared `AuthService`.
  - The screen must display a placeholder for a profile picture.
  - Tapping the profile picture placeholder should open the device's image gallery (using `image_picker`).
  - Upon selecting an image, it should be displayed on the screen.
  - An "Update Profile" button should be present.
  - Tapping "Update Profile" should call a new `updateProfile` method in the shared `AuthService`, passing the new name and selected image path.
  - The `amplify_storage_s3` package should be added to handle image uploads to an S3 bucket.
  - The `updateProfile` method in the `AuthService` should first upload the image to S3 and then update the user's attributes in Cognito.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart
  - apps/passenger-app/test/screens/profile_screen_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart
  - libs/shared/auth/lib/src/auth_service.dart
  - libs/shared/auth/pubspec.yaml

dev_notes: >
  This story introduces the first user-configurable settings. It will require adding the `image_picker` and `amplify_storage_s3` packages. The shared `AuthService` will need to be expanded to handle profile updates, including file uploads to S3, which is a new capability for our shared services.
