id: story-10.8
epic: user-profile-and-settings
slug: user-password-management
title: Implement User Password Management
status: Done
author: Bob (sm)
date: '2024-07-26T10:04:00Z'

description: >
  As a user, I want to be able to change my password from within the app's
  settings, so that I can maintain the security of my account.

acceptance_criteria:
  - A "Change Password" option must be added to the settings screen in both the `passenger-app` and `driver-app`.
  - This navigates to a `ChangePasswordScreen`.
  - The screen must require the user to enter their current password and a new password (with confirmation).
  - The app must call the authentication provider (e.g., AWS Cognito) to securely perform the password change.
  - An `AuthService` in each app must be updated to include a `changePassword` method.
  - The user must be notified of success or failure.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/change_password_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/change_password_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/api/auth_service.dart # To add changePassword method
  - Cabi Alpha/mobile/driver_app/lib/api/auth_service.dart # To add changePassword method

dev_notes: >
  This is a standard and essential security feature. The implementation must not handle passwords directly but must delegate the entire process to the secure authentication provider (Cognito) via its SDK.