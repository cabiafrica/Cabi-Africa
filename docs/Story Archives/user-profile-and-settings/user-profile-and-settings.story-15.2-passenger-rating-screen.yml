id: story-15.2
epic: user-profile-and-settings
slug: passenger-rating-screen
title: Implement Passenger Rating Screen
status: Done
author: Bob (sm)
date: '2024-06-02T10:00:00Z'

description: >
  As a passenger, I want to see my own rating as calculated from the feedback
  provided by drivers, so that I can understand my standing within the
  community.

acceptance_criteria:
  - A new "My Rating" option is added to the passenger's `ProfileScreen`.
  - Tapping this item navigates to a new `PassengerRatingScreen`.
  - The `PassengerRatingScreen` must display the passenger's overall average rating prominently at the top (e.g., "4.90 Stars").
  - The screen should include some brief, encouraging text about what makes a great passenger (e.g., "Be on time," "Keep the car clean").
  - A new method, `getPassengerRating()`, is added to the `RideService`.
  - For this initial story, `getPassengerRating()` can return a hardcoded mock rating.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/passenger_rating_screen.dart
  - apps/passenger-app/test/screens/passenger_rating_screen_test.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/api/ride_service.dart

dev_notes: >
  This story provides a feedback loop for the passenger, mirroring the driver's rating screen. It's a key feature for transparency and community management. The `RideService` will simulate a backend call to fetch the passenger's rating. The UI should be simple and focused on clearly presenting the rating.

tasks:
  - id: task-1
    description: Update `RideService` to include a mock passenger rating method.
    subtasks:
      - "[x] Add a new method `getPassengerRating()` to `ride_service.dart`."
      - "[x] Implement the method to return a hardcoded `Future<double>` (e.g., 4.90)."
  - id: task-2
    description: Create the new `PassengerRatingScreen`.
    subtasks:
      - "[x] Create the file `passenger_rating_screen.dart`."
      - "[x] Build a stateless widget that displays a hardcoded rating value prominently."
      - "[x] Add brief, encouraging text about being a good passenger."
      - "[x] Add a basic `AppBar` with a back button."
  - id: task-3
    description: Integrate the new screen into the `ProfileScreen`.
    subtasks:
      - "[x] Add a new 'My Rating' list item or button to `profile_screen.dart`."
      - "[x] Implement navigation to `PassengerRatingScreen` when the item is tapped."
  - id: task-4
    description: Write widget tests for the new screen.
    subtasks:
      - "[x] Create the test file `passenger_rating_screen_test.dart`."
      - "[x] Write a test to verify the rating and static text are displayed correctly."

