id: story-22.1
epic: user-profile-and-settings
slug: passenger-trip-details
title: "Passenger: View Details of a Past Trip"
status: DONE
author: sm.md
date: '2025-12-04T09:05:00Z'

description: >
  As a passenger, I want to tap on a trip from my trip history and see a detailed summary,
  so I can get a receipt, see the route taken, or get help with the trip.

acceptance_criteria:
  - Tapping on an item in the `TripHistoryScreen` (from story-10.4) must navigate to a new `TripDetailsScreen`.
  - The `TripDetailsScreen` must be passed the `tripId` and fetch the full details for that trip.
  - The screen must display a map showing the route, pickup/dropoff points, driver details, final fare breakdown (base fare, distance, time), and payment method used.
  - A "Get Help" button should be present, which can link to a support page or contact flow (the destination can be a placeholder for now).
  - A "Receipt" button should be available to view or download a trip receipt.
  - The `ride-service` must expose a new endpoint (e.g., `GET /rides/{tripId}`) to provide these detailed trip records.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/trip_details_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/trip_history_screen.dart # To add navigation on tap.
  - libs/backend/ride-service/src/lib/ride.service.ts # To add a getTripDetails method.
  - libs/backend/ride-service/src/lib/ride.controller.ts # To expose the new endpoint.

dev_notes: >
  This builds upon the trip history list. It's a prerequisite for story-20.3 (Tipping), which adds a "Tip" button to this screen for past trips. This screen will become the central hub for all post-trip actions.