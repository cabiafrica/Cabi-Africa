id: story-10.9
epic: user-profile-and-settings
slug: forgot-password-flow
title: Implement "Forgot Password" Flow
status: Done
author: Bob (sm)
date: '2024-07-27T09:04:00Z'

description: >
  As a user who has forgotten my password, I want to be able to reset it
  securely, so that I can regain access to my account.

acceptance_criteria:
  - A "Forgot Password?" link must be present on the `LoginScreen` of both apps.
  - Tapping the link navigates to a screen where the user enters their registered phone number or email.
  - The app must call the authentication provider (e.g., AWS Cognito) to initiate the password reset flow.
  - The user will receive a verification code via SMS or email.
  - The app must present a screen for the user to enter the verification code and their new password.
  - Upon successful submission, the password is changed, and the user can log in with the new password.

files_to_be_created:
  - apps/passenger-app/src/screens/forgot_password_screen.dart
  - apps/driver-app/src/screens/forgot_password_screen.dart

files_to_be_modified:
  - apps/passenger-app/src/screens/login_screen.dart # To add the link
  - apps/driver-app/src/screens/login_screen.dart # To add the link

dev_notes: >
  This is a standard security and usability feature. The entire flow should be handled by the authentication provider's SDK (e.g., Amplify Auth for Cognito) to ensure it is secure and compliant with best practices.