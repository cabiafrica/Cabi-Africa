title: User Account - Forgot Password
epic: user-profile-and-settings
story_id: user-profile-and-settings.story-10.10
type: Story
state: Done
owner: John (pm)
jira_ref: CABI-10-10
area: User Management
description: >
  As a user who has forgotten their password, I want to be able to securely reset it so that I can regain access to my account.
acceptance_criteria:
  - A "Forgot Password?" link is available on the login screens of the marketing website, passenger app, and driver app.
  - When a user enters their registered email address, the system sends them an email with a secure, time-limited password reset link.
  - The password reset link directs the user to a page where they can enter and confirm a new password.
  - The new password must meet the platform's security requirements (e.g., minimum length, complexity).
  - Upon successful password reset, the user is notified and can log in with their new password.
  - The password reset link must be single-use and expire after a short period (e.g., 1 hour) to ensure security.
technical_notes: >
  This workflow will involve several components:
  1.  **Frontend (Web & Mobile):** A UI for the user to request a password reset and a form to set a new password.
  2.  **User Management Service:** An endpoint to initiate the password reset process. It will generate a secure, single-use token, store its hash against the user's record with an expiry, and trigger the email.
  3.  **Notification Service:** A service responsible for sending the password reset email to the user.
  4.  **Authentication Service:** A new endpoint to validate the reset token and update the user's password hash in the database.
  The process must be secure against token leakage and replay attacks.
dependencies:
  - user-profile-and-settings.story-10.8-user-password-management
  - user-profile-and-settings.story-10.9-forgot-password-flow
