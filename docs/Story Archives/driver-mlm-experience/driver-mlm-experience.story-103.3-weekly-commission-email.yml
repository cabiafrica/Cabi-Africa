id: story-103.3
epic: driver-mlm-experience
slug: weekly-commission-email
title: Send Weekly Commission Summary Email to Drivers
status: Done
author: Bob (sm)
date: '2025-12-02T14:30:00Z'

description: >
  As a driver participating in the referral program, I want to receive a weekly summary email of my commission earnings,
  so that I can easily track my referral income and stay engaged with the MLM program without having to check the app constantly.

acceptance_criteria:
  - A scheduled job must run automatically once per week (e.g., every Monday morning).
  - The job must query the `RegistrationFeeLedger` to find all drivers who earned commissions in the preceding week.
  - For each driver with earnings, the system must send a summary email.
  - The email must contain the total commission amount earned during the week and the number of new referrals that generated commissions.
  - The `mlm-service` should host the scheduled job logic.
  - The `notification-service` must be used to send the formatted HTML email.
  - The email must use a professional, branded HTML template.

files_to_be_created:
  - libs/backend/notification-service/src/lib/templates/weekly-commission-summary.hbs # HTML template for the email.
  - apps/mlm-service/src/app/mlm-scheduler.service.ts # Service to house the scheduled task.

files_to_be_modified:
  - apps/mlm-service/src/app/app.module.ts # To import and provide the scheduler module and service.
  - libs/backend/notification-service/src/lib/notification.service.ts # To add a method for sending the weekly summary.

dev_notes: >
  This story introduces a proactive engagement feature for drivers. The core of the work is implementing a reliable scheduled task (cron job). The `@nestjs/schedule` package is the recommended tool for this within our NestJS ecosystem. The scheduler service will be responsible for fetching the data from the `RegistrationFeeLedger`, aggregating it per driver for the last 7 days, and then calling the `notification-service` to dispatch the emails.

tasks:
  - id: task-1
    description: "Implement the weekly scheduled job in `mlm-service` using `@nestjs/schedule`."
  - id: task-2
    description: "Add the logic to the job to query the `RegistrationFeeLedger` and aggregate weekly earnings for each driver."
  - id: task-3
    description: "Create the branded HTML email template for the weekly summary."
  - id: task-4
    description: "Update `notification-service` with a method to send the summary email and call it from the `mlm-service` scheduler."