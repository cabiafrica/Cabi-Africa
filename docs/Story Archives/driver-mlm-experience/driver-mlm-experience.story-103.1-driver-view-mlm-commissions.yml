id: story-103.1
epic: driver-mlm-experience
slug: driver-view-mlm-commissions
title: Allow Driver to View Their MLM Commission Earnings
status: Done
author: Bob (sm)
date: '2025-12-02T11:45:00Z'

description: >
  As a driver, I want to see a detailed breakdown of the commissions I've earned from my referrals,
  so that I can track the financial benefits of the MLM program and stay motivated to refer more drivers.

acceptance_criteria:
  - A new "Commissions" screen must be created in the `driver-app`, accessible from the "Earnings" or "Wallet" section.
  - The screen must display a summary of the driver's total commission earnings to date.
  - The screen must display a paginated list of individual commission transactions from the `RegistrationFeeLedger`.
  - Each transaction in the list must show the amount earned, the date, and a reference to the source (e.g., "Commission from new driver John D.").
  - To protect privacy, the new driver's name should be partially anonymized in the list.
  - The `mlm-service` must be updated to expose a new endpoint (e.g., `GET /mlm/my-commissions`) that fetches the logged-in driver's commission history.
  - The `mlm-service` endpoint must query the `RegistrationFeeLedger` table to retrieve all entries where the current user is the `recipientId`.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/mlm_commissions_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/wallet_screen.dart # To add a link/button to the new commissions screen.
  - apps/mlm-service/src/app/mlm.controller.ts # To add the new GET /mlm/my-commissions endpoint.
  - apps/mlm-service/src/app/mlm.service.ts # To add the logic for fetching a driver's commission history.

dev_notes: >
  This story provides the driver-facing view of the MLM system, closing the loop on the referral incentive. It builds directly on the `mlm-service` and `RegistrationFeeLedger` created in `story-101.4`. The key is to provide a clear, transparent log of earnings to build trust and encourage participation in the referral program. This directly addresses the "MLM Commission Payouts" requirement in the PRD for the Driver App.

tasks:
  - id: task-1
    description: "Implement the backend endpoint to fetch a driver's commission history."
  - id: task-2
    description: "Create the 'Commissions' screen in the `driver-app` to display the summary and list of transactions."
  - id: task-3
    description: "Integrate the new screen with the 'Wallet' or 'Earnings' section of the app."