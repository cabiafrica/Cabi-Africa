id: story-22.3
epic: ride-dispatch-and-matching
slug: offer-ride-to-driver
title: Offer Ride to Selected Driver and Handle Response
status: DONE
author: Sarah (po)
date: '2024-07-24T18:00:00Z'

description: >
  As the `Dispatch Service`, I need to send a ride offer to the highest-scoring
  driver and handle their acceptance or rejection, so that a ride can be
  officially assigned and the process can continue.

acceptance_criteria:
  - The `Dispatch Service` must listen for the `DriverSelectedForRideEvent` from the scoring algorithm.
  - Upon receiving the event, the service must send a "ride offer" to the selected driver's device in real-time (e.g., via WebSocket or a push notification from the `Notification Service`).
  - The ride offer payload must include essential details: pickup location, destination, and estimated fare.
  - The service must manage the offer's state, including a timeout (e.g., 30 seconds) for the driver to respond.
  - A new API endpoint (e.g., `POST /dispatch/offers/{offerId}/respond`) must be created for the driver's app to accept or reject the offer.
  - If the driver accepts the offer within the timeout, the `Ride` entity's status must be updated to `ASSIGNED`, and a `RideAcceptedByDriverEvent` must be emitted.
  - If the driver rejects the offer or the offer times out, a `RideRejectedByDriverEvent` must be emitted, which should trigger the system to re-run the scoring algorithm to find the next-best driver.

files_to_be_created:
  # This service will manage the lifecycle of an individual ride offer
  - apps/dispatch-service/src/dispatch/ride-offer.service.ts

files_to_be_modified:
  - docs/architecture.md # To add the new API endpoint for responding to offers.
  - apps/dispatch-service/src/dispatch/dispatch.service.ts # To integrate the offer logic.
  - Cabi Alpha/mobile/driver_app/lib/widgets/incoming_ride_offer.dart # A new UI component for the driver to see and respond to the offer.
