id: story-22.3
epic: ride-dispatch-and-matching
slug: driver-receive-accept-ride
title: Driver Receive and Accept Ride Request
status: DONE
author: Sarah (po)
date: '2024-08-10T19:30:00Z'

description: >
  As a driver, I want to receive ride requests with clear details (pickup, dropoff, fare)
  and be able to accept or decline them, so that I can choose trips that fit my schedule.

acceptance_criteria:
  - The Driver App must present a `RideRequestScreen` when a dispatch offer is received.
  - The screen must show: Pickup Location, Dropoff Location, Estimated Fare, and Distance.
  - There must be "Accept" and "Decline" buttons.
  - Clicking "Accept" must call the backend to assign the ride to the driver.
  - The backend must verify the ride is still available (status 'REQUESTED') before assigning.
  - Upon success, the driver should be transitioned to the navigation/pickup state.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/ride_request_screen.dart
  - libs/backend/ride-service/src/lib/ride.service.ts
  - libs/backend/ride-service/src/lib/ride.controller.ts

dev_notes: >
  This story covers the "Happy Path" of accepting a ride. In a real scenario, this screen
  would be triggered by a WebSocket event or Push Notification. For this implementation,
  we are establishing the UI and the REST endpoint for the acceptance action.

