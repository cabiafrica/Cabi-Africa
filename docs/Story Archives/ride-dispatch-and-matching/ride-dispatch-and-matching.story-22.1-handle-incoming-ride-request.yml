id: story-22.1
epic: ride-dispatch-and-matching
slug: handle-incoming-ride-request
title: Handle Incoming Ride Requests in Dispatch Service
status: IN PROGRESS
author: Sarah (po)
date: '2024-07-24T16:00:00Z'

description: >
  As a backend developer, I need to implement the initial endpoint in the new
  `Dispatch Service` to accept and process incoming ride requests from passengers,
  so that the system can begin the process of matching them with a driver.

acceptance_criteria:
  - A new `Dispatch Service` must be created within the monorepo structure (e.g., `apps/dispatch-service`).
  - The `Dispatch Service` must expose a new API endpoint, `POST /dispatch/requests`, to accept new ride requests.
  - The request body must include passenger ID, pickup coordinates, destination coordinates, and requested vehicle type.
  - Upon receiving a valid request, the service must create a new `Ride` entity in the database with a status of `SEARCHING`.
  - The service must return a response containing the unique ID of the newly created ride.
  - The new endpoint must be documented in the `architecture.md` OpenAPI specification.
  - The service should emit an internal event (e.g., `RideRequestedEvent`) with the ride details to decouple the request intake from the driver matching logic.

files_to_be_created:
  - apps/dispatch-service/src/dispatch/dispatch.controller.ts
  - apps/dispatch-service/src/dispatch/dispatch.service.ts
  - apps/dispatch-service/src/dispatch/dispatch.module.ts

files_to_be_modified:
  - docs/architecture.md # To add the new dispatch endpoint
