id: story-104.5
epic: web-booking-experience
slug: web-booking-save-payment-method
title: Allow Users to Save Payment Method for Future Web Bookings
status: Done
author: Bob (sm)
date: '2025-12-02T13:45:00Z'

description: >
  As a returning website user, I want the option to save my payment method during a web booking,
  so that I don't have to re-enter my card details for future rides.

acceptance_criteria:
  - On the payment form of the trip status page (`/trip/[tripId]`), a "Save this card for future use" checkbox must be displayed.
  - To save a card, the user must be logged in. If the user is a guest, checking the box should prompt them to log in or create an account.
  - If the user opts to save the card and the payment is successful, the `payment-service` must attach the payment method to the user's customer profile in the payment gateway.
  - On subsequent visits to the `WebBookingWidget`, if the user is logged in and has a saved card, it should be presented as the default payment option.
  - The user must still have the option to enter a new card instead of using the saved one.
  - The `payment-service` must be updated to handle charging a saved payment method for a logged-in user.

files_to_be_modified:
  - Cabi Alpha/web/user_portal/app/trip/[tripId]/page.tsx # To add the "Save card" checkbox and associated login/signup prompt logic.
  - Cabi Alpha/web/user_portal/components/WebBookingWidget.tsx # To check for and display saved payment methods for logged-in users.
  - libs/backend/payment-service/src/lib/payment.service.ts # To add logic to save a payment method and charge a saved method for a user.
  - libs/backend/payment-service/src/lib/payment.controller.ts # To expose any new required endpoints.

dev_notes: >
  This story enhances the web booking flow from `story-104.3` by adding convenience for repeat users. The key dependency is user authentication; this feature is only available for logged-in users. The implementation should build upon the existing payment gateway integration, focusing on associating payment methods with the user's customer ID in the gateway, rather than storing any sensitive information in our own database. This is a standard practice for PCI compliance.

tasks:
  - id: task-1
    description: "Update the `payment-service` to support attaching a payment method to a customer and charging a saved method."
  - id: task-2
    description: "Add the 'Save card' UI and logic to the payment form on the trip status page."
  - id: task-3
    description: "Implement the login/signup prompt for guest users who try to save a card."
  - id: task-4
    description: "Update the `WebBookingWidget` to fetch and display saved payment methods for authenticated users."