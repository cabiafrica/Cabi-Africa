id: story-104.12
epic: web-booking-experience
slug: web-user-change-password
title: "Web User: Change Account Password"
status: DONE
author: Gemini Code Assist
date: '2025-12-04T13:00:00Z'

description: >
  As a logged-in website user, I want to change my account password from within my account settings,
  so that I can maintain the security of my account.

acceptance_criteria:
  - A new "Security" or "Change Password" page must be created (e.g., at `/account/security`).
  - The page must be linked from the main user dashboard or profile page.
  - The page must contain a form with fields for "Current Password", "New Password", and "Confirm New Password".
  - The "New Password" field must have client-side validation for minimum complexity (e.g., length, character types).
  - Submitting the form must call a secure backend endpoint on the `user-service`.
  - The backend must validate that the "Current Password" is correct before proceeding.
  - If the current password is valid and the new passwords match, the backend must hash and save the new password.
  - A clear success or error message must be displayed to the user after submission.

files_to_be_created:
  - Cabi Alpha/web/user_portal/app/account/security/page.tsx

files_to_be_modified:
  - Cabi Alpha/web/user_portal/app/dashboard/page.tsx # To add a link to the new security page.
  - libs/backend/user-service/src/lib/user.service.ts # To add password change logic.
  - libs/backend/user-service/src/lib/user.controller.ts # To expose the password change endpoint.

dev_notes: >
  This is a critical security feature. The backend implementation must be robust, ensuring it securely verifies the current password against the stored hash before updating it. Consider adding rate limiting to this endpoint to prevent abuse. For enhanced security, we could also add a feature to log out all other active sessions upon a successful password change.

