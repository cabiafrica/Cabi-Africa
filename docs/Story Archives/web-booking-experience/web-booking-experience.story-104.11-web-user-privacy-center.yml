id: story-104.11
epic: web-booking-experience
slug: web-user-privacy-center
title: "Web User: Access Privacy Center"
status: DONE
author: Gemini Code Assist
date: '2025-12-04T12:05:00Z'

description: >
  As a logged-in website user, I want to access a "Privacy Center" where I can manage my communication preferences,
  so I have control over the marketing messages I receive.

acceptance_criteria:
  - A new "Privacy Center" page must be created in the `marketing-website` (e.g., at `/account/privacy`).
  - The page must be linked from the user's main account/dashboard area.
  - The page must include a toggle switch to opt-in or opt-out of "Marketing Communications".
  - The user's preference must be fetched from and saved to the `user-service`.
  - The page should include placeholder links for "Download My Data" and "Delete Account" for future implementation.

files_to_be_created:
  - Cabi Alpha/web/user_portal/app/account/privacy/page.tsx

files_to_be_modified:
  - Cabi Alpha/web/user_portal/app/dashboard/page.tsx # To add a link to this new page.
  - libs/backend/user-service/src/lib/user.controller.ts # To expose endpoint for getting/setting privacy preferences.

dev_notes: >
  This story brings the functionality of story-34.5 to the web portal, creating a consistent privacy management experience. It's a key feature for user trust and regulatory compliance. The backend endpoints should be reusable for both mobile and web clients.

