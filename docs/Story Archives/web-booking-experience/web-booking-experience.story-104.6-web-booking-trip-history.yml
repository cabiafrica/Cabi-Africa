id: story-104.6
epic: web-booking-experience
slug: web-booking-trip-history
title: Allow Web Users to View Past Trip History
status: Done
author: Bob (sm)
date: '2025-12-02T14:15:00Z'

description: >
  As a returning website user, I want to view a history of my past web-booked rides,
  so that I can keep track of my trips and expenses without needing to use the mobile app.

acceptance_criteria:
  - A new "My Trips" page must be created in the `marketing-website` app, accessible only to logged-in users.
  - The page must display a paginated list of the user's past rides that were booked via the web.
  - Each ride in the list must display key details: Date, Pickup & Destination addresses, Final Fare, and Ride Status (e.g., 'Completed', 'Cancelled').
  - The `ride-service` must be updated to expose a new endpoint (e.g., `GET /rides/my-history`) that returns the ride history for the authenticated user.
  - The endpoint must support pagination.
  - A link to the "My Trips" page must be available in the website's header or user profile dropdown when a user is logged in.

files_to_be_created:
  - Cabi Alpha/web/user_portal/app/my-trips/page.tsx # The trip history page for web users.

files_to_be_modified:
  - Cabi Alpha/web/user_portal/components/Header.tsx # Or similar navigation component to add the "My Trips" link.
  - libs/backend/ride-service/src/lib/ride.service.ts # To add logic to fetch ride history for a logged-in user.
  - libs/backend/ride-service/src/lib/ride.controller.ts # To expose the new endpoint for fetching trip history.

dev_notes: >
  This story enhances the logged-in user experience on the web, making the marketing site a more functional portal for repeat customers. It builds on the authentication established in previous stories like `story-104.5`. The backend implementation will be similar to the admin view of user ride history (`story-79.5`), but scoped to the currently authenticated user instead of an arbitrary user ID.

tasks:
  - id: task-1
    description: "Implement the backend endpoint in `ride-service` to fetch a paginated list of rides for the authenticated user."
  - id: task-2
    description: "Create the 'My Trips' page in the `marketing-website` app."
  - id: task-3
    description: "Implement the UI to display the list of past trips with key details and pagination."
  - id: task-4
    description: "Add a link to the 'My Trips' page in the site navigation for authenticated users."