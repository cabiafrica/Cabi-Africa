id: story-104.4
epic: web-booking-experience
slug: web-booking-email-receipt
title: Send Email Receipts for Web-Booked Rides
status: Done
author: Bob (sm)
date: '2025-12-02T13:15:00Z'

description: >
  As a website user who has paid for a ride, I want to receive a detailed receipt via email,
  so that I have a professional record of my transaction for personal accounting or expense reports.

acceptance_criteria:
  - An email must be automatically sent to the user upon successful payment for a web-booked ride.
  - The email must be sent to the address the user provided during the booking process.
  - The email receipt must contain a detailed breakdown of the trip, including:
    - Final fare paid
    - Ride date and time
    - Pickup and destination addresses
    - A static map image of the route taken
  - The `notification-service` must be responsible for generating and sending the email.
  - The `payment-service` must trigger the `notification-service` after a payment is successfully processed for a web-booked ride.
  - The email must use a professional, branded HTML template.

files_to_be_created:
  - libs/backend/notification-service/src/lib/templates/web-ride-receipt.hbs # HTML template for the email

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.service.ts # To trigger the notification service upon successful payment.
  - libs/backend/notification-service/src/lib/notification.service.ts # To add logic for sending the ride receipt email.

dev_notes: >
  This story adds a crucial post-purchase communication step, completing the web booking journey from a user's perspective. It follows directly from `story-104.3`. The implementation will require an email sending provider (like SendGrid or AWS SES) to be configured within the `notification-service`. The focus is on creating a clean email template and ensuring the trigger from the payment service is reliable.

tasks:
  - id: task-1
    description: "Create the HTML email template for the web ride receipt."
  - id: task-2
    description: "Implement the logic in `notification-service` to populate the template with ride data and send the email via a provider."
  - id: task-3
    description: "Update the `payment-service` to call the `notification-service` with the necessary trip and user data after a successful payment."