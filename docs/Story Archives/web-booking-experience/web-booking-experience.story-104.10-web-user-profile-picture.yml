id: story-104.10
epic: web-booking-experience
slug: web-user-profile-picture
title: "Web User: Manage Profile Picture"
status: DONE
author: Gemini Code Assist
date: '2025-12-04T12:00:00Z'

description: >
  As a logged-in website user, I want to upload, view, and remove my profile picture from my account profile page,
  so I can personalize my identity on the platform.

acceptance_criteria:
  - On the "My Profile" page (`/account/profile` from story-104.9), there must be a section to manage the profile picture.
  - The user's current picture (or a placeholder) must be displayed.
  - A user must be able to select an image file from their computer.
  - Upon selection, the image should be uploaded to the `user-service` via a secure endpoint.
  - The backend must handle the file upload (e.g., to S3) and associate the URL with the user's profile.
  - The user must have an option to remove their current profile picture, which should revert it to a default placeholder.

files_to_be_created:
  - Cabi Alpha/web/user_portal/app/account/profile/page.tsx

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.controller.ts # To expose an endpoint for web picture upload.
  - libs/backend/user-service/src/lib/user.service.ts # To handle the upload logic.

dev_notes: >
  This story mirrors the functionality of story-34.3 for the web platform. It enhances the "My Profile" page created in story-104.9. The backend will likely need a similar, if not identical, endpoint to the one used by the mobile apps for handling multipart/form-data uploads.

