id: story-104.10
epic: web-booking-experience
slug: web-user-change-password
title: Allow Web User to Change Their Password
status: DONE
author: Bob (sm)
date: '2025-12-02T16:15:00Z'

description: >
  As a logged-in website user, I want to change my account password,
  so that I can maintain the security of my account.

acceptance_criteria:
  - A new "Change Password" page must be created under the user's account section (e.g., `/account/security`).
  - The page must be accessible only to logged-in users.
  - The page must contain a form with fields for "Current Password", "New Password", and "Confirm New Password".
  - The "New Password" field must enforce the platform's minimum complexity requirements (e.g., length, character types).
  - Submitting the form must call a secure backend endpoint on the `user-service` or `auth-service`.
  - The backend must first validate that the "Current Password" is correct for the authenticated user before proceeding.
  - If the current password is valid, the backend must hash and save the new password.
  - Upon successful password change, the user must be shown a success message.
  - If the current password is incorrect, or if the new passwords don't match, a clear error message must be displayed.

files_to_be_created:
  - Cabi Alpha/web/user_portal/app/account/security/page.tsx # The change password page.

files_to_be_modified:
  - Cabi Alpha/web/user_portal/app/account/profile/page.tsx # Or similar, to add a link to the security page.
  - libs/backend/user-service/src/lib/user.service.ts # To add the password change logic.
  - libs/backend/user-service/src/lib/user.controller.ts # To expose the new endpoint.

dev_notes: >
  This is a standard and critical security feature for user account management. The backend implementation is the most critical part; it must securely verify the current password against the stored hash and then create a new hash for the new password. This functionality should be rate-limited to prevent brute-force attacks. For enhanced security, consider logging out all other active sessions for the user after a successful password change.

tasks:
  - id: task-1
    description: "Implement the secure backend endpoint for changing a user's password, including current password validation."
  - id: task-2
    description: "Create the 'Change Password' page and form in the `marketing-website` app."
  - id: task-3
    description: "Implement client-side validation for password complexity and matching fields."
  - id: task-4
    description: "Connect the frontend form to the backend endpoint and handle success/error feedback."