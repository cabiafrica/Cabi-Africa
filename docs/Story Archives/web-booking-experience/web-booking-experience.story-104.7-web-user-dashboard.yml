id: story-104.7
epic: web-booking-experience
slug: web-user-dashboard
title: "Web User: Logged-in Homepage/Dashboard"
status: Done
author: Gemini Code Assist
date: '2025-12-04T10:00:00Z'

description: >
  As a logged-in website user, I want to see a personalized dashboard homepage,
  so I can quickly access my information and key actions like booking a ride or viewing my trip history.

acceptance_criteria:
  - After a user successfully logs in via the website, they must be redirected to a new `/dashboard` page.
  - The dashboard must display a personalized welcome message (e.g., "Welcome back, Jane!").
  - The page must feature prominent links or cards for key actions:
    - "Book a New Ride" (linking to the homepage with the booking widget).
    - "View My Trips" (linking to the `/my-trips` page from story-104.6).
    - "Manage Profile" (destination can be a placeholder for now).
  - The main site navigation/header must be updated to show a link to the "Dashboard" instead of "Login" when the user is authenticated.

files_to_be_created:
  - Cabi Alpha/web/user_portal/app/dashboard/page.tsx

files_to_be_modified:
  - Cabi Alpha/web/user_portal/components/Header.tsx # To update nav for logged-in state.

dev_notes: >
  This story creates the central hub for authenticated users on the web portal. It ties together the booking widget and trip history features, improving user navigation and creating a more cohesive experience. This page will be the foundation for adding more account management features in the future.

