id: story-104.11
epic: web-booking-experience
slug: web-forgot-password
title: Implement "Forgot Password" Flow on Website
status: DONE
author: Bob (sm)
date: '2025-12-02T16:45:00Z'

description: >
  As a website user who has forgotten my password, I want to securely reset it via email,
  so that I can regain access to my account.

acceptance_criteria:
  - The website's login page must have a "Forgot Password?" link.
  - Clicking the link must navigate the user to a page where they can enter their registered email address.
  - Upon submission, the backend (`user-service` or `auth-service`) must generate a secure, single-use, time-limited password reset token.
  - The `notification-service` must send an email to the user containing a unique link with the reset token.
  - The email must use a professional, branded HTML template.
  - Clicking the link in the email must take the user to a "Reset Password" page.
  - The "Reset Password" page must validate the token from the URL and present a form to enter a "New Password" and "Confirm New Password".
  - Upon successful submission, the backend must update the user's password hash and invalidate the reset token.
  - The user should be notified of the successful password change and redirected to the login page.

files_to_be_created:
  - Cabi Alpha/web/user_portal/app/forgot-password/page.tsx # Page to enter email for reset link.
  - Cabi Alpha/web/user_portal/app/reset-password/page.tsx # Page to enter new password using token from URL.
  - libs/backend/notification-service/src/lib/templates/forgot-password-email.hbs # HTML template for the reset email.

files_to_be_modified:
  - # The website's login page component needs to be modified to add the "Forgot Password?" link.
  - libs/backend/user-service/src/lib/user.service.ts # To add logic for generating/validating tokens and resetting the password.
  - libs/backend/user-service/src/lib/user.controller.ts # To expose the necessary endpoints.
  - libs/backend/notification-service/src/lib/notification.service.ts # To handle sending the reset email.

dev_notes: >
  This story implements a critical security and usability feature. It's the counterpart to `story-104.10` for users who cannot log in. The security of the reset token is paramount—it must be single-use and expire after a short period (e.g., 1 hour). The backend service will need a mechanism to store the token hash and its expiry date, associating it with the user.

tasks:
  - id: task-1
    description: "Implement backend logic to generate a password reset token and trigger the notification service to send the reset email."
  - id: task-2
    description: "Implement the backend endpoint to validate a reset token and update the user's password."
  - id: task-3
    description: "Create the 'Forgot Password' and 'Reset Password' pages and forms in the `marketing-website` app."
  - id: task-4
    description: "Connect the frontend pages to the backend services and add the 'Forgot Password?' link to the login page."