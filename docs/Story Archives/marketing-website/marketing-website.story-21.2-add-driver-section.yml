id: story-21.2
epic: marketing-website-mvp
slug: add-driver-section
title: Add "Become a Driver" Section to Landing Page
status: DONE
author: Bob (sm)
date: '2024-07-20T11:00:00Z'

description: >
  As a prospective driver, I want to see a section on the marketing website
  that explains the benefits of driving with Cabi, so I can be motivated to
  sign up.

acceptance_criteria:
  - The main landing page (`index.html`) must be modified to include a new "Become a Driver" section.
  - This section should appear below the main hero/download section.
  - The section must have a clear headline (e.g., "Drive with Cabi").
  - It must include a short paragraph or 2-3 bullet points highlighting the benefits of driving (e.g., "Flexible hours," "Earn on your schedule," "Be your own boss").
  - A prominent Call-to-Action (CTA) button with text like "Sign Up to Drive" must be present.
  - The CTA button should link to the driver application's signup page.

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/pages/index.tsx
  - Cabi Alpha/web/user_portal/src/styles/globals.css

dev_notes: >
  This story builds directly on `story-21.1`. The content can be simple for the MVP. The main goal is to create a clear pathway for potential drivers to learn more and begin the onboarding process. The link for the CTA can be a placeholder initially if the final deep link isn't ready.
