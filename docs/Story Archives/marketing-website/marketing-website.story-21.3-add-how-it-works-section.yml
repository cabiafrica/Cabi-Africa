id: story-21.3
epic: marketing-website-mvp
slug: add-how-it-works-section
title: Add "How it Works" Section for Passengers
status: DONE
author: Bob (sm)
date: '2024-07-20T12:00:00Z'

description: >
  As a potential passenger, I want to see a simple "How it Works" section on
  the landing page, so I can quickly understand the steps to book a ride.

acceptance_criteria:
  - The main landing page (`index.html`) must be modified to include a new "How it Works" section.
  - The section should have a clear headline (e.g., "Riding with Cabi is Easy").
  - It must visually represent 3 simple steps for booking a ride (e.g., "1. Request", "2. Ride", "3. Pay").
  - Each step should have a short, descriptive sentence.
  - The section should be placed logically on the page, for example, after the main hero section.

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/pages/index.tsx
  - Cabi Alpha/web/user_portal/src/styles/globals.css

dev_notes: >
  This story adds valuable content for our primary user base: passengers. The goal is to quickly communicate the simplicity of the service. For the MVP, we can use simple text and basic layout. Icons or more advanced graphics can be added in a future story.
