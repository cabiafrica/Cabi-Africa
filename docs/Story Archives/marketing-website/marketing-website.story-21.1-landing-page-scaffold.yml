id: story-21.1
epic: marketing-website-mvp
slug: landing-page-scaffold
title: Create Basic Landing Page for Marketing Website
status: DONE
author: Bob (sm)
date: '2024-07-20T10:00:00Z'

description: >
  As a potential customer (passenger or driver), I want to visit a simple
  landing page that introduces the Cabi service, so I can understand what the
  product is and see links to download the mobile apps.

acceptance_criteria:
  - A new application/repository for the marketing website is created (e.g., `apps/marketing-website`).
  - The website must have a single landing page (`index.html` or equivalent).
  - The page must have a clear headline (e.g., "Cabi: Your Ride, Your Way").
  - The page must include two prominent buttons/links: "Download on the App Store" and "Get it on Google Play".
  - A simple footer should be present with a copyright notice (e.g., "© 2024 Cabi").
  - The page should be responsive and functional on both desktop and mobile browsers.
  - No complex styling is required; use basic HTML and CSS. The focus is on structure and functionality.

files_to_be_created:
  - Cabi Alpha/web/user_portal/src/pages/index.tsx
  - Cabi Alpha/web/user_portal/src/styles/globals.css

dev_notes: >
  This is the foundational story for the new `marketing-website-mvp` epic. The goal is to set up the project structure and deploy a minimal, functional landing page. We will add more content, styling, and features in subsequent stories. For now, the download links can point to placeholder URLs.
