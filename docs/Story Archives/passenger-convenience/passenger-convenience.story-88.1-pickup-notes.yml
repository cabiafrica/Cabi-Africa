id: story-88.1
epic: passenger-convenience
slug: pickup-notes
title: Implement "Pickup Notes" for Passengers
status: Done
author: Bob (sm)
date: '2024-08-08T11:19:00Z'

description: >
  As a passenger, I want to be able to add a short note for my driver during
  booking (e.g., "I'm at the blue door", "Pickup at the side entrance"), so I
  can make the pickup smoother.

acceptance_criteria:
  - On the `RideConfirmationPanel`, an optional "Add pickup note" text field must be available.
  - The note must be passed along with the ride request.
  - The `driver-app` must clearly display this note to the driver when they accept the ride and are on their way to the pickup.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_confirmation_panel.dart # To add the text field
  - Cabi Alpha/mobile/driver_app/lib/widgets/ride_request_panel.dart # To display the note

dev_notes: >
  A simple but very effective feature for reducing pickup friction and confusion, especially at complex locations.
