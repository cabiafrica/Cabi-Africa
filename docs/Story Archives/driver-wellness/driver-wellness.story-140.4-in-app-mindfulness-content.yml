id: story-140.4
epic: driver-wellness
slug: in-app-mindfulness-content
title: Implement In-App Mindfulness Content for Drivers
status: Done
author: Mary (analyst)
date: '2024-08-10T12:30:00Z'

description: >
  As a driver, I want to access short, guided mindfulness or relaxation audio
  sessions in the app, so I can de-stress and recharge during my breaks.

acceptance_criteria:
  - A new "Wellness" or "Relax" section must be added to the `driver-app`.
  - This section must display a library of short audio tracks (e.g., 3-5 minutes long).
  - The tracks should be organized into categories like "Breathing Exercises," "Short Meditations," and "Stress Relief."
  - The app must include a simple audio player interface to play, pause, and scrub through the tracks.
  - The audio content must be manageable from the `admin-panel`, allowing an administrator to upload new tracks and manage categories.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/mindfulness_content_screen.dart # To list and play audio content.
  - apps/admin-panel/src/app/wellness-content/page.tsx # For admins to manage the audio library.

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # Or a new content service to store and serve the audio files and metadata.

dev_notes: >
  This feature directly addresses driver mental wellness. The content should be specifically curated for short breaks. The implementation will require an audio player component in the driver app and a simple CMS-like functionality in the admin panel for content management.