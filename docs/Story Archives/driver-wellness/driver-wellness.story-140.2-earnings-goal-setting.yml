id: story-140.2
epic: driver-wellness
slug: earnings-goal-setting
title: Implement Earnings Goal Setting for Drivers
status: Done
author: Mary (analyst)
date: '2024-08-10T12:15:00Z'

description: >
  As a driver, I want to set a daily or weekly earnings goal in my app, so I
  can easily track my progress, stay motivated, and know how much more I need to work.

acceptance_criteria:
  - A new "Goals" section must be added to the driver's "Earnings" or "Performance" screen in the `driver-app`.
  - In this section, a driver can set a numerical earnings goal for a specific period (e.g., "Daily" or "Weekly").
  - The app must display a clear visual indicator (e.g., a progress bar) showing the driver's current earnings against their set goal.
  - The UI must also show the remaining amount needed to reach the goal.
  - The earnings progress calculation must be based on the driver's net take-home pay (after platform commission and other deductions). This includes the net fare, all tips, and any bonuses.
  - The goal and progress should reset automatically at the end of the chosen period (e.g., midnight for daily, Sunday night for weekly).
  - The `user-service` must be updated to store the driver's goal preferences.

files_to_be_created:
  - apps/driver-app/src/widgets/earnings_goal_progress_card.dart

files_to_be_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To add the goal setting UI and progress card.
  - libs/backend/user-service/src/lib/user.service.ts # To store the user's goal settings.

dev_notes: >
  This is a key motivational feature for the `driver-wellness` epic. It provides drivers with a tangible target and a sense of accomplishment. The progress should update in near real-time as trips are completed.

  **Currency Handling:** The goal amount is always set and displayed in the driver's local currency, as determined by their country of operation. All earnings progress is also calculated in the local currency. No currency conversion is required for this feature.
