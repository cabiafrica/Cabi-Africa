id: story-140.6
epic: driver-wellness
slug: earnings-opportunity-insights
title: Provide Earnings Opportunity Insights
status: Done
author: Sarah (po)
date: '2024-06-12T12:00:00Z'

description: >
  As a driver, I want to see insights and suggestions on where and when to
  drive to best meet my earnings goals, so I can work more efficiently and
  reduce idle time.

acceptance_criteria:
  - A new "Opportunities" or "Insights" section must be added to the `driver-app`.
  - This section must display a map with a heatmap showing current demand hotspots.
  - It must also provide suggestions based on historical data (e.g., "Demand is usually high in the Downtown area on Friday evenings.").
  - The feature should integrate with the earnings goals from `story-140.2`, providing context like "Driving in this hotspot for the next hour could help you reach 80% of your daily goal."
  - The `analytics-service` must be updated to generate these demand predictions and heatmaps.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/opportunities_screen.dart

dev_notes: >
  This feature bridges the gap between setting an earnings goal (`story-140.2`) and achieving it. It empowers drivers with data-driven suggestions, helping them maximize their time online. This is a key wellness feature as it reduces the stress of uncertainty.
