id: story-50.6
epic: dispatch-system
slug: dispatch-airport-rematching
title: "Dispatch: Implement Airport Rematching Logic"
status: Done
author: Gemini Code Assist
date: '2025-12-06T20:00:00Z'

description: >
  As a platform operator, when a ride is cancelled within an airport geofence, I want the dispatch system to use special logic
  to efficiently rematch the driver (e.g., return them to the front of the queue) or the passenger, so that airport operations remain smooth and wait times are minimized.

acceptance_criteria:
  - When a passenger cancels a ride after a driver has been dispatched from the airport virtual queue, the affected driver must be placed back at the front of the queue.
  - When a driver cancels an accepted airport ride, they must be moved to the back of the virtual queue or receive a configurable timeout penalty before they can re-enter.
  - The `dispatch-service` must correctly update the driver's position in the airport queue (managed in story-50.4) based on these cancellation scenarios.
  - These rematching rules must be configurable per airport zone.

files_to_be_created:
  # No new files are expected; this modifies the core dispatch logic.

files_to_be_modified:
  - # The core logic of the backend dispatch service, specifically the part that handles ride cancellations and airport queues.

dev_notes: >
  This story adds essential exception handling to the airport virtual queue feature (`story-50.4`), as required by the PRD (section 2.5). This is a purely backend story. The logic must handle different cancellation initiators (passenger vs. driver) with different outcomes to maintain fairness and efficiency. The state management of the virtual queue (likely in Redis) will need to be updated to support these new rules, such as moving a driver to the front or back of the list.
  PRD Reference: 2.5. Dispatch System -> Airport Operations -> Airport Rematching
