id: story-50.5
epic: dispatch-system
slug: dispatch-surge-integration
title: "Dispatch: Integrate Surge Zone Data into Fare Calculation"
status: Done
author: Gemini Code Assist
date: '2025-12-06T18:10:00Z'

description: >
  As a platform operator, I want the dispatch system to check if a ride's pickup location falls within an active surge zone
  and apply the corresponding multiplier to the fare estimate, so that pricing dynamically responds to demand.

acceptance_criteria:
  - When a passenger requests a fare estimate, the `ride-service` (or a dedicated `pricing-service`) must query for active surge zones.
  - The service must perform a geospatial query to determine if the ride's pickup coordinates are inside any active surge zone polygon.
  - If the pickup is inside a surge zone, the zone's multiplier must be applied to the base fare calculation.
  - The fare estimate returned to the passenger app must reflect the surged price.
  - The final fare charged at the end of the trip must also correctly apply the surge multiplier that was active at the time of booking.

files_to_be_created:
  # No new files are expected; this modifies existing services.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # Or a new pricing-service, to add the surge calculation logic.

dev_notes: >
  This story is the consumer of the feature built in `story-79.26` (Admin: Manage Surge Pricing Zones). It's a purely backend story that adds critical dynamic pricing logic. The implementation will require a database that supports geospatial queries (e.g., PostGIS) to efficiently check if a point is within a polygon. This logic must be applied both at the time of fare estimation and at final fare calculation.
  PRD Reference: 2.5. Dispatch System -> Operational Efficiency & Optimization -> Surge Zone Integration
