id: story-50.2
epic: dispatch-system
slug: dispatch-rejection-cascade
title: "Dispatch: Implement Job Offer Rejection Cascade"
status: Done
author: Gemini Code Assist
date: '2025-12-06T17:00:00Z'

description: >
  As a platform operator, when a driver rejects or times out on a ride offer, I want the dispatch system
  to automatically and immediately offer the job to the next-best-ranked driver, so that we minimize passenger wait times and increase the chance of a successful match.

acceptance_criteria:
  - The dispatch service must maintain a ranked list of eligible drivers for a given ride request (as established in story-50.1).
  - When the current top-ranked driver rejects a ride offer, they are removed from the candidate list for that specific ride.
  - The system must immediately send the ride offer to the new top-ranked driver in the candidate list.
  - If a driver fails to respond within the configured timeout period, it must be treated as a rejection, and the cascade must continue.
  - This process must repeat down the ranked list until a driver accepts the offer or the list of eligible drivers is exhausted.
  - If all eligible drivers reject the ride, the ride request status must be updated (e.g., to 'unfulfilled'), and a notification should be sent to the passenger.

files_to_be_created:
  # No new files are expected; this modifies the core dispatch logic.

files_to_be_modified:
  - # The core logic of the backend dispatch service where ride matching occurs.

dev_notes: >
  This story is a direct and critical follow-up to `story-50.1` (Driver Scoring for Assignments), as it depends on having a pre-ranked list of drivers to iterate through. The core of this work is purely on the backend, within the state machine that manages the lifecycle of a ride request.

  The main complexity will be managing the state of the offer as it cascades. The system must be resilient to race conditions, such as a passenger cancelling the ride while an offer is in-flight to a driver. The timeout for each offer should be a configurable value.
  PRD Reference: 2.5. Dispatch System -> Ride Matching & Assignment -> Job Offer Rejection Cascade
