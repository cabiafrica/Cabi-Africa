id: story-6.1
epic: epic-6.0
slug: seo-foundations
title: Implement SEO Foundations (robots.txt and Sitemap)
status: Done
author: Sarah (po)
date: '2024-06-23T09:05:00Z'

description: >
  As a marketing manager, I want the website to have basic technical SEO
  features in place, so that search engines can effectively crawl, index,
  and rank our pages, leading to increased organic traffic.

acceptance_criteria:
  - A `robots.txt` file is created in the `Cabi Alpha/web/user_portal/public/` directory.
  - The `robots.txt` must allow all user-agents ("`User-agent: *`") to crawl the site (`Allow: /`).
  - The `robots.txt` must specify the location of the sitemap (e.g., `Sitemap: https://www.cabi.com/sitemap.xml`).
  - A dynamic sitemap is generated at the `/sitemap.xml` route. This should be implemented as a server-side page (e.g., `Cabi Alpha/web/user_portal/src/pages/sitemap.xml.ts`).
  - The sitemap must include all static pages: `/`, `/drivers`, `/passengers`, `/blog`, `/about`, `/contact`, `/faq`, `/mlm-details`.
  - The sitemap must dynamically include all individual blog post URLs by fetching them from the content API.
  - All existing pages must have unique and descriptive `<title>` and `<meta name="description">` tags.

files_to_be_created:
  - docs/stories/story-6.1-seo-foundations.yml
  - Cabi Alpha/web/user_portal/public/robots.txt
  - Cabi Alpha/web/user_portal/src/pages/sitemap.xml.ts

dev_notes: >
  This is a foundational technical SEO story. Generating the sitemap dynamically
  is crucial to ensure that as we add new content, like blog posts, it is
  automatically included for search engines to discover.

tasks:
  - id: task-1
    description: Implement foundational SEO files.
    subtasks:
      - "[x] Create the `robots.txt` file in the public directory."
      - "[x] Create the dynamic `sitemap.xml.ts` page to generate the sitemap."

