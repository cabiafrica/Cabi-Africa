id: story-6.2
epic: epic-6.0
slug: newsletter-signup-component
title: Create Newsletter Signup Component
status: Done
author: Sarah (po)
date: '2024-06-24T11:00:00Z'

description: >
  As a marketing manager, I want a newsletter signup component on the website,
  so that we can capture visitor email addresses for lead nurturing and
  marketing campaigns.

acceptance_criteria:
  - A new reusable "NewsletterSignup" component is created in the `user-portal`.
  - The component must contain an email input field and a "Subscribe" button.
  - The component is added to the site-wide footer, making it visible on all pages.
  - A new API route is created at `Cabi Alpha/web/user_portal/src/pages/api/newsletter.ts` to handle form submissions.
  - For this story, the API route should log the submitted email to the console and return a success response.
  - Upon successful submission, the user should see a confirmation message (e.g., "Thanks for subscribing!").

files_to_be_created:
  - docs/stories/story-6.2-newsletter-signup-component.yml
  - Cabi Alpha/web/user_portal/src/components/marketing/NewsletterSignup.tsx
  - Cabi Alpha/web/user_portal/src/pages/api/newsletter.ts

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/components/layout/Footer.tsx

dev_notes: >
  This is a key lead-generation feature. The initial backend can be simple
  (console logging), with the plan to integrate it with a marketing automation
  platform (e.g., Mailchimp, SendGrid) in a future story.

