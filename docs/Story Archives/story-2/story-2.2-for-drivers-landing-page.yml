id: story-2.2
epic: epic-2.0
slug: for-drivers-landing-page
title: Create 'For Drivers' Landing Page
status: Done
author: Sarah (po)
date: '2024-06-07T09:00:00Z'

description: >
  As a prospective driver, I want to see a dedicated landing page that
  explains the benefits of driving for CABI, so that I can make an
  informed decision and easily find out how to sign up.

acceptance_criteria:
  - A new page is created in the `user-portal` app at the `/drivers` route.
  - The page must feature a prominent hero section with a clear headline (e.g., "Drive with CABI, Earn on Your Terms").
  - It must include a primary Call-to-Action (CTA) button, like "Sign Up to Drive", that links to the driver app download/signup page.
  - The page should contain sections detailing the key benefits of driving for us, such as flexible hours, earnings potential, and information about our unique MLM system.
  - The content should be engaging and use brand-consistent imagery.
  - The page must be fully responsive, providing a great experience on both mobile and desktop browsers.

files_to_be_created:
  - docs/stories/story-2.2-for-drivers-landing-page.yml
  - apps/user-portal/src/pages/drivers.tsx

dev_notes: >
  This page is a critical conversion point for driver acquisition. It should be designed to be persuasive and clear, bridging the gap between a visitor's interest and the action of downloading the driver app to start the onboarding process. We can reuse some of the components and styling from the main site.

tasks:
  - id: task-1
    description: Implement the frontend for the 'For Drivers' landing page.
    subtasks:
      - "[x] Create the new page file at `apps/user-portal/src/pages/drivers.tsx`."
      - "[x] Implement the hero section with a prominent headline and a 'Sign Up to Drive' CTA button."
      - "[x] Create sections to detail the key benefits for drivers (e.g., flexible hours, earnings potential, MLM system)."
      - "[x] Add brand-consistent imagery to the page."
      - "[x] Ensure the page layout is fully responsive."
      - "[x] Link the CTA to the new `/download/driver` page."

