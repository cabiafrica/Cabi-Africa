id: story-2.3
epic: epic-2.0
slug: for-passengers-landing-page
title: Create 'For Passengers' Landing Page
status: Done
author: Sarah (po)
date: '2024-06-09T10:00:00Z'

description: >
  As a potential passenger, I want to see a dedicated landing page that
  highlights the benefits and features of using the CABI ride-hailing service,
  so that I can quickly understand its value and decide to download the app.

acceptance_criteria:
  - A new page is created in the `user-portal` app at the `/passengers` route.
  - The page must feature a prominent hero section with a clear headline (e.g., "Your Ride, Your Way. Safe and Reliable.").
  - It must include a primary Call-to-Action (CTA) button, like "Download the App", that links to a new passenger app download page (`/download/passenger`).
  - The page should contain sections detailing key benefits for passengers, such as safety features, ride reliability, and easy booking through the app.
  - The content should be engaging and use brand-consistent imagery.
  - The page must be fully responsive, providing a great experience on both mobile and desktop browsers.

files_to_be_created:
  - docs/stories/story-2.3-for-passengers-landing-page.yml
  - Cabi Alpha/web/user_portal/src/pages/passengers.tsx
  - Cabi Alpha/web/user_portal/src/pages/download/passenger.tsx

dev_notes: >
  This page serves as the primary marketing funnel for passenger acquisition. It should be visually appealing and clearly communicate our value proposition to new users, encouraging them to download the passenger app.

tasks:
  - id: task-1
    description: Implement the 'For Passengers' landing page and associated download page.
    subtasks:
      - "[x] Create the new page file at `Cabi Alpha/web/user_portal/src/pages/passengers.tsx`."
      - "[x] Implement the hero section with a headline and a 'Download the App' CTA button."
      - "[x] Create sections to detail key benefits for passengers (e.g., safety, reliability, easy booking)."
      - "[x] Add brand-consistent imagery."
      - "[x] Create the new download page at `Cabi Alpha/web/user_portal/src/pages/download/passenger.tsx` with app store links."
      - "[x] Link the CTA on the `/passengers` page to the new `/download/passenger` page."
      - "[x] Ensure both pages are fully responsive."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
    - >-
      All tasks for this story are complete. The 'For Passengers' landing page
      has been implemented with a hero section, detailed benefits, and imagery.
      A corresponding download page has also been created for the CTA. The
      feature is now ready for QA review.
  file_list:
    - Cabi Alpha/web/user_portal/src/pages/passengers.tsx
    - Cabi Alpha/web/user_portal/src/pages/download/passenger.tsx
  change_log:
