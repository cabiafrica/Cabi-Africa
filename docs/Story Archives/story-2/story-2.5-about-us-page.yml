description: >
  As a site visitor, I want to learn about the company's mission, vision,
  and team, so that I can build trust and understand the brand better.

acceptance_criteria:
  - A new page is created in the `user-portal` app at the `/about` route.
  - The page must include a section detailing the company's mission and vision.
  - It should feature a brief history or story of how CABI started.
  - The page must be responsive and consistent with the site's overall design.
  - The new "About Us" page should be added to the main navigation header.

files_to_be_created:
