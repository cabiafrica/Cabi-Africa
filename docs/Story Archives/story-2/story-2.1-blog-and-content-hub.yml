id: story-2.1
epic: epic-2.0
slug: blog-and-content-hub
title: Implement Blog and Content Hub on Marketing Website
status: Done
author: Sarah (po)
date: '2024-06-05T10:15:00Z'

description: >
  As a marketing manager, I want a blog and content hub on the `user-portal`
  website, so that I can publish articles, share company news like the
  "CABI Launches in Nairobi!" announcement, and engage with our community.

acceptance_criteria:
  - A new `/blog` page is created in the `user-portal` Next.js app.
  - The `/blog` page fetches and displays a list of blog post summaries.
  - Each post summary in the list includes a title, summary text, an image, and the publication date.
  - Clicking on a post summary navigates the user to a dynamic route for that specific post (e.g., `/blog/post-1`).
  - The individual post page (e.g., `/blog/[postId]`) displays the full content, including title, author, date, and the main content body.
  - A new API route is created in the Next.js app at `Cabi Alpha/web/user_portal/src/pages/api/content/[...slug].ts`.
  - This API route will serve the blog data. For this story, it should adapt the logic from the mock `ContentService` in the `passenger-app` to provide the necessary data for the list and detail pages.
  - The UI for both the list and detail pages is responsive and aligns with the overall design of the marketing website.
  - Basic components for displaying posts, like a `PostSummaryCard`, are created and used.

files_to_be_created:
  - docs/stories/story-2.1-blog-and-content-hub.yml
  - Cabi Alpha/web/user_portal/src/pages/blog/index.tsx
  - Cabi Alpha/web/user_portal/src/pages/blog/[postId].tsx
  - Cabi Alpha/web/user_portal/src/pages/api/content/[...slug].ts
  - Cabi Alpha/web/user_portal/src/components/blog/PostSummaryCard.tsx

dev_notes: >
  The primary goal is to build the frontend structure and UI for the blog. We can leverage the existing mock `ContentService` from the passenger app as a template for our new API route's logic. This decouples frontend work from the future creation of a dedicated backend content service.

tasks:
  - id: task-1
    description: Implement the backend API route for blog content.
    subtasks:
      - "[x] Create the Next.js API route file at `Cabi Alpha/web/user_portal/src/pages/api/content/[...slug].ts`."
      - "[x] Define the data structures/types for blog posts (e.g., `BlogPost`, `BlogPostSummary`)."
      - "[x] Adapt the logic from the mock `ContentService` to serve a list of all blog posts."
      - "[x] Extend the API route to handle requests for a single post by its ID (e.g., `/api/content/posts/post-1`)."
  - id: task-2
    description: Create the frontend pages and components for the blog.
    subtasks:
      - "[x] Create the `PostSummaryCard.tsx` component to display a post's title, summary, image, and date."
      - "[x] Create the main blog page at `Cabi Alpha/web/user_portal/src/pages/blog/index.tsx`."
      - "[x] Implement the logic on the main blog page to fetch the list of posts from the API and render them using the `PostSummaryCard`."
      - "[x] Create the dynamic post detail page at `Cabi Alpha/web/user_portal/src/pages/blog/[postId].tsx`."
      - "[x] Implement the logic to fetch and display the full content of a single post."
      - "[x] Ensure both pages are responsive and match the website's design language."

