id: story-63.1
epic: map-and-navigation
slug: report-map-error
title: Implement "Report Map Error" Feature
status: DONE
author: Bob (sm)
date: '2024-08-06T09:04:00Z'

description: >
  As a driver, if I notice an error in the map data (e.g., a wrong turn, a
  new road), I want a simple way to report it, so that the platform's mapping
  can be improved.

acceptance_criteria:
  - In the `driver-app`, a "Report Map Error" button should be accessible from the map screen.
  - Tapping it allows the driver to drop a pin on the location of the error and select a category (e.g., "Wrong turn", "Road closed", "Incorrect speed limit").
  - The report is sent to the backend and stored for review.
  - This data can be used to provide feedback to our mapping provider or to create our own map overlays.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/screens/home_screen.dart # To add the reporting UI
  - libs/backend/ride-service/src/lib/ride.service.ts # Or a new map-service to store the reports

dev_notes: >
  This is the first story for a new `map-and-navigation` epic. It creates a valuable feedback loop, leveraging our drivers' local knowledge to improve a core component of our system.
