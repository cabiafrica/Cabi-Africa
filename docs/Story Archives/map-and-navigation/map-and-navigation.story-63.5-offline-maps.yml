id: story-63.5
epic: map-and-navigation
slug: offline-maps
title: Implement Offline Maps for Driver App
status: DONE
author: Bob (sm)
date: '2024-08-07T09:14:00Z'

description: >
  As a driver who works in areas with poor connectivity, I want to be able
  to download maps for my city, so that the app continues to function even if
  I lose my data connection.

acceptance_criteria:
  - The `driver-app` must have a "Downloads" section in settings.
  - The driver can select their city and download the map data for offline use.
  - The in-app navigation (`story-63.3`) must be able to function using these offline maps.
  - This requires a navigation SDK that supports offline maps.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # To add download management UI

dev_notes: >
  A critical feature for reliability in markets with inconsistent mobile data. The feasibility and implementation depend heavily on the chosen mapping and navigation provider.
