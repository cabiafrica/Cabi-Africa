id: story-63.3
epic: map-and-navigation
slug: in-app-turn-by-turn
title: Implement Turn-by-Turn Navigation in Driver App
status: DONE
author: Bob (sm)
date: '2024-08-07T09:00:00Z'

description: >
  As a driver, I want fully integrated, turn-by-turn navigation within the
  app, so that I don't have to switch to a third-party app like Waze or
  Google Maps.

acceptance_criteria:
  - The `driver-app` must integrate a navigation SDK (e.g., Mapbox Navigation SDK).
  - When a driver accepts a trip and taps "Navigate", the in-app turn-by-turn navigation experience begins.
  - The UI must display the map, the route, upcoming maneuver instructions, and voice-guided directions.
  - The navigation must automatically re-route if the driver deviates from the suggested path.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/widgets/trip_in_progress_panel.dart # To launch and display the navigation UI

dev_notes: >
  A major feature that significantly improves the driver experience by keeping them in our app. This is a large undertaking that relies heavily on the features and quality of the chosen navigation SDK.
