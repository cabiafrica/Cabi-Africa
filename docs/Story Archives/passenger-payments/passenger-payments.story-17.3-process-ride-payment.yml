id: story-17.3
epic: passenger-payments
slug: process-ride-payment
title: Process Final Ride Payment Using Saved Card
status: DONE
author: Bob (sm)
date: '2024-08-10T19:45:00Z'

description: >
  As a passenger, at the end of a ride, I want the system to automatically
  charge my default payment method for the final fare, so that I can have a
  seamless and cashless experience.

acceptance_criteria:
  - When a ride's status is updated to 'completed', the `ride-service` must calculate the final fare (including base fare, distance, time, tips, and any fees).
  - The `ride-service` must then trigger the `payment-service` to process the payment for the final amount.
  - The `payment-service` must retrieve the passenger's default payment method from the payment gateway (using the stored customer ID from `story-17.2`).
  - The `payment-service` must initiate a charge against that payment method for the final fare.
  - If the payment is successful, the ride's status must be updated to 'completed_and_paid'.
  - The `notification-service` must send a notification to the passenger confirming the successful payment and showing the amount charged.
  - If the payment fails, the ride status should be marked as 'payment_failed', and the passenger must be notified to update their payment information.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To trigger the payment process upon ride completion
  - libs/backend/payment-service/src/lib/payment.service.ts # To add logic for creating a charge against a saved payment method
  - libs/backend/notification-service/src/lib/notification.service.ts # To add payment success/failure notifications

dev_notes: >
  This story is the core of the monetization flow. It connects the `ride-service` with the `payment-service` to actually charge the user. Robust error handling for payment failures is critical. This story assumes a default payment method is used; a future story could allow the user to select which card to use if they have multiple saved.

tasks:
  - id: task-1
    description: Implement payment processing logic in the payment-service.
    subtasks:
      - "[x] Create `libs/backend/payment-service/src/lib/payment.service.ts` and `payment.controller.ts`."
      - "[x] Add a `createCharge` method to the service that simulates charging a user's default card."
  - id: task-2
    description: Implement ride completion and payment trigger in the ride-service.
    subtasks:
      - "[x] Create `libs/backend/ride-service/src/lib/ride.service.ts` and `ride.controller.ts`."
      - "[x] Add a `completeRide` method that calculates the final fare (mocked for now)."
      - "[x] The `completeRide` method must call the `payment-service`'s `createCharge` method."
      - "[x] Based on payment success/failure, update the ride status to 'completed_and_paid' or 'payment_failed'."
      - "[x] Integrate with `notification-service` to send payment success or failure notifications to the passenger."

