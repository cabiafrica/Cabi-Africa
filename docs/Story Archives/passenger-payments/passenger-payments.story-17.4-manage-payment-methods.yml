id: story-17.4
epic: passenger-payments
slug: manage-payment-methods
title: Allow Passenger to Manage Saved Payment Methods
status: DONE
author: Bob (sm)
date: '2024-08-10T22:00:00Z'

description: >
  As a passenger, I want to be able to view, set a default, and delete my
  saved payment methods, so that I have full control over my payment options.

acceptance_criteria:
  - The `PaymentMethodsScreen` must list all cards fetched from the `payment-service` as defined in `story-17.2`.
  - Each card in the list must have a "Delete" option.
  - Tapping "Delete" must show a confirmation dialog.
  - Confirming deletion must call a new endpoint in the `payment-service` to remove the payment method.
  - Each card in the list that is not the default must have a "Set as Default" option.
  - The UI must clearly indicate which card is currently the default.
  - Tapping "Set as Default" must call a new endpoint in the `payment-service` to update the user's default payment method.

files_to_be_modified:
  - apps/passenger-app/src/screens/payment_methods_screen.dart # To add delete and set-default UI/logic
  - libs/backend/payment-service/src/lib/payment.service.ts # To add logic for deleting and setting a default payment method
  - libs/backend/payment-service/src/lib/payment.controller.ts # To expose endpoints for these new actions

dev_notes: >
  This story builds on the foundation of `story-17.1` and `story-17.2`. It provides essential account management functionality for passengers. The backend actions should securely interact with the payment gateway to remove payment methods and update customer defaults.

tasks:
  - id: task-1
    description: Implement the backend logic for managing payment methods.
    subtasks:
      - "[x] Add a `deletePaymentMethod` method to `payment.service.ts`."
      - "[x] Add a `setDefaultPaymentMethod` method to `payment.service.ts`."
      - "[x] Expose these methods via new endpoints in `payment.controller.ts`."
  - id: task-2
    description: Implement the frontend UI for managing payment methods.
    subtasks:
      - "[x] Create `apps/passenger-app/src/screens/payment_methods_screen.dart`."
      - "[x] The screen should fetch and display a list of saved cards."
      - "[x] Each card item must have a menu with 'Delete' and 'Set as Default' options."
      - "[x] The 'Set as Default' option should be hidden for the current default card."
      - "[x] Implement the `onClick` handlers to call the new backend endpoints and refresh the list."

