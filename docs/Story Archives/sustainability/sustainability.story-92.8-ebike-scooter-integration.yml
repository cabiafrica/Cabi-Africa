id: story-92.8
epic: sustainability
slug: ebike-scooter-integration
title: Integrate Micromobility Partners (E-bikes/Scooters)
status: DONE for Review
author: Bob (sm)
date: '2024-08-10T04:20:00Z'

description: >
  As a passenger looking for a short trip, I want to see available e-bikes and
  scooters from partner services on the map, so I can choose the best option
  for my journey.

acceptance_criteria:
  - The `passenger-app` map must integrate with micromobility partners' APIs to display the real-time location of their available bikes and scooters.
  - Tapping on a bike/scooter should show its details (e.g., battery level) and deep-link the user to the partner's app to start the rental.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add the micromobility map layer
  - libs/backend/map-service/src/lib/map.service.ts # To fetch data from partner APIs

dev_notes: >
  This expands our MaaS offering (`story-99.4`) and reinforces our sustainability mission. It requires business development deals and API integrations with each partner.

tasks:
  - id: task-1
    description: Implement backend service to fetch micromobility data.
    subtasks:
      - "[x] Create `libs/backend/map-service/src/lib/map.service.ts`."
      - "[x] Implement a method to fetch available e-bikes/scooters from a mock partner API."
      - "[x] Expose this data via a new endpoint."
  - id: task-2
    description: Display micromobility options on the passenger app map.
    subtasks:
      - "[x] Create `apps/passenger-app/src/screens/home_screen.dart`."
      - "[x] Fetch and display micromobility vehicles as markers on the map."
      - "[x] Implement a details view on marker tap with a deep-link button."

