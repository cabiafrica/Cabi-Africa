id: story-92.2
epic: sustainability
slug: carbon-offset-program
title: Implement Carbon Offset Program
status: DONE
author: Bob (sm)
date: '2024-08-09T23:25:00Z'

description: >
  As a passenger, I want the option to pay a small extra amount on each ride
  to offset its carbon footprint, so I can feel better about my environmental impact.

acceptance_criteria:
  - In the app settings or on the ride confirmation screen, a user can opt-in to the "Carbon Offset" program.
  - If opted-in, a small, calculated fee is added to each ride fare.
  - The `fare-service` calculates the fee based on the estimated trip distance and emissions.
  - The collected funds are periodically donated to a certified carbon offset partner.
  - The user's profile and receipts should show the total amount they've contributed to carbon offsetting.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/fare.service.ts # To calculate and add the offset fee
  - apps/passenger-app/src/screens/settings_screen.dart # To add the opt-in toggle

dev_notes: >
  This feature allows users to actively participate in the company's sustainability mission. It requires a partnership with a reputable carbon offset organization.
