id: story-92.5
epic: sustainability
slug: public-sustainability-dashboard
title: Create Public-Facing Sustainability Dashboard
status: DONE
author: Bob (sm)
date: '2024-08-10T01:50:00Z'

description: >
  As a company, we want a public webpage that showcases our platform's
  collective positive environmental impact, to reinforce our brand's
  commitment to sustainability.

acceptance_criteria:
  - A new page must be created on our marketing website.
  - This page must display platform-wide, near-real-time statistics, such as: total CO2 emissions offset, total miles driven in EVs, and total shared rides taken.
  - The `analytics-service` must provide a public-facing API endpoint with this aggregated, anonymized data.

files_to_be_created:
  - apps/marketing-web/src/app/sustainability/page.tsx

dev_notes: >
  This is a powerful branding and corporate social responsibility (CSR) tool. The data must be aggregated and updated regularly (e.g., daily) to be impactful.
