id: story-92.1
epic: sustainability
slug: green-ride-option
title: Introduce "Green" Ride Option (EV/Hybrid)
status: DONE
author: Bob (sm)
date: '2024-08-09T23:20:00Z'

description: >
  As an environmentally conscious passenger, I want to be able to specifically
  request an electric or hybrid vehicle, so I can reduce my carbon footprint.

acceptance_criteria:
  - A new "Green" ride option must be available in the vehicle selector.
  - Drivers must be able to mark their vehicle as "Electric" or "Hybrid" during vehicle registration (`story-12.6`).
  - When a passenger requests a "Green" ride, the `ride-service` must only match them with drivers in an electric or hybrid vehicle.
  - The fare for a Green ride may be the same as or slightly different from a standard ride.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart # To add the Green option
  - libs/backend/ride-service/src/lib/ride.service.ts # To add matching logic
  - Cabi Alpha/mobile/driver_app/lib/screens/vehicle_details_screen.dart # To add EV/Hybrid designation

dev_notes: >
  This is the foundational story for the `sustainability` epic. It appeals to a growing segment of environmentally aware users and can be a positive brand differentiator.
