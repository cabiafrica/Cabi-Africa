id: story-92.3
epic: sustainability
slug: eco-routing
title: Provide Eco-Friendly Routing for Drivers
status: DONE
author: Bob (sm)
date: '2024-08-10T00:15:00Z'

description: >
  As a driver, I want the option to choose more fuel-efficient routes, even if
  they are slightly longer, so I can save money on gas and reduce my environmental impact.

acceptance_criteria:
  - In the `driver-app` settings, a driver can enable "Eco-Friendly Routing".
  - When enabled, the in-app navigation (`story-96.3`) should request and prioritize routes that are optimized for fuel efficiency from the mapping provider.
  - The app should display the potential fuel savings or emissions reduction for the selected eco-route compared to the fastest route.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # To add the eco-routing toggle
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_in_progress_screen.dart # To request and display eco-routes

dev_notes: >
  This aligns with our sustainability goals and provides a direct financial benefit to drivers. This feature is dependent on the mapping provider's API supporting fuel-efficient routing options.
