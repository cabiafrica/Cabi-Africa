id: story-92.7
epic: sustainability
slug: driver-ev-charging-map
title: Display EV Charging Stations on Driver Map
status: DONE
author: Bob (sm)
date: '2024-08-10T03:30:00Z'

description: >
  As a driver of an electric vehicle, I want to see nearby charging stations
  on my in-app map, so I can easily find a place to charge between trips.

acceptance_criteria:
  - The `driver-app` map must have a layer that can be toggled to show the locations of EV charging stations.
  - The data for charging stations will come from a third-party provider.
  - Tapping on a station should show details like the network, connector types, and availability if possible.

files_to_be_modified:
  - apps/driver-app/src/screens/home_screen.dart # To add the map layer and UI
  - libs/backend/map-service/src/lib/map.service.ts # To integrate with a charging station data provider

dev_notes: >
  This feature reduces "range anxiety" for EV drivers, making it more attractive for them to drive on our platform.
