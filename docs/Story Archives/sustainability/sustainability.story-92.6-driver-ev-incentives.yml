id: story-92.6
epic: sustainability
slug: driver-ev-incentives
title: Implement Incentives for Drivers with EVs
status: DONE
author: Bob (sm)
date: '2024-08-10T02:40:00Z'

description: >
  As an operations manager, I want to offer special incentives to drivers who
  use Electric Vehicles (EVs), to encourage the adoption of greener vehicles
  on our platform.

acceptance_criteria:
  - The `incentive-service` must be able to create bonuses or quests that are only available to drivers whose active vehicle is marked as "Electric".
  - This could include a per-trip bonus, lower commission rates, or access to exclusive promotions.
  - The `admin-panel` must be updated to allow the creation of these EV-specific incentives.

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To add EV-specific rule logic
  - apps/admin-panel/src/app/promotions/page.tsx # To add targeting for EVs

dev_notes: >
  This is a direct way to increase the number of "Green" rides (`story-92.1`) available on the platform and demonstrates a tangible commitment to sustainability.
