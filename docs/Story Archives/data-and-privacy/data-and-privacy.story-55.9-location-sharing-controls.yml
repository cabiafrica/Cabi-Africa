id: story-55.9
epic: data-and-privacy
slug: location-sharing-controls
title: Implement Granular Location Sharing Controls
status: Done
author: Bob (sm)
date: '2024-08-09T22:40:00Z'

description: >
  As a user, I want to understand and control how my location data is shared
  with the driver, so I can protect my privacy.

acceptance_criteria:
  - The "Privacy Center" (`story-55.5`) must include a section explaining location data usage.
  - It should clarify that the user's precise location is only shared with an assigned driver after a ride is accepted and until the trip ends.
  - It should provide a link to the phone's OS-level location settings for the app.
  - The app should not ask for "Always Allow" location permissions unless it's required for a specific feature (like background safety monitoring), and the reason must be clearly explained.

files_to_be_modified:
  - apps/passenger-app/src/screens/privacy_center_screen.dart # To add the location explanation

dev_notes: >
  This story is about transparency and trust. While most location control is at the OS level, we must be explicit in-app about how and when we use this sensitive data.
