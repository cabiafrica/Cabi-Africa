id: story-55.4
epic: data-and-privacy
slug: privacy-policy-versioning
title: Implement Privacy Policy Versioning and Acknowledgement
status: Done
author: Bob (sm)
date: '2024-08-07T09:08:00Z'

description: >
  As a legal/compliance manager, when we update our privacy policy, I want
  to require all users to accept the new version before they can continue
  using the service.

acceptance_criteria:
  - This is the user-facing part of `story-61.2` (Must-Read Alerts), but for all users.
  - The `admin-panel` must allow uploading new versions of the Privacy Policy.
  - When a new version is activated, all users must be presented with it upon next app open.
  - Users cannot proceed until they scroll and tap "Accept".
  - The `user-service` must log which version of the policy each user has accepted.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To track policy acceptance

dev_notes: >
  A critical legal and compliance feature. It ensures our user agreements are always up to date.
