id: story-55.2
epic: data-and-privacy
slug: granular-privacy-controls
title: Implement Granular Privacy Controls
status: Done
author: Bob (sm)
date: '2024-08-05T09:08:00Z'

description: >
  As a user, I want a centralized privacy dashboard where I can control how
  my data is used, such as for marketing personalization or analytics.

acceptance_criteria:
  - The "Privacy" settings screen must list different data usage categories (e.g., "Personalized Ads", "Analytics & Research").
  - The user must be able to opt-in or opt-out of each category individually.
  - The user's choices must be stored in the `user-service`.
  - All other services (`analytics-service`, `promotion-service`, etc.) must check for user consent before processing their data for a specific purpose.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/settings_screen.dart # To add the privacy dashboard
  - libs/backend/user-service/src/lib/user.service.ts # To store consent flags

dev_notes: >
  This feature gives users more control and helps build trust, while also being a legal requirement in many jurisdictions. It requires a robust consent management framework across the backend.