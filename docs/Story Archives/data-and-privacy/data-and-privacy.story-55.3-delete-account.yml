id: story-55.3
epic: user-account-management
slug: delete-account
title: Implement "Delete My Account" Self-Service
status: DONE
author: Bob (sm)
date: '2024-08-06T09:02:00Z'

description: >
  As a user, I want a clear and easy way to permanently delete my account
  and all associated personal data from within the app, in compliance with
  privacy regulations.

acceptance_criteria:
  - In the "Privacy" settings (`story-55.1`), a "Delete My Account" option must be available.
  - The user must go through a confirmation step, acknowledging that the action is irreversible.
  - Triggering the deletion starts an asynchronous backend process.
  - The process must orchestrate the deletion of user data across all relevant services (`user-service`, `payment-service`, `ride-service`, etc.).
  - For legal and financial auditing, some data may be anonymized rather than hard-deleted.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To orchestrate the cross-service deletion process

dev_notes: >
  A critical privacy feature and legal requirement. The orchestration of data deletion across multiple microservices is the main challenge and must be handled carefully to ensure full compliance.
