id: story-55.7
epic: user-account-management
slug: delete-my-account
title: Implement Self-Serve Account Deletion
status: Done
author: Bob (sm)
date: '2024-08-09T20:20:00Z'

description: >
  As a user, I want to be able to permanently delete my account and all
  associated data directly from the app, so I can exercise my right to be forgotten.

acceptance_criteria:
  - A "Delete Account" option must be available in the "Privacy Center".
  - Tapping it must trigger a multi-step confirmation process to prevent accidental deletion, including re-entering their password.
  - Upon final confirmation, a request is sent to the backend to begin the account deletion process.
  - The process should anonymize or delete all personally identifiable information (PII) across all services, subject to legal and financial record-keeping requirements.
  - The user is logged out, and their account is deactivated immediately, with full data deletion occurring asynchronously on the backend.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/privacy_center_screen.dart # To add the button
  - Cabi Alpha/mobile/driver_app/lib/screens/privacy_center_screen.dart # To add the button
  - libs/backend/user-service/src/lib/user.service.ts # To handle the deletion/anonymization workflow

dev_notes: >
  This is a destructive and irreversible action that requires careful implementation. We must clearly define what data can be deleted versus what must be retained for legal reasons (e.g., transaction records), in which case it should be anonymized.
