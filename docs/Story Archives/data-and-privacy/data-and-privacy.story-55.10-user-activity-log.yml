id: story-55.10
epic: data-and-privacy
slug: user-activity-log
title: Provide User-Facing Account Activity Log
status: Done
author: Bob (sm)
date: '2024-08-10T00:35:00Z'

description: >
  As a security-conscious user, I want to see a log of recent activity on my
  account, such as logins from new devices, so I can spot unauthorized access.

acceptance_criteria:
  - A new "Account Activity" section must be added to the "Privacy Center" (`story-55.5`).
  - This log should display recent security-related events, including successful logins (with device type and general location), password changes, and payment method changes.
  - The `user-service` must be enhanced to log these specific events for each user.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/privacy_center_screen.dart # To add the activity log UI
  - libs/backend/user-service/src/lib/auth.service.ts # To log security events

dev_notes: >
  This is a standard security feature that provides transparency and helps users feel in control of their account's security.
