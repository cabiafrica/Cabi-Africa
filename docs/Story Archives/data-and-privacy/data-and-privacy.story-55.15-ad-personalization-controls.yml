id: story-55.15
epic: data-and-privacy
slug: ad-personalization-controls
title: Implement Ad Personalization Controls
status: Done
author: Bob (sm)
date: '2024-08-10T04:40:00Z'

description: >
  As a user, I want to be able to opt-out of my data being used for targeted
  advertising purposes, to protect my privacy.

acceptance_criteria:
  - A new toggle must be added to the "Privacy Center" (`story-55.5`) labeled "Allow Ad Personalization".
  - If a user disables this toggle, their anonymized data must be excluded from any data exports or segments sent to third-party advertising networks.
  - The `analytics-service` must respect this flag when generating audience segments.

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To exclude users based on the flag

dev_notes: >
  This is a key privacy requirement under regulations like GDPR and CCPA. It gives users direct control over how their data is used for marketing.
