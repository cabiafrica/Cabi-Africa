id: story-55.8
epic: data-and-privacy
slug: manage-marketing-comms
title: Allow Users to Manage Marketing Communications
status: Done
author: Bob (sm)
date: '2024-08-09T20:15:00Z'

description: >
  As a user, I want to control whether I receive marketing and promotional
  communications via email and push notifications, so I can manage what
  messages I receive from the platform.

acceptance_criteria:
  - A new "Communication Preferences" section must be added to the "Privacy Center" (`story-55.5`).
  - This section must contain separate toggles for "Email Promotions" and "Push Notification Promotions".
  - The user's choices must be saved to their user profile in the `user-service`.
  - The `notification-service` must check these preferences before sending any batch promotional communications.
  - Transactional messages (e.g., receipts, trip updates) are not affected by these settings.

files_to_be_modified:
  - apps/passenger-app/src/screens/privacy_center_screen.dart # To add the toggles
  - libs/backend/user-service/src/lib/user.service.ts # To store preferences
  - libs/backend/notification-service/src/lib/notification.service.ts # To check preferences before sending
