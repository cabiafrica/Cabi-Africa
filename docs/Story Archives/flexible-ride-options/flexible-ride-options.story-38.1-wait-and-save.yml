id: story-38.1
epic: flexible-ride-options
slug: wait-and-save
title: Implement "Wait and Save" Ride Option
status: Done
author: Bob (sm)
date: '2024-07-30T10:09:00Z'

description: >
  As a price-sensitive passenger, I want an option to wait longer for a ride
  in exchange for a lower fare, so that I can save money if I'm not in a hurry.

acceptance_criteria:
  - A new ride option, "Wait & Save", must be displayed alongside standard options in the `RideBookingPanel`.
  - This option will show a lower estimated fare but a longer estimated wait time for pickup.
  - When a user selects this option, the `ride-service` must place their request in a lower-priority queue.
  - The matching algorithm will only offer this ride to drivers after a certain delay, or if it can be efficiently batched with another driver's route.
  - The core logic is to trade immediate dispatch for operational efficiency, passing the savings to the user.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_booking_panel.dart # To show the new option
  - libs/backend/ride-service/src/lib/ride.service.ts # To implement the priority queue and delayed matching

dev_notes: >
  This is the first story for a new `flexible-ride-options` epic. It's a pricing and logistics feature designed to improve platform efficiency and attract a wider range of customers. The complexity lies in the backend matching logic.