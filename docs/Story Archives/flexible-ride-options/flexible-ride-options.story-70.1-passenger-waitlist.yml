id: story-70.1
epic: flexible-ride-options
slug: passenger-waitlist
title: Implement "Passenger Waitlist" for High Demand
status: DONE
author: Bob (sm)
date: '2024-08-06T09:20:00Z'

description: >
  As a passenger, if there are no cars available, I want to join a waitlist
  and be automatically notified and matched when a car becomes free, so I
  don't have to keep re-opening the app.

acceptance_criteria:
  - If the `ride-service` cannot find a driver within a certain time, the `passenger-app` should offer to add the user to a waitlist.
  - The `ride-service` will keep the request active in a queue.
  - When a driver becomes available in the area, the system automatically matches them with the first person on the waitlist.
  - The passenger receives a notification that their ride has been found and confirmed.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To implement the waitlist queue logic
  - apps/passenger-app/src/widgets/ride_booking_panel.dart # To offer the waitlist option

dev_notes: >
  This is the first story for a new `flexible-ride-options` epic. It improves user experience during periods of very high demand, increasing the chance of eventually capturing the ride.
