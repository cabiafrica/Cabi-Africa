id: story-38.2
epic: flexible-ride-options
slug: ride-pass-subscription
title: Implement Ride Pass Subscription
status: Done
author: Bob (sm)
date: '2024-07-30T10:17:00Z'

description: >
  As a frequent passenger, I want to purchase a monthly "Ride Pass"
  subscription that gives me discounted or fixed-price rides, so that I can
  get more value from the service.

acceptance_criteria:
  - A new "Ride Pass" screen must be added to the `passenger-app` where users can subscribe.
  - The `payment-service` must handle recurring monthly billing for the subscription.
  - The `promotion-service` must define the benefits of the pass (e.g., "10% off all rides", "No surge pricing").
  - The `user-service` must track a user's subscription status.
  - The `ride-service` must check the user's subscription status when estimating a fare and apply the benefits accordingly.

files_to_be_created:
  - apps/passenger-app/src/screens/ride_pass_screen.dart

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle recurring subscriptions
  - libs/backend/user-service/src/lib/user.service.ts # To track subscription status
  - libs/backend/ride-service/src/lib/fare.service.ts # To apply subscription benefits

dev_notes: >
  This feature introduces a new revenue model (subscriptions) and is aimed at increasing loyalty among power users. It requires a robust recurring billing system in the `payment-service`.