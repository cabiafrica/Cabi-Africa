id: story-38.3
epic: flexible-ride-options
slug: shared-rides
title: Implement Shared / Pooled Rides
status: Done
author: Bob (sm)
date: '2024-07-31T11:05:00Z'

description: >
  As a price-sensitive passenger, I want to book a shared ride with other
  passengers heading in a similar direction in exchange for a significantly
  lower fare.

acceptance_criteria:
  - A new "Shared" vehicle/ride type must be available to passengers.
  - The `ride-service` must implement a complex matching algorithm that can batch multiple passengers into a single driver's trip.
  - The algorithm must dynamically create an optimal route with multiple pickups and dropoffs.
  - The driver's in-trip UI must be updated to handle a dynamic itinerary, showing the next pickup or dropoff in sequence.
  - The fare for each passenger must be calculated individually and be lower than a standard ride.
  - The driver's earnings for the trip should be the sum of all passenger fares (plus potential bonuses).

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_booking_panel.dart # To add "Shared" option
  - libs/backend/ride-service/src/lib/ride.service.ts # To implement the core pooling and re-routing logic
  - apps/driver-app/src/widgets/trip_in_progress_panel.dart # To handle dynamic multi-pickup/dropoff UI

dev_notes: >
  This is a very complex feature and a major product initiative. It requires sophisticated real-time routing and matching algorithms. It has the potential to significantly increase platform efficiency and affordability.