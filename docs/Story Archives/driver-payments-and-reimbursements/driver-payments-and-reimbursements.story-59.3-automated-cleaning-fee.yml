id: story-59.3
epic: driver-payments-and-reimbursements
slug: automated-cleaning-fee
title: Implement Automated Cleaning Fee Request
status: Done
author: Bob (sm)
date: '2024-08-05T09:19:00Z'

description: >
  As a driver, if a passenger makes a mess in my car, I want a simple,
  in-app way to report it and request a cleaning fee.

acceptance_criteria:
  - In the `TripDetailScreen`, a "Report an Issue" button must have a "Request Cleaning Fee" option.
  - The driver must take and submit at least one photo of the mess as evidence.
  - The request creates a support ticket. An agent reviews the evidence and, if valid, applies a pre-defined cleaning fee to the passenger's account.
  - The `payment-service` must process this charge to the passenger and credit it to the driver.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_detail_screen.dart # To add the cleaning fee flow
  - libs/backend/support-service/src/lib/support.service.ts # To handle the review ticket
  - libs/backend/payment-service/src/lib/payment.service.ts # To process the fee

dev_notes: >
  A critical feature for driver protection and for maintaining vehicle standards. The process requires human review to prevent fraud.
