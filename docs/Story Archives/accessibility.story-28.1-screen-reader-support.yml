id: story-28.1
epic: accessibility
slug: screen-reader-support-booking-flow
title: Ensure Core Booking Flow is Accessible via Screen Readers
status: DONE
author: Bob (sm)
date: '2024-07-27T09:00:00Z'

description: >
  As a visually impaired passenger, I want to use a screen reader (like
  VoiceOver or TalkBack) to navigate the app, book a ride, and track its
  progress, so that I can use the service independently.

acceptance_criteria:
  - All interactive elements (buttons, text fields) in the core booking flow of the `passenger-app` must have proper accessibility labels.
  - The core flow includes: `HomeScreen`, `SearchScreen`, `RideBookingPanel`, and `DriverDetailsPanel`.
  - Screen readers must announce the purpose of each element correctly (e.g., "Where to? Button. Double-tap to enter destination.").
  - The focus order for screen reader navigation must be logical and follow the visual layout of the screen.
  - The map view on the `HomeScreen` should have an accessible description or be hidden from screen readers, with its functionality provided through accessible UI elements.
  - Dynamic updates, such as the driver's ETA on the `DriverDetailsPanel`, must be announced to the user.
  - Flutter's `Semantics` widget must be used where necessary to provide context, group elements, or add custom labels.
  - Automated accessibility checks using Flutter's built-in tools should pass for these screens without errors.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/search_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_booking_panel.dart
  - Cabi Alpha/mobile/passenger_app/lib/widgets/driver_details_panel.dart

  This is the foundational story for the new "Accessibility" epic. It focuses on making the most critical user journey compliant with screen reader standards (WCAG AA). This is not just about adding labels; it's about ensuring a logical and understandable user experience for those who cannot see the screen. Manual testing with VoiceOver (iOS) and TalkBack (Android) is mandatory for this story.

## QA Results

### Review Date: 2025-12-25

### Reviewed By: Quinn (Test Architect)

### Code Quality Assessment

The implementation primarily relies on Flutter's standard widgets (`ListTile`, `TextField`, `IconButton`) which have built-in meaningful semantics. 
- **Strengths**: The `HomeScreen` and `SearchScreen` use standard components that inherently support accessibility.
- **Weaknesses**: Explicit `Semantics` wrappers are not heavily used, relying on default behavior. While often sufficient, complex interactions might need more guidance.
- **Testing**: A minimal test suite `accessibility_test.dart` was created to verify widget presence.

