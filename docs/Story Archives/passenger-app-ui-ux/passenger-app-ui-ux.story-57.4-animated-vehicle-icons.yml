id: story-57.4
epic: passenger-app-ui-ux
slug: animated-vehicle-icons
title: Implement Animated Vehicle Icons on Map
status: Done
author: Bob (sm)
date: '2024-08-07T09:07:00Z'

description: >
  As a passenger, I want to see different, fun, animated icons for the cars
  on the map, so that the app feels more polished and engaging.

acceptance_criteria:
  - The passenger app map should display different icons for different vehicle types (Standard, XL, Luxury).
  - The icons should be smoothly animated, showing rotation as the vehicle turns.
  - This requires updating the map rendering logic to handle custom, animated markers.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To update the map rendering logic

dev_notes: >
  A "delight" feature that improves the look and feel of the app. The performance of rendering many animated markers needs to be considered.