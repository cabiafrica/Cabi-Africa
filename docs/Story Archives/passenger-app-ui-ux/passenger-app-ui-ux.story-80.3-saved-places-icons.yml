id: story-80.3
epic: passenger-app-ui-ux
slug: saved-places-icons
title: Implement "Saved Places" Icons
status: Done
author: Bob (sm)
date: '2024-08-09T10:14:00Z'

description: >
  As a passenger, I want to be able to assign a unique icon to each of my
  saved places, so that I can identify them more quickly on the map and in lists.

acceptance_criteria:
  - When creating or editing a saved place (`story-27.2`), the user must be able to select an icon from a pre-defined library (e.g., house, briefcase, gym weight, fork & knife).
  - The selected icon must be displayed next to the saved place's name on the home screen and in lists.
  - The `user-service` must be updated to store the chosen icon for each saved place.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/saved_places_screen.dart # To add icon selection

dev_notes: >
  A small UI/UX improvement that adds a layer of personalization and makes the app more visually scannable for users.