id: story-57.1
epic: passenger-app-ui-ux
slug: passenger-widget
title: Implement Passenger App Home Screen Widget
status: DONE
author: Bob (sm)
date: '2024-08-05T09:04:00Z'

description: >
  As a frequent passenger, I want a home screen widget that shows me the
  estimated price and wait time for a ride to my "Home" or "Work" saved
  places, so I can check conditions without opening the app.

acceptance_criteria:
  - A new home screen widget must be developed for both iOS and Android.
  - The widget must allow the user to configure it for a specific saved place.
  - The widget will periodically fetch live ETA and pricing data from the `ride-service`.
  - Tapping the widget should open the app with the ride details pre-filled.

files_to_be_created:
  - The necessary native code files for iOS and Android widgets.

files_to_be_modified:
  - The Flutter project configuration to support widgets.

dev_notes: >
  This is the first story for a new `passenger-app-ui-ux` epic. It increases engagement by bringing key information outside of the app. It requires native development work for each platform.
