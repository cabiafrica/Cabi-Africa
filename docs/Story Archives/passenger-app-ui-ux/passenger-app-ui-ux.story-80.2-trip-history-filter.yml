id: story-80.2
epic: passenger-app-ui-ux
slug: trip-history-filter
title: Implement Trip History Search and Filter
status: Done
author: Bob (sm)
date: '2024-08-09T10:04:00Z'

description: >
  As a passenger, I want to be able to search and filter my trip history, so
  that I can easily find a specific past trip (e.g., to report a lost item
  or re-book a route).

acceptance_criteria:
  - The `TripHistoryScreen` in the `passenger-app` must have a search bar.
  - The user can search by destination address, driver name, or date.
  - Filter options must be available to show only "Business" trips or trips within a certain date range.
  - The `ride-service` must expose a more advanced endpoint for fetching trip history that supports these search and filter parameters.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/trip_history_screen.dart # To add search/filter UI
  - libs/backend/ride-service/src/lib/ride.controller.ts # To add the advanced query endpoint

dev_notes: >
  A quality-of-life improvement for users with a long trip history, making the app more useful for personal record-keeping.