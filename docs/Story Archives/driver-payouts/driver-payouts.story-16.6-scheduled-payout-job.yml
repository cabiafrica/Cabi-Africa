id: story-16.6
epic: driver-payouts
slug: scheduled-payout-job
title: Implement Scheduled Job for Weekly Payouts
status: Done
author: Bob (sm)
date: '2024-06-05T10:00:00Z'

description: >
  As a system administrator, I want a scheduled job that automatically
  triggers the payout process every week, so that driver payments are
  disbursed consistently and reliably without requiring manual intervention.

acceptance_criteria:
  - A new scheduled job must be created within our infrastructure.
  - The job must be configured to run on a fixed weekly schedule (e.g., every Friday at 17:00 UTC).
  - The job's task is to make a secure, internal HTTP POST request to the `/payouts/process` endpoint in the `payment-service`.
  - The request from the job to the `payment-service` must be authenticated using a secure, non-user-based method (e.g., a shared secret, API key, or IAM role).
  - The execution of the job itself must be logged, recording whether it successfully triggered the payout endpoint.
  - If the job fails to trigger the endpoint (e.g., due to a network error or the `payment-service` being unavailable), a high-priority alert must be sent to an operations/devops channel for immediate investigation.

files_to_be_created:
  - libs/infrastructure/aws/src/lib/payout-scheduler.stack.ts # Or equivalent for the chosen infrastructure-as-code tool

files_to_be_modified:
  - libs/infrastructure/aws/src/main.ts # To include the new scheduler stack in the deployment
  - libs/backend/payment-service/src/lib/payout.controller.ts # To ensure it can handle authentication from the scheduled job

dev_notes: >
  This story automates the trigger for the payout process defined in `story-16.4`. The implementation is primarily an infrastructure task. For an AWS environment, this would likely be an Amazon EventBridge (CloudWatch Events) rule that triggers a small AWS Lambda function. The Lambda's role is simply to call the `payment-service` API. The secret used for the job to authenticate with the service must be managed securely, for example, via AWS Secrets Manager. This decouples the scheduling from the application logic.
