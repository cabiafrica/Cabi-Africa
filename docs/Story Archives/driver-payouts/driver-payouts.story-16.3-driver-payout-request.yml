id: story-16.3
epic: driver-payouts
slug: driver-payout-request
title: Implement Driver Payout Request and Processing
status: Done
author: Bob (sm)
date: '2024-07-20T09:02:00Z'

description: >
  As a driver, I want to initiate a payout of my current earnings balance to
  my linked bank account, so that I can access my money.

acceptance_criteria:
  - The "Cash Out" button on the `WalletScreen` (`story-16.1`) must now trigger a real payout request.
  - Tapping "Cash Out" must present a confirmation dialog showing the amount to be paid out and the target bank account.
  - Upon confirmation, the `driver-app` must call a new endpoint in the `payment-service` (e.g., POST `/payouts/request`).
  - The `payment-service` must validate the request (e.g., minimum payout amount, valid payout method).
  - If valid, the `payment-service` must mark all 'unpaid' transactions for the driver as 'pending payout'.
  - The `payment-service` must then initiate a transfer via the integrated payment gateway (e.g., Stripe Connect, local bank transfer API) to the driver's registered payout method.
  - Upon successful initiation of the transfer, the driver's "Current Balance" should be reset to zero.
  - The `payment-service` must record a new 'payout' transaction.
  - The `driver-app` should display a success message and update the wallet balance.

files_to_be_created: []

files_to_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To implement the "Cash Out" button logic
  - libs/backend/payment-service/src/lib/payment.controller.ts # To add the /payouts/request endpoint
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement payout initiation logic and update transaction statuses

dev_notes: >
  This story is the core functionality of the `driver-payouts` epic. It moves from displaying a balance (`story-16.2`) to actually transferring funds. Integration with a payment gateway's payout API is critical. Error handling for failed transfers and robust transaction status management are essential.
