id: story-16.7
epic: driver-payouts
slug: admin-manage-payout-methods
title: Admin Management of Driver Payout Methods
status: Done
author: Bob (sm)
date: '2024-07-22T10:03:00Z'

description: >
  As an administrator, I want to view and manage a driver's payout methods
  (e.g., bank account details), so that I can assist drivers with setup issues
  and ensure they can receive their earnings.

acceptance_criteria:
  - A "Payout Methods" tab or section must be added to the driver detail page in the `admin-panel`.
  - This section must display the driver's currently configured payout methods.
  - The admin must have the ability to add a new payout method (e.g., bank account) on behalf of the driver.
  - The admin must be able to edit or delete an existing payout method.
  - The `payment-service` must expose secure, admin-only endpoints for creating, viewing, and updating a driver's payout methods.
  - All changes must be securely communicated to the payment gateway (e.g., Stripe Connect).

files_to_be_created: []

files_to_be_modified:
  - apps/admin-panel/src/app/drivers/[driverId]/page.tsx # To add the payout management UI
  - libs/backend/payment-service/src/lib/payment.controller.ts # To add admin endpoints for payout methods
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement admin logic for managing payout methods

dev_notes: >
  This story provides a crucial support function. Drivers may have trouble entering their bank details correctly, and this gives admins a way to resolve those issues directly. Security is paramount; all actions must be authenticated and authorized for admin users only.
