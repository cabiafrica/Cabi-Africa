id: story-16.4
epic: driver-payouts
slug: payout-history
title: Implement Driver Payout History View
status: DONE
author: Bob (sm)
date: '2024-08-10T19:00:00Z'

description: >
  As a driver, I want to view a detailed history of all my past payouts, so
  that I can track my earnings and manage my finances.

acceptance_criteria:
  - The `WalletScreen` in the `driver-app` must be updated to display a list of historical payout transactions, replacing the mock data from `story-16.1`.
  - The `payment-service` must expose a new endpoint (e.g., `GET /payouts/history`) to fetch a paginated list of the driver's past payout records.
  - Each item in the history list must display the payout date, the amount, and the status (e.g., "Completed", "Failed").
  - Tapping on a historical payout should navigate to a detail screen showing more information, such as the transaction ID and the bank account it was sent to.
  - The `driver-app` should handle pagination, loading more history as the user scrolls.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/payout_history_detail_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/wallet_screen.dart # To fetch and display real payout history
  - libs/backend/payment-service/src/lib/payment.service.ts # To add logic for fetching payout history
  - libs/backend/payment-service/src/lib/payment.controller.ts # To expose the new history endpoint

dev_notes: >
  This story builds on the initial wallet UI (`story-16.1`) by replacing the mocked transaction list with real data. The backend endpoint should support pagination to handle drivers with a long history of payouts efficiently. This feature is crucial for driver trust and financial transparency.
