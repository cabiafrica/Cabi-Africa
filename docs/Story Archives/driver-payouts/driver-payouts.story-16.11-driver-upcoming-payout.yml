id: story-16.11
epic: driver-payouts
slug: driver-upcoming-payout
title: Display Upcoming Payout Amount and Date
status: Done
author: Bob (sm)
date: '2024-07-18T09:00:00Z'

description: >
  As a driver, I want to see my next estimated payout amount and the date I
  can expect it to be processed, so that I can better plan my personal finances.

acceptance_criteria:
  - A new "Next Payout" section must be added to the `WalletScreen` in the `driver-app`.
  - This section must display the "Estimated Amount" and the "Expected Payout Date".
  - The "Estimated Amount" must reflect the driver's current balance of all unpaid earnings (fares, tips, commissions).
  - The "Expected Payout Date" must be calculated based on the configured weekly payout schedule (e.g., "next Friday").
  - A new endpoint must be created in the `payment-service` to provide these details for the currently logged-in driver.
  - The `payment-service` must have access to the payout schedule configuration to calculate the next payout date.
  - The service will calculate the estimated amount by summing all transactions for the driver that have an 'unpaid' status.

files_to_be_created:
  - apps/driver-app/src/widgets/next_payout_widget.dart

files_to_be_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To integrate the new widget
  - libs/backend/payment-service/src/lib/payment.controller.ts # To add a new endpoint for upcoming payout details
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement the calculation logic

dev_notes: >
  This story provides drivers with important forward-looking financial information, which can help with retention and satisfaction. The logic for calculating the next payout date should be robust and based on the same schedule used by the automated payout job (`story-16.6`). The "Estimated Amount" is a live-updating figure representing the driver's current unpaid balance. This feature enhances the financial clarity provided by the Wallet screen.

tasks:
  - id: task-1
    description: Implement backend logic for upcoming payout details.
    subtasks:
      - "[x] Add a `getUpcomingPayout` method to `libs/backend/payment-service/src/lib/payment.service.ts`."
      - "[x] The method should calculate the estimated amount from unpaid transactions and the next payout date."
      - "[x] Expose this method via a new `GET /payment/upcoming-payout` endpoint in `libs/backend/payment-service/src/lib/payment.controller.ts`."
  - id: task-2
    description: Implement the frontend widget in the driver app.
    subtasks:
      - "[x] Create `apps/driver-app/src/widgets/next_payout_widget.dart`."
      - "[x] The widget should fetch data from the new endpoint and display it in a card."
      - "[x] Create `apps/driver-app/src/screens/wallet_screen.dart` and integrate the new widget."
