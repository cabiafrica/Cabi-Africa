id: story-16.7
epic: driver-payouts
slug: payout-success-notification
title: Send In-App Notification to Driver on Successful Payout
status: Done
author: Bob (sm)
date: '2024-06-06T14:00:00Z'

description: >
  As a driver, I want to receive an in-app notification when a payout has been
  successfully sent to my account, so that I have immediate confirmation that
  my earnings are on their way.

acceptance_criteria:
  - When the `payment-service` confirms a successful payout transfer from the payment provider (as per `story-16.4`), it must publish a `PayoutSuccessful` event.
  - The event must contain the driver's user ID and the total amount paid.
  - A `notification-service` must subscribe to and listen for the `PayoutSuccessful` event.
  - Upon receiving the event, the `notification-service` must construct a notification message (e.g., "Your payout of KES 1,234.56 has been sent.").
  - The `notification-service` must then send a push notification to the specific driver's registered device(s).
  - The `driver-app` must be able to receive and display this push notification to the user, even if the app is in the background.

files_to_be_created:
  - libs/backend/notification-service/src/lib/listeners/payout.listener.ts # To handle the payout event

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payout.service.ts # To publish the 'PayoutSuccessful' event after a successful transfer
  - libs/backend/notification-service/src/lib/notification.service.ts # To include logic for sending payout notifications
  - Cabi Alpha/mobile/driver_app/lib/main.ts # Or equivalent entry point to configure push notification handling

dev_notes: >
  This story closes the loop on the payout process for the driver. It relies on an event-driven architecture where the `payment-service` and `notification-service` communicate asynchronously. The `notification-service` will need a way to look up a driver's push notification token (e.g., from the `user-service`) based on the user ID in the event. The implementation in the `driver-app` will involve integrating a push notification client like Firebase Cloud Messaging (FCM).
