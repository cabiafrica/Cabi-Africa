id: story-16.3
epic: driver-payouts
slug: mlm-commission-payouts
title: Calculate and Process MLM Commission Payouts
status: Done
author: Bob (sm)
date: '2024-06-02T19:00:00Z'

description: >
  As a system administrator, I want the `payment-service` to automatically
  calculate and process commission payouts for referrers based on the MLM
  structure, so that we can reward drivers for growing the network and ensure
  timely payments.

acceptance_criteria:
  - When a ride is successfully completed and paid for, an event must be published (e.g., by the `ride-service`) containing the ride ID, final fare, and driver ID.
  - The `payment-service` must listen for this `RideCompleted` event.
  - Upon receiving the event, the `payment-service` must query the `user-service` to determine if the driver who completed the ride has a referrer.
  - If a referrer exists, the `payment-service` will calculate a commission based on a configurable percentage of the ride fare (e.g., 1% for the direct referrer).
  - The calculated commission amount must be recorded and associated with the referrer's user account.
  - The original driver's earnings (fare minus platform fees and commission) must be calculated and recorded.
  - A new `transactions` table or collection should be created to log all earnings and commission payouts, linking them to the specific ride, driver, and referrer.
  - The `payment-service` must expose an internal endpoint that can be used to trigger a weekly/monthly payout process (the payout process itself will be defined in a future story).

files_to_be_created:
  - libs/backend/payment-service/src/lib/commission.service.ts
  - libs/backend/payment-service/src/lib/commission.controller.ts # For internal endpoints

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.module.ts # To import and provide the new commission service
  - libs/backend/payment-service/src/lib/payment.service.ts # To listen for events and orchestrate the process
  - libs/backend/ride-service/src/lib/ride.service.ts # To publish the 'RideCompleted' event
  - libs/backend/user-service/src/lib/user.service.ts # To add a method for finding a user's referrer

dev_notes: >
  This story introduces the financial logic for our MLM system. It focuses on the *calculation and recording* of commissions, not the actual disbursement of funds to bank accounts, which will be handled in a subsequent story (e.g., `story-16.4-process-payouts`). The communication between services will likely be asynchronous via an event bus (e.g., RabbitMQ, Kafka, or AWS SNS/SQS) to ensure resilience. The commission percentage should be stored in a configuration file for easy adjustment. This story only covers a single level of referral commission; multi-level calculations are out of scope for now.
