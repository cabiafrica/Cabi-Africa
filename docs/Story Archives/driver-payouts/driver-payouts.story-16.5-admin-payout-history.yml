id: story-16.5
epic: driver-payouts
slug: admin-payout-history-view
title: Implement Payout Batch History View in Admin Panel
status: Done
author: Bob (sm)
date: '2024-06-04T09:00:00Z'

description: >
  As a finance administrator, I want to view a history of all payout batches
  in the admin panel, so that I can monitor the status of disbursements, track
  total amounts paid, and quickly identify any failed batches that require
  manual intervention.

acceptance_criteria:
  - A new "Payout History" page must be added to the `admin-panel`.
  - This page must fetch and display a list of all payout batches from the `payment-service`.
  - The list should display key information for each batch: Batch ID, Date Processed, Status (e.g., 'Completed', 'Failed'), and Total Amount.
  - The list of batches should be sortable by date and filterable by status.
  - Clicking on a specific batch in the list must navigate to a detail view for that batch.
  - The batch detail view must list all individual driver payout attempts within that batch, showing the driver's name/ID, the amount, and the individual transfer status ('Paid', 'Failed').
  - Failed payout attempts in the detail view must be clearly highlighted (e.g., with a red color).
  - The `payment-service` must expose new, secure, admin-only endpoints to get the list of payout batches and the details for a specific batch.

files_to_be_created:
  - apps/admin-panel/src/app/payouts/page.tsx
  - apps/admin-panel/src/app/payouts/[batchId]/page.tsx

files_to_be_modified:
  - apps/admin-panel/src/components/layout/sidebar.tsx # Or equivalent navigation component to add the link
  - libs/backend/payment-service/src/lib/payout.controller.ts # To add new GET endpoints for batch history
  - libs/backend/payment-service/src/lib/payout.service.ts # To implement logic for fetching batch data

dev_notes: >
  This story provides the crucial administrative interface for the payout system. It's a read-only feature that consumes the data generated by the payout process in `story-16.4`. The new endpoints in the `payment-service` must be protected to ensure only authorized admins can view this sensitive financial data. The frontend should be built with clear data visualization to make it easy for admins to spot and diagnose issues.

tasks:
  - id: task-1
    description: Implement backend endpoints for batch history and details.
    subtasks:
      - "[x] Create `payout.service.ts` with methods to get batch history and details."
      - "[x] Create `payout.controller.ts` to expose `GET /payouts` and `GET /payouts/:batchId`."
  - id: task-2
    description: Build the frontend pages in the admin panel.
    subtasks:
      - "[x] Create `apps/admin-panel/src/app/payouts/page.tsx` to list all payout batches."
      - "[x] Create `apps/admin-panel/src/app/payouts/[batchId]/page.tsx` for the batch detail view."
      - "[x] Ensure failed payouts are highlighted in the detail view."
      - "[x] Add a link to the new 'Payout History' page in the main navigation."

