id: story-16.10
epic: driver-payouts
slug: driver-goal-reached-notification
title: Notify Driver on Reaching Weekly Earnings Goal
status: Done
author: Bob (sm)
date: '2024-07-05T09:00:00Z'

description: >
  As a driver, I want to receive a congratulatory notification when I reach my
  weekly earnings goal, so that I feel a sense of accomplishment and stay
  motivated.

acceptance_criteria:
  - After any transaction that increases a driver's earnings (e.g., trip fare, tip, commission), the `payment-service` must perform a check.
  - The check involves fetching the driver's `weeklyEarningsGoal` from the `user-service` and their current total weekly earnings.
  - If the new earnings total meets or exceeds the goal, and the previous total was below the goal (to ensure the notification is sent only once per week), the `payment-service` must publish a `WeeklyGoalReached` event.
  - The event must contain the `driverId` and the `goalAmount`.
  - The `notification-service` must subscribe to and listen for the `WeeklyGoalReached` event.
  - Upon receiving the event, the `notification-service` must construct a congratulatory message (e.g., "Congratulations! You've reached your weekly goal of KES 10,000.").
  - The `notification-service` must send this message as a push notification to the driver's registered device(s).

files_to_be_created: []

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.service.ts # To add logic to check goal and publish event
  - libs/backend/notification-service/src/lib/listeners/payment.listener.ts # To handle the new event
  - libs/backend/notification-service/src/lib/notification.service.ts # To add logic for sending the goal notification
  - The database schema for the `user-service` or `payment-service` might need a field to track if the weekly goal notification has already been sent for the current week to prevent duplicate notifications.

dev_notes: >
  This story adds a key motivational element to the earnings goal feature from `story-16.9`. The core logic resides in the `payment-service`, which acts as the trigger. An event-driven approach is crucial here. The system must be careful to only send the notification once per week when the goal is first crossed. This might require adding a flag like `weeklyGoalNotificationSent` to the user's record that gets reset at the start of each week.
