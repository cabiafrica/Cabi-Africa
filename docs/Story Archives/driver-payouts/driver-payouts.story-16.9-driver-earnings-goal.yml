id: story-16.9
epic: driver-payouts
slug: driver-earnings-goal
title: Allow Driver to Set and Track Weekly Earnings Goals
status: Done
author: Bob (sm)
date: '2024-06-30T09:00:00Z'

description: >
  As a driver, I want to set a personal weekly earnings goal and see my
  progress towards it, so that I can stay motivated and better plan my work.

acceptance_criteria:
  - A new "Weekly Goal" section must be added to the `WalletScreen` in the `driver-app`.
  - This section must allow the driver to set or edit a numerical earnings goal for the week.
  - The `user-service` must be updated to store this `weeklyEarningsGoal` value per driver.
  - The UI must display a progress indicator (e.g., a progress bar) showing current weekly earnings against the set goal.
  - The current weekly earnings must be fetched from the `payment-service`.
  - The `payment-service` must expose a new endpoint to calculate and return a driver's total earnings (fares, tips, commissions) for the current week (e.g., Monday to Sunday).
  - If no goal is set, the UI should prompt the driver to set one.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/widgets/earnings_goal_widget.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/wallet_screen.dart # To integrate the new widget
  - libs/backend/user-service/src/lib/user.controller.ts # To add an endpoint for setting/updating the goal
  - libs/backend/user-service/src/lib/user.service.ts # To add logic for storing the goal
  - The database schema for the `user-service` to add a `weeklyEarningsGoal` field to the user model.
  - libs/backend/payment-service/src/lib/payment.controller.ts # To add an endpoint for fetching current weekly earnings
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement the weekly earnings calculation

dev_notes: >
  This story introduces a driver engagement feature. It requires coordination between the `user-service` (which owns the goal setting) and the `payment-service` (which owns the earnings data). The definition of a "week" must be clearly defined and consistently applied on the backend (e.g., starts on Monday at 00:00 UTC). This feature lays the groundwork for future motivational tools, such as notifications upon reaching a goal.
