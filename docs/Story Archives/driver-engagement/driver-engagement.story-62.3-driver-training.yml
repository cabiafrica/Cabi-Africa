id: story-62.3
epic: driver-engagement
slug: driver-training
title: Implement In-App Driver Training Modules
status: Done
author: Bob (sm)
date: '2024-08-06T09:01:00Z'

description: >
  As a driver, I want access to short, in-app training videos and articles on
  topics like using app features, customer service best practices, and tax tips.

acceptance_criteria:
  - A new "Learning Center" must be added to the `driver-app`.
  - The `admin-panel` must allow admins to upload or link to training content (videos, articles) and categorize it.
  - The `driver-app` will fetch and display this content.
  - The system could track which modules a driver has completed.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/learning_center_screen.dart
  - apps/admin-panel/src/app/training/page.tsx

files_to_be_modified:
  - libs/backend/notification-service/src/lib/notification.service.ts # Or a new content-service

dev_notes: >
  This feature helps improve driver quality and consistency. It also serves as a great way to introduce new app features to drivers.