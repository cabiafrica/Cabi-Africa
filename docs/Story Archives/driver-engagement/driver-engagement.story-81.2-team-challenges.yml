id: story-81.2
epic: driver-engagement
slug: team-challenges
title: Implement Team-Based Driver Challenges
status: Done
author: Bob (sm)
date: '2024-08-09T10:09:00Z'

description: >
  As a driver, I want to join a team with other drivers to compete against
  other teams in weekly challenges, so that I can experience a sense of
  teamwork and larger-scale competition.

acceptance_criteria:
  - The `driver-app` will allow drivers to form or join persistent teams.
  - The `incentive-service` will allow admins to create team-based challenges (e.g., "Team with the highest average rating this week wins a bonus for each member").
  - The app must display team leaderboards and progress towards team goals.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To handle team logic
  - apps/driver-app/src/screens/leaderboard_screen.dart # To add team views

dev_notes: >
  This expands on private challenges (`story-81.1`) to foster a broader sense of community and competition, which can be a powerful motivator for groups of drivers.