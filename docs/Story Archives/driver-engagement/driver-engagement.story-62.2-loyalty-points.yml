id: story-62.2
epic: driver-engagement
slug: loyalty-points
title: Implement Driver Loyalty Points Program
status: Done
author: Bob (sm)
date: '2024-08-06T09:00:00Z'

description: >
  As a driver, I want to earn loyalty points for my activity on the
  platform (e.g., completing trips, receiving high ratings), which I can
  redeem for rewards in the Driver Store.

acceptance_criteria:
  - The `incentive-service` must define rules for earning points (e.g., 1 point per trip, 10 points for a 5-star rating).
  - The service must track the point balance for each driver.
  - The driver's wallet screen must be updated to show their current point balance.
  - The Driver Store (`story-62.1`) must be updated to allow items to be "purchased" with points instead of money.
  - When a driver redeems points, their balance must be updated.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To manage points logic
  - apps/driver-app/src/screens/wallet_screen.dart # To display points
  - apps/driver-app/src/screens/store_screen.dart # To allow redeeming points

dev_notes: >
  This feature creates a virtuous cycle, connecting on-road performance with tangible rewards and further engaging drivers with our brand ecosystem.