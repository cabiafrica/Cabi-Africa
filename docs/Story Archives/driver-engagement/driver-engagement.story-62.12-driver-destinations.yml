id: story-62.12
epic: driver-engagement
slug: driver-destinations
title: Implement Driver Destination Filter
status: Done
author: Bob (sm)
date: '2024-08-10T05:30:00Z'

description: >
  As a driver at the end of my day, I want to set a destination (like my home)
  and only receive trip requests that are generally heading in that direction,
  so I can earn money on my way home.

acceptance_criteria:
  - In the `driver-app`, a "Set Destination" feature must be available.
  - A driver can set a destination address and an arrival time window.
  - While this mode is active, the `ride-service` matching algorithm will only offer the driver trips that end along their route to the destination.
  - Drivers should have a limited number of destination uses per day.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To add destination-based matching logic

dev_notes: >
  This is a highly requested driver feature that improves flexibility and efficiency. The matching logic is complex, as it needs to find rides that don't deviate too much from the driver's path.