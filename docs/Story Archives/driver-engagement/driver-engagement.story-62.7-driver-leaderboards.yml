id: story-62.7
epic: driver-engagement
slug: driver-leaderboards
title: Implement Driver Leaderboards
status: Done
author: Bob (sm)
date: '2024-08-09T20:40:00Z'

description: >
  As a driver, I want to see how I rank against other drivers in my city based
  on metrics like trips completed or 5-star ratings, so I can compete in a
  friendly way and feel recognized for my hard work.

acceptance_criteria:
  - A new "Leaderboards" section must be added to the "Community" or "Performance" tab in the `driver-app`.
  - The screen must display weekly leaderboards for different metrics (e.g., "Most Trips," "Highest Rating," "Most Compliments").
  - The driver's own position on the leaderboard must be highlighted.
  - To protect privacy, leaderboards should only show the driver's first name and last initial.
  - The `analytics-service` must be responsible for calculating and providing the leaderboard data.

files_to_be_created:
  - apps/driver-app/src/screens/leaderboard_screen.dart

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To add leaderboard calculation logic

dev_notes: >
  This feature introduces gamification to the driver experience, which can be a powerful motivator. We need to ensure the competition is framed in a positive and healthy way.