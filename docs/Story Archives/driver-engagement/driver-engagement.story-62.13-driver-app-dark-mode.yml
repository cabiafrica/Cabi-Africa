id: story-62.13
epic: driver-engagement
slug: driver-app-dark-mode
title: Implement Dark Mode for Driver App
status: Done
author: Bob (sm)
date: '2024-08-10T06:35:00Z'

description: >
  As a driver who often drives at night, I want a "Dark Mode" for my app to
  reduce eye strain and improve safety.

acceptance_criteria:
  - The `driver-app` must have a fully supported dark theme.
  - The app should respect the user's OS-level setting for light/dark mode.
  - The user must also be able to manually override the theme in the app's settings.
  - This requires updating the app's theme (`story-90.3`) to support a dark color palette.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/core/theme/app_theme.dart # To add dark mode colors

dev_notes: >
  This is a major quality-of-life and safety feature for drivers who work at night.