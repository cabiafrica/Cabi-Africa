description: >
  This epic focuses on tracking and visualizing key performance indicators (KPIs) for drivers.
  High performance is often tied to incentive eligibility and platform tier status.
  
  Key metrics include:
  - Acceptance Rate (Offers accepted / Offers received)
  - Cancellation Rate (Rides cancelled by driver / Rides accepted)
  - Passenger Ratings (Average star rating)
