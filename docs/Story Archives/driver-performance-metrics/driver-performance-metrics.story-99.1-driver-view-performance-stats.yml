id: story-99.1
epic: driver-performance-metrics
slug: driver-view-performance-stats
title: Driver View Performance Statistics
status: DONE
author: Sarah (po)
date: '2024-08-12T15:00:00Z'

description: >
  As a driver, I want to view my key performance metrics (Acceptance Rate, Cancellation Rate, Rating)
  so that I understand my standing on the platform and can improve my service quality.

acceptance_criteria:
  - The Driver App must have a `PerformanceScreen`.
  - The screen must display the Driver's Average Rating prominently (e.g., 4.85 stars).
  - The screen must display Acceptance Rate (percentage).
  - The screen must display Cancellation Rate (percentage).
  - The screen must display Total Lifetime Trips.
  - Metrics falling below certain thresholds (e.g., high cancellation) should be visually distinct (e.g., red).
  - The app must fetch this data from the `performance-service`.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/performance_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart
  - libs/backend/performance-service/src/lib/performance.service.ts
  - libs/backend/performance-service/src/lib/performance.controller.ts

dev_notes: >
  This is a read-only dashboard. The calculation of these metrics usually happens asynchronously
  via background jobs updating a materialized view or cache, rather than computing on the fly
  for every request.

tasks:
  - id: task-1
    description: Implement backend stats retrieval.
    subtasks:
      - "[x] Create `performance.service.ts` with mock stats."
      - "[x] Create `performance.controller.ts` exposing `GET /performance/stats`."
  - id: task-2
    description: Implement frontend performance dashboard.
    subtasks:
      - "[x] Create `performance_screen.dart` with metric cards."
      - "[x] Add navigation icon to `home_screen.dart`."

