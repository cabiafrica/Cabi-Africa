id: story-22.5
epic: scheduled-rides
slug: passenger-manage-scheduled-rides
title: Allow Passenger to View and Cancel Upcoming Scheduled Rides
status: DONE
author: Bob (sm)
date: '2024-08-10T19:15:00Z'

description: >
  As a passenger, I want to see a list of my upcoming scheduled rides and have
  the option to cancel them, so that I can manage my future travel plans.

acceptance_criteria:
  - A new "Scheduled" or "Upcoming Trips" section must be added to the `passenger-app`, likely accessible from the main menu or trip history.
  - This section must display a list of all rides the passenger has scheduled that are still in a 'pending' state.
  - Each item in the list must show the scheduled pickup date/time, pickup location, and destination.
  - Each scheduled ride must have a "Cancel Ride" option.
  - Tapping "Cancel Ride" must show a confirmation dialog.
  - Upon confirmation, the app must call a new endpoint in the `ride-service` to cancel the scheduled ride.
  - The `ride-service` must update the ride's status to 'cancelled_by_passenger'.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/scheduled_rides_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/main_drawer.dart # To add a link to the new screen
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts # To add cancellation logic
  - libs/backend/ride-service/src/lib/scheduled_ride.controller.ts # To expose the cancellation endpoint

dev_notes: >
  This story provides the passenger-facing management for scheduled rides, mirroring the driver's view from `story-22.3`. The focus is on the core functionality of viewing and cancelling. The business logic for cancellation fees is handled in `story-17.5`.

tasks:
  - id: task-1
    description: Implement the backend logic for ride cancellation by a passenger.
    subtasks:
      - "[x] Add a `cancelByPassenger` method to `libs/backend/ride-service/src/lib/scheduled_ride.service.ts`."
      - "[x] Expose this method via a new `DELETE /scheduled-rides/:id/cancel-by-passenger` endpoint in `libs/backend/ride-service/src/lib/scheduled_ride.controller.ts`."
  - id: task-2
    description: Create the frontend screen for passengers to view and cancel scheduled rides.
    subtasks:
      - "[x] Create `Cabi Alpha/mobile/passenger_app/lib/screens/scheduled_rides_screen.dart`."
      - "[x] Implement a `FutureBuilder` to fetch and display a list of mock scheduled rides."
      - "[x] Add a 'Cancel' button for each ride that shows a confirmation dialog."
      - "[x] On confirmation, call the cancellation logic and refresh the list."

