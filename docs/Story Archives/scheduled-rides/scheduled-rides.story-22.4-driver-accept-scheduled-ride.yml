id: story-22.4
epic: scheduled-rides
slug: driver-accept-scheduled-ride
title: Allow Driver to View and Accept Upcoming Scheduled Rides
status: Done
author: Bob (sm)
date: '2024-07-04T09:00:00Z'

description: >
  As a driver, I want to see a list of available scheduled rides in my area and
  accept them in advance, so I can better plan my work schedule and secure
  future earnings.

acceptance_criteria:
  - A new "Ride Opportunities" or "Scheduled Rides" screen must be created in the `driver-app`.
  - This screen must fetch and display a list of upcoming scheduled rides that are available for drivers to accept.
  - For privacy, each ride in the list should show general details: pickup time window (e.g., "10:00 AM - 10:15 AM"), pickup neighborhood (not the exact address), destination neighborhood, and estimated fare.
  - The `ride-service` must expose a new endpoint for drivers to fetch these available scheduled rides, filtered by proximity or operating zone.
  - A driver can tap on a ride to accept it.
  - When a driver accepts a ride, the `ride-service` must assign the ride to that driver and update its status to 'Assigned'. The ride must then be removed from the list of available rides for other drivers.
  - The accepted ride should appear in a "My Schedule" tab or section for the driver.
  - The passenger must be notified via the `notification-service` that a driver has been assigned to their scheduled ride.
  - The driver must have the ability to cancel their assignment from the "My Schedule" view (cancellation policies will be defined in a future story).

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/scheduled_rides_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/navigation/app_router.dart # To add route for the new screen
  - libs/backend/ride-service/src/lib/scheduled_ride.controller.ts # To add new endpoints for drivers
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts # To implement logic for listing and assigning rides
  - libs/backend/notification-service/src/lib/notification.service.ts # To handle notifying the passenger
  - The database schema for `scheduled_rides` in the `ride-service` to add a `driverId` and update status values (e.g., 'Pending', 'Available', 'Assigned').

dev_notes: >
  This story introduces a marketplace model for scheduled rides, giving drivers more control over their schedule. This is a significant shift from the purely system-driven dispatch in `story-22.2`. The system will need to decide when a scheduled ride becomes 'Available' for drivers to view. For privacy, exact pickup/dropoff addresses should only be revealed to the assigned driver closer to the actual pickup time. This story focuses on the happy path of accepting a ride; cancellation rules and penalties will be a separate story.