id: story-22.2
epic: scheduled-rides
slug: dispatch-scheduled-rides
title: Dispatch Scheduled Rides to Drivers
status: Done
author: Bob (sm)
date: '2024-08-10T15:00:00Z'

description: >
  As the system, I need to automatically dispatch scheduled rides to available
  drivers ahead of the pickup time, so that the ride can be fulfilled reliably.

acceptance_criteria:
  - A new background job or cron task must be created in the `ride-service`.
  - This job should run periodically (e.g., every minute) to check for scheduled rides that are due for dispatch.
  - A ride should be considered "due for dispatch" a configurable amount of time before the scheduled pickup time (e.g., 15-20 minutes).
  - When a ride is due, the system must use the existing ride-matching logic to find and assign the best available driver.
  - Once a driver is assigned, the scheduled ride's status must be updated from 'pending' to 'assigned'.
  - The `notification-service` must send a notification to both the passenger and the assigned driver, confirming the ride is now active.
  - If no driver is found, the system should retry a few times before marking the ride as 'failed' and notifying the passenger.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts # To add the dispatch logic
  - libs/backend/ride-service/src/lib/ride.module.ts # To configure the scheduler/cron job
  - libs/backend/notification-service/src/lib/notification.service.ts # To handle new notifications for scheduled ride assignment

dev_notes: >
  This story builds on `story-22.1`. The core of this task is a reliable, scheduled job. Using a library like `node-cron` or a platform-specific scheduler (e.g., Kubernetes CronJob) is recommended. The logic should be resilient, with clear rules for when to start looking for a driver and how to handle cases where no drivers are available.

tasks:
  - id: task-1
    description: Implement the backend logic for dispatching scheduled rides.
    subtasks:
      - "[x] Add a `dispatchScheduledRides` method to `libs/backend/ride-service/src/lib/scheduled_ride.service.ts`."
      - "[x] The method should find rides due for dispatch within a configured time window."
      - "[x] Simulate assigning a driver and update the ride status to 'assigned'."
      - "[x] Integrate with `notification-service` to alert both passenger and driver."

