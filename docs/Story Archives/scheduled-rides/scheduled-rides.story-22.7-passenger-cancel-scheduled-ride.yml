id: story-22.7
epic: scheduled-rides
slug: passenger-cancel-scheduled-ride
title: Allow Passengers to Cancel a Scheduled Ride
status: Done
author: Bob (sm)
date: '2024-08-10T19:00:00Z'

description: >
  As a passenger, I want to cancel an upcoming scheduled ride that I no longer
  need, so that I am not charged and a driver is not dispatched unnecessarily.

acceptance_criteria:
  - In the `passenger-app`, on the screen showing the details of a scheduled ride, a "Cancel Ride" button must be available.
  - Tapping the button must prompt the user for confirmation before proceeding.
  - Upon confirmation, the app must call a new endpoint in the `ride-service` to cancel the specific scheduled ride.
  - The `ride-service` must update the ride's status to "Cancelled" and ensure it is not dispatched to any drivers.
  - After cancellation, the passenger app should return to the main screen or a ride history screen.
  - Cancellation policies (e.g., fees if cancelled too close to the pickup time) should be considered, but for this story, a simple cancellation is sufficient. Future stories can add complexity.

files_to_be_modified:
  - apps/passenger-app/src/screens/scheduled_rides_screen.dart # To add the cancel button and confirmation dialog.
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts # To add the cancellation logic.

dev_notes: >
  This story provides a crucial piece of the scheduled ride lifecycle. It's the counterpart to creating and viewing scheduled rides. The primary focus is on the "happy path" of cancelling before a driver has been dispatched. The `scheduled_ride.service.ts` will need a new method to handle the cancellation request, ensuring the ride is removed from the dispatch queue.

tasks:
  - id: task-1
    description: Implement backend logic for ride cancellation.
    subtasks:
      - "[x] Add a `cancelScheduledRide` method to `scheduled_ride.service.ts`."
      - "[x] Expose this method via a new `POST /scheduled-rides/:id/cancel` endpoint."
  - id: task-2
    description: Implement frontend UI for ride cancellation.
    subtasks:
      - "[x] Add a 'Cancel' button to each ride in `scheduled_rides_screen.dart`."
      - "[x] Implement a confirmation dialog before proceeding with cancellation."
      - "[x] On confirmation, call the new backend endpoint."

