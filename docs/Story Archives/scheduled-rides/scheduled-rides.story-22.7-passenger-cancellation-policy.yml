id: story-22.7
epic: scheduled-rides
slug: passenger-cancellation-policy
title: Define Passenger Cancellation Policy for Scheduled Rides
status: DONE
author: Bob (sm)
date: '2024-07-19T11:00:00Z'

description: >
  As a system administrator, I want to define and apply a cancellation policy
  for passengers who cancel scheduled rides, so that we can compensate drivers
  who have already committed to the ride and discourage last-minute changes.

acceptance_criteria:
  - When a passenger cancels a scheduled ride that has already been assigned to a driver (`story-22.4`), the system must check the time until pickup.
  - A configurable "late cancellation window" must be established (e.g., within 60 minutes of pickup).
  - If the cancellation occurs within this window, a cancellation fee must be charged to the passenger.
  - The `ride-service` must call the `payment-service` to process this cancellation fee against the passenger's default payment method.
  - A portion of this cancellation fee must be credited to the assigned driver's earnings.
  - The `ride-service` must publish a `ScheduledRideCancelledByPassenger` event.
  - The `notification-service` must listen for this event and notify the assigned driver that the ride has been cancelled and they have received a cancellation fee.
  - The passenger app must display a confirmation dialog before finalizing a late cancellation, warning them about the fee.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts # To implement cancellation logic and fee check
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle processing cancellation fees and crediting drivers
  - libs/backend/notification-service/src/lib/notification.service.ts # To notify the driver
  - apps/passenger-app/src/screens/scheduled_rides_screen.dart # To add cancellation warning dialog

dev_notes: >
  This story is the counterpart to the driver cancellation policies. It ensures fairness in the marketplace. The cancellation fee amount and the driver's share should be configurable. This creates a financial disincentive for passengers to cancel late, which protects driver time and income.
