id: story-22.3
epic: scheduled-rides
slug: driver-view-upcoming-rides
title: Allow Drivers to View Upcoming Scheduled Rides
status: DONE
author: Bob (sm)
date: '2024-08-10T15:30:00Z'

description: >
  As a driver, I want to see a list of my upcoming scheduled rides that have
  been assigned to me, so that I can plan my work schedule effectively.

acceptance_criteria:
  - A new "Upcoming Rides" or "Scheduled" section must be added to the `driver-app`, likely accessible from the main menu or a tab bar.
  - This section must display a list of rides that have been assigned to the driver but have not yet started.
  - Each item in the list should show key information: scheduled pickup time, estimated pickup location, and destination.
  - The driver must have an option to view more details about the scheduled ride.
  - The driver must be able to cancel their assignment for a scheduled ride (e.g., if more than an hour before pickup).
  - Cancelling a ride must trigger a process in the `ride-service` to return the ride to the dispatch pool to be reassigned to another driver.
  - The `ride-service` must expose a new endpoint to fetch assigned, upcoming rides for the currently logged-in driver.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/scheduled_rides_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/widgets/upcoming_ride_card.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/main_drawer.dart # Or another navigation element to link to the new screen
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts # To add logic for fetching driver-specific rides and handling cancellations
  - libs/backend/ride-service/src/lib/scheduled_ride.controller.ts # To expose the new endpoint
