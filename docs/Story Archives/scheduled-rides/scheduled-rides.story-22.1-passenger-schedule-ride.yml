id: story-22.1
epic: scheduled-rides
slug: passenger-schedule-ride
title: Allow Passenger to Schedule a Ride for a Future Time
status: Done
author: Bob (sm)
date: '2024-07-01T09:00:00Z'

description: >
  As a passenger, I want to schedule a ride for a later date and time, so that
  I can plan my travel in advance for important appointments.

acceptance_criteria:
  - A "Schedule" option must be added to the `RideBookingPanel` in the `passenger-app`.
  - Tapping "Schedule" must open a date and time picker dialog, allowing the user to select a future time (e.g., at least 1 hour from now).
  - After selection, the UI must update to show the scheduled time, and the confirmation button should change to "Schedule Ride".
  - Tapping "Schedule Ride" must call a new endpoint in the `ride-service` to create a scheduled ride request.
  - The `ride-service` must store this scheduled ride with a 'pending' status.
  - A new "My Rides" or "Scheduled Rides" screen must be accessible from the main navigation or profile.
  - This screen must list all upcoming scheduled rides, showing the destination and scheduled time.
  - The user must be able to cancel a scheduled ride from this list.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/scheduled_rides_screen.dart
  - libs/backend/ride-service/src/lib/scheduled_ride.controller.ts
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_booking_panel.dart # To add the schedule button and UI logic
  - Cabi Alpha/mobile/passenger_app/lib/navigation/app_router.dart # To add the route for the new screen
  - libs/backend/ride-service/src/lib/ride.module.ts # To import the new scheduled ride components
  - The database schema for the `ride-service` to add a `scheduled_rides` table.

dev_notes: >
  This is the foundational story for the new "Scheduled Rides" epic. It introduces the core passenger flow for booking a ride in advance. The backend `ride-service` will need a new data model and logic to store and manage these future-dated requests. This story focuses on the creation and cancellation by the passenger. The mechanism for dispatching these rides to drivers will be handled in a subsequent story.
