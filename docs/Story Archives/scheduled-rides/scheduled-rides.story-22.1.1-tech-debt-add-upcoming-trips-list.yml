id: story-22.1.1
epic: scheduled-rides
slug: tech-debt-add-upcoming-trips-list
title: '[Tech Debt] Add "Upcoming Trips" List for Passengers'
status: Done
author: Bob (sm)
date: '2024-08-15T22:15:00Z'

description: >
  This story addresses technical debt and a QA concern from `story-22.1`. The
  ability to schedule a ride was implemented, but there is no UI for the
  passenger to view the rides they have scheduled. This story creates the
  foundational "Upcoming Trips" screen, which is a prerequisite for `story-22.1`
  to be considered a complete, end-to-end feature.

acceptance_criteria:
  - This story addresses the `FAIL` status in the QA review of `story-22.1`.
  - A new "Upcoming Trips" screen must be created at `Cabi Alpha/mobile/passenger_app/lib/screens/upcoming_trips_screen.dart`.
  - A link to this new screen must be added to the app's main navigation (e.g., in a drawer).
  - The screen must fetch and display a list of all rides the passenger has scheduled that are in a 'pending' state.
  - Each item in the list must show, at a minimum, the scheduled pickup date/time and destination.
  - The backend `ride-service` must have an endpoint to list these scheduled rides for the current user.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/upcoming_trips_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/main_drawer.dart # Or other main navigation
  - libs/backend/ride-service/src/lib/scheduled_ride.controller.ts # To add an endpoint to list rides
  - libs/backend/ride-service/src/lib/scheduled_ride.service.ts # To add logic to list rides

dev_notes: >
  This story is being created to unblock `story-22.1`. It implements the core "view" functionality originally planned for `story-22.5`. The focus is solely on displaying the list of upcoming trips. Cancellation and other management features will remain in `story-22.5`.

tasks:
  - id: task-1
    description: Implement backend endpoint to list a passenger's upcoming scheduled rides.
    subtasks:
      - "[x] Add `findForPassenger` method to `scheduled_ride.service.ts`."
      - "[x] Expose the method via a new `GET /scheduled-rides/my-rides` endpoint in `scheduled_ride.controller.ts`."
  - id: task-2
    description: Create the "Upcoming Trips" screen in the passenger app to display the scheduled rides.
    subtasks:
      - "[x] Create the new `upcoming_trips_screen.dart` file."
      - "[x] Implement a `FutureBuilder` to fetch and display the list of rides."
      - "[x] Add a link to the new screen in the app's main navigation drawer."

