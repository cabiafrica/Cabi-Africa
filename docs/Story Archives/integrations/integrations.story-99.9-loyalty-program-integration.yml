id: story-99.9
epic: integrations
slug: loyalty-program-integration
title: Implement Loyalty Program Integration
status: DONE
author: Bob (sm)
date: '2024-08-10T06:05:00Z'

description: >
  As a passenger, I want to link my airline or hotel loyalty program account,
  so I can earn points/miles for the rides I take.

acceptance_criteria:
  - In the user's profile, they can link their account with partner loyalty programs.
  - After each completed trip, the `incentive-service` must call the partner's API to credit the user's loyalty account with points, based on the ride fare.
  - This requires business development deals and API integrations with each loyalty program partner.

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To handle posting points to partner APIs

dev_notes: >
  This is a very sticky feature for frequent travelers and a strong competitive differentiator.
