id: story-99.6
epic: integrations
slug: voice-assistant-integration
title: Implement Voice Assistant Integration (Siri/Google Assistant)
status: DONE
author: Bob (sm)
date: '2024-08-10T02:35:00Z'

description: >
  As a passenger, I want to be able to book a ride using my phone's voice
  assistant (e.g., "Hey Siri, get me a Cabi to work"), so I can book a ride hands-free.

acceptance_criteria:
  - The `passenger-app` must integrate with the native OS frameworks for voice commands (SiriKit for iOS, App Actions for Android).
  - Users must be able to book a ride to their saved "Home" and "Work" locations via a voice command.
  - The voice assistant should confirm the booking and provide the ETA.

files_to_be_modified:
  - The native iOS and Android projects for the `passenger-app` to add the necessary intent handlers and configurations.

dev_notes: >
  This is a powerful convenience feature that integrates our app more deeply into the user's daily routine. It requires native mobile development work, not just Flutter.
