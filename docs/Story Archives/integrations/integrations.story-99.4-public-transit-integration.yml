id: story-99.4
epic: integrations
slug: public-transit-integration
title: Display Public Transit Options
status: DONE
author: Bob (sm)
date: '2024-08-10T00:55:00Z'

description: >
  As a passenger, I want to see public transit options (bus, train) alongside
  the ride-sharing options for my journey, so I can make the best choice for my
  time and budget.

acceptance_criteria:
  - When a user enters a destination, the `passenger-app` should query a third-party transit data provider (e.g., via Google Maps API).
  - If public transit routes are available, a "Transit" tab should appear next to the ride options.
  - This tab should display the route, estimated travel time, and cost for the public transit journey.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add the transit tab and display
  - libs/backend/map-service/src/lib/map.service.ts # To proxy requests to the transit data provider

dev_notes: >
  This positions our app as a more comprehensive "Mobility as a Service" (MaaS) platform, not just a ride-sharing app. It requires integration with a real-time transit data feed.
