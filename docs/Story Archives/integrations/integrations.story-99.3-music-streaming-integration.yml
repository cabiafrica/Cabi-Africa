id: story-99.3
epic: integrations
slug: music-streaming-integration
title: Implement Music Streaming Integration
status: DONE
author: Bob (sm)
date: '2024-08-10T00:10:00Z'

description: >
  As a passenger, I want to connect my music streaming account (e.g., Spotify)
  to the app, so I can listen to my own music during the ride.

acceptance_criteria:
  - In the `passenger-app` settings, a user can link their music streaming account via an OAuth flow.
  - During a trip, the passenger can select music from their account to be played through the driver's car stereo system.
  - The `driver-app` must be able to receive the music selection and play it (e.g., via a connection to the driver's own streaming app).

files_to_be_modified:
  - apps/passenger-app/src/screens/settings_screen.dart # To link music account
  - apps/passenger-app/src/widgets/driver_details_panel.dart # To control music during a trip
  - apps/driver-app/src/widgets/trip_in_progress_panel.dart # To receive and play music

dev_notes: >
  This is a "delight" feature that can significantly enhance the passenger experience. It requires careful integration with the music service's SDK and a seamless way to hand off playback control to the driver's device.
