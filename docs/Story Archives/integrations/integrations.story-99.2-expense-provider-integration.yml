id: story-99.2
epic: integrations
slug: expense-provider-integration
title: Integrate with Expense Management Providers
status: DONE
author: Bob (sm)
date: '2024-08-09T23:45:00Z'

description: >
  As a business traveler, I want to automatically forward my ride receipts to
  my company's expense management software (e.g., Expensify, Concur), so I
  don't have to do it manually.

acceptance_criteria:
  - In the Business Profile settings (`story-55.5`), a user can connect their account to supported third-party expense providers via an OAuth flow.
  - Once linked, after a ride is completed on the Business Profile, the e-receipt (`story-55.4`) is automatically sent to the connected expense provider's API.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/business_profile_setup_screen.dart # To add the integration link
  - libs/backend/notification-service/src/lib/notification.service.ts # To add logic for forwarding receipts to third-party APIs

dev_notes: >
  This feature makes our platform much stickier for business users by deeply integrating into their workflow. Each integration will require a separate API implementation.
