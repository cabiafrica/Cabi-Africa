id: story-9.3
epic: refactoring-and-architecture
slug: shared-location-service
title: Refactor Location Logic into a Shared Core Location Service
status: DONE
author: Bob (sm)
date: '2024-05-29T20:00:00Z'

description: >
  As a developer, I want to consolidate all location-related logic from both the
  passenger and driver apps into a new shared package, `core_location`, to
  reduce code duplication and ensure consistent handling of location permissions
  and data fetching.

acceptance_criteria:
  - A new local package is created at `packages/core_location`.
  - The `core_location` package contains a unified `LocationService` that wraps the `geolocator` package.
  - The service must provide methods for checking permissions, getting the current position, and streaming position updates.
  - The `passenger-app`'s `pubspec.yaml` is updated to include a path dependency to the new `core_location` package.
  - The `driver-app`'s `pubspec.yaml` is updated to include a path dependency to the new `core_location` package.
  - The `LocationService` in the `driver-app` is removed and its functionality is replaced by the shared service.
  - The location logic in the `passenger-app`'s `HomeScreen` (e.g., `_determinePosition`) is refactored to use the shared `LocationService`.
  - All imports in both apps are updated to point to the new shared package.
  - Both applications must build and run without errors after the refactoring.

files_to_be_created:
  - packages/core_location/pubspec.yaml
  - packages/core_location/lib/core_location.dart
  - packages/core_location/lib/src/location_service.dart

files_to_be_deleted:
  - Cabi Alpha/mobile/driver_app/lib/api/location_service.dart

dev_notes: >
  This story continues our monorepo refactoring. It will centralize all interactions with the `geolocator` package, making permission handling and location fetching consistent. The driver app's location streaming and the passenger app's one-time location fetch can both be served by this single, unified service.