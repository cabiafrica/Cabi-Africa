id: story-9.8
epic: refactoring-and-architecture
slug: shared-secondary-button
title: Create a Shared Secondary Button Component
status: DONE
author: Gemini Code Assist
date: '2024-05-30T10:15:00Z'

description: >
  As a developer, I want a reusable `CabiSecondaryButton` widget in the `core_ui`
  package, so that I can create consistent secondary actions (like "Cancel" or
  "Go Back") across both the passenger and driver apps.

acceptance_criteria:
  - A new file `packages/core_ui/lib/src/widgets/cabi_secondary_button.dart` is created.
  - The `CabiSecondaryButton` must be a reusable widget, likely based on Flutter's `OutlinedButton`.
  - It must accept an `onPressed` callback and a `text` string for the button label.
  - The button's style (border, text color, etc.) must be derived from the shared `CabiTheme`, `CabiColors`, and `CabiTextStyles`.
  - The button must handle enabled and disabled states correctly, with distinct visual styles for each.
  - At least one existing button in either the `passenger-app` or `driver-app` must be refactored to use the new `CabiSecondaryButton`.
  - The refactored UI must render correctly with no visual regressions.

files_to_be_created:
  - packages/core_ui/lib/src/widgets/cabi_secondary_button.dart

files_to_be_modified:
  - # At least one file in `apps/passenger-app/lib/` or `apps/driver-app/lib/` that contains a secondary action button.

dev_notes: >
  This component complements the `CabiPrimaryButton` and is another foundational piece of our design system. Providing a clear, reusable secondary button prevents developers from creating one-off "cancel" or "back" buttons, ensuring visual consistency for all user actions.