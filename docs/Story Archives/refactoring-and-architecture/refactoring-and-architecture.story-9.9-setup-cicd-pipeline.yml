id: story-9.9
epic: refactoring-and-architecture
slug: setup-cicd-pipeline
title: "Setup CI/CD Pipeline for Backend Services and Frontend Apps"
status: Ready for Review
author: Gemini Code Assist
date: '2025-12-06T21:00:00Z'

description: >
  As a developer, I need an automated CI/CD pipeline (e.g., using GitHub Actions) that builds, runs tests, and deploys
  the backend services (as Docker containers) and frontend applications, so that we can ensure code quality and achieve continuous delivery.

acceptance_criteria:
  - A GitHub Actions workflow file must be created in the `.github/workflows/` directory.
  - The workflow must trigger on push to the `main` branch and on pull requests targeting `main`.
  - The workflow must successfully install all dependencies for the Nx monorepo.
  - The workflow must include a job to run linting and formatting checks across all projects.
  - A step must be added to run a dependency scan on the monorepo's `package.json` files (e.g., using `npm audit --audit-level=high`).
  - The pipeline must fail if the dependency scan finds any high or critical severity vulnerabilities.
  - The workflow must include a job to execute all unit and integration tests across the monorepo.
  - For backend services, the workflow must build Docker images and push them to a container registry (e.g., AWS ECR).
  - A step must be added to the Docker image build process to scan the final images for known OS and library vulnerabilities (e.g., using Trivy).
  - The pipeline must fail if the Docker image scan finds any high or critical severity vulnerabilities.
  - Scan results must be clearly visible in the CI/CD logs for review and debugging.
  - The workflow must include placeholder steps for deploying services (e.g., updating AWS Lambda/ECS) and frontend apps (e.g., to Vercel/Amplify).

files_to_be_created:
  - .github/workflows/ci-cd.yml

files_to_be_modified:
  # No existing files to modify.

dev_notes: >
  This is a foundational DevOps story that automates our build and deployment process, a critical requirement from the architecture document (section 3). We will start with a basic pipeline covering build, lint, and test stages. The deployment steps will be stubbed out initially and fully implemented as our infrastructure is defined in the IaC story (`story-9.11`). This ensures we have a solid foundation for continuous integration from the start.
  Architecture Reference: 3. Tech Stack (Docker, Deployment)

