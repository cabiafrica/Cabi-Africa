id: story-9.4
epic: refactoring-and-architecture
slug: shared-ui-package
title: Create a Shared UI Package for Common Widgets
status: DONE
author: Bob (sm)
date: '2024-05-29T21:00:00Z'

description: >
  As a developer, I want to create a shared UI package (`core_ui`) to house
  common widgets and theme elements, so that I can ensure a consistent look and
  feel across both the passenger and driver apps and reduce UI code duplication.

acceptance_criteria:
  - A new local package is created at `packages/core_ui`.
  - The `core_ui` package should be set up to contain common widgets, theme data, and style constants.
  - As a starting point, a common `PrimaryButton` widget should be created in the shared package.
  - The `passenger-app`'s `pubspec.yaml` is updated to include a path dependency to the new `core_ui` package.
  - The `driver-app`'s `pubspec.yaml` is updated to include a path dependency to the new `core_ui` package.
  - At least one existing `ElevatedButton` in both the passenger and driver apps should be refactored to use the new `PrimaryButton`.
  - Both applications must build and run without errors after the refactoring.
  - All existing tests must pass.

files_to_be_created:
  - packages/core_ui/pubspec.yaml
  - packages/core_ui/lib/core_ui.dart
  - packages/core_ui/lib/src/widgets/primary_button.dart

files_to_be_modified:
  - apps/passenger-app/pubspec.yaml
  - apps/driver-app/pubspec.yaml
  # At least one file in each app that uses an ElevatedButton will be modified.

dev_notes: >
  This story establishes the foundation for a shared component library. The initial `PrimaryButton` is just an example. The goal is to create a home for any widget that can be reused, such as custom text fields, panels, or loading indicators. This will be critical for maintaining a consistent design system as the apps evolve.
