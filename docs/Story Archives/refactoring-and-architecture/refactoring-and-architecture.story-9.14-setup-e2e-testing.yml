id: story-9.14
epic: refactoring-and-architecture
slug: setup-e2e-testing
title: "Setup End-to-End (E2E) Testing Framework"
status: Ready for Review
author: Gemini Code Assist
date: '2025-12-06T23:05:00Z'

description: >
  As a QA engineer, I need an E2E testing framework (e.g., Cypress, Playwright) integrated into the monorepo,
  so that we can write automated tests that simulate real user workflows across the frontend applications and their backend APIs.

acceptance_criteria:
  - An E2E testing framework (e.g., Cypress) must be added as a dev dependency to the root `package.json`.
  - A new Nx application (e.g., `apps/marketing-website-e2e`) must be generated to house the E2E tests for the marketing website.
  - A basic test case must be written to verify the marketing website's homepage loads correctly.
  - A second test case must be written to simulate filling out the driver registration form and submitting it, mocking the API response.
  - The CI/CD pipeline (from story-9.9) must be updated with a new job to run the E2E tests.

files_to_be_created:
  - apps/marketing-website-e2e/src/e2e/app.cy.ts

files_to_be_modified:
  - package.json # To add Cypress/Playwright dependencies.
  - .github/workflows/ci-cd.yml # To add the E2E test job.

dev_notes: >
  This story establishes our strategy for automated end-to-end testing, a key part of the Test Strategy (architecture section 14). E2E tests provide the highest level of confidence that our user flows are working as expected.

  We will use Cypress as the framework due to its excellent developer experience and integration with the Nx ecosystem. The initial setup will focus on the marketing website, with a separate E2E app for each frontend application to be created in the future.
  Architecture Reference: 14. Test Strategy and Standards

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  file_list:
    - package.json
    - apps/marketing-website-e2e/src/e2e/app.cy.ts
    - .github/workflows/ci-cd.yml
  change_log:
    - file: package.json
      change: Added `@nx/cypress` and `cypress` to the `devDependencies` to integrate the E2E testing framework into our project.
    - file: apps/marketing-website-e2e/src/e2e/app.cy.ts
      change: >
        Created the first E2E test file. It includes a basic test to ensure the marketing website's homepage loads, and a more comprehensive test that simulates a user filling out the driver registration form. This test uses `cy.intercept` to mock the backend API call, ensuring the test can run reliably in a CI environment without a live backend.
    - file: .github/workflows/ci-cd.yml
      change: >
        Added a new `e2e-tests` job to the CI/CD pipeline. This job runs after the unit and integration tests and executes the Cypress tests in headless mode. The main build and deploy job now depends on the successful completion of these E2E tests, adding another layer of quality assurance to our pipeline.
  completion_notes:
    - >
      I have successfully set up the End-to-End (E2E) testing framework using Cypress. I've added the required dependencies, created an initial test suite for the marketing website that covers the homepage and a mocked registration flow, and integrated the test execution into our CI/CD pipeline. This provides a solid foundation for building out comprehensive E2E tests for all our user-facing applications.