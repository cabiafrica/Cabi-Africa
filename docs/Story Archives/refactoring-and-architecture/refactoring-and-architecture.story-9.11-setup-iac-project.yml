id: story-9.11
epic: refactoring-and-architecture
slug: setup-iac-project
title: "Setup Initial Infrastructure as Code (IaC) Project"
status: Ready for Review
author: Gemini Code Assist
date: '2025-12-06T21:10:00Z'

description: >
  As a DevOps engineer, I need to set up a new AWS CDK project within the monorepo to define our core cloud infrastructure,
  so that our infrastructure is managed as code, enabling versioning, peer review, and repeatable deployments.

acceptance_criteria:
  - A new AWS CDK application must be initialized within the Nx monorepo (e.g., in `apps/infrastructure`).
  - The CDK project must be configured to use TypeScript.
  - An initial CDK stack must be created that defines the core networking infrastructure (e.g., a new VPC).
  - The stack must define the primary database resource (e.g., an AWS RDS for PostgreSQL instance).
  - The stack must define the API Gateway resource that will serve as the entry point for our backend services.
  - The CI/CD pipeline must be updated with a step to synthesize the CDK templates (`cdk synth`) to validate the infrastructure code.

files_to_be_created:
  - apps/infrastructure/bin/infrastructure.ts
  - apps/infrastructure/lib/main-stack.ts

files_to_be_modified:
  - .github/workflows/ci-cd.yml # To add the `cdk synth` validation step.

dev_notes: >
  This story establishes the foundation for our entire cloud environment, as specified in the architecture document (section 3.1). Using AWS CDK allows us to define our infrastructure in TypeScript, keeping our entire project within a consistent language ecosystem. This initial setup will focus on the non-negotiable core components. Subsequent stories will add service-specific resources (like Lambda functions) to this stack.
  Architecture Reference: 3.1. Cloud Infrastructure & 3.2. Technology Stack (AWS CDK)

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  file_list:
    - apps/infrastructure/bin/infrastructure.ts
    - apps/infrastructure/lib/main-stack.ts
    - .github/workflows/ci-cd.yml
  change_log:
    - file: apps/infrastructure/bin/infrastructure.ts
      change: Created the entry point for the new AWS CDK application. This script initializes the CDK app and instantiates our `MainStack`.
    - file: apps/infrastructure/lib/main-stack.ts
      change: >
        Created the `MainStack` class which defines our core cloud infrastructure. It includes a new VPC for networking, a PostgreSQL RDS instance for our primary database, and a REST API Gateway to serve as the entry point for our backend services.
    - file: .github/workflows/ci-cd.yml
      change: >
        Added a new `validate-iac` job to the CI/CD pipeline. This job runs `cdk synth` to ensure our infrastructure code is valid and can be synthesized into a CloudFormation template. The main build and deploy job now depends on the successful completion of this validation.
  completion_notes:
    - >
      I have successfully set up the initial Infrastructure as Code (IaC) project using AWS CDK. I created the main stack which defines our core VPC, RDS database, and API Gateway. I also updated the CI/CD pipeline to include a `validate-iac` job that synthesizes the CDK stack, ensuring our infrastructure definitions are always valid before deployment. This completes the requirements for the story.