id: story-9.7
epic: refactoring-and-architecture
slug: shared-primary-button
title: Create a Shared Primary Button Component
status: DONE
author: Gemini Code Assist
date: '2024-05-30T10:10:00Z'

description: >
  As a developer, I want a reusable `CabiPrimaryButton` widget in the `core_ui`
  package, so that I can create consistent primary call-to-action buttons
  across both the passenger and driver apps, reducing code duplication and
  enforcing a consistent design language.

acceptance_criteria:
  - A new file `packages/core_ui/lib/src/widgets/cabi_primary_button.dart` is created.
  - The `CabiPrimaryButton` must be a reusable widget that encapsulates the primary button styling.
  - It must accept an `onPressed` callback and a `text` string for the button label.
  - The button's style must be derived from the shared `CabiTheme`, `CabiColors`, and `CabiTextStyles`.
  - The button must handle enabled and disabled states correctly, with distinct visual styles for each.
  - At least one existing `ElevatedButton` in both the `passenger-app` and `driver-app` must be refactored to use the new `CabiPrimaryButton`.
  - The refactored UI must render correctly with no visual regressions.

files_to_be_created:
  - packages/core_ui/lib/src/widgets/cabi_primary_button.dart

files_to_be_modified:
  - apps/lib/widgets/trip_summary_panel.dart # Example: Refactor the 'Pay Now' button.
  - # At least one file in `apps/passenger-app/lib/` that contains a primary action button.

dev_notes: >
  This story is a key step in building our design system. By creating a shared button component, we abstract away the specific styling details (`ElevatedButton.styleFrom`, etc.) into a single, reusable widget. This makes the feature code cleaner and ensures that future design updates to primary buttons can be made in one place.