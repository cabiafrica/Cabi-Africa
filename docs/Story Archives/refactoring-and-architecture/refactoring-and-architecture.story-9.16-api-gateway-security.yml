id: story-9.16
epic: refactoring-and-architecture
slug: api-gateway-security
title: "Implement API Gateway Authentication and Rate Limiting"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T23:15:00Z'

description: >
  As a DevOps engineer, I need to configure the API Gateway to validate JWTs on incoming requests and enforce rate limiting policies,
  so that our backend services are protected from unauthorized access and denial-of-service attacks.

acceptance_criteria:
  - The IaC project (from story-9.11) must be updated to configure a JWT Authorizer on the AWS API Gateway.
  - The authorizer must be configured to validate the signature and claims of JWTs issued by our `auth-service`.
  - All protected backend endpoints must be configured to use this authorizer.
  - Unauthenticated requests to protected endpoints must be rejected by the API Gateway with a `401 Unauthorized` response.
  - A usage plan must be configured on the API Gateway to enforce a global rate limit (e.g., 100 requests/second) and a burst limit.
  - Requests exceeding the rate limit must be rejected by the API Gateway with a `429 Too Many Requests` response.

files_to_be_created:
  # No new files are expected; this modifies the IaC project.

files_to_be_modified:
  - apps/infrastructure/lib/main-stack.ts # To add authorizer and usage plan configurations to the API Gateway resource.

dev_notes: >
  This story implements the security responsibilities of the API Gateway as defined in the architecture document (sections 2.2 and 5.1.6).

  By handling JWT validation and rate limiting at the gateway level, we offload these cross-cutting concerns from the individual microservices. This simplifies the service code, ensures consistent security policy enforcement, and improves performance by rejecting invalid or excessive requests at the edge, before they consume backend resources.
  Architecture Reference: 2.2. High Level Overview & 5.1.6. API Gateway