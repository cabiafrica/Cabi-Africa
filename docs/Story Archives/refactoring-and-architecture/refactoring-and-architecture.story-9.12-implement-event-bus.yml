id: story-9.12
epic: refactoring-and-architecture
slug: implement-event-bus
title: "Implement Event Bus for Asynchronous Service Communication"
status: Ready for Review
author: Gemini Code Assist
date: '2025-12-06T21:15:00Z'

description: >
  As a backend developer, I need a message bus (e.g., AWS SQS/SNS) configured and a shared library created for publishing
  and subscribing to events, so that our microservices can communicate asynchronously and remain decoupled.

acceptance_criteria:
  - The IaC project (from story-9.11) must be updated to define an SNS topic to act as the main event bus.
  - The IaC project must define SQS queues for key subscribing services (e.g., a queue for the `MLM Service`).
  - The SQS queues must be configured to subscribe to the main SNS topic.
  - A new shared library (e.g., `libs/shared/event-bus`) must be created in the Nx monorepo.
  - This library must contain a simple `EventPublisher` class for sending messages to the SNS topic.
  - The library must also define common event interfaces (e.g., `DriverRegisteredEvent`).
  - The `Driver Lead Service` must be refactored to use the `EventPublisher` to publish a `DriverRegisteredEvent` instead of directly calling the `MLM Service`.

files_to_be_created:
  - libs/shared/event-bus/src/index.ts
  - libs/shared/event-bus/src/lib/event-publisher.ts
  - libs/shared/event-bus/src/lib/event-interfaces.ts

files_to_be_modified:
  - apps/infrastructure/lib/main-stack.ts # To add the SNS topic and SQS queues.
  - # The Driver Lead Service will be modified to publish an event.
  - # The MLM Service will be modified to consume events from its SQS queue.

dev_notes: >
  This story implements the "Event-Driven Communication" pattern from the architecture document (section 2.4). This is a fundamental shift that improves scalability and resilience. By having services communicate via events, we remove direct, synchronous dependencies. For example, if the `MLM Service` is temporarily down, the `DriverRegisteredEvent` will wait in its queue, and the registration process can still succeed.
  Architecture Reference: 2.4. Architectural and Design Patterns -> Event-Driven Communication

