id: story-110.1
epic: driver-onboarding-profile-management
slug: driver-document-submission-ui
title: Implement Driver Document Submission UI in Driver App
status: Done
author: Bob (sm)
date: '2025-12-02T19:45:00Z'

description: >
  As a prospective driver who has just registered, I want to upload my required documents (e.g., driver's license, vehicle insurance) through the app,
  so that I can complete the next step of my application process.

acceptance_criteria:
  - After a new driver with 'PROSPECT' status logs into the `driver-app`, they must be directed to a "Document Submission" screen.
  - The screen must display a list of required documents (e.g., "Driver's License", "Vehicle Insurance", "Vehicle Registration").
  - Each item in the list must have an "Upload" button that allows the user to take a photo or select one from their device's gallery.
  - After a document is uploaded, its status should change to "Pending Review".
  - A "Submit for Review" button should become active only after all required documents have been uploaded.
  - The `user-service` must be updated with an endpoint to handle the file uploads and associate them with the driver's profile.
  - The `user-service` must also update the driver's `applicationStatus` to `PENDING_APPROVAL` upon final submission.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/document_submission_screen.dart

files_to_be_modified:
  - # The main entry point of the driver-app after login needs to be modified to route 'PROSPECT' users to the new screen.
  - libs/backend/user-service/src/lib/user.controller.ts # To add a new endpoint for document uploads.
  - libs/backend/user-service/src/lib/user.service.ts # To add logic for handling file storage and updating driver status.
  - # The Prisma schema will need to be updated with a `Document` model to track uploads.

dev_notes: >
  This story is the first step in the in-app onboarding flow, directly addressing the "Driver Document Submission" requirement from the PRD. It's a critical gate in the driver activation process. The implementation will require using device camera/gallery plugins. The backend will need to handle multipart/form-data for file uploads and integrate with a file storage solution (like AWS S3).

tasks:
  - id: task-1
    description: "Implement the backend endpoint and service logic in `user-service` to handle document uploads and update driver status."
  - id: task-2
    description: "Create the 'Document Submission' screen in the `driver-app`."
  - id: task-3
    description: "Implement the UI to list required documents and integrate camera/gallery functionality for uploads."
  - id: task-4
    description: "Implement the logic to submit all documents for review and update the driver's application status."
