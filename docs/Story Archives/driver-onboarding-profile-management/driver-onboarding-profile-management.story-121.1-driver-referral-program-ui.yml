id: story-121.1
epic: driver-onboarding-profile-management
slug: driver-referral-program-ui
title: "Driver App: Driver Referral Program UI"
status: Done
author: Gemini Code Assist
date: '2025-12-05T11:15:00Z'

description: >
  As a driver, I want a dedicated "Referral Program" section in the app where I can find my unique
  referral code and easily share it, so I can invite new drivers and earn bonuses.

acceptance_criteria:
  - A new "Referral Program" screen must be created in the `driver-app`.
  - The screen must prominently display the driver's unique `referralCode` (from their `DriverProfile`).
  - A "Copy Code" button must be available to copy the code to the device clipboard.
  - A "Share" button must open the native device sharing dialog, pre-populated with a message and the referral code/link.
  - The screen should also display a summary of referral status (e.g., "3 drivers signed up, 1 activated").

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/referral_program_screen.dart

files_to_be_modified:
  - # The app's main navigation will need a link to this new screen.
  - # The backend User Management Service will need an endpoint to provide referral summary stats.

dev_notes: >
  This story creates the primary in-app interface for the driver referral program, a key business goal from the PRD (section 2.2). The `referralCode` is already part of the `DriverProfile` model in the architecture. The main work is creating the new screen and integrating with native sharing functionality. The summary stats will require a new backend endpoint to aggregate data about users who have used the driver's code.
  PRD Reference: 2.2. Driver App -> Engagement, Incentives & Community -> Driver Referral Program
