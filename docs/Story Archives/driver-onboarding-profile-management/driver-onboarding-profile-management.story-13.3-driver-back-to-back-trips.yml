id: story-13.3
epic: driver-onboarding-profile-management
slug: driver-back-to-back-trips
title: "Driver App: Implement Back-to-Back Trips"
status: Done
author: Gemini Code Assist
date: '2025-12-06T18:40:00Z'

description: >
  As a driver, I want the option to receive new trip requests while I am finishing my current trip,
  so I can minimize my idle time and seamlessly move from one ride to the next.

acceptance_criteria:
  - A driver must have a setting in their profile to enable or disable "Back-to-Back Trips".
  - If enabled, when a driver is nearing the destination of their current trip, the dispatch system can send them a new ride request.
  - The new ride request must have a pickup location that is near the current trip's destination.
  - The driver app UI must clearly distinguish a back-to-back request from a standard request.
  - Accepting a back-to-back trip adds it to a queue, which automatically becomes the active trip after the current one is completed.

files_to_be_created:
  # No new screens, modifies existing screens and services.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/in_trip_screen.dart # To handle displaying the new ride request.
  - # The backend dispatch service needs significant modification to support this feature.

dev_notes: >
  This is a powerful efficiency feature from the PRD (section 2.2) that increases driver earnings and platform liquidity. The complexity is almost entirely in the backend `dispatch-service`. The service needs to know when a driver is in the "nearing destination" phase of a trip and then find a suitable new ride that starts nearby. The driver app needs to handle the UI for accepting a ride while another is still in progress.
  PRD Reference: 2.2. Driver App -> Core Trip Management & Navigation -> Back-to-Back Trips
