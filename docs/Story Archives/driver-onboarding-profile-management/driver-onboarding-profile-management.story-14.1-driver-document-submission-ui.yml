id: story-14.1
epic: driver-onboarding-profile-management
slug: driver-document-submission-ui
title: "'Driver App: Implement Document Submission UI'"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T11:00:00Z'

description: >
  As a new driver who has just registered, I need a clear interface in the driver app to upload my required documents
  (e.g., driver's license, vehicle insurance), so I can complete my onboarding process and get approved to drive.

acceptance_criteria:
  - A new "Documents" screen must be created in the `driver-app` as part of the onboarding flow.
  - The screen must display a list of required documents (e.g., "Driver's License", "Vehicle Insurance").
  - For each document, the user must be able to tap to upload an image from their device's camera or gallery.
  - After selecting an image, a preview should be shown before confirming the upload.
  - Uploading a document must call a backend endpoint to submit the file for review.
  - The UI must update to show the status of each document (e.g., "Pending Review", "Approved", "Rejected").

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/document_submission_screen.dart

files_to_be_modified:
  - # The driver app's onboarding router/navigator to include this new screen.
  - # The backend DocumentService will need an endpoint to handle file uploads.

dev_notes: >
  This story is a critical part of the MVP driver onboarding funnel as defined in `brief.md`. It provides the driver-facing UI for the document management system. The frontend will need to integrate with device-native image pickers and camera functionality. The backend will require a secure endpoint for handling multipart/form-data file uploads and associating them with the driver's profile. This story is the user-facing counterpart to the admin-side document review features.
  PRD Reference: 2.2. Driver App -> Onboarding & Profile Management -> Driver Document Submission

tasks:
  - id: task-1
    description: '[x] Create the initial UI for the Document Submission screen.'
  - id: task-2
    description: '[x] Integrate a native image picker to allow document selection.'
  - id: task-3
    description: '[x] Implement backend logic to handle multipart file uploads.'
  - id: task-4
    description: '[x] Connect the frontend to the new backend upload endpoint.'

