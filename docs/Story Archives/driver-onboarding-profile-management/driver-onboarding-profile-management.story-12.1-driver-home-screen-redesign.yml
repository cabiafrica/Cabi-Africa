id: story-12.1
epic: driver-onboarding-profile-management
slug: driver-home-screen-redesign
title: "Driver App: Home Screen Redesign"
status: Done
author: Gemini Code Assist
date: '2025-12-05T11:00:00Z'

description: >
  As a driver, I want a cleaner, more intuitive home screen that prioritizes my online/offline status,
  current earnings for the day, and a clear map view, so I can get the most important information at a glance.

acceptance_criteria:
  - The driver app's home screen must be redesigned to feature a large, prominent "Go Online" / "Go Offline" toggle button.
  - A clearly visible card or header must display the driver's total earnings for the current day.
  - The majority of the screen real estate should be dedicated to the map view.
  - Other actions (e.g., viewing earnings history, profile) should be accessible via a clean navigation bar or drawer, not cluttering the main screen.

files_to_be_created:
  # No new files, this is a redesign of an existing screen.

files_to_be_modified:
  - apps/driver-app/src/screens/home_screen.dart # To implement the new layout and components.

dev_notes: >
  This story implements the "Home Screen Redesign" requirement from the PRD (section 2.2). The goal is to declutter the main interface and focus on the driver's core tasks: going online and viewing immediate earnings. This is primarily a UI/UX story, refactoring the existing home screen to follow the new design. It will serve as the new foundation for other home screen features.
  PRD Reference: 2.2. Driver App -> Core Trip Management & Navigation -> Home Screen Redesign
