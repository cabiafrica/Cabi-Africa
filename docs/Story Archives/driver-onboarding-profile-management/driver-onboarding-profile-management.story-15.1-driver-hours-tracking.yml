id: story-15.1
epic: driver-onboarding-profile-management
slug: driver-hours-tracking
title: "Driver App: Track and Display Driving Hours"
status: Done
author: Gemini Code Assist
date: '2025-12-06T18:35:00Z'

description: >
  As a driver, I want the app to track my driving hours and alert me when I'm approaching a mandatory break time,
  so I can manage my fatigue and comply with safety regulations.

acceptance_criteria:
  - The driver app must track the cumulative time the driver is "Online".
  - A visual indicator of total hours driven for the day/week must be displayed in the driver's profile or dashboard.
  - The system must enforce a configurable driving limit (e.g., 12 hours in a 24-hour period).
  - When a driver is approaching their limit, the app must show a warning notification.
  - When the limit is reached, the app must automatically switch the driver to "Offline" status and prevent them from going online again until a mandatory break period has passed.
  - The backend must securely log driving sessions to prevent tampering.

files_to_be_created:
  # No new screens, this adds logic and UI elements to existing screens.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart # To display warnings and handle auto-offline.
  - # A backend service (e.g., user-service) to log and validate driving sessions.

dev_notes: >
  This is a critical safety and compliance feature from the PRD (section 2.2). The logic should be managed primarily on the backend to be authoritative and prevent client-side manipulation. The backend will need to record timestamps for when a driver goes online and offline. The driver app will be responsible for displaying the current status and showing alerts based on data provided by the backend.
  PRD Reference: 2.2. Driver App -> Safety & Wellness -> Driver Hours Tracking
