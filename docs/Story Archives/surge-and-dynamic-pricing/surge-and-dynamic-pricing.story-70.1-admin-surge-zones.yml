id: story-70.1
epic: surge-and-dynamic-pricing
slug: admin-surge-zones
title: Create Admin Interface for Managing Surge Pricing Zones
status: Done
author: Bob (sm)
date: '2024-08-09T21:15:00Z'

description: >
  As an operations manager, I need a map-based interface to define geographic
  zones where surge pricing can be applied, so I can manage supply and demand.

acceptance_criteria:
  - A new "Dynamic Pricing" section must be added to the `admin-panel`.
  - This section must feature a map where admins can draw, edit, and delete polygonal "surge zones".
  - Each zone can be named (e.g., "Downtown," "Airport").
  - The `ride-service` or a new `pricing-service` must be able to store and retrieve these geofenced zones.

files_to_be_created:
  - apps/admin-panel/src/app/pricing/page.tsx

files_to_be_modified:
  - libs/backend/ride-service/src/lib/pricing.service.ts # Or a new service to store zones

dev_notes: >
  This is the foundational story for all dynamic pricing. It provides the tool for defining where surge can happen. The actual calculation and application of surge will be in subsequent stories.
