id: story-70.6
epic: surge-and-dynamic-pricing
slug: surge-route-pricing
title: Implement Surge Pricing Based on Route, Not Just Pickup
status: DONE for Review
author: Bob (sm)
date: '2024-08-10T07:20:00Z'

description: >
  As an operations manager, I want surge pricing to apply to trips that travel
  *into* or *through* a surge zone, not just trips that start there, to better
  compensate drivers for entering high-demand areas.

acceptance_criteria:
  - The `fare-service` must be updated.
  - When calculating a fare, it must check if the proposed route intersects with any active surge zones.
  - A portion of the trip that falls within the surge zone should have the surge multiplier applied to its distance/time rate.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/fare.service.ts # To add route-based surge calculation

dev_notes: >
  This is a more equitable model of surge pricing that better reflects the driver's effort and the demand dynamics of the entire trip, not just the pickup point.
tasks:
  - id: task-1
    description: Update fare-service to calculate route-based surge pricing.
    subtasks:
      - "[x] Create `libs/backend/fare-service/src/lib/fare.service.ts`."
      - "[x] Implement logic to check if a trip's route intersects with active surge zones."
      - "[x] Apply the surge multiplier only to the segment of the trip that is within the surge zone."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  file_list:
    - libs/backend/fare-service/src/lib/fare.service.ts
  change_log:
    - file: libs/backend/fare-service/src/lib/fare.service.ts
      change: Created a new fare service that calculates route-based surge pricing by applying a multiplier to trip segments that fall within a surge zone.
