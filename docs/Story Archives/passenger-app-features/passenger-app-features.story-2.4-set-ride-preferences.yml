id: story-2.4
epic: passenger-app-features
slug: set-ride-preferences
title: "Passenger: Set Ride Preferences"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T14:15:00Z'

description: >
  As a passenger, I want to set my ride preferences (e.g., quiet ride, temperature),
  so that the driver is aware of my needs before they pick me up.

acceptance_criteria:
  - A new "Ride Preferences" section must be available in the `passenger-app`.
  - The screen must allow a passenger to set preferences such as:
    - "Quiet Ride" (toggle).
    - "Temperature" (e.g., "Cool", "Warm", "No Preference").
  - The selected preferences must be saved and associated with the passenger's profile.
  - When a passenger books a ride, these preferences must be passed along with the trip details to the assigned driver.
  - The `user-service` must be updated with endpoints to get and set these preferences.
  - New DTOs, `RidePreferencesDto` and `UpdateRidePreferencesDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/ride_preferences_screen.dart
  - docs/passenger-app-features.story-2.4-set-ride-preferences.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/passenger.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature enhances the passenger experience by allowing for personalization. The backend will store these preferences against the user's profile. The `ride-service` will need to fetch these preferences and include them in the trip details sent to the `driver-app`.

