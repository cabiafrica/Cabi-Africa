id: story-21.2
epic: passenger-app-features
slug: apply-promo-code
title: "Passenger: Apply a Promo Code to a Ride"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T14:30:00Z'

description: >
  As a passenger, I want to be able to apply a promotional code before I confirm my ride booking,
  so that I can receive a discount on my fare.

acceptance_criteria:
  - On the ride booking/confirmation screen in the `passenger-app`, there must be an input field to enter a promo code.
  - After entering a code and tapping "Apply", the app must call an endpoint in the `ride-service` or `promo-code-service` to validate the code.
  - If the code is valid, the UI must update to show the discounted fare.
  - If the code is invalid or expired, the UI must display an appropriate error message.
  - The selected promo code must be associated with the ride when the booking is confirmed.
  - New DTOs, `ApplyPromoCodeDto` and `AppliedPromoCodeDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/booking_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/widgets/promo_code_input_widget.dart
  - docs/passenger-app-features.story-21.2-apply-promo-code.yml

files_to_be_modified:
  - libs/shared/dtos/src/lib/passenger.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature directly impacts revenue and user acquisition. The backend validation logic is critical and must check the code's existence, expiry, usage limits, and scope (e.g., new users only). The frontend will provide the UI for this interaction.

