id: story-2.3
epic: passenger-app-features
slug: save-frequent-routes
title: "Passenger: Save Frequent Routes as Shortcuts"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T14:00:00Z'

description: >
  As a passenger, I want to save my frequent routes (e.g., "Home to Work") as shortcuts,
  so that I can quickly book them without re-entering the origin and destination each time.

acceptance_criteria:
  - After a trip is completed, the app must prompt the user to save the route as a shortcut.
  - A new "Saved Routes" section must be available in the `passenger-app`.
  - This section must list all the user's saved routes, showing the name (e.g., "Work"), origin, and destination.
  - Tapping on a saved route must pre-fill the booking screen with the corresponding origin and destination.
  - The user must be able to delete a saved route.
  - The `user-service` must be updated with endpoints to create, retrieve, and delete saved routes for a passenger.
  - New DTOs, `SavedRouteDto` and `CreateSavedRouteDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/saved_routes_screen.dart
  - libs/shared/dtos/src/lib/passenger.dto.ts
  - docs/passenger-app-features.story-2.3-save-frequent-routes.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a convenience feature to improve the booking experience for repeat users. The backend will need a new table to store these user-specific routes. The frontend will involve a new screen to list the routes and a prompt after a trip.

