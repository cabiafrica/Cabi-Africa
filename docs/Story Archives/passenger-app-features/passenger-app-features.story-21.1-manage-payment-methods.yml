id: story-21.1
epic: passenger-app-features
slug: manage-payment-methods
title: "Passenger: Manage Payment Methods"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T15:15:00Z'

description: >
  As a passenger, I want to be able to add, view, and manage my payment methods (e.g., credit cards),
  so that I can easily pay for my rides.

acceptance_criteria:
  - A new "Payment" or "Wallet" section must be available in the `passenger-app`.
  - This section must list all saved payment methods, showing the card type and last four digits.
  - The user must be able to add a new payment method by providing their card details via a secure payment gateway integration (e.g., Stripe, Braintree).
  - The user must be able to set one payment method as the "default" for all future rides.
  - The user must be able to delete a saved payment method.
  - The `payment-service` must be updated with endpoints to add, retrieve, and delete payment methods, and to set a default.
  - New DTOs, `PaymentMethodDto` and `AddPaymentMethodDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/payment_methods_screen.dart
  - libs/shared/dtos/src/lib/payment.dto.ts
  - docs/passenger-app-features.story-21.1-manage-payment-methods.yml

files_to_be_modified:
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This is a critical feature for monetization. The backend `payment-service` will need to integrate securely with a payment provider like Stripe. It will store customer IDs and payment method IDs, but never raw card details. The frontend will use the payment provider's SDK to tokenize card information securely.

