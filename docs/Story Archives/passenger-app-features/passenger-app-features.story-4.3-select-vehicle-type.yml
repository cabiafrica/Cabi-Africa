id: story-4.3
epic: passenger-app-features
slug: select-vehicle-type
title: "Passenger: Select Vehicle Type Before Booking"
status: DONE for Review
author: Gemini Code Assist
date: '2025-12-08T15:00:00Z'

description: >
  As a passenger, I want to be able to choose from different vehicle types (e.g., Standard, Premium, XL) before booking a ride,
  so that I can select an option that fits my needs and budget.

acceptance_criteria:
  - On the ride booking screen in the `passenger-app`, a list of available vehicle categories must be displayed.
  - Each category must show its name (e.g., "Standard"), capacity, and the estimated fare for the selected route.
  - The passenger must be able to select one vehicle type from the list.
  - The default selection should be the "Standard" category.
  - The `ride-service` must be updated to accept a `vehicleCategoryId` when a ride is booked.
  - The fare estimation logic must account for the selected vehicle category's specific rates.
  - A new DTO, `CreateBookingDto`, must be created in the shared DTOs library.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/vehicle_selection_widget.dart
  - docs/passenger-app-features.story-4.3-select-vehicle-type.yml

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/booking_screen.dart
  - libs/shared/dtos/src/lib/ride.dto.ts
  - libs/shared/dtos/src/index.ts

dev_notes: >
  This feature is a core part of the booking flow, allowing passengers to choose their service level. The frontend will display the options fetched from the backend. The `ride-service` will use the selected category to calculate the fare.

