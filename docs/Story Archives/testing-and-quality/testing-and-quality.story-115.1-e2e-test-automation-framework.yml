id: story-115.1
epic: testing-and-quality
slug: e2e-test-automation-framework
title: Implement End-to-End Test Automation Framework
status: DONE
author: Bob (sm)
date: '2024-08-10T07:00:00Z'

description: >
  As a QA engineer, I need a framework to write and run automated end-to-end
  tests for critical user flows, so we can catch regressions before they reach production.

acceptance_criteria:
  - A test automation framework (e.g., Patrol, Appium) must be selected and integrated into the mobile app projects.
  - The framework must be configured to run on a CI/CD pipeline.
  - An initial test suite must be created that covers the core passenger ride booking flow from start to finish.

files_to_be_created:
  - apps/passenger-app/integration_test/booking_flow_test.dart

dev_notes: >
  This is the foundational story for the new `testing-and-quality` epic. Investing in test automation is critical for maintaining quality as the platform grows in complexity.
