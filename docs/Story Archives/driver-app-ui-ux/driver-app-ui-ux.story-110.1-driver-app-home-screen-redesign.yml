id: story-110.1
epic: driver-app-ui-ux
slug: driver-app-home-screen-redesign
title: Redesign Driver App Home Screen for Clarity
status: Done
author: Bob (sm)
date: '2024-08-10T06:50:00Z'

description: >
  As a driver, I want a cleaner, more intuitive home screen that prioritizes
  key information like my online status, current earnings, and access to the map.

acceptance_criteria:
  - A UX/UI design process must be conducted to produce new mockups for the driver home screen.
  - Key information (online/offline status, current earnings, active quests) must be more prominent and glanceable.
  - The map should take up a larger portion of the screen.
  - Less frequently used features should be moved into a secondary menu to reduce clutter.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart # To be refactored based on new design

dev_notes: >
  This is the foundational story for the new `driver-app-ui-ux` epic. A driver's home screen is their primary tool; improving its usability can have a major impact on their efficiency and satisfaction.

