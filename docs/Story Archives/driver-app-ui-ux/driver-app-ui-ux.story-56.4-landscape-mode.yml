id: story-56.4
epic: driver-app-ui-ux
slug: landscape-mode
title: Implement Driver App Landscape Mode
status: Done
author: Bob (sm)
date: '2024-08-06T09:15:00Z'

description: >
  As a driver who uses a dashboard-mounted phone, I want the app to work in
  landscape mode, so that it fits my screen orientation.

acceptance_criteria:
  - The `driver-app` must support both portrait and landscape orientations.
  - All screens, especially the main map and navigation view, must have a responsive layout that adapts gracefully to landscape mode.
  - This will require refactoring many UI components to be responsive.

files_to_be_created: []

files_to_be_modified:
  - All major screens and widgets in `apps/driver-app`.

dev_notes: >
  A significant UI/UX effort that can greatly improve usability for many drivers. Each screen needs to be re-evaluated and potentially redesigned for a landscape layout.
