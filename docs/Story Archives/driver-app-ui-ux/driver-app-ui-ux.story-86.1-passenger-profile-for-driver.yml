id: story-86.1
epic: driver-app-ui-ux
slug: passenger-profile-for-driver
title: Implement "Passenger Profile" for Drivers
status: Done
author: Bob (sm)
date: '2024-08-08T11:17:00Z'

description: >
  As a driver, when I accept a ride, I want to be able to see some basic,
  non-sensitive information about the passenger, such as their average
  rating and total number of trips.

acceptance_criteria:
  - When a ride request is shown to the driver, it must include the passenger's average rating.
  - After accepting, the driver can tap on the passenger's name to see a simple profile.
  - The profile should show their name, rating, total trips, and any compliments they've received from other drivers.
  - This helps drivers get a better sense of the passenger they are about to pick up.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/ride_request_panel.dart # To display the passenger info

dev_notes: >
  This provides symmetry with the passenger's view of the driver, building a two-way system of trust and reputation.