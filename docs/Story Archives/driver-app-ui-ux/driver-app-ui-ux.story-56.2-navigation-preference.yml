id: story-56.2
epic: driver-app-ui-ux
slug: navigation-preference
title: Implement One-Click Navigation App Preference
status: Done
author: Bob (sm)
date: '2024-08-06T09:05:00Z'

description: >
  As a driver, I want to set my preferred third-party navigation app (e.g.,
  Waze, Google Maps) and have the app launch it with one tap, so I can start
  navigating without extra steps.

acceptance_criteria:
  - In the `driver-app` settings, a "Navigation App" preference must be available.
  - The driver can choose between "In-App Navigation", "Waze", or "Google Maps".
  - When the driver taps the "Navigate" button for a pickup or dropoff, the app should launch the selected app directly with the destination pre-filled.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # To add the preference
  - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart # To implement the one-click launch

dev_notes: >
  A simple but highly effective quality-of-life improvement for drivers, allowing them to use the tools they are most comfortable with.

tasks:
  - id: task-1
    description: Add navigation preference to the driver's settings screen.
    subtasks:
      - "[x] Modify `Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart` to include a selection UI for the preferred navigation app."
      - "[x] Create a mock service to simulate saving the preference."
  - id: task-2
    description: Implement one-click navigation launch based on preference.
    subtasks:
      - "[x] Create a utility/service to handle launching external map apps with a destination."
      - "[x] Modify the trip panel widget to use this service when the 'Navigate' button is tapped."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  file_list:
    - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart
    - Cabi Alpha/mobile/driver_app/lib/utils/map_launcher.dart
    - Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart
  change_log:
    - file: Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart
      change: Added a dialog to the settings screen for drivers to select and save their preferred navigation app.
    - file: Cabi Alpha/mobile/driver_app/lib/utils/map_launcher.dart
      change: Created a utility to launch external navigation apps (Google Maps, Waze) using URL schemes.
    - file: Cabi Alpha/mobile/driver_app/lib/widgets/trip_in_progress_panel.dart
      change: Created a trip panel widget with a 'Navigate' button that uses the map launcher utility.
