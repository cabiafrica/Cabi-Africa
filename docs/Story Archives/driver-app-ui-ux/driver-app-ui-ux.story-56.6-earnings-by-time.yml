id: story-56.6
epic: driver-app-ui-ux
slug: earnings-by-time
title: Implement "Earnings by Time of Day" View
status: Done
author: Bob (sm)
date: '2024-08-08T11:06:00Z'

description: >
  As a driver, I want to see a breakdown of my earnings by time of day and
  day of the week, so that I can identify the most profitable times to drive.

acceptance_criteria:
  - In the driver's earnings screen, a new analytics view must be added.
  - It should display a heatmap or bar chart showing the driver's average hourly earnings for different time blocks (e.g., Mon 9-10 AM, Fri 5-6 PM).
  - The `analytics-service` must be able to calculate this personalized earnings data.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To add the new analytics view
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To calculate the data

dev_notes: >
  A powerful data-driven tool that helps drivers optimize their work strategy by showing them when they can earn the most.