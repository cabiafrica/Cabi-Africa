id: story-43.1
epic: environmental-options
slug: green-rides
title: Implement "Green" / EV Ride Option
status: Done
author: Bob (sm)
date: '2024-07-31T11:15:00Z'

description: >
  As an environmentally conscious passenger, I want to be able to request a
  ride in an electric or hybrid vehicle, so that I can reduce my carbon footprint.

acceptance_criteria:
  - A "Green" vehicle type/attribute must be created.
  - Drivers must be able to specify if their vehicle is an EV or Hybrid during vehicle registration (`story-28.1`).
  - A "Green" ride option must be available to passengers during booking, possibly at a slight premium.
  - When selected, the matching algorithm must only consider drivers in EV/Hybrid vehicles.
  - The app could also display an estimate of the CO2 emissions saved by choosing this option.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/vehicle-service/src/lib/vehicle.service.ts # To add EV/Hybrid flag
  - apps/driver-app/src/screens/vehicle_management_screen.dart # To add the vehicle attribute
  - apps/passenger-app/src/widgets/ride_booking_panel.dart # To add the "Green" option

dev_notes: >
  This is the first story for a new `environmental-options` epic. It caters to a growing market segment and improves the company's brand image.
