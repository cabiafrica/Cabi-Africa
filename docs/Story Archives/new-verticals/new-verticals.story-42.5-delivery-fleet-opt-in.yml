id: story-42.5
epic: new-verticals
slug: delivery-fleet-opt-in
title: Implement "Delivery Fleet" Driver Opt-In
status: DONE
author: Bob (sm)
date: '2024-08-01T09:12:00Z'

description: >
  As a driver, I want to be able to opt-in or out of receiving delivery
  requests, so that I can choose whether I want to transport packages and food.

acceptance_criteria:
  - In the `driver-app` settings, toggles must be available for "Accept Rides", "Accept Package Deliveries", and "Accept Food Deliveries".
  - The driver's preferences must be stored in the `user-service`.
  - The matching algorithm in the `ride-service` must respect these preferences when dispatching any type of job.
  - A driver must be able to change these preferences at any time.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # To add the service toggles
  - libs/backend/user-service/src/lib/user.service.ts # To store preferences
  - libs/backend/ride-service/src/lib/ride.service.ts # To filter drivers based on service preference

dev_notes: >
  This is a crucial story for our new verticals, giving drivers control over the type of work they do. It makes the matching logic more complex as it needs to filter by service type.
