id: story-42.2
epic: new-verticals
slug: package-delivery-pricing
title: Implement Pricing for Package Delivery
status: DONE
author: Bob (sm)
date: '2024-07-31T11:03:00Z'

description: >
  As an administrator, I want to set a separate pricing model for package
  deliveries, so that we can price this new service appropriately.

acceptance_criteria:
  - The `admin-panel` must allow setting a distinct pricing structure for the "Delivery" service type.
  - This structure should include a base fare, per-km rate, and potentially factors based on package size/weight.
  - The `pricing-service` (or `ride-service`) must store these delivery pricing rules.
  - When a user requests a delivery (`story-42.1`), the fare estimation must use this specific pricing model.

files_to_be_created: []

files_to_be_modified:
  - apps/admin-panel/src/app/settings/pricing/page.tsx # Or similar, to add delivery pricing
  - libs/backend/ride-service/src/lib/fare.service.ts # To handle different pricing models based on trip type (ride vs. delivery)

dev_notes: >
  This story defines the business model for the package delivery vertical. The fare calculation service must be made more generic to handle different pricing strategies for different service types.
