id: story-65.2
epic: new-verticals
slug: vehicle-parts-marketplace
title: Implement "Vehicle Parts" Marketplace
status: DONE
author: Bob (sm)
date: '2024-08-07T09:06:00Z'

description: >
  As a driver, I want a marketplace where I can buy and sell used car parts
  with other drivers on the platform, so that I can find affordable parts or
  sell things I don't need.

acceptance_criteria:
  - A new "Parts Marketplace" must be added to the `driver-app`.
  - Drivers can create listings with photos, a description, and a price.
  - Other drivers can browse, search, and contact the seller via in-app chat.
  - The platform does not handle the payment or logistics, it only facilitates the connection.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/marketplace_screen.dart # To add the new marketplace section

dev_notes: >
  This builds a C2C marketplace within our driver ecosystem, adding value by helping drivers reduce their maintenance costs.
