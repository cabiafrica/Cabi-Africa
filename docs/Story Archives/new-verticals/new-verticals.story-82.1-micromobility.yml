id: story-82.1
epic: new-verticals
slug: micromobility
title: Implement "Bike & Scooter" Rentals
status: DONE
author: Bob (sm)
date: '2024-08-08T11:13:00Z'

description: >
  As a user, I want to see nearby partner bikes and scooters on my map, and
  be able to unlock and rent them for short trips.

acceptance_criteria:
  - This is the first story for a new `new-verticals` epic.
  - The app must integrate with the APIs of third-party micromobility providers (e.g., Lime, Bird).
  - The passenger map will display the real-time location of available bikes/scooters.
  - Tapping on one will allow the user to unlock it, typically by scanning a QR code.
  - The rental session is managed and billed by the third-party provider, but initiated from our app.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To display and interact with micromobility options

dev_notes: >
  This further cements the app as a multi-modal MaaS platform. It's an API integration project that can be complex depending on the partner.
