id: story-42.3
epic: new-verticals
slug: food-delivery
title: Implement Food Delivery Service
status: DONE
author: Bob (sm)
date: '2024-07-31T11:09:00Z'

description: >
  As a user, I want to order food from local restaurants through the app and
  have it delivered by a driver, so that I can get meals delivered on demand.

acceptance_criteria:
  - A new "Food" tab or section must be added to the `passenger-app`.
  - This section will list partner restaurants and their menus.
  - A new `restaurant-service` must be created to manage restaurant data, menus, and orders.
  - Users can add items to a cart and place an order.
  - When an order is placed, the `restaurant-service` notifies the restaurant.
  - Once the restaurant confirms the order is ready for pickup, the `ride-service` is called to dispatch a driver for the delivery (similar to package delivery).
  - The user can track the order status and driver location in real-time.

files_to_be_created:
  - libs/backend/restaurant-service/src/lib/restaurant.service.ts
  - apps/restaurant-portal/src/app/page.tsx # A new web portal for restaurants to manage orders

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart # To add the "Food" entry point

dev_notes: >
  A massive new vertical that requires building a three-sided marketplace (customers, drivers, restaurants). This involves creating entirely new services and a new web portal for restaurant partners.
