id: story-50.4
epic: new-verticals
slug: bus-tickets
title: Implement Intercity Bus Ticket Booking
status: DONE
author: Bob (sm)
date: '2024-08-05T09:17:00Z'

description: >
  As a user planning a longer trip, I want to be able to search for and book
  intercity bus tickets within the app, so I can manage both my local and
  long-distance travel in one place.

acceptance_criteria:
  - A new "Bus Travel" section must be added to the `passenger-app`.
  - The app must integrate with bus aggregator APIs to fetch routes, schedules, and pricing.
  - Users must be able to select a seat, book, and pay for their bus ticket through our app.
  - The `payment-service` must handle settlement with the bus operators.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/bus_booking_screen.dart

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle bus ticket payments

dev_notes: >
  This feature further expands the app into a multi-modal travel solution, capturing a different segment of the travel market.
