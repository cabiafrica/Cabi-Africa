id: story-42.4
epic: new-verticals
slug: proof-of-delivery
title: Implement "Proof of Delivery" for Packages
status: DONE
author: Bob (sm)
date: '2024-08-01T09:04:00Z'

description: >
  As a driver delivering a package, I need to capture proof of delivery,
  such as a photo or a signature, so that the delivery can be securely confirmed.

acceptance_criteria:
  - When the driver arrives at the delivery destination, the `driver-app` must prompt them to capture proof of delivery.
  - The driver must have the option to take a photo of the package at the dropoff location.
  - Alternatively, the driver can capture the recipient's signature directly on the app screen.
  - The captured photo or signature must be uploaded and associated with the delivery trip record in the `ride-service` or `document-service`.
  - The sender must be able to view the proof of delivery in their trip history.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/widgets/trip_in_progress_panel.dart # To add proof of delivery capture UI
  - libs/backend/ride-service/src/lib/ride.service.ts # To store the proof of delivery
  - apps/passenger-app/src/screens/trip_detail_screen.dart # To display the proof of delivery

dev_notes: >
  This is a critical feature for the package delivery vertical to handle disputes and confirm service completion. It adds new UI flows and data types to the trip model.
