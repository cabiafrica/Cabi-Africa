id: story-105.1
epic: driver-documents
slug: driver-upload-license
title: Driver Upload License and Documents
status: DONE
author: Sarah (po)
date: '2024-08-12T19:00:00Z'

description: >
  As a driver, I want to upload photos of my required documents (License, Insurance, etc.)
  so that I can be verified and allowed to drive on the platform.

acceptance_criteria:
  - The Driver App must have a `DocumentManagementScreen`.
  - The screen must list all required documents.
  - Each item must show its current status (Missing, Pending, Approved, Rejected).
  - If Rejected, the reason must be displayed.
  - Drivers can tap "Upload" on Missing or Rejected items to pick a file/photo.
  - Uploading a document changes its status to "Pending Review".
  - The app must interact with the `document-service`.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/document_management_screen.dart
  - libs/backend/document-service/src/lib/document.service.ts
  - libs/backend/document-service/src/lib/document.controller.ts

dev_notes: >
  This story focuses on the driver-side submission. The admin-side review process
  is handled in `story-12.2`. This implementation mocks the actual file binary transfer
  and focuses on the status flow and UI feedback.

tasks:
  - id: task-1
    description: Implement backend document handling.
    subtasks:
      - "[x] Create `document.service.ts` with mock document states."
      - "[x] Create `document.controller.ts` exposing `GET /documents` and `POST /documents/upload`."
  - id: task-2
    description: Implement frontend document list.
    subtasks:
      - "[x] Create `document_management_screen.dart`."
      - "[x] Implement status indicators and upload simulation."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
