id: story-18.3
epic: passenger-experience
slug: passenger-share-trip-status
title: "Passenger: Share Live Trip Status with Trusted Contacts"
status: DONE
author: Gemini Code Assist
date: '2025-12-04T09:00:00Z'

description: >
  As a passenger on an active trip, I want to share a link with my live location and trip details
  (driver name, car, ETA) with a trusted contact, so they can monitor my journey for safety and peace of mind.

acceptance_criteria:
  - An option "Share Trip Status" must be available on the `in_trip_panel`.
  - Tapping this option must open the native device sharing dialog.
  - The sharing dialog must be pre-populated with a message containing a unique, publicly accessible URL.
  - The backend must generate a short-lived, secure token associated with the trip to create this unique URL (e.g., `https://cabi.com/track/trip/{token}`).
  - Visiting the URL must display a simple web page showing a map with the car's live location, driver's first name, vehicle model, and the estimated time of arrival.
  - The shared link must become inactive a short time after the trip is completed or cancelled (e.g., 1 hour).
  - If the user has set up Trusted Contacts (from story-32.1), they should appear as quick-share options.

files_to_be_created:
  - libs/backend/trip-sharing-service/src/lib/trip_sharing.service.ts # To generate and manage sharing tokens.
  - Cabi Alpha/web/user_portal/app/track/trip/[token]/page.tsx # The public-facing web page for tracking a trip.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/in_trip_panel.dart # To add the "Share Trip Status" button and logic.

dev_notes: >
  This story implements a key safety feature from the PRD (section 2.1). The main complexity is on the backend, which needs a new microservice or logic to generate secure, temporary tokens for sharing live trip data. This token will be used to fetch trip details for a public, unauthenticated web view.

  The frontend work in the passenger app is relatively straightforward, involving the integration of a share plugin to trigger the native OS sharing UI. This story has a soft dependency on `story-32.1` (Emergency Contacts) to enhance the sharing flow.
  PRD Reference: 2.1. Passenger App -> Safety & Support -> Share Trip Status
