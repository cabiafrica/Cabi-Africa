id: story-2.3
epic: passenger-experience
slug: passenger-saved-routes
title: "Passenger: Save Frequent Routes as Shortcuts"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T16:05:00Z'

description: >
  As a passenger, I want to save a complete, frequent route (e.g., "Gym to Office") as a one-tap shortcut on my home screen,
  so I can book my common journeys instantly.

acceptance_criteria:
  - After completing a ride, the user should be prompted with an option to "Save this route".
  - In the `TripDetailsScreen` (from trip history), a "Save Route" button must be available.
  - Saving a route must allow the user to give it a custom name (e.g., "Morning Commute").
  - Saved routes must appear as shortcuts on the `HomeScreen`, separate from "Home" and "Work".
  - Tapping a saved route shortcut must pre-fill both the pickup and destination fields in the booking flow.
  - The `user-service` must be updated with endpoints to create, view, and delete saved routes for a user.

files_to_be_created:
  - apps/passenger-app/src/screens/saved_routes_screen.dart # For managing all saved routes.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To display saved route shortcuts.
  - apps/passenger-app/src/screens/trip_details_screen.dart # To add the "Save Route" button.
  - libs/backend/user-service/src/lib/user.service.ts # To add methods for managing saved routes.
  - libs/backend/user-service/src/lib/user.controller.ts # To expose CRUD endpoints for saved routes.

dev_notes: >
  This story enhances the personalization features from the PRD (section 2.1), building on `story-2.2` (Saved Places). The backend `user-service` will need a new data model to store saved routes, linking a user ID to a name, pickup coordinates, and destination coordinates. The frontend work involves adding the save action post-trip and displaying these new shortcuts on the home screen for quick access.
  PRD Reference: 2.1. Passenger App -> Convenience & Personalization -> Saved Routes
