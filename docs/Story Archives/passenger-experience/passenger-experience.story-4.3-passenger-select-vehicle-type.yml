id: story-4.3
epic: passenger-experience
slug: passenger-select-vehicle-type
title: "Passenger: Select Vehicle Type Before Booking"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T16:00:00Z'

description: >
  As a passenger, I want to choose from different vehicle types (e.g., "Standard", "XL") before confirming my ride,
  so I can see the estimated fare for each and select the one that best suits my needs for space or budget.

acceptance_criteria:
  - After setting pickup and destination, the `RideConfirmationPanel` must display a list of available vehicle types.
  - Each vehicle type in the list must show its name (e.g., "Standard", "XL"), an icon, estimated passenger capacity, and the calculated fare for the route.
  - The user must be able to select one vehicle type from the list, and the selected option must be visually highlighted.
  - The main "Confirm Ride" button must be associated with the currently selected vehicle type.
  - The backend `ride-service` must be updated to provide fare estimates for all available vehicle types for a given route.
  - The ride creation request must include the selected `vehicleTypeId`.

files_to_be_created:
  # No new files, this modifies existing widgets and services.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_confirmation_panel.dart # To add the vehicle type selector UI.
  - libs/backend/ride-service/src/lib/ride.service.ts # To add logic to calculate fares for multiple vehicle types.
  - libs/backend/ride-service/src/lib/ride.controller.ts # To expose a new fare estimation endpoint that returns multiple options.

dev_notes: >
  This story implements a fundamental part of the booking flow from the PRD (section 2.1). The backend will need to access the vehicle type configuration (managed by admins) to calculate fares based on different base rates and per-mile/per-minute charges. The frontend will need to render a horizontal or vertical list of options within the confirmation panel, likely as part of the work done in `story-4.2`. This feature is crucial for offering tiered services.
  PRD Reference: 2.1. Passenger App -> Core Ride Booking & Management -> Vehicle Type Selection
