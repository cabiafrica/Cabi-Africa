id: story-18.2
epic: passenger-experience
slug: passenger-schedule-ride
title: "Passenger: Schedule a Ride for a Future Date/Time"
status: DONE
author: Bob (sm)
date: '2025-12-02T18:00:00Z'

description: >
  As a passenger, I want to schedule a ride for a future date and time,
  so I can plan my travel in advance for important appointments and have peace of mind that my ride is booked.

acceptance_criteria:
  - On the `RideConfirmationPanel`, a "Schedule" option (e.g., a button or icon) must be present.
  - Tapping "Schedule" must open a native date and time picker dialog.
  - The system must enforce business rules for scheduling (e.g., cannot schedule less than 30 minutes in the future, or more than 30 days in advance).
  - After a user selects a valid future date/time and confirms, the panel must update to show the selected scheduled time.
  - The main confirmation button text must change from "Confirm Ride" to "Schedule Ride".
  - Tapping "Schedule Ride" must call a new `scheduleRide()` method in the `ride-service` which creates a ride record with a 'scheduled' status.
  - The backend must return a confirmation of the scheduled ride.
  - After successful scheduling, the user should be shown a confirmation screen and then returned to the home screen.
  - The user must be able to view their upcoming scheduled rides (this is covered in story-22.5).

files_to_be_created:
  # No new files, this modifies existing UI components.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/ride_confirmation_panel.dart # To add the "Schedule" button and logic.
  - libs/backend/ride-service/src/lib/ride.service.ts # To add a new `scheduleRide` method.
  - libs/backend/ride-service/src/lib/ride.controller.ts # To expose the new `POST /rides/schedule` endpoint.

dev_notes: >
  This story introduces the core scheduling functionality into the passenger booking flow, as defined in the PRD (section 2.1).
  It builds upon the existing `RideConfirmationPanel` (from story-4.2). The main effort will be in the UI modification to include the date/time picker flow and the backend logic in the `ride-service` to handle the creation of a 'scheduled' ride.
  This story supersedes the initial `story-18.1` and should be prioritized for implementation.
  The management of these scheduled rides (view/cancel) is handled by `story-22.5`.
  PRD Reference: 2.1. Passenger App -> Scheduled Rides
