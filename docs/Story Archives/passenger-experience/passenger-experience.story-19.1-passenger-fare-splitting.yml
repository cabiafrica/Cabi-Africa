id: story-19.1
epic: passenger-experience
slug: passenger-fare-splitting
title: "Passenger: Split a Fare with Other Riders"
status: DONE
author: Bob (sm)
date: '2025-12-03T10:00:00Z'

description: >
  As a passenger, I want to initiate a fare split with other passengers in my ride,
  so that we can easily and fairly share the cost of the trip directly within the app.

acceptance_criteria:
  - During an active trip, a "Split Fare" option must be available on the `in_trip_panel`.
  - Tapping "Split Fare" navigates to a new `FareSplitScreen`.
  - The `FareSplitScreen` must allow the initiating passenger to select other riders to invite to the split. (For v1, this can be done by searching for other Cabi users by phone number).
  - The system must send an in-app notification or SMS to the invited users with a request to join the fare split.
  - Invited users must be able to accept or decline the split request.
  - When an invited user accepts, the UI for all participants must update to show the new per-person cost.
  - A new backend service (`fare-split-service`) must be created to manage the state of the fare split (invitations, acceptances, declines).
  - At the end of the trip, the `payment-service` must charge each participant their respective share of the final fare.
  - If an invited user declines or does not respond by the end of the trip, their share of the cost remains with the initiating passenger.
  - The final trip receipt for all participants must clearly show the total fare and the amount they personally paid.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/fare_split_screen.dart
  - libs/backend/fare-split-service/src/lib/fare_split.service.ts
  - libs/backend/fare-split-service/src/lib/fare_split.controller.ts

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/in_trip_panel.dart # To add the "Split Fare" button.
  - libs/backend/payment-service/src/lib/payment.service.ts # To integrate with the fare-split-service for final charge calculation.
  - libs/backend/notification-service/src/lib/notification.service.ts # To send fare split invitations.

dev_notes: >
  This story introduces a socially interactive payment feature as outlined in the PRD (section 2.1).
  The core complexity lies in the backend state management. A new `fare-split-service` will be responsible for creating a fare split session, tracking invites, and communicating the final breakdown to the `payment-service`.
  The frontend work involves creating the invitation UI and updating the in-trip view to reflect the split status.
  The initial version will use phone number search to find other users. Future iterations could integrate with the device's contacts.
  PRD Reference: 2.1. Passenger App -> Fare Splitting
