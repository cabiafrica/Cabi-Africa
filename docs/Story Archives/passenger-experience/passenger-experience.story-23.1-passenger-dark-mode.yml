id: story-23.1
epic: passenger-experience
slug: passenger-dark-mode
title: "Passenger App: Implement Dark Mode"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T18:45:00Z'

description: >
  As a passenger, I want the app to support a dark mode theme,
  so I can use it comfortably in low-light conditions and reduce battery consumption on OLED screens.

acceptance_criteria:
  - The app must provide a setting to switch between "Light", "Dark", and "System Default" themes.
  - When "Dark" mode is selected, all screens, dialogs, and components must adapt to a dark color scheme.
  - All text must be legible, and all interactive elements must be clearly visible and distinguishable in dark mode.
  - The map style must also update to a dark version when dark mode is active.
  - The theme implementation must use the shared `CabiTheme` and `CabiColors` from the `core_ui` package.

files_to_be_created:
  # No new screens, this is a theme-level change.

files_to_be_modified:
  - packages/core_ui/lib/src/theme/cabi_colors.dart # To add dark theme color definitions.
  - packages/core_ui/lib/src/theme/cabi_theme.dart # To define the dark ThemeData.
  - apps/passenger-app/lib/main.dart # To manage theme switching.

dev_notes: >
  This story implements a standard but important UI/UX feature from the PRD (section 2.1). It builds upon the shared UI packages (`story-9.5`). The work involves defining a dark color palette in `CabiColors` and creating a corresponding `ThemeData` in `CabiTheme`. A theme provider/manager will be needed at the root of the app to allow the user to switch themes and persist their choice. All custom-colored widgets throughout the app must be checked to ensure they adapt correctly.
  PRD Reference: 2.1. Passenger App -> UI/UX Enhancements -> Dark Mode
