id: story-21.1
epic: passenger-experience
slug: passenger-manage-payments
title: "Passenger: Manage Payment Methods"
status: DONE
author: Gemini Code Assist
date: '2025-12-06T11:10:00Z'

description: >
  As a passenger, I want to be able to add, view, and remove my payment methods (e.g., credit cards),
  so I can manage how I pay for my rides.

acceptance_criteria:
  - A new "Payment" or "Wallet" screen must be created in the `passenger-app`, accessible from the profile/settings.
  - The screen must allow a user to add a new payment method, integrating with a payment provider (e.g., Stripe) to securely capture card details.
  - The screen must display a list of the user's saved payment methods (e.g., "Visa ending in 4242").
  - The user must be able to set one payment method as their default.
  - The user must be able to remove a saved payment method.
  - The backend `payment-service` must be created/updated with endpoints to handle these CRUD operations for payment methods.

files_to_be_created:
  - apps/passenger-app/src/screens/payment_methods_screen.dart
  - libs/backend/payment-service/src/lib/payment.service.ts
  - libs/backend/payment-service/src/lib/payment.controller.ts

dev_notes: >
  This story is a critical MVP feature, enabling the core commerce functionality of the app. The main complexity is the secure integration with a PCI-compliant payment gateway like Stripe. The frontend should use the provider's SDK (e.g., Stripe Elements) to tokenize card information, ensuring sensitive data never touches our servers. The backend `payment-service` will store the non-sensitive token and customer ID provided by the payment gateway.
  PRD Reference: 2.1. Passenger App -> Payments & Promotions -> Payment Method Management
