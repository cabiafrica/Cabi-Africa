id: story-2.2
epic: passenger-experience
slug: passenger-saved-places
title: 'Passenger: Save "Home" and "Work" Addresses for Quick Booking'
status: DONE
author: Gemini Code Assist
date: '2025-12-04T09:15:00Z'

description: >
  As a passenger, I want to save my "Home" and "Work" addresses in the app,
  so I can see one-tap shortcuts on the home screen to book rides to these locations quickly.

acceptance_criteria:
  - A "Saved Places" section must be added to the app's settings or profile screen.
  - Within "Saved Places", a user must be able to set or update addresses for "Home" and "Work".
  - On the main `HomeScreen`, if "Home" or "Work" are set, prominent shortcut buttons must be displayed.
  - Tapping a shortcut (e.g., "Take me Home") must pre-fill the destination field in the booking flow with the corresponding saved address.
  - The `user-service` must be updated with an endpoint to save/update these addresses for the user's profile.

files_to_be_created:
  - apps/passenger-app/src/screens/saved_places_screen.dart

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To display the shortcut buttons.
  - libs/backend/user-service/src/lib/user.service.ts # To add methods for managing saved places.
  - libs/backend/user-service/src/lib/user.controller.ts # To expose endpoints for saved places.

dev_notes: >
  This story directly addresses the "Homepage Redesign" requirement from the PRD (section 2.1) by adding a major convenience feature. The backend will need to extend the user profile model to store these specific addresses. The frontend work involves creating a management screen for these places and, most importantly, modifying the `HomeScreen` to conditionally display the new shortcut buttons.
  PRD Reference: 2.1. Passenger App -> Core Ride Booking & Management -> Homepage Redesign
