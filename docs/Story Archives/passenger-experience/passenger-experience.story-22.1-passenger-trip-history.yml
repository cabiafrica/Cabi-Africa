id: story-22.1
epic: passenger-experience
slug: passenger-trip-history
title: "Passenger: View and Filter Trip History"
status: DONE
author: Gemini Code Assist
date: '2025-12-04T09:05:00Z'

description: >
  As a passenger, I want to view a list of my past trips, including details like the route map,
  fare breakdown, and driver information, so I can keep track of my activity and expenses.

acceptance_criteria:
  - A "Trip History" or "My Rides" option must be available in the app's main navigation or profile section.
  - Tapping this option navigates to a new `TripHistoryScreen`.
  - The `TripHistoryScreen` must call a new backend endpoint `GET /rides/my-history` to fetch a paginated list of the user's past trips.
  - Each item in the list must display the date, pickup/destination addresses, and the final fare.
  - Tapping a trip item must navigate to a `TripDetailsScreen` showing a route map, full fare breakdown, and driver details.
  - The history screen must include basic filtering options (e.g., by date range).

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/trip_history_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/trip_details_screen.dart

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To add a method to fetch user's ride history.
  - libs/backend/ride-service/src/lib/ride.controller.ts # To expose the new GET /rides/my-history endpoint.
  - # The app's main navigation component (e.g., Drawer or ProfileScreen) to add the link.

dev_notes: >
  This story implements a core user feature from the PRD (section 2.1). The backend work is similar to other history-fetching endpoints but scoped to the authenticated passenger. The frontend will involve creating two new screens: a list view and a detail view. This feature is a prerequisite for other post-trip actions like adding a tip later or reporting an issue.
  PRD Reference: 2.1. Passenger App -> Core Ride Booking & Management -> Trip History
