id: story-140.1
epic: user-account-management
slug: self-serve-account-deletion
title: Implement Self-Serve Account Deletion
status: DONE
author: Sarah (po)
date: '2024-08-12T15:00:00Z'

description: >
  As a user (driver or passenger), I want to permanently delete my account and
  all associated personal data directly from the app, so that I can exercise
  my right to be forgotten in compliance with privacy regulations.

acceptance_criteria:
  - A "Delete Account" option must be available within the user's main Profile/Settings screen in both the `passenger-app` and `driver-app`.
  - Tapping "Delete Account" must trigger a multi-step confirmation process to prevent accidental deletion.
  - The confirmation flow must clearly explain that the action is irreversible and will permanently delete their data.
  - To confirm, the user must re-enter their password and type a confirmation phrase (e.g., "DELETE") into a text field to enable the final delete button.
  - Upon final confirmation, the app must call a new `deleteAccount()` method in the shared `core_auth` package.
  - A new secure `DELETE /user/me` endpoint must be created in the `user-service`.
  - The `user-service` will orchestrate the deletion, starting with the user's account in the authentication provider (e.g., Cognito).
  - The `user-service` must then publish a `UserDeleted` event containing the user's ID.
  - Other microservices (e.g., `ride-service`, `payment-service`, `document-service`) must subscribe to the `UserDeleted` event to asynchronously anonymize or delete associated user data.
  - After the deletion request is successfully submitted, the user is immediately logged out and returned to the `LoginScreen`.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart
  - libs/shared/auth/lib/src/auth_service.dart
  - libs/backend/user-service/src/lib/user.controller.ts
  - libs/backend/user-service/src/lib/user.service.ts
  - Other services (e.g., `payment-service`, `ride-service`) will need to be modified to subscribe to the `UserDeleted` event.

dev_notes: >
  This is a security-critical and highly destructive feature that must be handled with extreme care to comply with data privacy regulations (e.g., GDPR, CCPA). The multi-step confirmation on the frontend is mandatory to prevent accidental deletion. An event-driven approach for cascading deletes/anonymization is crucial for maintaining data consistency across our microservices.

  It is critical to define what data can be hard-deleted versus what must be retained for legal or financial auditing reasons. For retained data, all Personally Identifiable Information (PII) must be anonymized while preserving transactional integrity. This story consolidates the requirements from `story-19.3`, `story-55.3`, and `story-55.7`.
