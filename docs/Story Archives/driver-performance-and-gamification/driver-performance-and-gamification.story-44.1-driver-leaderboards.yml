id: story-44.1
epic: driver-performance-and-gamification
slug: driver-leaderboards
title: Implement Driver Leaderboards
status: Done
author: Bob (sm)
date: '2024-08-01T09:00:00Z'

description: >
  As a driver, I want to see how I rank against other drivers in my city on
  key metrics, so that I can have a sense of competition and achievement.

acceptance_criteria:
  - A new "Leaderboards" screen must be added to the `driver-app`.
  - The screen must display weekly or monthly leaderboards for metrics like "Total Trips", "5-Star Ratings", and "Total Earnings".
  - The driver's own position on the leaderboard must be highlighted.
  - For privacy, drivers should be identified by their first name and last initial, or a chosen username.
  - The `analytics-service` must have a scheduled job to compile and cache these leaderboards.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/leaderboard_screen.dart

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To add leaderboard generation logic
  - libs/backend/analytics-service/src/lib/analytics.controller.ts # To expose leaderboard data

dev_notes: >
  This is the first story for a new `driver-performance-and-gamification` epic. It introduces a competitive element to driving, which can boost engagement and performance. The backend job should be efficient to avoid performance issues.
