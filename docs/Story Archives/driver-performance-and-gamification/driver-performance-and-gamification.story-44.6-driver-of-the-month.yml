id: story-44.6
epic: driver-performance-and-gamification
slug: driver-of-the-month
title: Implement "Driver of the Month" Program
status: Done
author: Bob (sm)
date: '2024-08-02T10:15:00Z'

description: >
  As an operations manager, I want to formally recognize a "Driver of the
  Month" in each city, so that we can celebrate our top performers and inspire others.

acceptance_criteria:
  - The `analytics-service` must have a job that identifies the top driver each month based on a weighted score of ratings, trips, compliments, and acceptance rate.
  - The winner receives a special, permanent "Driver of the Month" badge on their profile.
  - The winner may also receive a significant monetary bonus from the `incentive-service`.
  - A notification is sent to all drivers in the city announcing the winner, to foster a sense of community and aspiration.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To implement the winner selection logic
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To award the bonus

dev_notes: >
  A marketing and community-focused feature that builds on the rest of the gamification epic. It provides a highly visible and aspirational goal for drivers.