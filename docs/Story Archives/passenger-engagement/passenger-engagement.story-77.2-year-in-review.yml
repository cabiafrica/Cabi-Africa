id: story-77.2
epic: passenger-engagement
slug: year-in-review
title: Implement "Year in Review" Summary
status: DONE
author: Bob (sm)
date: '2024-08-08T11:07:00Z'

description: >
  As a passenger, at the end of the year, I want to see a fun, shareable
  "Year in Review" summary with stats about my usage, so that I can see my
  travel habits and share them on social media.

acceptance_criteria:
  - In January, a special "Year in Review" screen becomes available in the `passenger-app`.
  - It should display fun stats like "Total Trips Taken", "Total Distance Traveled", "Most Visited Place", "Top Rated Driver".
  - The screen should be visually appealing and designed to be screenshotted and shared.
  - The `analytics-service` will be responsible for pre-calculating this data for all users at the end of the year.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/year_in_review_screen.dart

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To run the annual calculation job

dev_notes: >
  A highly engaging marketing feature that users love to share. It requires a large batch analytics job to run at a specific time of year.
