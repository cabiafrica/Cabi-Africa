id: story-77.1
epic: passenger-engagement
slug: passenger-leaderboards
title: Implement "Passenger Leaderboards"
status: DONE
author: Bob (sm)
date: '2024-08-08T11:02:00Z'

description: >
  As a passenger, I want to see fun, anonymized leaderboards for things like
  "Most Trips Taken" or "Most Cuisines Tried" (for food delivery), so that I
  can have a sense of fun and competition.

acceptance_criteria:
  - A new "Leaderboards" section must be added to the `passenger-app`.
  - Leaderboards should be for non-sensitive metrics (e.g., total trips, number of cities visited).
  - All user data must be anonymized (e.g., "User from Nairobi", "Rider B.").
  - The `analytics-service` will be responsible for compiling these leaderboards.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/leaderboard_screen.dart

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To generate passenger leaderboards

dev_notes: >
  This is the first story for a new `passenger-engagement` epic. It's a lighthearted gamification feature to increase app usage and engagement.
