id: story-31.2
epic: tipping-features
slug: post-trip-tipping
title: Prompt Passenger to Add Tip After Ride Completion
status: IN_PROGRESS # Status updated to reflect that work has started.
author: Bob (sm)
date: '2024-08-10T18:45:00Z'

description: >
  As a passenger, after my ride is complete, I want to be prompted to add a
  tip for my driver, so I can show my appreciation for their service.

acceptance_criteria:
  - After a ride is marked as 'completed', if no tip was pre-selected (`story-31.1`), the `passenger-app` must display a tipping screen.
  - This screen should appear before the final rating screen (`story-42.1`).
  - The screen must reuse the existing `TripSummaryPanel` widget to offer pre-set fixed-amount options (e.g., 50, 100, 150) and a "Round Up" option.
  - The `onPayNow` callback of the `TripSummaryPanel` must trigger the `payment-service` to add the tip to the final ride charge.
  - The `payment-service` must be updated to modify the original ride's payment authorization to include the additional tip amount.
  - After the tip is submitted (or skipped), the user flow should proceed to the rating screen.
  - The screen hosting the `TripSummaryPanel` must include a "Skip for now" button to allow the user to proceed to the rating screen without adding a tip.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # Or the screen that orchestrates the post-trip flow
  - libs/backend/payment-service/src/lib/payment.service.ts # To add logic for processing a post-ride tip
  - libs/backend/payment-service/src/lib/payment.controller.ts # To expose an endpoint for adding a tip

dev_notes: >
  This story implements the most common tipping flow. It will reuse the refactored `TripSummaryPanel` to ensure UI consistency. The integration with the `payment-service` is critical; it must correctly add the tip to the final fare. This flow should be skipped if a tip was already provided via `story-31.1`.

tasks:
  - id: task-1
    description: Implement the backend logic for adding a tip post-ride.
    subtasks:
      - "[ ] Add an `addTipToCharge` method to `payment.service.ts`."
      - "[ ] The method should update the original ride charge with the tip amount."
      - "[ ] Expose this via a new `POST /payments/add-tip` endpoint in `payment.controller.ts`."
  - id: task-2
    description: Integrate the tipping panel into the post-ride flow.
    subtasks:
      - "[ ] In the post-ride screen (e.g., `HomeScreen`), display the `TripSummaryPanel`."
      - "[ ] Implement the `onPayNow` callback to call the new backend endpoint."
      - "[ ] Add a 'Skip for now' button that navigates the user to the `RateDriverScreen`."
      - "[ ] On success, navigate the user to the `RateDriverScreen`."

