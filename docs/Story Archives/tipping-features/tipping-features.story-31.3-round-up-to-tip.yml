id: story-31.3
epic: tipping-features
slug: round-up-to-tip
title: Implement "Round Up to Tip" Feature
status: Done
author: Bob (sm)
date: '2024-07-28T10:09:00Z'

description: >
  As a passenger, when paying for my ride, I want a simple option to "round
  up" my fare to the nearest dollar (or equivalent), with the difference
  going to the driver as a tip, so I can easily leave a small tip.

acceptance_criteria:
  - On the payment/tipping screen in the `passenger-app`, a "Round Up" button must be displayed next to the standard tip options.
  - The button must show the amount that will be added (e.g., "Round Up (+KES 30)").
  - Tapping this button calculates the difference to the next whole currency unit and adds it as the tip.
  - This tip amount is then processed as part of the final payment.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/trip_summary_panel.dart # Or payment screen

dev_notes: >
  This is a user experience enhancement for the tipping feature. It provides a low-friction way for passengers to show appreciation. The logic is entirely client-side.

tasks:
  - id: task-1
    description: Implement the "Round Up" button and logic.
    subtasks:
      - "[x] Modify the tipping widget in the `passenger-app` to include a new 'Round Up' button."
      - "[x] The button should display the amount to be added (e.g., 'Round Up (+KES 30)')."
      - "[x] Implement the client-side logic to calculate the difference to the next whole dollar amount."
      - "[x] Tapping the button should set the tip amount to this calculated value."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
    - >-
      All tasks completed. The "Round Up" feature has been implemented in the
      TripSummaryPanel and is fully covered by widget tests. The story meets
      all acceptance criteria and is ready for review.
  file_list:
    - apps/passenger-app/src/screens/trip_summary_panel.dart
    - apps/passenger-app/test/screens/trip_summary_panel_test.dart
  change_log:
    - file: apps/passenger-app/src/screens/trip_summary_panel.dart
      change: Added a "Round Up" button to the tipping options, with client-side logic to calculate the amount needed to reach the next whole currency unit and set it as the tip.

