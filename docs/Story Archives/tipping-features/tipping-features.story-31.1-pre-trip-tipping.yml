id: story-31.1
epic: tipping-features
slug: pre-trip-tipping
title: Implement Tipping Options Before Ride Confirmation
status: Done
author: Bob (sm)
date: '2024-07-27T09:07:00Z'

description: >
  As a passenger, I want the option to add a tip for my driver before I even
  confirm the ride, so that I can complete the entire payment process upfront.

acceptance_criteria:
  - On the `RideConfirmationPanel` in the `passenger-app`, a new section for adding a tip must be available.
  - It should offer pre-set options (e.g., 10%, 15%, 20%) and a custom amount field.
  - The selected tip amount must be passed to the `ride-service` when the ride is requested.
  - The final payment processing in `story-5.2` must be updated to use this pre-selected tip amount instead of prompting for a tip after the ride.
  - If a tip is pre-selected, the post-ride flow should go directly to the rating screen, skipping the payment/tip prompt.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_confirmation_panel.dart # To add the tipping UI
  - libs/backend/ride-service/src/lib/ride.service.ts # To store the pre-selected tip amount
  - libs/backend/payment-service/src/lib/payment.service.ts # To use the pre-selected tip

dev_notes: >
  This is the first story for a new `tipping-features` epic. It aims to streamline the post-ride experience by handling the tip upfront. This can increase the likelihood of tipping and improve the user flow.
