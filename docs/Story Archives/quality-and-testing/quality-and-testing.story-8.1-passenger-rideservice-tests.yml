id: story-8.1
epic: quality-and-testing
slug: passenger-rideservice-tests
title: Add Unit Tests for Passenger RideService
status: 'Ready for Review'
author: Bob (sm)
date: '2024-05-29T16:00:00Z'

description: >
  As a developer, I want to add comprehensive unit tests for the passenger app's
  `RideService` to ensure its core business logic for fare estimation, ride
  creation, and payment processing is reliable and to prevent future regressions.

acceptance_criteria:
  - A new test file `apps/passenger-app/test/api/ride_service_test.dart` is created.
  - The test file must use a testing framework (like `flutter_test` or `test`) to verify the service's behavior.
  - Tests for `getFareEstimateAndRoute` must verify that correct fare estimates are returned for different ride tiers.
  - Tests for `createRide` and `cancelRideSearch` should confirm that the methods execute without errors.
  - A test for `processPayment` must verify that the method completes and returns `true` as expected.
  - Tests should verify that the `driverAssignedStream` and `tripEndedStream` can be listened to and that the service's `dispose` method closes them correctly.
  - All new tests must pass.

files_to_be_created:
  - apps/passenger-app/test/api/ride_service_test.dart

files_to_be_modified: []

dev_notes: >
  This story addresses a known test coverage gap for a critical service. Since the `RideService` methods use simulated delays (`Future.delayed`), the tests will need to be asynchronous and properly handle `Future` completion.
