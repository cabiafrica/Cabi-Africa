id: story-3.3
epic: epic-3.0
slug: mlm-explanation-page
title: Create MLM Explanation Page
status: Done
author: Sarah (po)
date: '2024-06-15T15:00:00Z'

description: >
  As a prospective or current driver, I want a detailed explanation of the
  Multi-Level Marketing (MLM) system, so that I can fully understand the
  earning potential and how to build my network.

acceptance_criteria:
  - A new page is created in the `user-portal` app at the `/mlm-details` route.
  - The page must clearly explain the structure of the MLM system (e.g., levels, downlines).
  - It should detail how commissions are earned from referred drivers.
  - The page should use visual aids, like diagrams or infographics, to make the system easy to understand.
  - It must include a clear Call-to-Action (CTA) that encourages drivers to sign up, linking to the `/download/driver` page.
  - The page must be responsive and consistent with the site's overall design.

files_to_be_created:
  - docs/stories/story-3.3-mlm-explanation-page.yml
  - Cabi Alpha/web/user_portal/src/pages/mlm-details.tsx

dev_notes: >
  This page is a key trust-building asset. It fulfills the "Learn More" link on
  the `/drivers` page. The content should be clear, transparent, and avoid
  overly complex jargon. We can start with placeholder text and diagrams.

tasks:
  - id: task-1
    description: Implement the MLM Explanation page.
    subtasks:
      - "[x] Create the new page file at `Cabi Alpha/web/user_portal/src/pages/mlm-details.tsx`."
      - "[x] Implement hero section, content sections with placeholders, and a CTA."

