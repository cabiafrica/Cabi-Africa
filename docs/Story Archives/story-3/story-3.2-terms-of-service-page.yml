id: story-3.2
epic: epic-3.0
slug: terms-of-service-page
title: Create Terms of Service Page
status: Done
author: Sarah (po)
date: '2024-06-14T10:00:00Z'

description: >
  As a user, I want to read the Terms of Service so that I understand the
  rules, my rights, and my obligations when using the CABI platform.

acceptance_criteria:
  - A new page is created in the `user-portal` app at the `/terms-of-service` route.
  - The page must contain well-structured placeholder text for a standard Terms of Service document.
  - The content should include sections for "User Accounts", "User Conduct", "Disclaimers", and "Limitation of Liability".
  - The page must be responsive and consistent with the site's overall design.
  - A link to the `/terms-of-service` page is added to the site-wide footer.

files_to_be_created:
  - docs/stories/story-3.2-terms-of-service-page.yml
  - apps/user-portal/src/pages/terms-of-service.tsx

files_to_be_modified:
  - apps/user-portal/src/components/layout/Footer.tsx

dev_notes: >
  Similar to the Privacy Policy, this is a critical legal page. The initial
  implementation can use generic placeholder text which will be replaced by
  the legal team's official content.

tasks:
  - id: task-1
    description: Implement the Terms of Service page and update footer.
    subtasks:
      - "[x] Create the new page file at `apps/user-portal/src/pages/terms-of-service.tsx`."
      - "[x] Update the `Footer.tsx` component to add the 'Terms of Service' link."

