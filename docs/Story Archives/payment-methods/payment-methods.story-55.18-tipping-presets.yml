id: story-55.18
epic: payment-methods
slug: tipping-presets
title: Allow Passengers to Set Default Tipping Preferences
status: DONE
author: Bob (sm)
date: '2024-08-10T00:45:00Z'

description: >
  As a passenger, I want to set a default tip percentage in my profile, so
  that it's automatically selected for me on the post-ride rating screen.

acceptance_criteria:
  - In the "Payment" or "Wallet" screen, a user can set a default tip percentage (e.g., 15%, 18%, 20%) or a custom amount.
  - On the post-ride rating screen, this default tip is pre-selected, but the user can still change it for that specific trip.
  - The `user-service` must be updated to store this preference.

files_to_be_modified:
  - apps/passenger-app/src/screens/wallet_screen.dart # To add the default tip setting
  - apps/passenger-app/src/screens/rate_driver_screen.dart # To pre-select the default tip

dev_notes: >
  This is a small convenience feature that streamlines the post-ride experience for passengers who consistently tip the same amount.
