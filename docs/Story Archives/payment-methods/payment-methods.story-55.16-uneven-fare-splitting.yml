id: story-55.16
epic: payment-methods
slug: uneven-fare-splitting
title: Allow Uneven Fare Splitting
status: DONE
author: Bob (sm)
date: '2024-08-09T20:05:00Z'

description: >
  As a passenger splitting a fare, I want the ability to assign different
  amounts to each person, so we can split the cost unfairly if needed (e.g.,
  if someone is being dropped off much earlier).

acceptance_criteria:
  - When initiating a fare split (`story-55.3`), the requestor must have the option to "Split Unevenly".
  - This UI allows the requestor to enter a specific amount for each participant.
  - The system must validate that the sum of the parts equals the total fare.
  - Each participant is notified of the specific amount they are being asked to pay and can accept or decline.

files_to_be_modified:
  - apps/passenger-app/src/widgets/driver_details_panel.dart # To add the uneven split UI
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle uneven charge amounts

dev_notes: >
  This adds a layer of complexity to the fare split logic but provides a lot more flexibility and power to the user.
