id: story-55.3
epic: payment-methods
slug: fare-splitting
title: Implement Fare Splitting
status: DONE
author: Bob (sm)
date: '2024-08-09T18:15:00Z'

description: >
  As a passenger, I want to split the fare for a ride with other passengers,
  so that we can easily share the cost.

acceptance_criteria:
  - During an active trip, the passenger who requested the ride can initiate a "Split Fare" action.
  - The passenger can select other users from their phone's contacts.
  - The selected friends receive a notification asking them to accept the fare split request.
  - If they accept, the total fare is divided equally among all participants and charged to their respective default payment methods.
  - If a friend declines or does not respond, their share of the cost reverts to the original requestor.
  - The `payment-service` must handle the logic for multi-party charges and the reversion logic.

files_to_be_modified:
  - apps/passenger-app/src/widgets/driver_details_panel.dart # To add the "Split Fare" button
  - libs/backend/payment-service/src/lib/payment.service.ts # To manage the fare split logic

dev_notes: >
  This is a socially complex feature. The state management is key: what happens if one person's payment fails? The initial implementation will split the fare equally. Future iterations could allow for uneven splits.
