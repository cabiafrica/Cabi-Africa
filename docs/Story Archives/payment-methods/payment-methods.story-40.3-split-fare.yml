id: story-40.3
epic: payment-methods
slug: split-fare
title: Implement "Split Fare" Feature
status: Done
author: Bob (sm)
date: '2024-07-31T11:07:00Z'

description: >
  As a passenger traveling with friends, I want to be able to split the fare
  with other users of the app, so that we can easily share the cost of the ride.

acceptance_criteria:
  - During or after a trip, the passenger who booked the ride must have a "Split Fare" option.
  - This allows them to select other passengers (from their contacts who are also users) to split the cost with.
  - The selected friends receive a notification in their app to accept the split request.
  - If they accept, the `payment-service` charges each person their share of the fare.
  - If a request is declined or expires, the remaining cost is charged to the original booker.
  - The `payment-service` must be able to handle multiple partial charges for a single trip.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/trip_in_progress_view.dart # To add the "Split Fare" button
  - libs/backend/payment-service/src/lib/payment.service.ts # To manage the split fare state machine and multiple charges
  - libs/backend/notification-service/src/lib/notification.service.ts # To send split requests

dev_notes: >
  A popular social payment feature. The complexity lies in the state management of the split request (pending, accepted, declined) and ensuring the full fare is eventually collected.

tasks:
  - id: task-1
    description: Implement backend logic for the split fare state machine.
    subtasks:
      - "[x] Create `payment.service.ts` with methods to initiate and respond to a fare split."
      - "[x] Implement the state machine logic for 'pending', 'accepted', and 'declined' statuses."
      - "[x] Create `payment.controller.ts` to expose the new endpoints."
      - "[x] Integrate with `notification-service` to send split requests to participants."
  - id: task-2
    description: Build the frontend UI for initiating and responding to a fare split.
    subtasks:
      - "[x] Add a 'Split Fare' button to the trip view in the passenger app."
      - "[x] Create a UI for the initiator to select friends to split with."
      - "[x] Create a UI for participants to see and respond to incoming split requests."

