id: story-55.25
epic: payment-methods
slug: split-payment-methods
title: Allow Splitting a Fare Across Multiple Payment Methods
status: Done
author: Bob (sm)
date: '2024-08-10T06:25:00Z'

description: >
  As a passenger, I want to be able to split the cost of a single ride between
  two of my own payment methods (e.g., part from my wallet balance, part from
  my credit card).

acceptance_criteria:
  - On the payment selection screen, the user can choose to "Split Payment".
  - The UI allows them to specify how much to charge to each of their saved payment methods (including their wallet).
  - The `payment-service` must be able to process a single ride fare as multiple, partial transactions against different payment sources.

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle multi-source charging

dev_notes: >
  This provides maximum flexibility for users managing their finances, especially for using up remaining wallet balances.

tasks:
  - id: task-1
    description: Implement backend logic in `payment-service` to handle multi-source charging.
    subtasks:
      - "[x] Add a `processMultiSourcePayment` method to `payment.service.ts`."
      - "[x] The method must take an array of payment sources and amounts."
      - "[x] It must process transactions sequentially and handle failures gracefully (e.g., rollback)."
  - id: task-2
    description: Build the frontend UI for splitting payment.
    subtasks:
      - "[x] Add a 'Split Payment' option to the payment screen (`trip_summary_panel.dart`)."
      - "[x] Create `apps/passenger-app/src/screens/split_payment_screen.dart` for the user to allocate amounts."
      - "[x] On confirmation, call the new backend endpoint."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
    - >-
      All tasks are complete. The `payment-service` has been updated with a
      `processMultiSourcePayment` method that includes rollback logic for
