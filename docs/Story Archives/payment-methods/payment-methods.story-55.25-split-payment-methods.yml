    requirements_traceability:
      - criteria: "The UI allows them to specify how much to charge to each of their saved payment methods..."
        test_case: "Given a passenger navigates to the split payment screen, when the UI loads, then they can allocate portions of the fare to their available payment methods."
        status: PASS
