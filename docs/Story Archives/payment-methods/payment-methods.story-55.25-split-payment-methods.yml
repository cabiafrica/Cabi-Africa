      change: Added the `processMultiSourcePayment` method to handle charging a single fare across multiple payment sources, including failure and rollback logic.
    - file: apps/passenger-app/src/screens/split_payment_screen.dart
      change: Created a new screen to allow passengers to allocate fare amounts across their available payment methods.

