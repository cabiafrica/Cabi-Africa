id: story-55.21
epic: payment-methods
slug: round-up-for-charity
title: Implement "Round Up & Donate" Feature
status: Done
author: Bob (sm)
date: '2024-08-10T03:10:00Z'

description: >
  As a passenger, I want the option to round up my fare to the nearest dollar
  and donate the difference to a partner charity, so I can easily contribute
  to good causes.

acceptance_criteria:
  - In the app settings, a user can opt-in to "Round Up & Donate" and select from a list of partner charities.
  - When an opted-in user takes a ride, the `fare-service` calculates the difference to the next whole dollar and adds it to the fare.
  - The collected funds are tracked by the `payment-service`.
  - The user can see their total donations in their profile.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/fare.service.ts # To calculate the round-up amount
  - libs/backend/payment-service/src/lib/payment.service.ts # To track collected donations

dev_notes: >
  This is a great CSR and brand-building feature. It requires business development deals with charities and a robust accounting process for the collected funds.
