id: story-55.20
epic: payment-methods
slug: receipt-customization
title: Allow Receipt Customization for Business Profiles
status: DONE
author: Bob (sm)
date: '2024-08-10T02:20:00Z'

description: >
  As a business user, I want to add custom information, like my company's VAT
  number or a logo, to my e-receipts, so they meet my company's expensing requirements.

acceptance_criteria:
  - In the Business Profile settings (`story-55.5`), a user can add custom fields to their receipts (e.g., "Company Name," "VAT Number").
  - The e-receipt template (`story-55.4`) must be updated to dynamically include these custom fields if they exist.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/business_profile_setup_screen.dart # To add the custom fields UI
  - libs/backend/notification-service/src/lib/notification.service.ts # To update the receipt template

dev_notes: >
  This feature adds a layer of professionalism and utility for business users, making our service more attractive for corporate use.
