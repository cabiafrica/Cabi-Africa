id: story-55.22
epic: payment-methods
slug: pay-for-another-user
title: Allow Users to Request a Ride for Someone Else
status: DONE
author: Bob (sm)
date: '2024-08-10T04:00:00Z'

description: >
  As a user, I want to be able to request a ride for another person (e.g., a
  friend or family member), have it charged to my account, and share the trip
  details with them.

acceptance_criteria:
  - On the ride request screen, there must be an option to select "For Someone Else".
  - This allows the requestor to enter the passenger's name and phone number and set their pickup location.
  - The ride is charged to the requestor's account.
  - The actual passenger receives an SMS with a link to a web-based live tracking view (`story-18.4`) showing the driver's details and ETA.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add the "For Someone Else" flow

dev_notes: >
  This is a very common use case (e.g., booking a ride for an elderly parent). The key is the communication flow to the actual passenger who doesn't have the app open.
