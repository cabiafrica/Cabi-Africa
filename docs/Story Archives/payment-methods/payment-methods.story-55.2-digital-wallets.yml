id: story-55.2
epic: payment-methods
slug: digital-wallets
title: Integrate Apple Pay and Google Pay
status: Done
author: Bob (sm)
date: '2024-08-09T16:50:00Z'

description: >
  As a passenger, I want to pay for my ride using my phone's native digital
  wallet (Apple Pay or Google Pay), so that I can check out quickly and
  securely without entering card details.

acceptance_criteria:
  - On the ride confirmation screen, "Apple Pay" or "Google Pay" must be presented as a payment option if available on the device.
  - Selecting this option must launch the native payment sheet.
  - Upon successful authorization in the native wallet, the ride is booked and charged.
  - This requires integration with the payment processor's specific SDKs for Apple Pay and Google Pay.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add the digital wallet button
  - libs/backend/payment-service/src/lib/payment.service.ts # To process payments from digital wallets
