id: story-55.15
epic: payment-methods
slug: enforce-corporate-policies
title: Enforce Corporate Travel Policies at Time of Booking
status: DONE
author: Bob (sm)
date: '2024-08-09T20:00:00Z'

description: >
  As a travel manager, when I set a travel policy (e.g., "no premium
  vehicles," "max ride cost of $50"), I want the system to enforce it when my
  employees try to book a ride on the company profile.

acceptance_criteria:
  - When a passenger using a Business Profile requests a ride, the `ride-service` must check for any applicable corporate policies.
  - If the requested ride violates a policy (e.g., selecting a vehicle class that is disallowed), the app must show an error and prevent the booking.
  - If the estimated fare exceeds a spending limit, the booking must be blocked.
  - The error message shown to the employee must be clear about which policy was violated.

files_to_be_modified:
  - libs/backend/ride-service/src/lib/fare.service.ts # To check against corporate policies before confirming a ride
  - apps/passenger-app/src/screens/home_screen.dart # To display policy violation errors

dev_notes: >
  This story is what makes our B2B offering a true enterprise product. It provides the cost control and compliance that companies require.
