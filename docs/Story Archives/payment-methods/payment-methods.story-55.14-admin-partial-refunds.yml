id: story-55.14
epic: payment-methods
slug: admin-partial-refunds
title: Enable Admins to Issue Partial Refunds
status: DONE
author: Bob (sm)
date: '2024-08-09T19:55:00Z'

description: >
  As a support agent, I want the ability to issue a partial refund for a
  trip (e.g., refunding a toll or wait time fee), so I can resolve customer
  complaints with more precision.

acceptance_criteria:
  - In the admin transaction view (`story-55.6`), the "Refund" action must allow the agent to choose between a full refund and a partial refund.
  - For a partial refund, the agent must be able to specify the exact amount to be returned to the passenger.
  - The `payment-service` must process the partial refund via the payment processor.
  - The transaction log must be updated to show both the original charge and the subsequent partial refund.

files_to_be_modified:
  - apps/admin-panel/src/app/transactions/page.tsx # To enhance the refund UI
  - libs/backend/payment-service/src/lib/payment.service.ts # To add partial refund logic

dev_notes: >
  This is a crucial tool for customer support, allowing for more nuanced and fair resolutions to disputes without having to refund an entire trip.
