id: story-55.12
epic: payment-methods
slug: driver-cash-balance
title: Implement Driver Cash Collection and Negative Balance Handling
status: DONE
author: Bob (sm)
date: '2024-08-09T19:45:00Z'

description: >
  As an operations manager, I need a system to manage the platform commission
  from cash trips, ensuring that drivers settle their balance with the platform regularly.

acceptance_criteria:
  - When a driver completes a cash trip, the platform's commission is recorded as a negative balance in the driver's wallet.
  - The driver's app must clearly display this "Amount Owed to Cabi".
  - Earnings from digital-payment trips must first be used to pay down any negative balance before being made available for payout.
  - If a driver's negative balance exceeds a certain threshold, they may be restricted from taking more cash-only trips until the balance is settled.
  - Drivers must be able to settle their negative balance by paying the platform using a linked card or other payment method.

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.service.ts # To manage driver negative balances
  - apps/driver-app/src/screens/wallet_screen.dart # To display amount owed and provide settlement options

dev_notes: >
  This is a complex but essential feature for markets with high cash usage. It ensures the business model is sustainable. The rules for restricting drivers must be clear and communicated well.
