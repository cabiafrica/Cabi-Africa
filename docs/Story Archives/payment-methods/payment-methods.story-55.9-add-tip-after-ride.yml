id: story-55.9
epic: payment-methods
slug: add-tip-after-ride
title: Allow Passenger to Add a Tip After the Ride is Complete
status: DONE
author: Bob (sm)
date: '2024-08-09T19:10:00Z'

description: >
  As a passenger, I want the ability to add a tip for my driver for a limited
  time after the trip has ended, in case I forgot to do so on the rating screen.

acceptance_criteria:
  - In the passenger's trip history, for recent trips (e.g., within 24 hours), an "Add Tip" option should be visible if no tip was given.
  - Tapping this option allows the passenger to select a tip amount.
  - The `payment-service` must process a new, separate transaction for the tip amount.
  - The tip must be correctly attributed and paid out to the driver.

files_to_be_modified:
  - apps/passenger-app/src/screens/trip_history_screen.dart # To add the "Add Tip" option
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle post-ride tip transactions

dev_notes: >
  This is a user-friendly feature that can increase driver satisfaction and earnings. The main complexity is handling the tip as a separate transaction from the original ride fare.
