id: story-55.4
epic: payment-methods
slug: automated-e-receipts
title: Send Automated E-Receipts After Trips
status: Done
author: Bob (sm)
date: '2024-08-09T18:20:00Z'

description: >
  As a user (passenger or business profile manager), I want to automatically
  receive a detailed email receipt after every completed trip, so that I have
  a record for my expenses.

acceptance_criteria:
  - After a trip's payment is successfully processed, the `notification-service` must trigger sending an email receipt.
  - The receipt must be sent to the passenger's registered email address.
  - The receipt must contain key details: map of the route, pickup/dropoff locations, date/time, driver name, vehicle info, and an itemized fare breakdown (base fare, distance, time, tolls, tip, total).
  - The email template should be professional and on-brand.

files_to_be_modified:
  - libs/backend/notification-service/src/lib/notification.service.ts # To integrate with an email provider and send receipts
  - libs/backend/payment-service/src/lib/payment.service.ts # To trigger the receipt event after successful payment

dev_notes: >
  This is a fundamental feature for user trust and business use. It requires an email templating engine and integration with a transactional email service (e.g., SendGrid, Mailgun).
