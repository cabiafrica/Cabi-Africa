id: story-80.1
epic: platform-services
slug: integrate-firebase-push-notifications
title: Integrate Firebase Cloud Messaging for Push Notifications
status: DONE
author: Sarah (po)
date: '2024-08-24T10:00:00Z'

description: >
  As a platform engineer, I need to replace the mock push notification provider
  with a real implementation using Firebase Cloud Messaging (FCM), so that the
  system can send reliable, real-time notifications to user devices for critical
  events.

acceptance_criteria:
  - The mock `PushProvider` in `apps/driver-lead-service/src/notifications/push.provider.ts` must be replaced with a real implementation using the Firebase Admin SDK.
  - Firebase project credentials must be loaded securely into the application (e.g., from environment variables, not committed to the repository).
  - The `User` model in the Prisma schema must be updated to include a `deviceTokens` field (e.g., `String[]`) to store FCM registration tokens.
  - A new endpoint (e.g., `POST /auth/devices/register`) must be created to allow authenticated clients (mobile apps) to register their device token.
  - The `PushProvider.send` method must be updated to:
    - Accept a `userId` instead of a raw device token in its `to` field.
    - Fetch the `deviceTokens` for the given `userId` from the database.
    - Send a push notification to all of the user's registered device tokens via FCM.
  - A test notification (e.g., the `suspicious-login-reported-alert`) should be updated to also send a push notification to demonstrate the working integration.

files_to_be_modified:
  - c:/Users/User/Desktop/Cabi-Flutter/docs/architecture.md # To update the User model in the Prisma schema
  - c:/Users/User/Desktop/Cabi-Flutter/apps/driver-lead-service/src/notifications/push.provider.ts # To replace mock with real implementation
  - c:/Users/User/Desktop/Cabi-Flutter/docs/user-management.service.ts # To add device token management and trigger a test push
  - c:/Users/User/Desktop/Cabi-Flutter/apps/driver-lead-service/src/driver-leads/auth.controller.ts # To add the new device registration endpoint

dev_notes: >
  This is a crucial backend infrastructure task that enables many future user-facing features. Security of the Firebase service account credentials is paramount. The `to` field in the `NotificationPayload` for push notifications will now represent a `userId`, not a device token, which is a key implementation detail. We will also need a strategy for cleaning up stale/invalid device tokens in a future story.
