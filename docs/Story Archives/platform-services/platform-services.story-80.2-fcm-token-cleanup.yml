id: story-80.2
epic: platform-services
slug: fcm-token-cleanup
title: Automated Cleanup of Stale FCM Device Tokens
status: DONE
author: Sarah (po)
date: '2024-08-25T16:00:00Z'

description: >
  As a platform engineer, I need an automated process to detect and remove
  stale or invalid FCM device tokens from user profiles, so that we can improve
  push notification delivery efficiency, reduce unnecessary API calls to FCM,
  and maintain a clean dataset.

acceptance_criteria:
  - The `PushProvider` must be updated to analyze the response from FCM after sending a notification.
  - When the FCM response indicates a token is invalid (e.g., with an error code like `messaging/registration-token-not-registered`), the token must be removed from the corresponding user's `deviceTokens` array in the database.
  - This cleanup process should happen asynchronously to avoid blocking the main notification sending flow.
  - A periodic batch job (e.g., a weekly cron job) must be implemented as a fallback to query and remove tokens that haven't been used or updated in a long time (e.g., > 90 days).
  - Logging must be added to track the number of stale tokens removed, both from direct FCM feedback and from the batch job.

files_to_be_created:
  - apps/driver-lead-service/src/jobs/token-cleanup.job.ts # For the periodic batch cleanup

files_to_be_modified:
  - c:/Users/User/Desktop/Cabi-Flutter/apps/driver-lead-service/src/notifications/push.provider.ts # To handle FCM API responses
  - c:/Users/User/Desktop/Cabi-Flutter/apps/driver-lead-service/src/app.module.ts # To register the new cron job

dev_notes: >
  This is an important maintenance task for the long-term health of our push notification system. The FCM `sendEachForMulticast` response provides detailed results for each token, which is what we'll use for the real-time cleanup. The batch job acts as a safety net for tokens that become stale without being explicitly invalidated. We should be careful with database writes to avoid performance bottlenecks during a mass notification send.
