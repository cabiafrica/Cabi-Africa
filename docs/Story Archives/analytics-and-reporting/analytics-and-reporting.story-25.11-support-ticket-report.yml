id: story-25.11
epic: analytics-and-reporting
slug: support-ticket-report
title: Admin Report on Support Ticket Metrics
status: Done
author: Bob (sm)
date: '2024-07-30T10:18:00Z'

description: >
  As a support manager, I want a report on support ticket volume and
  resolution times, so that I can manage staffing and identify common problems.

acceptance_criteria:
  - A new "Support" report must be added to the `admin-panel`.
  - It must allow filtering by date range and support category (`story-24.5`).
  - The report must display:
    - Total tickets created
    - Average first response time
    - Average resolution time
  - The `analytics-service` must aggregate this data from the `support-service`.

files_to_be_created:
  - apps/admin-panel/src/app/reports/support/page.tsx

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To aggregate support data

dev_notes: >
  This report provides key metrics for managing the customer support operation. It helps in understanding agent workload and identifying the most common user issues.
