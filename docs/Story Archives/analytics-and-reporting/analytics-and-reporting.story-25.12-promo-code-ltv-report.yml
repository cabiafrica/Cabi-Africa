id: story-25.12
epic: analytics-and-reporting
slug: promo-code-ltv-report
title: Report on Promo Code Customer Lifetime Value (LTV)
status: Done
author: Bob (sm)
date: '2024-07-31T11:12:00Z'

description: >
  As a marketing analyst, I want to see the long-term spending habits of
  users acquired through a specific promo code, so that I can measure the
  true ROI of a campaign beyond the first ride.

acceptance_criteria:
  - A new "Campaign LTV" report must be added to the `admin-panel`.
  - The admin can select a promo code.
  - The report must show the cohort of users who signed up with that code and their aggregated spending over time (e.g., 30, 60, 90 days post-signup).
  - This allows comparison between the cost of the promotion and the revenue generated by the acquired users.
  - The `analytics-service` must perform this complex cohort analysis.

files_to_be_created:
  - apps/admin-panel/src/app/reports/campaign-ltv/page.tsx

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To implement LTV cohort calculation

dev_notes: >
  A sophisticated analytics feature that provides deep insights into marketing effectiveness. It requires the `analytics-service` to join user acquisition data with long-term transaction data.
