id: story-25.9
epic: analytics-and-reporting
slug: admin-audit-log
title: Implement Admin System Health/Audit Log
status: Done
author: Bob (sm)
date: '2024-07-28T10:05:00Z'

description: >
  As a senior administrator or developer, I want to view a raw stream of
  important system events, so that I can debug issues and audit critical actions.

acceptance_criteria:
  - A new "Audit Log" page must be added to the `admin-panel`, accessible only to super-admins.
  - The page must display a real-time, paginated list of system events.
  - Events to be logged include: `UserRegistered`, `AccountSuspended`, `TripCreated`, `TripCancelled`, `PaymentFailed`, `PayoutProcessed`, `AdminLogin`, etc.
  - Each log entry must show the event name, a timestamp, the user/actor involved, and a payload of relevant data.
  - The `analytics-service` must consume all relevant events from across the microservices and store them in a dedicated, searchable log database (e.g., Elasticsearch, or a simple SQL table).

files_to_be_created:
  - apps/admin-panel/src/app/admin/audit-log/page.tsx

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To consume and store all events

dev_notes: >
  This is a technical, low-level tool for system monitoring and forensics. It provides an immutable record of everything that happens on the platform. It's less of a business report and more of an engineering and security tool.