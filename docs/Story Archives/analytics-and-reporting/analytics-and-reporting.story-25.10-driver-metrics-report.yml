id: story-25.10
epic: analytics-and-reporting
slug: driver-metrics-report
title: Admin Report on Driver Acceptance and Cancellation Rates
status: Done
author: Bob (sm)
date: '2024-07-30T10:14:00Z'

description: >
  As an operations manager, I want a report that shows city-wide or zone-specific
  driver acceptance and cancellation rates over time, so that I can identify
  problems with network reliability.

acceptance_criteria:
  - A new "Network Health" report must be added to the `admin-panel`.
  - It must allow filtering by date range and geographic area.
  - The report must display trend charts for:
    - Ride request acceptance rate (%)
    - Driver-initiated cancellation rate after acceptance (%)
  - The `analytics-service` must aggregate this data from `RideRequestRejected` and `RideCancelledByDriver` events.

files_to_be_created:
  - apps/admin-panel/src/app/reports/network-health/page.tsx

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To aggregate the new metrics

dev_notes: >
  This report provides a macro view of marketplace health. A low acceptance rate or high cancellation rate could indicate issues with pricing, driver satisfaction, or app performance that need to be addressed.
