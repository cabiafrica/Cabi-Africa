id: story-25.7
epic: analytics-and-reporting
slug: admin-passenger-report
title: Implement Admin Passenger Activity Report
status: Done
author: Bob (sm)
date: '2024-07-27T09:01:00Z'

description: >
  As an administrator, I want to view an activity report for individual
  passengers, so that I can understand usage patterns and investigate support issues.

acceptance_criteria:
  - A "Passenger Report" page must be added under the "Reports" section of the `admin-panel`.
  - The page must allow an admin to select a passenger and a date range.
  - The report must display key metrics for that passenger in that period, including:
    - Total trips taken
    - Total amount spent
    - Most frequent pickup/dropoff locations
    - Promo codes used
    - Average rating given to drivers
  - The `analytics-service` must expose an endpoint to generate this report.

files_to_be_created:
  - apps/admin-panel/src/app/reports/passenger-activity/page.tsx

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.controller.ts # To add the new report endpoint
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To implement the data aggregation logic

dev_notes: >
  This is the passenger-focused counterpart to the driver performance report (`story-25.5`). It provides valuable data for marketing, support, and understanding user cohorts.
