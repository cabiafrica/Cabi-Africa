id: story-45.7
epic: driver-financial-tools
slug: downloadable-statements
title: Implement Downloadable Monthly Earnings Statements
status: Done
author: Bob (sm)
date: '2024-08-05T09:00:00Z'

description: >
  As a driver, I want to be able to download official monthly and annual
  earnings statements as PDFs, so that I have the documents I need for loans,
  rentals, or tax purposes.

acceptance_criteria:
  - In the driver's earnings screen, a "Statements" section must be available.
  - The driver can select a month or year and request a statement.
  - The `analytics-service` must have a job to generate a PDF statement on demand.
  - The statement must include a breakdown of gross earnings, platform fees, tips, bonuses, and net payout.
  - The generated PDF must be downloadable to the driver's device.

files_to_be_created:
  - libs/backend/analytics-service/src/lib/pdf-generation.service.ts

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/wallet_screen.dart # To add the statements UI
  - libs/backend/analytics-service/src/lib/analytics.controller.ts # To add an endpoint for statement generation

dev_notes: >
  This is a crucial feature for treating drivers as professional business owners. The backend will need a reliable PDF generation library to create official-looking documents.
