id: story-88.2
epic: driver-financial-tools
slug: driver-download-statements
title: "Driver: Download Weekly/Monthly Earnings Statements"
status: Done
author: Gemini Code Assist
date: '2025-12-06T14:05:00Z'

description: >
  As a driver, I want to be able to generate and download my earnings statements as a PDF for a specific week or month,
  so I can have official records for my finances and tax purposes.

acceptance_criteria:
  - On the `EarningsHistoryScreen` (from story-88.1), each weekly or monthly summary item must have a "Download" icon or button.
  - Tapping "Download" must call a new backend endpoint (e.g., `GET /earnings/statements/:periodType/:periodId/download`).
  - The backend must generate a PDF document containing a detailed breakdown of all earnings and deductions for that period.
  - The PDF must include company branding and key driver information.
  - The driver app must handle the downloaded file, allowing the user to save it to their device or share it using the native sharing dialog.

files_to_be_created:
  # No new app screens, but a backend PDF generation template/service will be needed.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_history_screen.dart # To add the download button and file handling logic.
  - c:/Users/User/Desktop/Cabi-Flutter/docs/document.service.ts # To add a new method and controller endpoint to EarningsService for PDF statement generation.

dev_notes: >
  This story fulfills a critical requirement for drivers as independent contractors, as noted in the PRD (section 2.2). The main complexity is on the backend. A new service method will be needed in the `EarningsService` to aggregate all financial data for a period and then use a library (e.g., `pdf-lib` or a templating engine) to generate a professional-looking PDF.

  The frontend will need to call this endpoint and use a file handling plugin (e.g., `path_provider`, `open_file`) to manage the downloaded statement.
  PRD Reference: 2.2. Driver App -> Earnings, Payouts & Financial Tools -> Downloadable Statements
