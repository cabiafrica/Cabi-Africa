id: story-45.5
epic: driver-financial-tools
slug: accounting-integration
title: Integration with Accounting Software for Drivers
status: Done
author: Bob (sm)
date: '2024-08-02T10:09:00Z'

description: >
  As a driver, I want to connect my account to my accounting software (e.g.,
  QuickBooks Self-Employed), so that my earnings and mileage are automatically
  synced for easy tax preparation.

acceptance_criteria:
  - A new "Integrations" section must be added to the `driver-app` settings.
  - The driver can authenticate and link their QuickBooks (or other) account.
  - A new service in the backend must be responsible for periodically pushing earnings and mileage data to the third-party accounting API.
  - This service will be triggered after each payout cycle.

files_to_be_created:
  - libs/backend/integration-service/src/lib/accounting.service.ts

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart # To add the integration link

dev_notes: >
  A powerful tool for drivers that simplifies their business operations. This is an API integration project that adds significant value to the driver experience.
