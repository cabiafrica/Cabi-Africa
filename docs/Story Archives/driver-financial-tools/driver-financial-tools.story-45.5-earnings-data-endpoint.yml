id: story-45.5
epic: driver-financial-tools
slug: earnings-data-endpoint
title: Create Backend Endpoint for Aggregated Earnings Data
status: Done
author: Bob (sm)
date: '2024-08-09T14:45:00Z'

description: >
  As a backend developer, I need to create a new endpoint that provides
  aggregated earnings data for a driver, so that the driver app can display
  historical earnings trends and summaries.

acceptance_criteria:
  - A new endpoint, such as `GET /payments/driver/earnings-summary`, must be created in the `payment-service`.
  - The endpoint must accept query parameters to specify a date range (e.g., `startDate`, `endDate`).
  - The response must be a structured object containing aggregated data for the specified period.
  - The aggregated data must include:
    - `totalEarnings`: Sum of all earnings (fares, tips, bonuses).
    - `totalTrips`: Count of completed trips.
    - `hoursOnline`: Total duration the driver was online.
    - `dailyBreakdown`: An array of objects, each representing a day with its total earnings.
  - The `payment-service` must implement an efficient method to query and aggregate transaction and session data to generate this summary.

files_to_be_modified:
  - libs/backend/payment-service/src/lib/payment.controller.ts # To add the new earnings summary endpoint.
  - libs/backend/payment-service/src/lib/payment.service.ts # To implement the data aggregation logic.

dev_notes: >
  This story is the backend counterpart to `story-45.4`. It provides the necessary data for the UI to render earnings history and charts. The main challenge will be to design a performant query that can aggregate data over various timeframes (weekly, monthly) without slowing down the system. Consider caching strategies for frequently requested summaries. This endpoint is critical for unlocking the analytical capabilities of the driver's wallet.
