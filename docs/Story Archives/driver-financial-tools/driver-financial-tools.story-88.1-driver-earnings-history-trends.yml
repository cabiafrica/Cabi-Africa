id: story-88.1
epic: driver-financial-tools
slug: driver-earnings-history-trends
title: "Driver: View Earnings History and Trends"
status: Done
author: Gemini Code Assist
date: '2025-12-06T14:00:00Z'

description: >
  As a driver, I want to see a summary of my earnings over different time periods with simple charts,
  so I can understand my performance, identify trends, and plan my work schedule more effectively.

acceptance_criteria:
  - The `EarningsDashboardScreen` (from story-85.0) must contain a button or link to a new `EarningsHistoryScreen`.
  - The `EarningsHistoryScreen` must feature tabs or filters to switch between "Weekly" and "Monthly" views.
  - A simple bar chart must be displayed, showing total earnings for each week or month in the selected period.
  - Below the chart, a summary list must show total earnings, total trips, and hours online for each corresponding period.
  - The screen must call a new backend endpoint in the `EarningsService` (e.g., `GET /earnings/history-trends`) to fetch this aggregated data.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_history_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_dashboard_screen.dart # To add a link/button to the new history screen.
  - c:/Users/User/Desktop/Cabi-Flutter/docs/document.service.ts # To add a new method and controller endpoint to EarningsService for aggregated trend data.

dev_notes: >
  This story adds a much-needed analytical layer on top of the basic earnings data, directly addressing a requirement from the PRD (section 2.2).

  The main backend work is to create an efficient aggregation query in the `EarningsService` that can group earnings, trip counts, and other metrics by week or month. This should be a new, dedicated endpoint to avoid overloading the existing summary or detail endpoints.

  The frontend will involve creating a new screen and integrating a simple charting library (e.g., `fl_chart`) to visualize the data.
  PRD Reference: 2.2. Driver App -> Earnings, Payouts & Financial Tools -> Earnings History & Trends
