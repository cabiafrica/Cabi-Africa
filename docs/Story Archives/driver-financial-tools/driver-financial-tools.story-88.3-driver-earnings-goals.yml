id: story-88.3
epic: driver-financial-tools
slug: driver-earnings-goals
title: "Driver: Set and Track Earnings Goals"
status: Done
author: Gemini Code Assist
date: '2025-12-06T14:10:00Z'

description: >
  As a driver, I want to set a weekly earnings goal within the app and see a progress bar that tracks my progress towards it,
  so I can stay motivated and better plan my work.

acceptance_criteria:
  - On the `EarningsDashboardScreen`, a new UI widget must be present for setting and viewing a weekly earnings goal.
  - The widget must allow a driver to input a numerical goal for the week.
  - Once set, the widget must display a progress bar showing current earnings vs. the goal.
  - The backend `User Management Service` must be updated to store the driver's earnings goal preference.
  - The `EarningsDashboardScreen` must fetch both the goal and the current progress to render the widget.

files_to_be_created:
  # No new screens, this adds a widget to an existing screen.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_dashboard_screen.dart # To add the goal setting/tracking widget.
  - # The backend User Management Service will need to be updated to store the goal on the driver's profile.

dev_notes: >
  This story introduces a driver engagement feature from the PRD (section 2.2). It's primarily a frontend UI enhancement to the main earnings dashboard. The backend work is minimal, likely just adding a new field to the `DriverProfile` model in the `User Management Service` to persist the goal. The frontend will then be responsible for the visual representation of the goal and progress.
  PRD Reference: 2.2. Driver App -> Earnings, Payouts & Financial Tools -> Earnings Goal Setting
