id: story-85.1
epic: driver-financial-tools
slug: driver-detailed-trip-view
title: "Driver: View Detailed Earnings Breakdown for Past Trips"
status: Done
author: Bob (sm)
date: '2025-12-03T12:00:00Z'

description: >
  As a driver, I want to view a detailed breakdown for each of my past trips,
  so that I can fully understand how my earnings are calculated and track my income accurately.

acceptance_criteria:
  - Tapping on a trip from the existing earnings summary/history list must navigate to a new `TripDetailsScreen`.
  - The `TripDetailsScreen` must display a static map image of the trip's route.
  - The screen must clearly display the following financial details for the selected trip:
    - Base Fare
    - Tip
    - Bonus (if applicable)
    - Commission (deduction)
    - Final Earnings (total)
  - The screen must also display the following trip metadata:
    - Date and Time
    - Trip Duration
    - Trip Distance
  - A new backend endpoint, `GET /earnings/trips/:tripId`, must be created in the `EarningsController`.
  - This endpoint must call a new `getTripDetails` method in the `EarningsService` that returns the detailed breakdown for a single trip.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/trip_details_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_summary_screen.dart # Or similar, to handle navigation to the new details screen.
  - c:/Users/User/Desktop/Cabi-Flutter/docs/document.service.ts # To add a new `getTripDetails` method to EarningsService and a new `EarningsController` endpoint.

dev_notes: >
  This story is the first step in building out the `driver-financial-tools` epic, directly addressing the PRD requirement (section 2.2).
  It builds upon the existing `EarningsService` by adding a more granular level of detail. The main work involves creating the new `TripDetailsScreen` in the driver app and implementing the corresponding backend endpoint to serve the detailed data. The existing `getDriverEarningsSummary` provides a list of transactions; this story adds the drill-down capability.
  PRD Reference: 2.2. Driver App -> Detailed Trip View
