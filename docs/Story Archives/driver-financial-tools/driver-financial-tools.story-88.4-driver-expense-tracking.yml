id: story-88.4
epic: driver-financial-tools
slug: driver-expense-tracking
title: "Driver: Track Business-Related Expenses"
status: Done
author: Gemini Code Assist
date: '2025-12-06T14:15:00Z'

description: >
  As a driver, I want a simple tool within the app to log my business-related expenses (like fuel and maintenance),
  so I can better understand my net earnings and prepare for tax time.

acceptance_criteria:
  - A new "Expenses" tab or section must be added to the `EarningsDashboardScreen`.
  - This section must allow a driver to log a new expense, capturing the amount, date, and category (e.g., "Fuel", "Maintenance", "Supplies").
  - A list of logged expenses for the current week/month must be displayed.
  - A new backend service or new tables in the `user-service` database must be created to store expense records for each driver.
  - The app must call new backend endpoints to create and fetch expense records.

files_to_be_created:
  - # A new backend service or controller/service within an existing service for managing expenses.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_dashboard_screen.dart # To add the new "Expenses" tab and UI.
  - # The Prisma schema will need a new `Expense` model.

dev_notes: >
  This story adds a significant utility feature for drivers, as outlined in the PRD (section 2.2). It helps position the app as an all-in-one tool for their business.

  The backend will require a new data model (`Expense`) linked to the `DriverProfile`. A new set of CRUD endpoints will be needed to manage these expense records.

  The frontend work involves adding a new section to the earnings dashboard to provide the interface for logging and viewing these expenses.
  PRD Reference: 2.2. Driver App -> Earnings, Payouts & Financial Tools -> Expense Tracking
