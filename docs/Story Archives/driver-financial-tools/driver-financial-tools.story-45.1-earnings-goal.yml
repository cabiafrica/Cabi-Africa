id: story-45.1
epic: driver-financial-tools
slug: earnings-goal
title: Implement Driver "Earnings Goal" Setting
status: Done
author: Bob (sm)
date: '2024-08-01T09:02:00Z'

description: >
  As a driver, I want to set a daily or weekly earnings goal in my app, so
  that I can easily track my progress towards my financial target.

acceptance_criteria:
  - A new "Set Goal" feature must be added to the driver's earnings/wallet screen.
  - The driver can input a monetary amount for their daily or weekly goal.
  - The app must display a progress bar showing current earnings against the set goal.
  - The app should provide encouraging messages as the driver gets closer to the goal.
  - The goal and progress should be stored locally on the device or in the `user-service`.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To add goal setting UI and progress bar

dev_notes: >
  This is the first story for a new `driver-financial-tools` epic. It's a simple but powerful motivational tool that helps drivers manage their work and finances more effectively.
