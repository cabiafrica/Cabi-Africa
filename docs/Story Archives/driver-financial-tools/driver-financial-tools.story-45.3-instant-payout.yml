id: story-45.3
epic: driver-financial-tools
slug: instant-payout
title: Implement "Instant Payout" (Cash Out) Feature
status: Done
author: Bob (sm)
date: '2024-08-09T14:35:00Z'

description: >
  As a driver, I want the option to cash out my available earnings instantly
  to my linked debit card, so that I can access my money when I need it,
  rather than waiting for a weekly payout.

acceptance_criteria:
  - A "Cash Out" button must be prominently displayed on the driver's `WalletScreen`.
  - The button must show the available balance that can be cashed out.
  - Tapping the button initiates a payout process via the payment processor (e.g., Stripe Instant Payouts).
  - The system may charge a small, clearly disclosed fee for this service.
  - The `payment-service` must handle the payout transaction and update the driver's available balance.
  - The driver must receive a confirmation in the app and via notification once the payout is successful.

files_to_be_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To add the cash out button and flow
  - libs/backend/payment-service/src/lib/payment.service.ts # To integrate with payment processor's instant payout API

dev_notes: >
  This is a highly requested feature in the gig economy. It requires tight integration with the payment provider's specific APIs for instant transfers. The business logic for eligibility (e.g., minimum balance, account age) and fees must be clearly defined.
