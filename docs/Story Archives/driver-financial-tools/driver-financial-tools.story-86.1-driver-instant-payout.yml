id: story-86.1
epic: driver-financial-tools
slug: driver-instant-payout
title: "'Driver: Request Instant Payout of Available Earnings'"
status: Done for Review
author: Bob (sm)
date: '2025-12-03T13:00:00Z'

description: >
  As a driver, I want to request an immediate payout of my available earnings to my linked bank account,
  so I can access my money when I need it without waiting for a weekly payout cycle.

acceptance_criteria:
  - The "Cash Out" button on the `WalletScreen` (from story-16.1) must be enabled only when the driver's available balance is greater than zero.
  - Tapping the "Cash Out" button must open a confirmation modal displaying the total balance, any applicable transaction fees, and the final payout amount.
  - Confirming the payout must call a new backend endpoint, `POST /payouts/request-instant`.
  - A new `PayoutService` must be created in the backend to orchestrate the payout process.
  - The `PayoutService` must validate the driver's balance with the `EarningsService`.
  - The `PayoutService` must integrate with a third-party payment provider (e.g., Stripe Connect) to initiate the transfer to the driver's linked account.
  - Upon successful initiation of the transfer, the driver's available balance must be updated to zero.
  - The `WalletScreen` UI must update to reflect the new balance and show the instant payout as a new transaction in the history.
  - The system must handle potential failures from the payment provider gracefully and show an appropriate error message to the driver.

files_to_be_created:
  - libs/backend/payout-service/src/lib/payout.service.ts
  - libs/backend/payout-service/src/lib/payout.controller.ts

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/wallet_screen.dart # To add logic to the "Cash Out" button and confirmation modal.
  - c:/Users/User/Desktop/Cabi-Flutter/docs/document.service.ts # To add a method to EarningsService to debit the driver's balance upon successful payout.

dev_notes: >
  This story implements a high-value feature for drivers, as specified in the PRD (section 2.2). The main complexity lies in the backend integration with a third-party payment provider.
  A new `PayoutService` is proposed to encapsulate this logic, keeping it separate from the `EarningsService`, which should only be concerned with calculating earnings.
  The `PayoutService` will act as an orchestrator, first verifying funds with the `EarningsService`, then calling the external payment gateway, and finally instructing the `EarningsService` to debit the driver's balance.
  The frontend work on `WalletScreen` builds directly on `story-16.1`.
  PRD Reference: 2.2. Driver App -> Instant Payouts

