id: story-45.5
epic: driver-financial-tools
slug: driver-earnings-forecast
title: Provide Driver Earnings Forecast
status: Done
author: Bob (sm)
date: '2024-08-10T05:50:00Z'

description: >
  As a driver, I want to see a forecast of my potential earnings for the
  upcoming week based on historical demand, so I can better plan when to drive.

acceptance_criteria:
  - In the driver's "Earnings" screen, a new "Forecast" tab must be available.
  - The `analytics-service` must use historical ride data to predict demand and earnings potential for different times of day and days of the week.
  - The forecast should be presented visually, showing "hot spots" of high earning potential.

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To build the forecasting model

dev_notes: >
  This is a data-science-heavy feature. The model needs to account for seasonality, local events, and other factors to be accurate. It provides immense value to drivers for planning their work.
