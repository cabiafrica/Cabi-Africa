id: story-45.4
epic: driver-financial-tools
slug: earnings-history-and-trends
title: Implement Earnings History and Trends View
status: Done
author: Bob (sm)
date: '2024-08-09T14:40:00Z'

description: >
  As a driver, I want to view my earnings history with weekly and monthly
  summaries and charts, so that I can track my performance and identify trends.

acceptance_criteria:
  - The `WalletScreen` in the `driver-app` must be enhanced with a "History" or "Trends" tab.
  - This view must display total earnings, hours online, and trips completed for the current week.
  - It must include a bar chart showing daily earnings for the current week.
  - The user must be able to navigate to previous weeks and months to see historical data.
  - The `payment-service` or a new `analytics-service` endpoint must provide this aggregated data.

files_to_be_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To add the new history/trends UI
  - libs/backend/payment-service/src/lib/payment.service.ts # To add endpoints for aggregated earnings data

dev_notes: >
  This feature transforms the earnings screen from a simple ledger into an analytical tool. The main challenge is efficiently querying and aggregating transaction data on the backend to provide these summaries without impacting performance.
