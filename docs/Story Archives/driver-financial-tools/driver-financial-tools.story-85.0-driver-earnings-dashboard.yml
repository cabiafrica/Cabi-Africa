id: story-85.0
epic: driver-financial-tools
slug: driver-earnings-dashboard
title: "Driver App: Implement Basic Earnings Dashboard"
status: Done
author: Gemini Code Assist
date: '2025-12-06T11:05:00Z'

description: >
  As a driver, I want a basic dashboard screen that shows my earnings summary (today, this week) and a list of my recent trips,
  so I can quickly see my financial performance and access trip details.

acceptance_criteria:
  - A new "Earnings" screen must be created in the `driver-app`, accessible from the main navigation.
  - The screen must display a summary section with total earnings for "Today" and "This Week".
  - Below the summary, a list of recent trips must be displayed.
  - The backend `EarningsService` must provide an endpoint to fetch this summary data and recent trip list.
  - Tapping on a trip in the list must navigate to the `TripDetailsScreen` (from story-85.1).

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/earnings_dashboard_screen.dart

files_to_be_modified:
  - # The driver app's main navigation to add a link to the new "Earnings" screen.
  - c:/Users/User/Desktop/Cabi-Flutter/docs/document.service.ts # The EarningsService will need a new method and controller endpoint for the summary.

dev_notes: >
  This story directly implements the "Basic Driver Dashboard" requirement for the MVP from `brief.md`. It serves as the main entry point for all financial features for the driver. The backend `EarningsService` will need to be enhanced to provide a dedicated summary endpoint that is optimized for this screen, separate from the detailed trip history endpoint. This story provides the container for `story-85.1` (Detailed Trip View) and `story-87.1` (MLM Payouts).
  PRD Reference: 2.2. Driver App -> Earnings, Payouts & Financial Tools
