id: story-4.1
epic: epic-4.0
slug: contact-us-page
title: Create "Contact Us" Page with Form
status: Done
author: Sarah (po)
date: '2024-06-17T09:05:00Z'

description: >
  As a site visitor, I want a "Contact Us" page with a form, so that I can
  easily send inquiries, feedback, or partnership requests to the CABI team.

acceptance_criteria:
  - A new page is created in the `user-portal` app at the `/contact` route.
  - The page must contain a form with fields for "Name", "Email", "Subject", and "Message".
  - Basic client-side validation must be present for the email format and to ensure required fields are not empty.
  - A new API route is created at `Cabi Alpha/web/user_portal/src/pages/api/contact.ts` to handle form submissions.
  - For this story, the API route should log the received form data to the console and return a success response.
  - Upon successful form submission, the user should see a confirmation message on the page (e.g., "Thank you for your message! We'll get back to you soon.").
  - A "Contact Us" link is added to the site-wide footer.

files_to_be_created:
  - docs/stories/story-4.1-contact-us-page.yml
  - Cabi Alpha/web/user_portal/src/pages/contact.tsx
  - Cabi Alpha/web/user_portal/src/pages/api/contact.ts

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/components/layout/Footer.tsx

dev_notes: >
  This story establishes a primary communication channel for our users. The backend for this can be simple for now (console logging). In a future story, we can integrate this endpoint with a proper ticketing system like the one used by the `support-service` or an email service.

tasks:
  - id: task-1
    description: Implement the "Contact Us" page and API route.
    subtasks:
      - "[x] Create the new page file at `Cabi Alpha/web/user_portal/src/pages/contact.tsx`."
      - "[x] Create the new API route at `Cabi Alpha/web/user_portal/src/pages/api/contact.ts`."
      - "[x] Update the `Footer.tsx` component to add the 'Contact Us' link."

