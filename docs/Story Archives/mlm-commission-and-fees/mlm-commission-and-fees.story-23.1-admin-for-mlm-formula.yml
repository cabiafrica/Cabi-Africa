id: story-23.1
epic: mlm-commission-and-fees
slug: admin-for-mlm-formula
title: Admin UI and API for MLM Fee Formula Management
status: DONE
author: Sarah (po)
date: '2024-07-27T10:00:00Z'

description: >
  As an administrator, I need a UI and corresponding API endpoints to view,
  create, and update the MLM fee distribution formula, so that I can control
  how registration fees are allocated across the driver network.

acceptance_criteria:
  - The `MLM Service` must expose `GET /admin/mlm/formula` and `PUT /admin/mlm/formula` endpoints as defined in `architecture.md`.
  - The admin panel must have a new page for "MLM Fee Formula".
  - The UI must display the current formula rules (e.g., Sponsor: 10% fixed, Upline 1: 5% fixed, Company: 85%).
  - The UI must allow an administrator to modify the values and types (fixed/percentage) for each rule.
  - Submitting the changes must call the `PUT /admin/mlm/formula` endpoint to update the formula in the database.
  - The backend logic must ensure that the sum of all percentage-based rules does not exceed 100%.

files_to_be_created:
  - apps/admin-panel/src/features/mlm-formula/MlmFormulaPage.tsx

files_to_be_modified:
  - apps/mlm-service/src/mlm/mlm.controller.ts # To add the new endpoints
  - apps/mlm-service/src/mlm/mlm.service.ts # To add the business logic
