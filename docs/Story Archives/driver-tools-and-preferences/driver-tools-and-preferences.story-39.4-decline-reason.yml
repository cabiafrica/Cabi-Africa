id: story-39.4
epic: driver-tools-and-preferences
slug: decline-reason
title: Driver "Decline Reason" Feedback
status: Done
author: Bob (sm)
date: '2024-07-31T11:13:00Z'

description: >
  As a driver, when I decline a ride request, I want to provide a quick
  reason (e.g., "Pickup too far", "Destination too short"), so that the
  platform can understand my decisions.

acceptance_criteria:
  - When a driver taps to decline a ride request, a small, non-intrusive dialog must appear with a list of pre-defined reasons.
  - The selected reason must be sent to the backend along with the `RideRequestRejected` event.
  - The `analytics-service` must consume and aggregate this data.
  - This data can be used to generate reports on why drivers are declining trips in certain areas or at certain times.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/ride_request_panel.dart # To add the decline reason dialog
  - libs/backend/ride-service/src/lib/ride.service.ts # To include the reason in the event payload

dev_notes: >
  This feature provides an invaluable data stream for understanding marketplace dynamics and improving the matching algorithm and pricing.
