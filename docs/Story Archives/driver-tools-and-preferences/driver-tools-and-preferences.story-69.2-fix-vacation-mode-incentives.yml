id: story-69.2
epic: driver-tools-and-preferences
slug: fix-vacation-mode-incentives
title: '[Bug] Fix Vacation Mode to Pause Incentive Programs'
status: Done
author: Bob (sm)
date: '2024-08-15T17:15:00Z'

description: >
  This story addresses a bug identified during the QA review of `story-69.1`.
  While vacation mode correctly pauses notifications, it does not pause the
  driver's standing in any tier or incentive program. This fails a key
  acceptance criterion and means drivers could still be penalized for
  inactivity while on vacation.

acceptance_criteria:
  - This story fixes the `FAIL` status in the QA review of `story-69.1`.
  - The `incentive-service` must be modified to check a driver's vacation status before calculating incentive eligibility or penalties.
  - When calculating metrics that rely on continuous activity (e.g., weekly trip counts, consecutive days online), the service must exclude any days a driver was on vacation.
  - A driver's tier status or incentive eligibility must not be negatively affected by inactivity during their approved vacation period.

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To add logic to check vacation status

dev_notes: >
  This is a high-priority bug fix to complete the original intent of the vacation mode feature. It requires modifying the core logic of the `incentive-service` to read the vacation dates from a driver's user profile and exclude them from any calculations that could penalize them for being offline.

tasks:
  - id: task-1
    description: Update the `incentive-service` to correctly handle drivers who are on vacation, ensuring they are not penalized by incentive programs.
    subtasks:
      - "[x] Add a `findById` method to `user.service.ts` to allow fetching user vacation dates."
      - "[x] Update `incentive.service.ts` to use the `UserService` to check a driver's vacation status."
      - "[x] Ensure incentive calculation logic is skipped if the driver is on vacation."

