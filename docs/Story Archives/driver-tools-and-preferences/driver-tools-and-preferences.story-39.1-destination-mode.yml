id: story-39.1
epic: driver-tools-and-preferences
slug: destination-mode
title: Implement Driver "Destination Mode"
status: Done
author: Bob (sm)
date: '2024-07-30T10:10:00Z'

description: >
  As a driver, I want to set a destination (e.g., my home at the end of the
  day) and only receive ride requests that are heading in that general
  direction, so that I can earn money on my way to my destination.

acceptance_criteria:
  - A "Set Destination" feature must be added to the `driver-app`'s `HomeScreen`.
  - The driver can enter a destination address.
  - While in "Destination Mode", the driver will only be matched with rides whose destination is along their route or in the same general direction.
  - The matching algorithm in the `ride-service` must be updated to filter ride requests based on the driver's destination.
  - The driver should be able to use this feature a limited number of times per day (e.g., twice) to prevent misuse.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/screens/home_screen.dart # To add the destination mode UI
  - libs/backend/ride-service/src/lib/ride.service.ts # To implement the destination-based matching logic

dev_notes: >
  This is the first story for a new `driver-tools-and-preferences` epic. It's a highly requested feature that improves the driver's quality of life and efficiency. The main challenge is the geospatial logic in the backend to determine if a ride request aligns with the driver's path.
