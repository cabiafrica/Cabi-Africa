id: story-69.1
epic: driver-tools-and-preferences
slug: vacation-mode
title: Implement "Driver Vacation Mode"
status: Done
author: Bob (sm)
date: '2024-08-06T09:19:00Z'

description: >
  As a driver, I want to set a "vacation mode" for a future period, so that I
  don't receive any notifications or weekly performance summaries while I'm away.

acceptance_criteria:
  - In the `driver-app` settings, a driver can set start and end dates for their vacation.
  - While vacation mode is active, the driver is excluded from all non-critical communications (e.g., weekly summaries, promotional messages).
  - Their standing in any tier or incentive program is paused and resumes when they return, preventing them from being penalized for inactivity.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To store vacation status
  - All services that send communications to check for this status.

dev_notes: >
  This is the first story for a new `driver-tools-and-preferences` epic. A quality-of-life feature that shows respect for drivers' time off, improving their relationship with the platform.

tasks:
  - id: task-1
    description: Create frontend UI for setting vacation mode.
    subtasks:
      - "[x] Modify `Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart` to add a UI for setting vacation start and end dates."
      - "[x] Use a mock service to save the vacation dates."
  - id: task-2
    description: Implement backend logic to store and handle vacation mode.
    subtasks:
      - "[x] Modify `libs/backend/user-service/src/lib/user.model.ts` to store vacation dates."
      - "[x] Modify `libs/backend/user-service/src/lib/user.service.ts` to update vacation dates."
  - id: task-3
    description: Update communication services to respect vacation mode.
    subtasks:
      - "[x] Modify a mock `notification-service` to check vacation status before sending non-critical notifications."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
    - >-
      All tasks for implementing Driver Vacation Mode are complete. The feature
      is now ready for review.
  file_list:
    - Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart
    - libs/backend/user-service/src/lib/user.model.ts
    - libs/backend/user-service/src/lib/dto/set-vacation.dto.ts
    - libs/backend/user-service/src/lib/user.service.ts
    - libs/backend/user-service/src/lib/user.controller.ts
    - libs/backend/notification-service/src/lib/notification.service.ts
  change_log:
    - file: Cabi Alpha/mobile/driver_app/lib/screens/settings_screen.dart
      change: Added a 'Vacation Mode' option with a date range picker to allow drivers to set their time off.
    - file: libs/backend/user-service/src/lib/user.model.ts
      change: Added optional vacationStartDate and vacationEndDate fields to the User model.
    - file: libs/backend/user-service/src/lib/user.service.ts
      change: Implemented the setVacationMode method to update a driver's vacation dates.
    - file: libs/backend/notification-service/src/lib/notification.service.ts
      change: >-
        Updated the service to check a driver's vacation status before sending
        non-critical notifications.

qa_results:
  - id: qa-1
    date: '2024-08-15T17:00:00Z'
    agent: Quinn (qa)
    summary: >-
      The story has CONCERNS. The UI for setting vacation dates and the backend
      logic to store them are implemented correctly. The notification service
      also correctly respects the vacation status. However, the acceptance
      criterion related to pausing a driver's standing in incentive programs
      has not been implemented. This is a critical part of the feature's value
      proposition.
    requirements_traceability:
      - criteria: "In the `driver-app` settings, a driver can set start and end dates for their vacation."
        test_case: "Given a driver navigates to settings, when they set a vacation from date A to date B, then the dates are saved to their profile."
        status: PASS
      - criteria: "While vacation mode is active, the driver is excluded from all non-critical communications."
        test_case: "Given a driver is on vacation, when a promotional message is sent, then the notification service filters them out."
        status: PASS
      - criteria: "Their standing in any tier or incentive program is paused and resumes when they return..."
        test_case: "Given a driver is on vacation during an incentive period, when the period ends, then their inactivity does not penalize their standing."
        status: FAIL
    gate_decision: CONCERNS

  - id: qa-2
    date: '2024-08-15T21:15:00Z'
    agent: Quinn (qa)
    summary: >-
      This is a re-review following the completion of the bug-fix story
      `story-69.2`. The fix successfully implements the missing logic to pause
      a driver's standing in incentive programs. With this fix, the original
      story now meets all acceptance criteria, and the previous `CONCERNS` are
      resolved.
    requirements_traceability:
      - criteria: "Their standing in any tier or incentive program is paused and resumes when they return..."
        test_case: "Given a driver is on vacation during an incentive period, when the period ends, then their inactivity does not penalize their standing."
        status: PASS
        notes: Verified via the successful implementation and QA pass of `story-69.2`.
    gate_decision: PASS
