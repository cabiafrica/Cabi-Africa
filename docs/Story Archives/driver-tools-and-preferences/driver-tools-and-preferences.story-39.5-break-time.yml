id: story-39.5
epic: driver-tools-and-preferences
slug: break-time
title: Implement Driver "Break Time" Mode
status: Done
author: Bob (sm)
date: '2024-07-31T11:19:00Z'

description: >
  As a driver, I want to be able to take a short break without my acceptance
  rate being negatively affected, so that I can rest without being penalized.

acceptance_criteria:
  - A "Take a Break" button must be available in the `driver-app`.
  - When activated, the driver stops receiving new ride requests for a configurable period (e.g., 30 minutes).
  - This status is different from "Offline" as it indicates a temporary pause.
  - Any incoming requests during this time will not be sent to the driver and will not count against their acceptance rate.
  - The driver can end the break early at any time.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/screens/home_screen.dart # To add the break button
  - libs/backend/ride-service/src/lib/ride.service.ts # To exclude drivers on break from matching

dev_notes: >
  A quality-of-life feature for drivers that acknowledges their need for breaks, potentially improving overall driver satisfaction and retention.
