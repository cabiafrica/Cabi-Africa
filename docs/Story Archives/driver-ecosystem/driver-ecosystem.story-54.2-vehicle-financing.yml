title: Vehicle Financing and Leasing Partnerships
status: Done
author: Bob (sm)
date: '2024-08-05T09:01:00Z'

description: >
  As a driver, I want to access special offers for vehicle financing or
  leasing through the platform, so that I can get a compliant vehicle more easily.

acceptance_criteria:
  - The "Marketplace" (`story-54.1`) will feature a section for vehicle solutions.
  - This will link out to the websites of third-party financing and leasing partners.
  - The platform may pass a referral token to the partner.
  - High-performing drivers (based on tier) may see exclusive or better offers.

