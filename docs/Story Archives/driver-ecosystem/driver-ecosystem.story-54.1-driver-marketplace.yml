id: story-54.1
epic: driver-ecosystem
slug: driver-marketplace
title: Implement "Driver App Marketplace"
status: Done
author: Bob (sm)
date: '2024-08-02T10:16:00Z'

description: >
  As a driver, I want access to a marketplace within my app that offers
  discounts on things I need, like gas, car maintenance, and insurance, so
  that I can reduce my operating costs.

acceptance_criteria:
  - A new "Marketplace" or "Driver Perks" screen must be added to the `driver-app`.
  - This screen will display offers from third-party partners.
  - The `incentive-service` or a new `partnership-service` will manage these offers.
  - Some offers may be available to all drivers, while others may be unlocked by reaching a certain driver tier (`story-44.3`).

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/marketplace_screen.dart

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To manage and serve offers

dev_notes: >
  This is the first story for a new `driver-ecosystem` epic. It adds value to the driver experience beyond direct earnings and requires business development efforts to secure partnerships.