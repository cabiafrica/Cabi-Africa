id: story-20.7
epic: ratings-and-reviews
slug: automated-low-rating-warnings
title: Implement Automated Warnings for Low-Rated Users
status: DONE
author: Bob (sm)
date: '2024-07-27T09:02:00Z'

description: >
  As a system administrator, I want to automatically warn or deactivate users
  (both drivers and passengers) whose average rating falls below a certain
  threshold, so that we can maintain a high-quality and safe community.

acceptance_criteria:
  - A scheduled job must be created in the `rating-service` to periodically review user ratings.
  - The system must have configurable rating thresholds for warnings and deactivation (e.g., warning at 4.5, deactivation at 4.2).
  - When a user's average rating drops below the warning threshold, the `notification-service` must send them an automated warning message.
  - If a user's rating drops below the deactivation threshold, the `rating-service` must call the `user-service` to suspend their account.
  - The `user-service` must update the user's status to 'suspended' and publish an `AccountSuspended` event.
  - All actions (warnings, deactivations) must be logged for administrative review.

files_to_be_created:
  - libs/backend/rating-service/src/lib/rating.scheduler.ts

files_to_be_modified:
  - libs/backend/rating-service/src/lib/rating.service.ts # To implement the checking logic
  - libs/backend/user-service/src/lib/user.service.ts # To add a 'suspend' method

dev_notes: >
  This story operationalizes the rating system, turning it from a simple metric into an active quality control mechanism. The thresholds must be easily configurable. This automation is crucial for scaling the platform while maintaining quality standards.
