id: story-42.1
epic: ratings-and-reviews
slug: passenger-rate-driver
title: Passenger Rate and Review Driver After Trip
status: Done
author: Bob (sm)
date: '2024-08-10T17:45:00Z'

description: >
  As a passenger, after completing a ride, I want to be able to rate my driver
  and leave a short review, so that I can provide feedback on my experience.

acceptance_criteria:
  - Immediately after a ride is completed, the `passenger-app` must present a rating screen.
  - The rating screen must allow the passenger to give a star rating (e.g., 1-5 stars).
  - The rating screen must include an optional text field for a written review.
  - Submitting the rating and review must send the data to the `rating-service`.
  - The `rating-service` must store the rating and review, associating it with the driver and the specific trip.
  - The `rating-service` must update the driver's average rating.
  - The passenger should receive a confirmation that their feedback has been submitted.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/rating_review_screen.dart
  - libs/backend/rating-service/src/lib/rating.controller.ts
  - libs/backend/rating-service/src/lib/rating.service.ts

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/trip_completion_screen.dart # To trigger the rating screen
  - libs/backend/rating-service/src/lib/rating.module.ts # To register components
  - The database schema for the `rating-service` to add a `ratings` table.

dev_notes: >
  This is the foundational story for the ratings and reviews system. It focuses
  on the passenger's ability to submit feedback. Subsequent stories will cover
  displaying ratings, driver's ability to rate passengers, and admin moderation.
  The rating calculation should be robust and handle edge cases (e.g., first-time drivers).

tasks:
  - id: task-1
    description: Create the backend rating-service.
    subtasks:
      - "[x] Create `libs/backend/rating-service/src/lib/rating.service.ts` and `rating.controller.ts`."
      - "[x] Add a `create` method to the service to handle new rating submissions."
      - "[x] Expose this method via a `POST /ratings` endpoint."
  - id: task-2
    description: Create the frontend rating and review screen.
    subtasks:
      - "[x] Create `Cabi Alpha/mobile/passenger_app/lib/screens/rating_review_screen.dart`."
      - "[x] Implement a UI for star rating and an optional text review."
      - "[x] On submission, call the new backend endpoint."

