id: story-42.2
epic: ratings-and-reviews
slug: display-driver-rating
title: Display Driver's Average Rating on Profile
status: DONE
author: Bob (sm)
date: '2024-08-11T09:00:00Z'

description: >
  As a driver, I want to see my current average rating on my profile screen,
  so that I can get feedback on my performance and understand how passengers
  perceive my service.

acceptance_criteria:
  - The `ProfileScreen` in the `driver-app` must be updated to display the driver's average rating.
  - The rating should be displayed visually with star icons and a numerical value (e.g., "4.8 ★").
  - A new backend endpoint (e.g., `GET /drivers/me/profile`) must be created to provide the driver's profile data, including their calculated average rating.
  - The `rating-service` (or a related `user-service`) will be responsible for providing this average rating data.
  - The `driver-app` must call this new endpoint to fetch and display the rating when the `ProfileScreen` is loaded.
  - If a driver has not yet received any ratings, the screen should display a message like "No ratings yet".

files_to_be_modified:
  - apps/driver-app/src/screens/profile_screen.dart
  - libs/backend/user-service/src/lib/user.controller.ts # Or a new driver-profile service
  - libs/backend/user-service/src/lib/user.service.ts # To fetch and include the average rating

dev_notes: >
  This story makes the feedback from `story-42.1` useful to the driver. It involves fetching the pre-calculated average rating from the backend and displaying it in the driver's app. This is a read-only feature. The backend service should join data from the user's record and their aggregated rating from the `rating-service`.
