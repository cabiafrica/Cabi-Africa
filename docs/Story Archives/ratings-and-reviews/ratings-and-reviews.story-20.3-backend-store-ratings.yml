id: story-20.3
epic: ratings-and-reviews
slug: backend-store-ratings
title: Implement Backend to Store and Process Driver Ratings
status: Done
author: Bob (sm)
date: '2024-07-19T10:32:00Z'

description: >
  As the system, I need to receive, validate, and store driver ratings
  submitted by passengers, so that this data can be used to calculate
  overall driver scores and for review.

acceptance_criteria:
  - A new `rating-service` must be created in the backend.
  - The `rating-service` must expose a secure endpoint (e.g., POST `/ratings/driver`) to accept new ratings.
  - The endpoint must validate the incoming payload (trip ID, rating value 1-5, optional comment).
  - The service must verify that the authenticated user (passenger) was actually on the specified trip to prevent fraudulent ratings.
  - The rating data must be stored in a new database table (e.g., `driver_ratings`).
  - After storing a rating, the `rating-service` should trigger a background job or publish an event to asynchronously recalculate the driver's average rating.
  - The `user-service` should be updated with a new field on the driver's profile to store their average rating and total rating count.

files_to_be_created:
  - libs/backend/rating-service/src/lib/rating.service.ts
  - libs/backend/rating-service/src/lib/rating.controller.ts
  - libs/backend/rating-service/src/lib/rating.module.ts

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.model.ts # To add average rating fields to the driver model

dev_notes: >
  This story provides the backend support for the frontend feature in `story-20.2`. Creating a dedicated `rating-service` keeps the domain logic clean. The recalculation of a driver's average rating should be an asynchronous process to keep the rating submission endpoint fast. This service will be the source of truth for all feedback data.
