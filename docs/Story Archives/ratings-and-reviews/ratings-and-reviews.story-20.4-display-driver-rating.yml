id: story-20.4
epic: ratings-and-reviews
slug: display-driver-rating
title: Display Average Rating in Driver and Admin Apps
status: Done
author: Bob (sm)
date: '2024-07-19T11:03:00Z'

description: >
  As a driver, I want to see my average rating in my app. As an admin, I want
  to see driver ratings in the admin panel, so that performance can be
  monitored by both drivers and the company.

acceptance_criteria:
  - The `driver-app`'s `ProfileScreen` must be updated to display the driver's average rating and total number of ratings.
  - The `user-service` must expose the `averageRating` and `ratingCount` fields on the driver's profile endpoint.
  - The `driver-app` must fetch and display this information.
  - In the `admin-panel`, the driver list page must be updated to include a column for "Average Rating".
  - The admin endpoint that lists drivers must be updated to include the rating information.
  - The rating should be displayed visually, for example, as "4.85 ★".

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To display the rating
  - apps/admin-panel/src/app/drivers/page.tsx # Or equivalent driver list page, to add the rating column
  - libs/backend/user-service/src/lib/user.service.ts # To ensure rating data is returned in driver profile endpoints

dev_notes: >
  This story closes the feedback loop by making the rating data, calculated in `story-20.3`, visible. For drivers, it's a key performance indicator. For admins, it's a crucial tool for quality management. The data should already be available on the user model, so this is primarily a frontend and API serialization task.
