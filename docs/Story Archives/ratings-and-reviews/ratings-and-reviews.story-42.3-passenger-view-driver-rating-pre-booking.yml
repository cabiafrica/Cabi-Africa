id: story-42.3
epic: ratings-and-reviews
slug: passenger-view-driver-rating-pre-booking
title: Display Driver Rating to Passenger Before Ride Confirmation
status: DONE
author: Bob (sm)
date: '2024-08-11T11:00:00Z'

description: >
  As a passenger, I want to see the driver's average rating after a match is
  found but before the ride is confirmed, so that I can make an informed
  decision about the driver I will be riding with.

acceptance_criteria:
  - When a driver is assigned to a passenger's ride request, the UI panel showing the driver's details (e.g., name, car model) must also display their average star rating.
  - The rating should be displayed clearly, for example, "4.8 ★".
  - The backend service responsible for matching a driver to a ride (`ride-service`) must be updated to include the driver's average rating in the payload sent to the passenger app.
  - This will likely require the `ride-service` to communicate with the `rating-service` or a shared data source to retrieve the driver's current average rating.
  - If a driver has not yet received any ratings, the UI should display a neutral message like "New Driver" instead of a zero-star rating.
  - The `DriverDetailsPanel` (or equivalent widget) in the `passenger-app` must be updated to render this new rating information.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/driver_details_panel.dart # Or the widget that shows the matched driver's info
  - libs/backend/ride-service/src/lib/ride.service.ts # To fetch and include the driver's rating in the match payload
  - libs/backend/ride-service/src/lib/ride.dto.ts # To add the rating field to the data transfer object

dev_notes: >
  This story makes the rating system a proactive tool for passengers, rather than just a reactive feedback mechanism. It closes the loop by making driver ratings a key part of the booking decision. The main technical task is an inter-service communication on the backend to enrich the driver-match data with their average rating.
