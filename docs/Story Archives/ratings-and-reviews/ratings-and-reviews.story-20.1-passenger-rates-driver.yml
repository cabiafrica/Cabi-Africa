id: story-20.1
epic: ratings-and-reviews
slug: passenger-rates-driver
title: Allow Passenger to Rate Driver After Trip
status: Done
author: Bob (sm)
date: '2024-06-21T09:00:00Z'

description: >
  As a passenger, after my trip is complete, I want to rate my driver on a
  scale of 1 to 5 stars and provide optional feedback, so that I can share my
  experience and help maintain service quality on the platform.

acceptance_criteria:
  - After the payment is confirmed on the `TripSummaryPanel`, the `passenger-app` must display a new "Rate Your Driver" screen.
  - This screen must show the driver's name and profile picture.
  - It must feature a 1-5 star rating selector.
  - It must include an optional text field for comments.
  - A "Submit Rating" button sends the rating data to a new backend `rating-service`.
  - A new backend `rating-service` must be created to receive and store ratings.
  - The `rating-service` must store the star rating and optional comment, associating it with the `rideId`, `driverId`, and `passengerId`.
  - After storing the new rating, the `rating-service` must trigger an update of the driver's average rating in the `user-service`.
  - The `user-service` must be updated to store and manage an `averageRating` and `ratingCount` for each driver.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/rate_driver_screen.dart
  - libs/backend/rating-service/src/lib/rating.service.ts
  - libs/backend/rating-service/src/lib/rating.controller.ts
  - libs/backend/rating-service/src/lib/rating.module.ts

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/widgets/trip_summary_panel.dart # To navigate to the rating screen after payment
  - libs/backend/user-service/src/lib/user.service.ts # To add logic for updating a driver's average rating
  - The database schema for the `user-service` to add `averageRating` and `ratingCount` fields to the user model.
  - The database schema for the new `rating-service` to store individual ratings.

dev_notes: >
  This is the foundational story for the new "Ratings and Reviews" epic. It introduces a new `rating-service` to decouple rating logic from other services. The most complex part of this story will be the interaction between the `rating-service` and the `user-service` to keep the driver's average rating up-to-date in real-time. The reverse flow (driver rating passenger) will be handled in a subsequent story.
