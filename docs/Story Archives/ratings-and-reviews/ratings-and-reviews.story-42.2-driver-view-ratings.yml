id: story-42.2
epic: ratings-and-reviews
slug: driver-view-ratings
title: Allow Driver to View Their Ratings and Feedback
status: Done
author: Bob (sm)
date: '2024-08-10T20:30:00Z'

description: >
  As a driver, I want to see my average rating and the feedback passengers
  have left for me, so that I can understand my performance and improve my service.

acceptance_criteria:
  - A new "My Ratings" or "Feedback" screen must be added to the `driver-app`, accessible from their profile or main menu.
  - The screen must prominently display the driver's overall average star rating (e.g., 4.85 stars).
  - The screen must display a list of recent reviews/comments left by passengers.
  - For privacy, passenger names and trip details should be anonymized in the review list.
  - The `rating-service` must expose a new endpoint to fetch the ratings and reviews for the currently logged-in driver.
  - The endpoint should support pagination to handle drivers with a large number of reviews.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/ratings_feedback_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart # To add a link to the new ratings screen
  - libs/backend/rating-service/src/lib/rating.service.ts # To add logic for fetching a driver's ratings
  - libs/backend/rating-service/src/lib/rating.controller.ts # To expose the new endpoint

dev_notes: >
  This story provides the crucial feedback loop for drivers, which is essential for their engagement and service quality improvement. It's important to ensure that the feedback displayed is anonymous to protect passenger privacy. The initial version can show all reviews, while future stories could add filtering or trend analysis.

tasks:
  - id: task-1
    description: Implement the backend logic for fetching driver ratings.
    subtasks:
      - "[x] Add a `getDriverRatings` method to `libs/backend/rating-service/src/lib/rating.service.ts`."
      - "[x] The method should calculate the driver's average rating and return a paginated list of recent reviews."
      - "[x] Expose this method via a new `GET /ratings/my-ratings` endpoint in `libs/backend/rating-service/src/lib/rating.controller.ts`."
  - id: task-2
    description: Create the frontend screen for drivers to view their ratings.
    subtasks:
      - "[x] Create `Cabi Alpha/mobile/driver_app/lib/screens/ratings_feedback_screen.dart`."
      - "[x] The screen should fetch data from the new endpoint."
      - "[x] Display the overall average rating prominently."
      - "[x] Display a list of recent reviews, excluding passenger details for privacy."

