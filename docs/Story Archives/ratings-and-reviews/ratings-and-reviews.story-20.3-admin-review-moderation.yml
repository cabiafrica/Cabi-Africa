id: story-20.3
epic: ratings-and-reviews
slug: admin-review-moderation
title: Implement Admin Panel for Rating and Review Moderation
status: Done
author: Bob (sm)
date: '2024-06-24T09:00:00Z'

description: >
  As an administrator, I want to view all submitted ratings and reviews, and
  have the ability to hide or delete inappropriate content, so that I can
  maintain a professional and safe community standard.

acceptance_criteria:
  - A new "Ratings & Reviews" page must be created in the `admin-panel`.
  - This page must fetch and display a paginated list of all submitted ratings from the `rating-service`.
  - The list should be filterable by star rating (e.g., show only 1-star ratings) and searchable by driver or passenger ID.
  - Each item in the list must display: the star rating, the comment, who rated whom, the associated ride ID, and the date.
  - An administrator must have an action to "Hide" a specific review.
  - Hiding a review should change its status so it is no longer publicly visible or factored into average ratings, but it should be retained in the database for auditing.
  - When a review is hidden, the `rating-service` must trigger a recalculation of the rated user's average rating in the `user-service`.
  - The `rating-service` must expose new, secure, admin-only endpoints for fetching all ratings and for updating a rating's status (e.g., to 'hidden').

files_to_be_created:
  - apps/admin-panel/src/app/ratings/page.tsx

files_to_be_modified:
  - apps/admin-panel/src/components/layout/sidebar.tsx # To add the link to the new page
  - libs/backend/rating-service/src/lib/rating.controller.ts # To add admin endpoints for fetching and moderation
  - libs/backend/rating-service/src/lib/rating.service.ts # To implement moderation logic
  - libs/backend/user-service/src/lib/user.service.ts # To add a method for recalculating a user's average rating
  - The database schema for the `rating-service` to add a `status` field (e.g., 'visible', 'hidden') to the ratings table.

dev_notes: >
  This story provides essential moderation capabilities for the platform. The new admin endpoints in the `rating-service` must be properly secured. The most critical interaction is the recalculation of a user's average rating after a review is hidden to ensure data consistency. This will likely require a new method in the `user-service` that can be called by the `rating-service`.
