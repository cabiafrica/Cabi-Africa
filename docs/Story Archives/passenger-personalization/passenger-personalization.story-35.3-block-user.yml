id: story-35.3
epic: passenger-personalization
slug: block-user
title: Implement "Block a User" Feature
status: DONE
author: Bob (sm)
date: '2024-07-30T10:11:00Z'

description: >
  As a user (passenger or driver), after a particularly bad experience, I
  want to block the other person so that I am never matched with them again.

acceptance_criteria:
  - After rating a user (driver rating passenger, or passenger rating driver), an option to "Block this person" should be available.
  - The `user-service` must be updated to store a block list for each user.
  - The ride matching algorithm in the `ride-service` must be updated to check this block list.
  - The system must never match a passenger with a driver they have blocked, or a driver with a passenger they have blocked.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/rate_driver_screen.dart # To add block option
  - apps/driver-app/src/screens/rate_passenger_screen.dart # To add block option
  - libs/backend/user-service/src/lib/user.service.ts # To store block lists
  - libs/backend/ride-service/src/lib/ride.service.ts # To enforce the block during matching

dev_notes: >
  A critical safety and comfort feature. It gives users control over their experience. The implementation is a simple but crucial check during the matching process.
