id: story-35.2
epic: passenger-personalization
slug: manage-favorite-drivers
title: Manage Favorite Drivers List
status: DONE
author: Bob (sm)
date: '2024-07-30T10:00:00Z'

description: >
  As a passenger, I want to view and remove drivers from my "Favorite
  Drivers" list, so that I can manage my preferences.

acceptance_criteria:
  - The `FavoriteDriversScreen` (`story-35.1`) must display a list of all drivers the passenger has marked as a favorite.
  - Each item in the list should show the driver's name, photo, and rating.
  - The user must be able to remove a driver from this list.
  - The `user-service` must expose endpoints for listing and removing favorite drivers.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/favorite_drivers_screen.dart # To implement the list and remove functionality
  - libs/backend/user-service/src/lib/user.controller.ts # To add endpoints for managing favorites

dev_notes: >
  This story completes the "Favorite Driver" feature by providing the necessary management capabilities for the user. It's a straightforward CRUD (Create, Read, Delete) feature.
