id: story-8.1
epic: epic-8.0
slug: i18n-framework-setup
title: Setup i18n Framework
status: Done
author: Sarah (po)
date: '2024-06-27T17:05:00Z'

description: >
  As a developer, I want to set up an internationalization (i18n) framework
  in the `user-portal` app, so that we can easily add and manage translations
  for different languages in the future.

acceptance_criteria:
  - An i18n library (e.g., `next-i18next`) is added as a dependency to the `user-portal` app.
  - The Next.js configuration (`next.config.js`) is updated to support i18n routing for English (`en`) and Swahili (`sw`).
  - A configuration file for the i18n library is created (e.g., `next-i18next.config.js`).
  - A directory structure for translation files is established at `Cabi Alpha/web/user_portal/public/locales/[locale]/common.json`.
  - Initial translation files are created for `en` and `sw` with at least one shared key (e.g., a welcome message).
  - The `_app.tsx` file is wrapped with the i18n provider to make translations available throughout the app.
  - The homepage (`/`) is refactored to use a translated string from the new i18n framework to prove the setup is working.

files_to_be_created:
  - docs/stories/story-8.1-i18n-framework-setup.yml
  - Cabi Alpha/web/user_portal/next-i18next.config.js
  - Cabi Alpha/web/user_portal/public/locales/en/common.json
  - Cabi Alpha/web/user_portal/public/locales/sw/common.json

files_to_be_modified:
  - Cabi Alpha/web/user_portal/next.config.js
  - Cabi Alpha/web/user_portal/src/pages/_app.tsx
  - Cabi Alpha/web/user_portal/src/pages/index.tsx

tasks:
  - id: task-1
    description: "Framework Installation and Configuration"
    subtasks:
      - "[x] Add `next-i18next` as a dependency."
      - "[x] Create `next-i18next.config.js` to define supported locales."
      - "[x] Update `next.config.js` to enable i18n routing."
  - id: task-2
    description: "Application Integration"
    subtasks:
      - "[x] Create translation files for 'en' and 'sw' at `public/locales/`."
      - "[x] Wrap `_app.tsx` with the `appWithTranslation` HOC."
      - "[x] Refactor the homepage to use the `useTranslation` hook and `serverSideTranslations` to prove the setup works."

