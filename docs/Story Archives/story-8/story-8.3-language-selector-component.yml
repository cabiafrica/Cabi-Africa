id: story-8.3
epic: epic-8.0
slug: language-selector-component
title: Create Language Selector Component
status: Done
author: Sarah (po)
date: '2024-06-28T10:30:00Z'

description: >
  As a user, I want an easy-to-use language selector on the website, so that
  I can switch between available languages (e.g., English and Swahili) to
  view content in my preferred language.

acceptance_criteria:
  - A new reusable "LanguageSelector" component is created.
  - The component is added to the site-wide footer, making it accessible on all pages.
  - The component must display the currently selected language (e.g., "English").
  - When clicked, it should present a list of all available languages ("English", "Swahili").
  - Selecting a new language from the list must redirect the user to the same page under the new language's path (e.g., from `/drivers` to `/sw/drivers`).
  - The component should handle root paths correctly (e.g., from `/` to `/sw` and vice-versa).

files_to_be_created:
  - docs/stories/story-8.3-language-selector-component.yml
  - Cabi Alpha/web/user_portal/src/components/layout/LanguageSelector.tsx

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/components/layout/Footer.tsx

dev_notes: >
  This component is key to making our i18n implementation usable. It should
  leverage the Next.js router to switch locales. A dropdown menu is a good
  UI choice for scalability as we add more languages.

tasks:
  - id: task-1
    description: "Implement the Language Selector component and integrate it."
    subtasks:
      - "[x] Create the new reusable `LanguageSelector.tsx` component."
      - "[x] Add the `LanguageSelector` component to the site-wide `Footer.tsx`."
      - "[x] Add the `language_selector_label` key to the `en` and `sw` translation files."

