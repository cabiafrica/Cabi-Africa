id: story-8.2
epic: epic-8.0
slug: localize-marketing-site
title: Localize Core Marketing Site Pages
status: Done
author: Sarah (po)
date: '2024-06-28T09:30:00Z'

description: >
  As a marketing manager, I want the core marketing pages (Homepage, For
  Drivers, For Passengers) to be available in both English and Swahili, so
  that we can effectively communicate our value proposition to a wider, local
  audience.

acceptance_criteria:
  - All static text content on the core marketing pages (`/`, `/drivers`, `/passengers`) and their primary components must be extracted into translation files.
  - This includes text in the `Hero`, `DynamicStats`, `Testimonials`, `NewsletterSignup`, and `Footer` components.
  - The `en/common.json` and `sw/common.json` files must be updated with all extracted strings and their translations.
  - The pages (`index.tsx`, `drivers.tsx`, `passengers.tsx`) must be refactored to load the `common` namespace and use the `useTranslation` hook.
  - The components must also be refactored to use the `useTranslation` hook.
  - The site must render correctly in both English (`/`, `/drivers`) and Swahili (`/sw`, `/sw/drivers`) without any missing text or layout issues.

files_to_be_created:
  - docs/stories/story-8.2-localize-marketing-site.yml

files_to_be_modified:
  - Cabi Alpha/web/user_portal/public/locales/en/common.json
  - Cabi Alpha/web/user_portal/public/locales/sw/common.json
  - Cabi Alpha/web/user_portal/src/pages/index.tsx
  - Cabi Alpha/web/user_portal/src/pages/drivers.tsx
  - Cabi Alpha/web/user_portal/src/pages/passengers.tsx
  - Cabi Alpha/web/user_portal/src/components/marketing/DynamicStats.tsx
  - Cabi Alpha/web/user_portal/src/components/marketing/NewsletterSignup.tsx
  - Cabi Alpha/web/user_portal/src/components/layout/Footer.tsx
  - Cabi Alpha/web/user_portal/src/components/marketing/Testimonials.tsx

tasks:
  - id: task-1
    description: "Update Translation Files"
    subtasks:
      - "[x] Extract all static text from core marketing pages and components."
      - "[x] Update `en/common.json` with all extracted English strings."
      - "[x] Update `sw/common.json` with all corresponding Swahili translations."
  - id: task-2
    description: "Refactor Pages and Components"
    subtasks:
      - "[x] Refactor `index.tsx`, `drivers.tsx`, and `passengers.tsx` to load translations and use the `useTranslation` hook."
      - "[x] Refactor `DynamicStats.tsx`, `NewsletterSignup.tsx`, `Footer.tsx`, and `Testimonials.tsx` to use the `useTranslation` hook."

