id: story-120.10
epic: user-groups-and-networks
slug: organization-leaderboards
title: Implement Organization-Specific Leaderboards
status: DONE
author: Sarah (po)
date: '2024-06-12T12:00:00Z'

description: >
  As an organization manager, I want to see leaderboards for my members based
  on key metrics, so I can foster friendly competition and recognize top performers.

acceptance_criteria:
  - A new "Leaderboards" tab must be added to the organization dashboard in the `group-portal-web`.
  - The leaderboards must be visible only to members of that organization.
  - The leaderboards should rank members on metrics like "Trips Completed," "5-Star Ratings," and "Positive Feedback."
  - The data for these leaderboards will be provided by the `analytics-service`, which must be updated to support filtering by `organizationId`.

files_to_be_created:
  - apps/group-portal-web/src/app/dashboard/[groupId]/leaderboards/page.tsx

dev_notes: >
  This feature introduces a gamification layer within the driver organizations, distinct from the city-wide leaderboards in `story-62.7`. It aims to increase engagement and performance within a specific group. The `analytics-service` will need a significant update to efficiently aggregate metrics on a per-organization basis.