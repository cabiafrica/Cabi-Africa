id: story-120.2
epic: user-groups-and-networks
slug: organization-activity-management
title: Enable Organization Managers to Create and Manage Activities
status: DONE
author: Mary (analyst)
date: '2024-08-10T10:15:00Z'

description: >
  As a driver organization manager, I want to create and manage activities
  for my members within our organization's portal, so I can coordinate
  events, set performance goals, and track participation.

acceptance_criteria:
  - A new "Activities" section is added to the Driver Organization Portal dashboard.
  - In this section, a manager can create a new activity with a title, description, and date/time.
  - Created activities are listed in the dashboard for the manager to see.
  - A corresponding "Organization Activities" view is created in the `driver-app`, visible to drivers who are part of an organization.
  - Drivers can see the list of activities published by their organization manager.

files_to_be_created:
  - apps/group-portal-web/src/app/dashboard/[groupId]/activities/page.tsx # Manager's UI to create/manage activities
  - Cabi Alpha/mobile/driver_app/lib/screens/organization_activities_screen.dart # Driver's view of their organization's activities

dev_notes: >
  This story builds on the foundational portal from `story-120.1`. It introduces the first major interactive feature between managers and members. The initial focus is on the simple creation and viewing of activities. Tracking participation, adding different activity types (e.g., quests with financial rewards), and member RSVPs will be handled in subsequent stories.