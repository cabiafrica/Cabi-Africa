id: story-120.11
epic: user-groups-and-networks
slug: mlm-referral-system
title: Design and Implement Multi-Level Referral Program
status: DONE
author: Sarah (po)
date: '2024-06-12T12:00:00Z'

description: >
  As a platform operator, I want to introduce a new multi-level referral program
  to incentivize user acquisition through driver organizations and their networks,
  including the distribution of registration fees and performance-based ride commissions.

dev_notes: >
  This story was split from `story-120.1` to be handled separately. It will require significant design work on the incentive and user services to support a hierarchical referral structure (e.g., via `referrerId` on the user model) and define the rules for commission and bonus payouts across multiple levels. This is a high-complexity, high-business-value feature that needs its own dedicated analysis and implementation plan.
