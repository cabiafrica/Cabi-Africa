id: story-120.2
epic: user-groups-and-networks
slug: public-organization-profile
title: Create Public Profile Page for Driver Organizations
status: DONE
author: Sarah (po)
date: '2024-06-12T12:00:00Z'

description: >
  As a driver looking to join an organization, I want to view a public profile
  page for each organization, so I can learn more about them before I decide
  to request to join.

acceptance_criteria:
  - A public-facing profile page must be created for each "Active" organization.
  - The page should be accessible via a clean URL (e.g., /orgs/[org-slug]).
  - The profile must display the organization's name, a description/mission statement (managed from the portal), and the number of active members.
  - The profile page must include a "Request to Join" button, which initiates the flow defined in `story-120.4`.

files_to_be_created:
  - apps/group-portal-web/src/app/orgs/[orgSlug]/page.tsx # The public profile page for an organization.

dev_notes: >
  This story creates the "front door" for organizations, allowing them to be discovered by potential new members. It builds on the foundational data from `story-120.1`. The content for this page (like the description) should be manageable by the organization's leadership team from their dashboard.