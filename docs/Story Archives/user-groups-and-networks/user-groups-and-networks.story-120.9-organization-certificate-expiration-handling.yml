id: story-120.9
epic: user-groups-and-networks
slug: organization-certificate-expiration-handling
title: Handle Expired Organization Registration Certificates
status: DONE
author: Mary (analyst)
date: '2024-08-10T10:55:00Z'

description: >
  As a platform administrator, I need the system to track the expiration of
  organization registration certificates and take appropriate action, so that
  all active organizations on the platform remain compliant.

acceptance_criteria:
  - The `Driver Organization` data model (from `story-120.1`) must include a field for `certificate_expiration_date`.
  - A scheduled backend job must run periodically to identify organizations whose certificates are expiring within a configurable threshold (e.g., 30 days, 7 days).
  - When an expiration is approaching, the organization's founder and leader board members must receive automated notifications (in-app and email) reminding them to upload a new certificate.
  - Once the `certificate_expiration_date` passes, the organization's status automatically changes to "Expired" or "Non-Compliant".
  - While in "Expired" status, the organization's portal features (e.g., creating activities, approving members) are disabled, and its drivers cannot receive organization-specific benefits.
  - The `admin-panel` must provide a view for administrators to see all organizations with expiring or expired certificates.
  - The organization founder/leader board can upload a new certificate via the `group-portal-web`, which then triggers a re-verification process by a platform administrator (similar to initial registration).
  - Upon re-verification and approval, the organization's status reverts to "Active".

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To add expiration date to organization model and update status logic.
  - libs/backend/notification-service/src/lib/notification.service.ts # To send expiration reminders.
  - apps/admin-panel/src/app/organizations/page.tsx # To add views for expired/expiring organizations.
  - apps/group-portal-web/src/app/dashboard/[groupId]/management/page.tsx # To allow uploading new certificates.

dev_notes: >
  This story ensures ongoing compliance for organizations. The "Expired" status should clearly communicate to the organization that action is required. The re-verification process should leverage the existing `story-120.1` verification flow.