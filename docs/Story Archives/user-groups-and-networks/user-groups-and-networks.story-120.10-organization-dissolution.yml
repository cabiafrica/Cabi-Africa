id: story-120.10
epic: user-groups-and-networks
slug: organization-dissolution
title: Implement Process for Dissolving an Organization
status: DONE
author: Mary (analyst)
date: '2024-08-10T11:00:00Z'

description: >
  As an organization founder or a platform administrator, I need a formal
  process to dissolve an organization on the platform when it ceases to exist,
  so that members are correctly transitioned and the platform remains accurate.

acceptance_criteria:
  - In the `group-portal-web`, the founder can initiate a "Dissolve Organization" request from the management page.
  - The request must be behind a confirmation dialog to prevent accidental initiation.
  - Submitting the request creates a "pending dissolution" task for platform administrators.
  - In the `admin-panel`, an administrator can review and approve the dissolution request.
  - Upon approval, the system changes the organization's status to "Dissolved".
  - The `organizationId` for all drivers in that organization is set to null.
  - All former members are notified that their organization has been dissolved and they are now independent drivers.
  - The dissolved organization's portal becomes inaccessible.

files_to_be_modified:
  - apps/group-portal-web/src/app/dashboard/[groupId]/management/page.tsx # To add the "Dissolve Organization" feature.
  - apps/admin-panel/src/app/organizations/page.tsx # To review and approve dissolution requests.
  - libs/backend/user-service/src/lib/user.service.ts # To handle the dissolution logic and member updates.

dev_notes: >
  This is a critical off-boarding process for an entire organization. The admin approval step is essential to prevent accidental or malicious dissolutions. The process must gracefully transition all members back to independent status.

  **Important:** Dissolution should be treated as a permanent, irreversible action. If an organization wishes to reform, they must go through the new registration process again. The "Dissolved" status is a final state.

  **Data Retention:** Upon dissolution, the organization's data (activities, announcements, audit logs, etc.) becomes inaccessible but is not immediately deleted. It is "soft-deleted" and retained on the backend according to the platform's general data retention policies for auditing and legal purposes, before being permanently purged.