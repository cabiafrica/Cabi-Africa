id: story-53.3
epic: location-specific-features
slug: event-mode
title: Implement "Event Mode" for Venues
status: DONE
author: Bob (sm)
date: '2024-08-05T09:06:00Z'

description: >
  As an operations manager, I want to configure an "Event Mode" for a specific
  venue (e.g., a stadium or concert hall) during a specific time, so that we
  can manage the surge in demand when an event ends.

acceptance_criteria:
  - The `admin-panel` must allow creating an event with a geofence, a time window, and a dedicated pickup/dropoff zone.
  - During the event window, passengers and drivers within the geofence are shown special instructions.
  - A temporary, fixed surcharge may be applied to all trips to/from the event zone.
  - The system may use a virtual queue (`story-53.2`) for drivers at the designated pickup point.

files_to_be_created: []

files_to_be_modified:
  - apps/admin-panel/src/app/events/page.tsx # New UI for event management
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle event-based logic

dev_notes: >
  This feature builds on the airport logic to handle temporary, high-demand situations. It's key to providing a good user experience during large public events.
