id: story-28.2
epic: accessibility
slug: dynamic-font-sizing
title: Add Support for Dynamic Font Sizing
status: Done
author: Bob (sm)
date: '2024-07-28T09:00:00Z'

description: >
  As a user with low vision, I want the app's text to respect my device's
  system-level font size settings, so that I can read all content comfortably
  without needing to pinch-to-zoom.

acceptance_criteria:
  - Both the `passenger-app` and `driver-app` must adapt to the user's chosen font size in their device settings (Dynamic Type on iOS, Font Size on Android).
  - All text elements, including buttons, labels, input fields, and informational text, must scale up and down accordingly.
  - UI layouts must remain usable and not break when font sizes are increased to the largest settings. Text should wrap correctly and not be truncated or overflow its container.
  - Widgets with text content should not have fixed heights; they must use responsive layout widgets like `Flexible`, `Expanded`, or be placed in scrollable views like `ListView`.
  - The `MaterialApp` theme in both apps should be configured to correctly use the `textScaleFactor` from `MediaQuery`.
  - Manual testing must be performed on both iOS and Android devices with system font sizes set to the minimum, default, and maximum values to verify layout integrity.

files_to_be_created: []

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/main.dart # To ensure theme respects textScaleFactor
  - Cabi Alpha/mobile/driver_app/lib/main.dart # To ensure theme respects textScaleFactor
  - Various widget and screen files across both apps will need to be reviewed and updated to ensure their layouts are flexible. Examples include:
    - `Cabi Alpha/mobile/passenger_app/lib/widgets/ride_booking_panel.dart`
    - `Cabi Alpha/mobile/driver_app/lib/screens/wallet_screen.dart`
    - `Cabi Alpha/mobile/passenger_app/lib/screens/profile_screen.dart`
    - `Cabi Alpha/mobile/driver_app/lib/screens/profile_screen.dart`

dev_notes: >
  This is a cross-cutting accessibility improvement that will affect a large number of UI components in both mobile apps. The main challenge is not enabling text scaling, but ensuring that the layouts are robust enough to handle it. Developers should prioritize using flexible layout widgets and avoid hardcoded heights or widths on components containing text. Extensive testing across various screens and font sizes is critical to the success of this story.
