id: story-90.1
epic: accessibility
slug: screen-reader-booking-flow
title: Implement Screen Reader Support for Core Ride Booking Flow
status: Done
author: Bob (sm)
date: '2024-08-09T14:15:00Z'

description: >
  As a passenger with a visual impairment, I need the core ride booking flow
  to be compatible with screen readers (e.g., VoiceOver on iOS, TalkBack on
  Android), so that I can independently request a ride.

acceptance_criteria:
  - All interactive elements on the `passenger-app` home screen (address input, saved places, ride options) must have clear, descriptive labels for screen readers.
  - The map view must provide an accessible alternative or description of the current state (e.g., "Pickup location set to 123 Main St").
  - The ride confirmation screen must read out the selected ride type, ETA, and price before confirming.
  - The "Request Ride" button must be clearly labeled and focused.
  - During the trip, key status updates (e.g., "Driver is arriving," "Trip started") must be announced by the screen reader.

files_to_be_modified:
  - Cabi Alpha/mobile/passenger_app/lib/screens/home_screen.dart
  - Cabi Alpha/mobile/passenger_app/lib/widgets/address_picker.dart
  - Cabi Alpha/mobile/passenger_app/lib/widgets/driver_details_panel.dart

dev_notes: >
  This is the first story for the `accessibility` epic. It focuses on the most critical user path. Implementation will involve wrapping widgets with `Semantics` and providing appropriate labels and hints. Testing must be done with VoiceOver and TalkBack enabled.
