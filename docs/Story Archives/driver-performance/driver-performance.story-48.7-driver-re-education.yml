id: story-48.7
epic: driver-performance
slug: driver-re-education-modules
title: Implement Driver Re-education Modules
status: Done
author: Bob (sm)
date: '2024-08-10T00:20:00Z'

description: >
  As an operations manager, when a driver's rating falls below a certain
  threshold, I want the system to automatically assign them remedial training
  modules to help them improve.

acceptance_criteria:
  - The `admin-panel` must have a section for managing educational content (videos, quizzes).
  - When a driver's performance metrics trigger a "low performance" flag (`story-48.2`), the system can assign them specific modules.
  - The driver is notified and must complete the modules in their app within a certain timeframe to avoid suspension.

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To trigger module assignment
  - Cabi Alpha/mobile/driver_app/lib/screens/performance_screen.dart # To display and access assigned modules

dev_notes: >
  This provides a constructive path for improvement for struggling drivers, rather than simply deactivating them. It helps maintain platform quality and can improve driver retention.
