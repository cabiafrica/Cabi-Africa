id: story-48.11
epic: driver-performance
slug: passenger-compliment-visibility
title: Show Driver Compliments to Passengers
status: Done
author: Bob (sm)
date: '2024-08-10T03:35:00Z'

description: >
  As a passenger, I want to see the compliments a driver has received from
  other riders on their profile, so I can get a better sense of their strengths.

acceptance_criteria:
  - When a passenger is matched with a driver, the driver's profile view must display a summary of compliments they've received (e.g., "150+ compliments for Great Conversation").
  - This uses the same data that is shown to the driver in their performance dashboard (`story-48.3`).

files_to_be_modified:
  - apps/passenger-app/src/widgets/driver_details_panel.dart # To display the compliments

dev_notes: >
  This helps build passenger confidence in their driver and gives more meaning to the compliment system.
