id: story-48.2
epic: driver-performance
slug: automated-performance-feedback
title: Implement Automated Performance Feedback
status: Done
author: Bob (sm)
date: '2024-08-09T16:40:00Z'

description: >
  As an operations manager, I want the system to automatically send feedback
  to drivers when their performance metrics cross certain thresholds, so that
  we can maintain platform quality at scale.

acceptance_criteria:
  - The `incentive-service` or `analytics-service` must have configurable thresholds for metrics like rating, acceptance rate, and cancellation rate.
  - When a driver's metrics cross a threshold (e.g., rating drops below 4.6), an automated message is sent to their in-app newsfeed.
  - The message should be encouraging and provide tips for improvement.
  - Conversely, positive messages should be sent for excellent performance (e.g., "You've received 20 5-star ratings in a row!").

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To add the threshold-checking logic

dev_notes: >
  This automates a key part of driver management. The tone of the messages is critical; they should be supportive, not punitive.
