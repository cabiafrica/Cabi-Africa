id: story-48.5
epic: driver-performance
slug: admin-driver-performance-view
title: Create Admin View for Individual Driver Performance
status: Done
author: Bob (sm)
date: '2024-08-09T17:45:00Z'

description: >
  As an operations manager, I need to be able to look up any driver and see
  their detailed performance dashboard, so I can have informed conversations
  with them about their service quality.

acceptance_criteria:
  - In the `admin-panel`, on the user detail page for a driver, there must be a "Performance" tab.
  - This tab should display the same metrics the driver sees in their own app (rating, acceptance rate, cancellation rate, trends).
  - It should also show a history of automated feedback messages sent to the driver.
  - The data will be provided by the `analytics-service`.

files_to_be_modified:
  - apps/admin-panel/src/app/users/[userId]/page.tsx # To add a new performance tab
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To expose individual driver performance data to admins

dev_notes: >
  This gives the support and operations teams the same view as the driver, which is essential for handling performance-related support tickets and outreach.

tasks:
  - id: task-1
    description: Implement backend endpoint for driver performance data.
    subtasks:
      - "[x] Create `analytics.service.ts` with a `getDriverPerformanceForAdmin` method."
      - "[x] The method should return mock data for rating, acceptance rate, and feedback history."
      - "[x] Create `analytics.controller.ts` to expose the data via a `GET /admin/analytics/driver/:driverId` endpoint."
  - id: task-2
    description: Add the 'Performance' tab to the user detail page in the admin panel.
    subtasks:
      - "[x] Modify `apps/admin-panel/src/app/users/[userId]/page.tsx` to include a 'Performance' tab/section."
      - "[x] Fetch data from the new endpoint for the performance view."
      - "[x] Display the driver's performance metrics and feedback history."

dev_agent_record:
  agent_model_used: gemini-1.5-pro
  completion_notes:
    - >-
      All tasks are complete. I have created a new endpoint in the
      `analytics-service` to provide driver performance data. The user detail
      page in the admin panel has been updated to include a 'Performance'
      section that fetches and displays this data, giving administrators the
      same view as the driver.
  file_list:
    - libs/backend/analytics-service/src/lib/analytics.service.ts
    - libs/backend/analytics-service/src/lib/analytics.controller.ts
    - apps/admin-panel/src/app/users/[userId]/page.tsx
  change_log:
    - file: libs/backend/analytics-service/src/lib/analytics.service.ts
      change: Created a new service to provide mock driver performance data for the admin view.
    - file: apps/admin-panel/src/app/users/[userId]/page.tsx
      change: Added a 'Performance' section to the user detail page that fetches and displays driver performance metrics and feedback history.

