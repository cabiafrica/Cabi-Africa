id: story-48.9
epic: driver-performance
slug: top-driver-program
title: Implement "Top Driver" Program
status: Done
author: Bob (sm)
date: '2024-08-10T01:55:00Z'

description: >
  As a high-performing driver, I want to be recognized and rewarded with
  special perks, so I feel valued and am incentivized to maintain high quality service.

acceptance_criteria:
  - The `incentive-service` must define tiers for drivers (e.g., "Pro," "All-Star") based on metrics like rating, trip count, and acceptance rate.
  - Drivers who achieve these tiers gain access to perks, such as priority support, exclusive promotions, or a special badge on their profile.
  - The driver's current tier and progress towards the next tier must be visible in their "Performance" screen.

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To manage the tier logic and perks
  - Cabi Alpha/mobile/driver_app/lib/screens/performance_screen.dart # To display tier status and perks

dev_notes: >
  This formalizes driver recognition and creates a clear path for advancement, which is a powerful retention tool. The perks should be meaningful and desirable.
