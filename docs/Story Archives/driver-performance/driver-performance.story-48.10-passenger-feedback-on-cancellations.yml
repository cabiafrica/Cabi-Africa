id: story-48.10
epic: driver-performance
slug: passenger-feedback-on-cancellations
title: Collect Passenger Feedback on Driver Cancellations
status: Done
author: Bob (sm)
date: '2024-08-10T02:45:00Z'

description: >
  As a passenger whose ride was cancelled by a driver, I want to provide a
  reason for why I think the driver cancelled (e.g., "Driver asked me to
  cancel," "Driver passed me"), so the platform can track bad behavior.

acceptance_criteria:
  - When a driver cancels a trip, the passenger is presented with a simple, optional survey asking for the reason.
  - The reasons should be a predefined list.
  - This feedback is logged against the driver's profile and is visible to admins.
  - The `analytics-service` should track drivers with a high rate of problematic cancellation reasons.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To show the cancellation feedback survey
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To log and analyze the feedback

dev_notes: >
  Driver cancellations are a major source of user frustration. Collecting this data helps identify and address problematic driver behavior.
