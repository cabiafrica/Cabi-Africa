id: story-48.12
epic: driver-performance
slug: driver-cancellation-rate-impact
title: Implement Consequences for High Driver Cancellation Rates
status: Done
author: Bob (sm)
date: '2024-08-10T04:25:00Z'

description: >
  As an operations manager, I want the system to automatically penalize
  drivers with excessively high cancellation rates, to improve platform reliability.

acceptance_criteria:
  - The `analytics-service` must track each driver's cancellation rate over a rolling period.
  - If a driver's rate exceeds a configurable threshold, they receive a warning.
  - If the rate remains high, the system can apply penalties, such as a temporary "timeout" from receiving requests or temporary loss of access to premium features (e.g., "Top Driver" status).

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To track rates and apply penalties

dev_notes: >
  This is the stick to the carrot of performance incentives. It's necessary to maintain a healthy marketplace but must be implemented fairly, taking into account things like passenger no-shows.
