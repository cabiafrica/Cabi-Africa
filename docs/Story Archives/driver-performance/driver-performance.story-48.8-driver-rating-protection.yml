id: story-48.8
epic: driver-performance
slug: driver-rating-protection
title: Implement Driver Rating Protection
status: Done
author: Bob (sm)
date: '2024-08-10T01:05:00Z'

description: >
  As a driver, I don't want my rating to be negatively affected by things
  outside of my control, like traffic or a passenger's bad day.

acceptance_criteria:
  - The system must automatically identify trips with factors outside the driver's control (e.g., extreme traffic detected by the map provider, a ride that was part of a failed fare split).
  - If a passenger gives a low rating (e.g., below 4 stars) on such a trip, and does not select a reason directly related to driver quality (like "Cleanliness" or "Professionalism"), the rating should be excluded from the driver's average.
  - The `analytics-service` must contain this logic when calculating driver ratings.

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To add the rating exclusion logic

dev_notes: >
  This is a huge driver satisfaction feature. It shows that we understand their challenges and are building a fair platform. The rules for exclusion need to be well-defined and transparent.
