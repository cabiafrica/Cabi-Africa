id: story-25.1
epic: app-analytics
slug: foundational-event-tracking
title: Implement Foundational Analytics and Track User Login Events
status: Done
author: Bob (sm)
date: '2024-07-16T09:00:00Z'

description: >
  As a product manager, I want to track basic user events, starting with
  logins, so that we can begin to understand user engagement, session frequency,
  and daily active users.

acceptance_criteria:
  - A new backend `analytics-service` must be created.
  - The `analytics-service` must be integrated with a third-party analytics provider (e.g., Mixpanel, Amplitude).
  - The `user-service` must be updated to publish a `UserLoggedIn` event upon successful user authentication.
  - The `UserLoggedIn` event must contain the `userId` and `userType` (driver/passenger).
  - The new `analytics-service` must subscribe to the `UserLoggedIn` event.
  - Upon receiving the event, the `analytics-service` must send a corresponding "User Logged In" event to the configured third-party analytics provider.
  - A new "Analytics" page must be added to the `admin-panel`.
  - For this initial story, the "Analytics" page can simply contain a link to the external dashboard of the chosen third-party provider.

files_to_be_created:
  - libs/backend/analytics-service/src/lib/analytics.service.ts
  - libs/backend/analytics-service/src/lib/analytics.module.ts
  - libs/backend/analytics-service/src/lib/listeners/user.listener.ts
  - apps/admin-panel/src/app/analytics/page.tsx

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To publish the UserLoggedIn event
  - apps/admin-panel/src/components/layout/sidebar.tsx # To add the link to the new page

dev_notes: >
  This is the foundational story for the new "App Analytics" epic. It establishes the event-tracking pipeline. The `analytics-service` will act as a facade for our chosen analytics provider, which will allow us to easily swap providers in the future if needed. The key is to establish the event-driven flow from a source service (`user-service`) to the consumer (`analytics-service`) and then out to the external platform.
