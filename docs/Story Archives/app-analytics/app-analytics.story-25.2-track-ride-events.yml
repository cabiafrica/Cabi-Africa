id: story-25.2
epic: app-analytics
slug: track-ride-events
title: Track Ride Requested and Ride Completed Events
status: Done
author: Bob (sm)
date: '2024-07-17T09:00:00Z'

description: >
  As a product manager, I want to track when rides are requested and when they
  are completed, so that we can analyze core business metrics like conversion
  rates from request to completion, and understand ride volume over time.

acceptance_criteria:
  - When a passenger requests a ride, the `ride-service` must publish a `RideRequested` event.
  - The `RideRequested` event must contain relevant, non-PII properties such as `rideId`, `passengerId`, and geographical data (e.g., pickup/destination geohash or city).
  - When a ride is successfully completed (i.e., after payment), the `ride-service` must publish a `RideCompleted` event.
  - The `RideCompleted` event must contain properties like `rideId`, `passengerId`, `driverId`, `finalFare`, `tipAmount`, and `durationInSeconds`.
  - The `analytics-service` must subscribe to both `RideRequested` and `RideCompleted` events.
  - Upon receiving these events, the `analytics-service` must send corresponding events to the configured third-party analytics provider (e.g., Mixpanel, Amplitude).
  - The events sent to the analytics provider must include the properties from the original event to allow for detailed analysis.

files_to_be_created:
  - libs/backend/analytics-service/src/lib/listeners/ride.listener.ts

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To publish the RideRequested and RideCompleted events
  - libs/backend/analytics-service/src/lib/analytics.module.ts # To register the new listener
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To handle the new events

dev_notes: >
  This story adds tracking for the most critical funnel in our application. It builds directly on the pipeline from `story-25.1`. The `ride-service` is the source of these events and should publish them at the logical points in the ride lifecycle: upon initial creation of a ride request, and after successful payment finalization. Care should be taken to only include data in the events that is useful for analytics and avoids sending unnecessary Personally Identifiable Information (PII).
