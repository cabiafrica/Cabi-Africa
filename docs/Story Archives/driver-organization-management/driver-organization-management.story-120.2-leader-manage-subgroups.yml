id: story-120.2
epic: driver-organization-management
slug: leader-manage-subgroups
title: Allow Organization Leaders to Manage Subgroups in Driver App
status: Done
author: Bob (sm)
date: '2025-12-02T16:00:00Z'

description: >
  As an organization leader, I want to create, edit, and manage my organization's subgroups and their members directly within the Driver App,
  so that I can structure my teams and manage my members efficiently without needing to contact a platform administrator.

acceptance_criteria:
  - A new "Manage Organization" section must appear in the `driver-app` menu, visible only to users designated as organization leaders.
  - This section must lead to a screen where a leader can view the hierarchical structure of their organization's subgroups.
  - The leader must be able to create a new subgroup under their organization or nested under an existing subgroup.
  - The leader must be able to edit the name and description of subgroups within their organization.
  - The leader must be able to delete subgroups they manage.
  - The leader must be able to view the list of drivers in a subgroup and add or remove members (who must already be part of the main organization).
  - The `user-service` must be updated with new endpoints, protected to ensure a user can only manage subgroups belonging to their own organization.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/manage_organization_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/edit_subgroup_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/widgets/app_drawer.dart # Or similar navigation to add the "Manage Organization" link for leaders.
  - libs/backend/user-service/src/lib/user.controller.ts # To add new leader-scoped endpoints for subgroup management.
  - libs/backend/user-service/src/lib/user.service.ts # To add business logic with permission checks for leaders.

dev_notes: >
  This story decentralizes subgroup management from central admins to the organization leaders themselves, fulfilling the "Subgroup Management" requirement from the PRD for leaders. It's the driver-facing counterpart to `story-79.13`. The most critical part of this story is the backend authorization logic. The service must rigorously verify that the requesting user is a designated leader of the organization they are attempting to modify.

tasks:
  - id: task-1
    description: "Implement leader-scoped backend endpoints in `user-service` for subgroup CRUD and membership management."
  - id: task-2
    description: "Create the 'Manage Organization' screen in the `driver-app` to display the subgroup hierarchy."
  - id: task-3
    description: "Implement the UI for creating, editing, and deleting subgroups."
  - id: task-4
    description: "Implement the UI for viewing subgroup members and adding/removing drivers from them."
