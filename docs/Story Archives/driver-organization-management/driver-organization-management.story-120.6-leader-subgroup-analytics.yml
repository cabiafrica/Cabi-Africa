id: story-120.6
epic: driver-organization-management
slug: leader-subgroup-analytics
title: Allow Organization Leaders to See Subgroup Analytics
status: Done
author: Bob (sm)
date: '2025-12-02T18:45:00Z'

description: >
  As an organization leader, I want to view performance and growth analytics for my subgroups,
  so that I can monitor their activity, identify areas for support, and understand the overall health of my network.

acceptance_criteria:
  - A new "Subgroup Analytics" screen must be created in the `driver-app`, accessible from the "Manage Organization" section.
  - The screen must display key metrics for the leader's organization and its subgroups, such as:
    - Total number of members in each subgroup.
    - Number of new members added to each subgroup over a selected period (e.g., last 7 days, last 30 days).
    - Overall activity level (e.g., total trips, total hours online) for each subgroup.
  - The UI should allow for filtering data by subgroup and by a predefined time range (e.g., "Last 7 days", "Last 30 days", "All Time").
  - The `user-service` (or a new dedicated `analytics-service`) must be updated with new endpoints to provide this aggregated data.
  - These endpoints must be protected to ensure leaders only see data for their own organization and its subgroups.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/subgroup_analytics_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/manage_organization_screen.dart # To add a link to the new screen.
  - libs/backend/user-service/src/lib/user.controller.ts # To add new leader-scoped endpoints for analytics.
  - libs/backend/user-service/src/lib/user.service.ts # To add business logic for aggregating subgroup analytics.
  - # Potentially a new `analytics-service` if the complexity warrants it.

dev_notes: >
  This story provides valuable insights for organization leaders, helping them manage their teams more effectively. The backend will need to perform aggregations across user, driver profile, and potentially ride data. Performance of these queries will be important, especially for larger organizations. The frontend should present the data clearly, possibly using simple charts or tables, and ensure the filtering options are intuitive.

tasks:
  - id: task-1
    description: "Implement backend endpoints in `user-service` (or new `analytics-service`) to provide aggregated analytics for an organization's subgroups, with appropriate authorization."
  - id: task-2
    description: "Create the 'Subgroup Analytics' screen in the `driver-app`."
  - id: task-3
    description: "Implement the UI to display the key metrics, including filtering by subgroup and time range."
  - id: task-4
    description: "Add a link to the new screen from the 'Manage Organization' section."
