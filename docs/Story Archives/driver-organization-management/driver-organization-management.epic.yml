key_deliverables:
  - Group Portal Web Application (Next.js)
  - Organization registration and verification system
  - Member management and join/leave flows
  - Leadership succession and governance tools
  - Activity management and RSVP system
  - Certificate tracking and renewal
  - Audit logging for transparency
  - Public organization profiles
  - Organization discovery browser
  - Performance leaderboards

dev_notes: >
  This is a major new feature set that introduces a new user type (Organization Manager)
  and a new web application (the Group Portal). It has significant implications for
  the user service, which will need to model the relationships between users,
  organizations, and leadership roles.
