id: story-120.5
epic: driver-organization-management
slug: driver-view-organization-members
title: Allow Drivers to View All Members of Their Organization
status: Done
author: Bob (sm)
date: '2025-12-02T17:30:00Z'

description: >
  As a driver who is a member of an organization, I want to see a list of all my fellow members,
  so that I can connect with my peers and feel a sense of community.

acceptance_criteria:
  - A new "Members" screen must be created in the `driver-app`, accessible from the "My Organization" section.
  - The screen must display a searchable and paginated list of all members of the driver's organization.
  - For each member, the list must display their name (partially anonymized for privacy, e.g., "John D.") and their profile picture.
  - The `user-service` must be updated with an endpoint (e.g., `GET /organizations/my-organization/members`) that returns the member list for the authenticated driver's organization.
  - The endpoint must support pagination and searching by name.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/organization_members_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/organization_leaders_screen.dart # Or similar screen, to add a link to the full member list.
  - libs/backend/user-service/src/lib/user.controller.ts # To add the new endpoint for fetching members.
  - libs/backend/user-service/src/lib/user.service.ts # To add logic to fetch all members of a user's organization.

dev_notes: >
  This story enhances the community features for driver organizations, following stories like `story-120.4` (view leaders). The key considerations are performance and privacy. The backend must efficiently query and paginate what could be a large list of members. The frontend should display names in a partially anonymized format to respect member privacy while still allowing for recognition.

tasks:
  - id: task-1
    description: "Implement the backend endpoint in `user-service` to get a paginated and searchable list of members of the authenticated user's organization."
  - id: task-2
    description: "Create the 'Members' screen in the `driver-app`."
  - id: task-3
    description: "Implement the UI to display the list of members with their anonymized names and profile pictures, including search and pagination functionality."
  - id: task-4
    description: "Add a link to the new screen from an appropriate place within the 'My Organization' section of the app."
