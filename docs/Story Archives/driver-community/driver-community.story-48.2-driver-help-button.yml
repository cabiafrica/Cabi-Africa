id: story-48.2
epic: driver-community
slug: driver-help-button
title: Implement Driver "Help" Button in Community Chat
status: Done
author: Bob (sm)
date: '2024-08-01T09:16:00Z'

description: >
  As a driver, if I'm in a difficult situation (e.g., a flat tire), I want to
  be able to press a "Help" button that notifies other nearby drivers in my
  community chat, so that someone close by might be able to assist.

acceptance_criteria:
  - In the driver community chat (`story-48.1`), a "Request Help" button must be available.
  - Tapping it sends a special, highlighted message into the local chat room with the driver's location.
  - The message could be "Driver [Name] needs help near [Street Name]".
  - This is a non-binding, community-based feature and does not involve official support.

files_to_be_created: []

files_to_be_modified:
  - apps/driver-app/src/screens/community_chat_screen.dart # To add the help button and message type

dev_notes: >
  This feature enhances the community aspect of the driver chat, turning it into a tool for mutual support.
