      - "[x] Create `incentive.controller.ts` exposing `GET /incentives/quests`."
  - id: task-2
    description: Implement frontend quests screen.
    subtasks:
      - "[x] Create `quests_screen.dart` with progress bars."
      - "[x] Add navigation from the Home screen."

