id: story-26.1
epic: driver-incentives
slug: consecutive-trips-bonus
title: Implement Consecutive Trips Bonus
status: Done
author: Bob (sm)
date: '2024-07-20T09:00:00Z'

description: >
  As a driver, I want to earn a bonus for completing a certain number of trips
  in a row without rejecting or canceling, so that I am incentivized to stay
  online and accept more rides during busy periods.

acceptance_criteria:
  - A new backend `incentive-service` must be created to manage all bonus and incentive logic.
  - The `incentive-service` must track a driver's "consecutive trip streak".
  - The `ride-service` must publish events that the `incentive-service` can consume: `RideCompleted`, `RideCancelledByDriver`, and `RideRequestRejected`.
  - The `incentive-service` must listen for these events:
    - On `RideCompleted`, the driver's streak is incremented.
    - On `RideCancelledByDriver` or `RideRequestRejected`, the driver's streak is reset to zero.
  - When a driver's streak reaches a configurable threshold (e.g., 3 trips), the `incentive-service` must award a bonus.
  - Awarding a bonus involves calling the `payment-service` to add a bonus transaction to the driver's earnings ledger.
  - After awarding the bonus, the `incentive-service` must publish a `BonusAwarded` event.
  - The `notification-service` must listen for the `BonusAwarded` event and send a congratulatory notification to the driver (e.g., "You've earned a KES 150 bonus for completing 3 trips in a row!").
  - A new "Incentives" page must be added to the `admin-panel` for an admin to define the rules for this bonus (e.g., number of trips required, bonus amount).

files_to_be_created:
  - libs/backend/incentive-service/src/lib/incentive.service.ts
  - libs/backend/incentive-service/src/lib/incentive.controller.ts # For admin rules
  - libs/backend/incentive-service/src/lib/incentive.module.ts
  - libs/backend/incentive-service/src/lib/listeners/ride.listener.ts
  - apps/admin-panel/src/app/incentives/page.tsx

files_to_be_modified:
  - libs/backend/ride-service/src/lib/ride.service.ts # To ensure all necessary events are published
  - libs/backend/payment-service/src/lib/payment.service.ts # To add a method for receiving bonus transactions
  - libs/backend/notification-service/src/lib/notification.service.ts # To handle sending bonus notifications
  - apps/admin-panel/src/components/layout/sidebar.tsx # To add link to the new page
  - The database schema for the new `incentive-service` to store rules and driver streak state.

dev_notes: >
  This is the foundational story for the new "Driver Incentives" epic. It introduces a new `incentive-service` to encapsulate gamification logic. The state of a driver's streak could be managed in-memory with Redis for performance, or in a persistent database. The rules for the bonus must be configurable by an admin. This feature relies heavily on a robust event-driven architecture to function correctly.
