id: story-55.2
epic: driver-incentives
slug: driver-referral-program
title: Driver Referral Program
status: DONE
author: Sarah (po)
date: '2024-08-12T11:00:00Z'

description: >
  As a driver, I want to access a unique referral code to share with friends,
  and track their progress, so that I can earn bonuses when they sign up and drive.

acceptance_criteria:
  - The Driver App must have a `ReferralScreen`.
  - The screen must display the driver's unique referral code.
  - There must be a button to copy the code or share it via system dialog.
  - The screen must list drivers referred by the user.
  - For each referral, show Name, Status (Registered/Active/Completed), and Trip Progress.
  - The app must fetch this data from the `incentive-service`.

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/referral_screen.dart
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart
  - libs/backend/incentive-service/src/lib/incentive.service.ts
  - libs/backend/incentive-service/src/lib/incentive.controller.ts

dev_notes: >
  The referral system relies on tracking the `referredBy` field on the User entity.
  For this story, we are mocking the aggregation of that data in the `incentive-service`.

tasks:
  - id: task-1
    description: Implement backend referral logic.
    subtasks:
      - "[x] Update `incentive.service.ts` to return mock referral data."
      - "[x] Update `incentive.controller.ts` to expose `GET /incentives/referral`."
  - id: task-2
    description: Implement frontend referral screen.
    subtasks:
      - "[x] Create `referral_screen.dart`."
      - "[x] Add navigation icon to `home_screen.dart`."

