id: story-26.4
epic: driver-incentives
slug: itemized-incentive-earnings
title: Display Itemized Incentive Earnings in Driver Wallet
status: Done
author: Bob (sm)
date: '2024-07-22T10:00:00Z'

description: >
  As a driver, I want to see a detailed breakdown of my earnings in my wallet,
  including base fares, tips, and specific bonuses, so that I can clearly
  understand how my total pay is calculated.

acceptance_criteria:
  - The transaction list on the `WalletScreen` in the `driver-app` must be updated to show the type of each earning.
  - Transaction types must be clearly labeled (e.g., "Trip Fare", "Passenger Tip", "Consecutive Trip Bonus", "Peak Hour Bonus").
  - The `payment-service` must ensure that all transaction records include a specific type or description.
  - The `incentive-service` must provide a clear description when it calls the `payment-service` to create a bonus transaction.
  - The wallet details endpoint in the `payment-service` must return the transaction type along with each transaction record.
  - The `driver-app` must use this type information to display an appropriate label or icon next to each transaction in the wallet history.

files_to_be_modified:
  - apps/driver-app/src/screens/wallet_screen.dart # To display itemized transaction types
  - libs/backend/payment-service/src/lib/payment.service.ts # To ensure transaction types are stored and returned
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To pass detailed descriptions when creating bonus transactions

dev_notes: >
  This story is about improving financial transparency for drivers, which is crucial for trust and satisfaction. It doesn't introduce new calculations but focuses on ensuring that the data already being processed is categorized and presented clearly. This is primarily a data enrichment and frontend presentation task, building on the wallet and incentive features.

tasks:
  - id: task-1
    description: Update backend services to include and return transaction types.
  - id: task-2
    description: Update the driver app WalletScreen to display itemized earnings.
