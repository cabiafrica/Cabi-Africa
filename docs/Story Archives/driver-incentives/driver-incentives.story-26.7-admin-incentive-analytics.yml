id: story-26.7
epic: driver-incentives
slug: admin-incentive-analytics
title: Admin Analytics for Incentive Performance
status: Done
author: Bob (sm)
date: '2024-07-24T11:02:00Z'

description: >
  As an administrator, I want to view performance reports for each incentive
  program, so that I can understand their cost and effectiveness.

acceptance_criteria:
  - A new "Analytics" tab must be added to the "Incentives" section of the `admin-panel`.
  - The report must allow filtering by incentive type and date range.
  - For a given incentive, the report must show:
    - Total cost (total bonus amount paid out).
    - Number of unique drivers who participated.
    - Impact on key metrics (e.g., for a Peak Hours bonus, show the increase in trips completed in that zone compared to a baseline).
  - The `analytics-service` must be responsible for generating this data.
  - The `analytics-service` will need to consume `BonusAwarded` events and correlate them with ride and driver data to build the report.

files_to_be_created:
  - apps/admin-panel/src/app/incentives/analytics/page.tsx

files_to_be_modified:
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To aggregate incentive data
  - libs/backend/analytics-service/src/lib/analytics.controller.ts # To expose the report endpoint

dev_notes: >
  This story provides the crucial ROI analysis for the incentive features. It allows the business to see if the money being spent on bonuses is actually influencing driver behavior in the desired way. This is a data-intensive feature that closes the loop on the entire epic.
