id: driver-incentives
slug: driver-incentives
title: Driver Incentives and Promotions
status: DONE
owner: Sarah (po)
description: >
  This epic encompasses the features required to manage and distribute financial incentives
  to drivers. The goal is to balance supply and demand, improve driver retention, and
  encourage specific behaviors such as driving during peak hours or in specific zones.
  
  Key capabilities include:
  - Quest/Streak Bonuses (e.g., "Complete 10 rides for $20 extra")
  - Sign-up and Referral Bonuses
  - Surge/Boost Zones visualization and payout
  - Progress tracking for active incentives in the Driver App
tags:
  - growth
  - retention
  - driver-experience
