id: story-101.3
epic: driver-acquisition-funnel
slug: driver-registration-backend
title: Implement Backend for Web-Based Driver Registration
status: Done
author: Bob (sm)
date: '2025-12-02T10:30:00Z'

description: >
  As a developer, I want to implement the backend service for the web-based driver registration form,
  so that prospective driver data can be securely captured, validated, stored, and the driver registration
  fee can be collected and distributed according to the MLM formula as defined in the Unified PRD (Section 2.6)
  and Architecture Document (Section 7.1).

acceptance_criteria:
  - A new NestJS application, `driver-lead-service`, must be created within the monorepo as defined in `architecture.md`.
  - The `driver-lead-service` must expose a `POST /driver-leads/register` endpoint that accepts the `RegistrationRequest` schema (per OpenAPI spec in Architecture Section 8).
  - The endpoint must validate the incoming `recaptchaToken` by calling the Google reCAPTCHA API as per security requirement NFR2.
  - Upon successful validation, the service must interact with the `User Management Service` to:
    - Create a new `User` record with email and hashed password (if provided).
    - Create a corresponding `DriverProfile` record with `applicationStatus` set to `PROSPECT` (per Architecture Section 4.2).
    - If a `referralCode` is provided, validate it and set the `referrerId` on the `DriverProfile` to link the new driver to their sponsor/upline.
    - Assign the new driver to an appropriate `DriverGroup` if applicable (per Architecture Section 4.4).
  - The service must integrate with a payment provider (Stripe) to collect the driver registration fee as specified in PRD Section 2.6.
  - Upon successful payment, the `driver-lead-service` must trigger the `MLM Service` via `POST /mlm/distribute-fee` to distribute the registration fee according to the configured formula (per Architecture Section 7.1, steps 7-15).
  - The `DriverRegistrationForm.tsx` component in the `user-portal` app must be updated to call this new backend endpoint, replacing any previous stub.
  - The API must return a success response (201) with the new `userId` upon successful registration and payment.
  - The API must return appropriate error responses for failures (e.g., 400 for invalid reCAPTCHA, duplicate email, invalid referral code, or payment failure).

files_to_be_created:
  - apps/driver-lead-service/src/main.ts
  - apps/driver-lead-service/src/app/app.module.ts
  - apps/driver-lead-service/src/app/driver-lead.controller.ts
  - apps/driver-lead-service/src/app/driver-lead.service.ts

files_to_be_modified:
  - Cabi Alpha/web/user_portal/src/components/DriverRegistrationForm.tsx # To replace the stubbed API call with a real one.
  - libs/backend/user-service/src/lib/user.service.ts # To ensure it can be called by the new service to create a prospect.
  - apps/driver-lead-service/src/app/driver-lead.service.ts # To add Stripe payment integration and MLM Service trigger.

dev_notes: >
  This story implements the complete `Driver Lead Service` outlined in `architecture.md` Section 5.1.2.
  It's the crucial link between the frontend registration form and our core user system, payment processing,
  and MLM commission distribution. The implementation follows the sequence diagram in Architecture Section 7.1
  (Driver Registration & Commission Workflow). Key integration points:
  1. Google reCAPTCHA for bot protection (Architecture Section 6.1)
  2. User Management Service for creating PROSPECT users (Architecture Section 4.1, 4.2)
  3. Stripe for collecting the driver registration fee (PRD Section 2.6)
  4. MLM Service for distributing the registration fee (Architecture Section 5.1.3, API endpoint `/mlm/distribute-fee`)
  The focus is on orchestrating these services correctly. The actual MLM fee distribution logic resides in the
  MLM Service (see `mlm-commission-and-fees.story-23.2-backend-commission-calculation.yml`).

tasks:
  - id: task-1
    description: "Create and configure the new `driver-lead-service` NestJS application within the monorepo."
  - id: task-2
    description: "Implement the `POST /driver-leads/register` endpoint with reCAPTCHA validation."
  - id: task-3
    description: "Integrate with User Management Service to create User and DriverProfile with PROSPECT status, handle referral linking, and group assignment."
  - id: task-4
    description: "Integrate Stripe payment processing to collect the driver registration fee."
  - id: task-5
    description: "Trigger the MLM Service (`POST /mlm/distribute-fee`) upon successful payment to distribute the registration fee."
  - id: task-6
    description: "Update the `DriverRegistrationForm.tsx` in user-portal to call the new live endpoint and handle payment flow and success/error responses."