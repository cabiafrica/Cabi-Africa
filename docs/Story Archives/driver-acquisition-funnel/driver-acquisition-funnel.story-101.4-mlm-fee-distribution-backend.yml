id: story-101.4
epic: driver-acquisition-funnel
slug: mlm-fee-distribution-backend
title: Implement Backend for MLM Registration Fee Distribution
status: Done
author: Bob (sm)
date: '2025-12-02T10:45:00Z'

description: >
  As a developer, I want to implement the backend service for distributing the driver registration fee,
  so that referrers are compensated according to the configured MLM formula when a new driver they referred signs up.

acceptance_criteria:
  - A new NestJS application, `mlm-service`, must be created within the monorepo as defined in `architecture.md`.
  - The `mlm-service` must expose a `POST /mlm/distribute-fee` endpoint that is triggered upon a new driver registration.
  - The endpoint must receive the new driver's ID and the total registration fee.
  - The service must fetch the new driver's referral hierarchy from the `User Management Service`.
  - The service must read the fee distribution rules from the `MlmFeeFormula` table in the database.
  - Based on the hierarchy and formula, the service must calculate the correct commission amounts for the sponsor (direct referrer) and any upline referrers.
  - For each commission, a new record must be created in the `RegistrationFeeLedger` table, linking the new driver, the recipient, and the amount.
  - The `driver-lead-service` must be updated to call the `mlm-service`'s `/distribute-fee` endpoint after a new prospect is successfully created.

files_to_be_created:
  - apps/mlm-service/src/main.ts
  - apps/mlm-service/src/app/app.module.ts
  - apps/mlm-service/src/app/mlm.controller.ts
  - apps/mlm-service/src/app/mlm.service.ts

files_to_be_modified:
  - apps/driver-lead-service/src/app/driver-lead.service.ts # To call the new mlm-service after creating a prospect.
  - libs/backend/user-service/src/lib/user.service.ts # To add a method for retrieving a user's referral hierarchy.

dev_notes: >
  This story brings the `MLM Service` from the architecture document to life. It directly follows `story-101.3`. The core logic involves fetching the referral chain, applying a formula, and recording the financial transactions in a ledger. For this story, we can assume a simple, hard-coded registration fee and MLM formula. The admin UI for configuring the formula (`Admin Configure MLM Fee Distribution` from the PRD) will be handled in a separate story. This keeps the focus on the core distribution mechanism.

tasks:
  - id: task-1
    description: "Create and configure the new `mlm-service` NestJS application."
  - id: task-2
    description: "Implement the `POST /mlm/distribute-fee` endpoint, including logic to calculate commissions and create ledger entries."
  - id: task-3
    description: "Update the `driver-lead-service` to call the `mlm-service` upon successful registration."
  - id: task-4
    description: "Extend the `user-service` to expose an endpoint/method for retrieving a user's upline."