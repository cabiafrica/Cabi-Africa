content: |
  # Frequently Asked Questions

  ## Driving with Cabi

  **Q: What are the requirements to become a Cabi driver?**
  A: To become a Cabi driver, you must meet the following requirements:
  - Be at least 21 years of age.
  - Hold a valid, in-state driver's license.
  - Have at least one year of licensed driving experience in the US (3 years if you are under 23).
  - Have a valid, in-state vehicle registration and insurance.
  - Use an eligible 4-door vehicle.
  - Pass a background check.

  **Q: What kind of vehicle do I need?**
  A: Your vehicle must be a 4-door car, in good condition, and no more than 15 years old. Specific requirements may vary by city. You can find more details during the registration process.

  **Q: How do I sign up?**
  A: You can start your application right here on our website! Just fill out the initial form, and we'll guide you through the next steps, which include downloading the Cabi Driver App to upload your documents and complete the process.

  ## Payments & Earnings

  **Q: How much can I earn with Cabi?**
  A: Your earnings depend on when, where, and how often you drive. We offer competitive rates and numerous opportunities for bonuses. Many of our drivers appreciate the flexibility to earn as much or as little as they need.

  **Q: How do I get paid?**
  A: We offer flexible payment options. You can choose to be paid weekly via direct deposit, or you can use our Instant Payout feature to cash out your earnings at any time.

  **Q: Does Cabi take a commission?**
  A: Yes, Cabi takes a commission from the fare to cover the costs of running the platform, including technology, marketing, and support. Our commission rates are transparent, and you will always see a detailed breakdown of your earnings for every trip.

  ## Account & App

  **Q: How do I get the Cabi Driver App?**
  A: After you complete the initial web registration, we will provide you with a direct link to download the app from the Apple App Store or Google Play Store.

  **Q: I'm having trouble with the app. Where can I get help?**
  A: We have a 24/7 support team ready to assist you. You can contact support directly through the Cabi Driver App.
notes: >
