id: story-130.1
epic: marketing-and-communications
slug: platform-blog
title: Create Public-Facing Company Blog
status: Done
author: Mary (analyst)
date: '2024-08-10T11:40:00Z'

description: >
  As a marketing manager, I want a public-facing blog integrated with our
  marketing website, so I can publish articles, company news, and feature
  announcements to engage with our users and the public.

acceptance_criteria:
  - A new "Blog" section must be added to the main marketing website.
  - The `admin-panel` must have a new section for "Content Management" where authorized admins can write, edit, and publish blog posts.
  - Published blog posts should appear on the public website, sorted by publication date.
  - Each blog post must have a unique URL for easy sharing.
  - The blog should support basic formatting, images, and categories/tags.

files_to_be_created:
  - apps/marketing-web/src/app/blog/page.tsx # The main blog listing page
  - apps/marketing-web/src/app/blog/[slug]/page.tsx # The detail page for a single blog post
  - apps/admin-panel/src/app/content/blog/page.tsx # Admin UI for managing blog posts

dev_notes: >
  This is a foundational story for content marketing. The admin panel component can be built using a rich text editor (like Tiptap or TinyMCE). The public-facing blog will be a standard feature of the marketing web app.