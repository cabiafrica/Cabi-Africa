id: story-130.5
epic: marketing-and-communications
slug: admin-featured-content-ui
title: Create Admin UI to Manage "What's New" Home Screen Content
status: Done
author: Mary (analyst)
date: '2024-08-10T12:00:00Z'

description: >
  As a marketing or content manager, I need a simple interface in the admin
  panel to select and manage the content that appears in the "What's New"
  section on the user home screen, so I can control this key communication channel.

acceptance_criteria:
  - A new "Featured Content" management section must be created on the `apps/admin-panel/src/app/communications/page.tsx` page.
  - This UI must allow an admin to define the content for the "What's New" component, including a Title, an Image URL, and a Destination Link (URL or app deep link).
  - The UI should only allow for one piece of content to be "featured" at any given time.
  - The admin must be able to "Publish" or "Update" the featured content, making it live for users.
  - The admin must be able to "Clear" or "Unpublish" the featured content, which will cause the "What's New" component to disappear from user apps.

files_to_be_modified:
  - apps/admin-panel/src/app/communications/page.tsx # To add the new management UI.
  - libs/backend/notification-service/src/lib/notification.service.ts # To store and serve the featured content configuration.

dev_notes: >
  This story provides the control mechanism for the dynamic component defined in `story-130.3`. The interface should be straightforward, focusing on setting or clearing the single "featured" item. The backend will need a simple key-value store or a dedicated table to hold the current featured content configuration.