id: story-11.1
epic: driver-onboarding
slug: driver-signup
title: Driver Account Creation and Signup
status: Done
author: Bob (sm)
date: '2024-08-10T18:00:00Z'

description: >
  As a prospective driver, I want to sign up for an account using my email and
  password, so that I can begin the onboarding process to drive for the platform.

acceptance_criteria:
  - The `driver-app` must have a "Sign Up to Drive" option on its initial screen.
  - This option must lead to a registration form that collects Full Name, Email, Phone Number, and a password.
  - The system must validate that the email is not already in use.
  - Upon successful submission, a new user account must be created in the `user-service` with a `role` of 'driver' and a `status` of 'pending_onboarding'.
  - The `auth-service` must handle the creation of authentication credentials.
  - After signup, the driver should be automatically logged in and directed to the first step of the onboarding flow (which will be defined in a subsequent story, e.g., document upload).

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/signup_screen.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/login_screen.dart # To add a link to the new signup screen
  - libs/backend/user-service/src/lib/user.service.ts # To handle creation of a user with the 'driver' role
  - libs/backend/auth-service/src/lib/auth.service.ts # To handle new user registration

dev_notes: >
  This is the foundational story for the `driver-onboarding` epic. It creates the entry point for all new drivers. The key is to create the user record with a specific status ('pending_onboarding') that can be used to guide the user through the required onboarding steps, such as document submission and profile completion, which will be covered in subsequent stories.

tasks:
  - id: task-1
    description: Implement the backend logic for driver signup.
    subtasks:
      - "[x] Add a `registerDriver` method to `auth.service.ts`."
      - "[x] This method should call `user.service.ts` to create a new user with `role: 'driver'` and `status: 'pending_onboarding'`."
  - id: task-2
    description: Create the frontend signup screen for the driver app.
    subtasks:
      - "[x] Create `Cabi Alpha/mobile/driver_app/lib/screens/signup_screen.dart`."
      - "[x] Implement a form to collect Full Name, Email, Phone, and Password."
      - "[x] On submission, call the backend registration endpoint."
      - "[x] Add a link from the login screen to this new signup screen."

