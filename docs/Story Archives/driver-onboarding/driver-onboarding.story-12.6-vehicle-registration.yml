id: story-12.6
epic: driver-onboarding
slug: vehicle-registration
title: Allow Drivers to Register and Manage Their Vehicle
status: Done
author: Bob (sm)
date: '2024-08-09T13:10:00Z'

description: >
  As a driver, I need to add my vehicle's details (make, model, color, license
  plate) to my profile, so that passengers can identify my car and the system
  can ensure it meets platform requirements.

acceptance_criteria:
  - A new "My Vehicle" section must be added to the `driver-app` profile or settings.
  - Drivers must be able to input their vehicle's make, model, year, color, and license plate number.
  - The `user-service` must store these vehicle details against the driver's profile.
  - This information must be made available to the `ride-service` and subsequently to the passenger when a ride is assigned.
  - Drivers should be able to edit their vehicle details, which may trigger a re-verification process for certain changes.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/vehicle_details_screen.dart

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To add storage for vehicle details.
  - libs/backend/user-service/src/lib/user.controller.ts # To add endpoints for managing vehicle details.
