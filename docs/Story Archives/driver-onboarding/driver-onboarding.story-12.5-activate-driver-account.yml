id: story-12.5
epic: driver-onboarding
slug: activate-driver-account
title: Activate Driver's Account Upon Final Document Approval
status: Done
author: Bob (sm)
date: '2024-06-11T10:00:00Z'

description: >
  As a system, I want to automatically activate a driver's account once all
  their required documents are approved, so that they can immediately go online
  and start accepting rides without any manual activation steps.

acceptance_criteria:
  - When an admin approves a document, the `document-service` must check if all other required documents for that driver are also in an "Approved" state.
  - If all documents are approved, the `document-service` must make an internal API call to the `user-service` to set the driver's verification status to "Verified".
  - Upon receiving this update, the `user-service` must change the driver's account status to "Active" and publish an `AccountActivated` event.
  - The `notification-service` must listen for the `AccountActivated` event.
  - Upon receiving the event, the `notification-service` must send a final congratulatory push notification to the driver (e.g., "Congratulations, you're approved! You can now go online and start receiving ride requests.").
  - When the driver next opens the `driver-app`, the `AuthWrapper` or equivalent logic must recognize the "Verified" status and grant them access to the main home screen, allowing them to go online.
  - The `PendingApprovalScreen` (`story-12.3`) must no longer be shown to the verified driver.

files_to_be_created:
  - libs/backend/notification-service/src/lib/listeners/user.listener.ts # To handle user-related events like activation

files_to_be_modified:
  - libs/backend/document-service/src/lib/document.service.ts # To add the check for all approved documents and call user-service
  - libs/backend/user-service/src/lib/user.service.ts # To handle the final activation and publish the 'AccountActivated' event
  - libs/backend/notification-service/src/lib/notification.module.ts # To register the new user listener
  - Cabi Alpha/mobile/driver_app/lib/auth_wrapper.dart # To ensure the routing logic correctly handles the 'Verified' status

dev_notes: >
  This story is the final, automated step that concludes the driver onboarding epic. It orchestrates the transition from a pending applicant to an active driver. The key logic resides in the `document-service` to trigger the final activation call to the `user-service`. The event published by the `user-service` ensures that other parts of the system, like notifications, are cleanly decoupled. This completes the full onboarding loop from the driver's perspective.

tasks:
  - id: task-1
    description: Enhance `document-service` to trigger driver activation.
    subtasks:
      - "[x] In `document.service.ts`, after a document is approved, add a check to see if all required documents for the driver are now approved."
      - "[x] If all documents are approved, make an internal API call to the `user-service` to verify the driver."
  - id: task-2
    description: Update `user-service` to handle driver activation and publish event.
    subtasks:
      - "[x] In `user.service.ts`, create a method to handle the verification update from `document-service`."
      - "[x] This method should set the driver's account status to 'Active'."
      - "[x] After activating the account, publish an `AccountActivated` event."
  - id: task-3
    description: Implement notification for driver activation.
    subtasks:
      - "[x] Create the new listener file `user.listener.ts` in the `notification-service`."
      - "[x] Implement a listener that subscribes to the `AccountActivated` event."
      - "[x] On receiving the event, send a congratulatory push notification to the driver."
      - "[x] Register the new `UserListener` in `notification.module.ts`."
  - id: task-4
    description: Update `driver-app` routing logic for activated accounts.
    subtasks:
      - "[x] In `auth_wrapper.dart`, modify the logic to recognize the 'Verified'/'Active' status."
      - "[x] Ensure drivers with this status are directed to the main home screen and can go online."
      - "[x] Ensure the `PendingApprovalScreen` is no longer shown to activated drivers."

