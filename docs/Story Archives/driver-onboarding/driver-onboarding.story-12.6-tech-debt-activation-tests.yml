id: story-12.6
epic: driver-onboarding
slug: tech-debt-activation-tests
title: '[Tech Debt] Add Unit Tests for Automated Driver Activation Flow'
status: Done
author: Bob (sm)
date: '2024-07-22T12:00:00Z'

description: >
  This story addresses technical debt identified during the implementation of
  `story-12.5`. Unit tests need to be added to cover the new, orchestrated
  logic for automatically activating a driver's account after all documents
  are approved. This is crucial for preventing regressions and ensuring the
  stability of the onboarding flow.

acceptance_criteria:
  - Unit tests must be added for the new logic in `document.service.ts` that checks if all documents for a driver are approved.
  - The test must cover the case where the service correctly triggers the activation call to `user-service`.
  - Unit tests must be added for the `activateDriverAccount` method in `user.service.ts`.
  - The test must verify that the driver's status is updated to 'Active' and that an `AccountActivated` event is published.
  - Unit tests must be added for the `user.listener.ts` in the `notification-service` to confirm it correctly handles the `AccountActivated` event and triggers a notification.
  - Code coverage for the new logic in the affected services must meet or exceed the project's defined threshold.

files_to_be_created:
  - libs/backend/notification-service/src/lib/listeners/user.listener.spec.ts # To test the event listener

files_to_be_modified:
  - libs/backend/document-service/src/lib/document.service.spec.ts # To add tests for the activation trigger
  - libs/backend/user-service/src/lib/user.service.spec.ts # To add tests for the account activation method

tasks:
  - id: task-1
    description: Write and implement unit tests for the services involved in the automated driver activation flow.
    subtasks:
      - "[x] Add unit tests for `document.service.ts` to verify the activation trigger logic."
      - "[x] Add unit tests for `user.service.ts` to verify the `activateDriverAccount` method."
      - "[x] Create `user.listener.spec.ts` and add unit tests for the `notification-service` event listener."

