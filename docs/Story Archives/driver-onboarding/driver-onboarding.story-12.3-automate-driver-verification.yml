id: story-12.3
epic: driver-onboarding
slug: automate-driver-verification
title: Automate Driver Overall Verification Status Update
status: Done
author: Bob (sm)
date: '2024-07-19T10:00:00Z'

description: >
  As the system, I want to automatically update a driver's overall
  verification status to "Verified" once all their required documents
  have been approved, so that the driver can be activated on the platform
  without manual intervention after document review.

acceptance_criteria:
  - The `document-service` must implement a mechanism to check if all *required*
    documents for a given driver have an 'Approved' status.
  - This check should be triggered automatically whenever a document's status
    changes to 'Approved' (e.g., after an admin action from `story-12.2`).
  - If all required documents are approved, the `document-service` must
    call a new endpoint/method in the `user-service` to mark the driver
    as fully verified.
  - The `user-service` must update the driver's `verificationStatus` field
    to 'Verified' in its database.
  - Upon successfully updating the driver's status to 'Verified', the
    `user-service` must publish an `AccountActivated` event (as referenced
    in `story-25.3`).
  - The system should handle cases where a driver might have optional documents
    that are not yet approved; these should not block the overall verification.

files_to_be_created: []

files_to_be_modified:
  - libs/backend/document-service/src/lib/document.service.ts # To add logic for checking all documents and triggering user-service update
  - libs/backend/user-service/src/lib/user.service.ts # To add a method for marking a driver as verified and publishing the event
  - libs/backend/notification-service/src/lib/listeners/user.listener.ts # To consume the AccountActivated event

dev_notes: >
  This story is crucial for automating the final step of driver onboarding. It builds directly on `story-12.1` (document submission) and `story-12.2` (admin review). The `document-service` will be responsible for determining when a driver is "fully documented" and then informing the `user-service`. The `AccountActivated` event published by the `user-service` is a key integration point for other services, such as the `analytics-service` (`story-25.3`). Careful consideration should be given to defining "required" vs. "optional" documents.

tasks:
