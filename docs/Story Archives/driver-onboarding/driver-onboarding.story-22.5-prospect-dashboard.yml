title: Prospective Driver Dashboard
epic: driver-onboarding
story_id: driver-onboarding.story-22.5
type: Story
state: Done
owner: John (pm)
jira_ref: CABI-22-5
area: Web Portal
description: >
  As a prospective driver who has started the registration process, I want a simple dashboard on the marketing website to view my application status and see the next steps, so that I can stay informed and motivated to complete my onboarding.
acceptance_criteria:
  - A logged-in user on the marketing website with a "Prospect" status can access a "My Application" page.
  - The dashboard should display the current status of their application (e.g., "Web Registration Complete," "Pending Document Submission," "Pending Background Check").
  - The dashboard must clearly indicate the next required action (e.g., "Download the app to submit your documents").
  - The page should provide a prominent, easy-to-use deep link to the Cabi Driver App.
  - The information on this dashboard should be consistent with the user's actual status in the backend.
  - This is a "Phase 1" dashboard and should be a simple, read-only view.
notes: >
  This story is for the "Future" requirement R3.2 in the PRD. It provides a crucial touchpoint for prospective drivers, keeping them engaged in the funnel. The `Driver Lead Service` will need an endpoint to provide the application status for a given user. The frontend of the marketing website will consume this endpoint to display the information.
dependencies:
  - driver-onboarding.story-12.3-driver-pending-approval-screen
