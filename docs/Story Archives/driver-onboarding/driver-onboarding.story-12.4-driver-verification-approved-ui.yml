id: story-12.4
epic: driver-onboarding
slug: driver-verification-approved-ui
title: Driver App UI for "Verification Approved"
status: Done
author: Bob (sm)
date: '2024-07-19T11:02:00Z'

description: >
  As a newly approved driver, when I open the app after my documents are
  verified, I want to see a confirmation of my status and be guided on how
  to go online and start accepting rides.

acceptance_criteria:
  - When the `driver-app` starts, it must check the driver's `verificationStatus` from the `user-service`.
  - If the status is 'Verified', the app should navigate to the main `HomeScreen`.
  - The `HomeScreen` must display a prominent "Go Online" or "Start Driving" button.
  - A welcome message or a one-time tutorial overlay should appear, congratulating the driver and explaining how to toggle their availability.
  - The "Documents" screen (`story-12.1`) should now show all documents with an "Approved" status.
  - The app should no longer block the driver from accessing the main driving interface.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/widgets/welcome_overlay.dart

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/screens/home_screen.dart # To handle the 'Verified' state and show the "Go Online" button
  - Cabi Alpha/mobile/driver_app/lib/main.dart # Or a splash screen, to handle the initial status check and navigation

dev_notes: >
  This story completes the onboarding loop from the driver's perspective. It's the "Aha!" moment where the driver is finally activated. The UI should be clear and celebratory, encouraging the driver to take their first trip. This flow is triggered by the backend status change from `story-12.3`.
