id: story-12.1
epic: driver-onboarding
slug: driver-document-submission
title: Implement Driver Document Submission and Verification Flow
status: Done
author: Bob (sm)
date: '2024-06-07T15:00:00Z'

description: >
  As a prospective driver, I want to upload my required documents (e.g.,
  driver's license, vehicle registration) through the app, so that I can
  complete the verification process and be approved to start driving.

acceptance_criteria:
  - A new "Documents" screen must be created in the `driver-app`.
  - This screen should be accessible after initial registration, perhaps as part of a guided onboarding flow.
  - The screen must display a list of required documents (e.g., "Driver's License", "Vehicle Logbook", "PSV Insurance Certificate").
  - Each document item in the list must show its current status (e.g., "Not Submitted", "Pending Review", "Approved", "Rejected").
  - Tapping on a document item allows the driver to upload a file by either taking a photo or selecting one from their gallery.
  - A new backend `document-service` must be created to handle the document uploads.
  - The `document-service` must securely store the uploaded files (e.g., in an S3 bucket) and associate them with the driver's user ID.
  - After an upload, the document's status must be updated to "Pending Review" and reflected in the `driver-app`.
  - The `user-service` should be updated to store the overall verification status of the driver (e.g., 'unverified', 'pending', 'verified').

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/document_upload_screen.dart
  - libs/backend/document-service/src/lib/document.service.ts
  - libs/backend/document-service/src/lib/document.controller.ts
  - libs/backend/document-service/src/lib/document.module.ts

files_to_be_modified:
  - Cabi Alpha/mobile/driver_app/lib/navigation/app_router.dart # To add the route for the new screen
  - libs/backend/user-service/src/lib/user.model.ts # To add a verification status field
  - libs/backend/user-service/src/lib/user.service.ts # To update the verification status

dev_notes: >
  This is the first story in the new "Driver Onboarding" epic. It establishes the critical path for getting drivers verified. A new, dedicated `document-service` is proposed to encapsulate all logic related to document handling, storage, and status management. This story focuses on the driver's submission process. A subsequent story (`story-12.2`) will cover the `admin-panel` interface for reviewing and approving/rejecting these documents.

tasks:
  - id: task-1
    description: Create the frontend screen for document submission.
    subtasks:
      - "[x] Create `Cabi Alpha/mobile/driver_app/lib/screens/document_upload_screen.dart`."
      - "[x] The screen should display a list of required documents and their status."
      - "[x] Tapping a document should allow the user to upload a file."
      - "[x] Add the new screen to the navigation in `Cabi Alpha/mobile/driver_app/lib/navigation/app_router.dart`."
  - id: task-2
    description: Implement the backend document service for uploads.
    subtasks:
      - "[x] Create `libs/backend/document-service/src/lib/document.service.ts` and `document.controller.ts`."
      - "[x] Implement an endpoint to handle file uploads and associate them with the driver."
      - "[x] Update the document status to 'Pending Review' after upload."
  - id: task-3
    description: Update user service to track overall verification status.
    subtasks:
      - "[x] Add a `verificationStatus` field to the user model in `libs/backend/user-service/src/lib/user.model.ts`."
      - "[x] Modify `libs/backend/user-service/src/lib/user.service.ts` to manage this status."

