id: story-21.5
epic: promotions-and-discounts
slug: driver-referral-program
title: Implement Driver Referral Program
status: DONE
author: Bob (sm)
date: '2024-07-29T14:04:00Z'

description: >
  As a driver, I want to refer new drivers to the platform and earn a bonus
  when they sign up and complete a certain number of trips, so that I am
  incentivized to help grow our driver supply.

acceptance_criteria:
  - Each driver must have a unique referral code available in the `driver-app`.
  - A new "Refer a Driver" screen must be created to display the code and share options.
  - During driver sign-up, new applicants must have a field to enter a referral code.
  - The `user-service` must store the referral relationship.
  - The `promotion-service` must define the rules (e.g., "Referee must complete 25 trips in 30 days for referrer to earn KES 5000").
  - The `promotion-service` must listen for `TripCompleted` events and track the progress of referred drivers.
  - When a referred driver meets the criteria, the service must issue a bonus payment to the referrer via the `payment-service`.

files_to_be_created:
  - Cabi Alpha/mobile/driver_app/lib/screens/referral_screen.dart

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To handle driver referral codes
  - libs/backend/promotion-service/src/lib/promotion.service.ts # To track and process driver referral bonuses

dev_notes: >
  This is a powerful tool for driver acquisition. It's more complex than the passenger referral program (`story-21.4`) because the reward is conditional on the new driver's performance. This requires the `promotion-service` to track state over a longer period.
