id: story-74.1
epic: promotions-and-discounts
slug: gift-ride-pass
title: Implement "Ride Pass" Gifting
status: Done
author: Bob (sm)
date: '2024-08-07T09:19:00Z'

description: >
  As a user, I want to be able to purchase a Ride Pass subscription (`story-38.2`)
  as a gift for another user, so that I can give them a month of discounted rides.

acceptance_criteria:
  - In the `Ride Pass` screen, a "Gift a Pass" option must be available.
  - The user can select a contact and pay for a one-month pass for them.
  - The recipient receives a notification that they have been gifted a Ride Pass.
  - The `payment-service` and `user-service` must handle the logic of applying the subscription to the recipient's account.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/screens/ride_pass_screen.dart # To add the gifting flow
  - libs/backend/payment-service/src/lib/payment.service.ts # To handle the gift purchase

dev_notes: >
  This adds a social and gifting element to our subscription feature, potentially driving new user acquisition and revenue.
