id: story-58.9
epic: promotions-and-discounts
slug: gamified-promo-codes
title: Implement Gamified Promo Code Discovery
status: DONE
author: Bob (sm)
date: '2024-08-10T05:05:00Z'

description: >
  As a marketing manager, I want to create "scavenger hunt" style campaigns
  where users can discover promo codes by performing certain actions in the app.

acceptance_criteria:
  - The `incentive-service` must support creating promotions that are "hidden" until a user performs a specific sequence of actions.
  - Example: A user who takes a "Green" ride, then a "Shared" ride, then visits the "Refer a Friend" screen might unlock a special promo code.
  - When unlocked, the user receives an in-app notification congratulating them and revealing the code.

files_to_be_modified:
  - libs/backend/incentive-service/src/lib/incentive.service.ts # To add the gamified logic

dev_notes: >
  This is a creative engagement feature that encourages users to explore different parts of the app. It's more interactive than simply giving out codes.
