id: story-58.5
epic: promotions-and-discounts
slug: admin-promo-analytics
title: Create Admin Dashboard for Promotion Analytics
status: DONE
author: Bob (sm)
date: '2024-08-09T18:50:00Z'

description: >
  As a marketing manager, I need to see analytics on how my promo codes are
  being used, so I can understand the ROI and effectiveness of my campaigns.

acceptance_criteria:
  - A new "Analytics" view must be added to the promo code management section of the `admin-panel`.
  - For each promo code, the admin must be able to see: total number of times used, number of unique users, and total discount value given.
  - The dashboard should also show overall promotion performance across date ranges.
  - The `analytics-service` must be responsible for collecting and aggregating this data from the `incentive-service` and `payment-service`.

files_to_be_modified:
  - apps/admin-panel/src/app/promotions/page.tsx # To add the analytics view
  - libs/backend/analytics-service/src/lib/analytics.service.ts # To process and expose promotion analytics

dev_notes: >
  This story closes the loop for the marketing team, turning campaigns into measurable activities. Without this data, it's impossible to know if promotions are successful.
