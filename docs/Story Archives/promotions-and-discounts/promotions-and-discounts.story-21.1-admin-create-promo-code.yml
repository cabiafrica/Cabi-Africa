id: story-21.1
epic: promotions-and-discounts
slug: admin-create-promo-code
title: Implement Admin Functionality to Create Promo Codes
status: Done
author: Bob (sm)
date: '2024-06-26T09:00:00Z'

description: >
  As an administrator, I want to create and manage promotion codes in the admin
  panel, so that I can offer discounts to passengers and drive user engagement.

acceptance_criteria:
  - A new backend `promotion-service` must be created to handle all logic related to promotions.
  - The `promotion-service` requires a database model for storing promo codes with attributes like: code string (e.g., "SAVE10"), discount type (percentage or fixed amount), value, expiration date, and usage limits (e.g., total uses, uses per user).
  - A new "Promotions" page must be added to the `admin-panel`.
  - This page must display a list of existing promo codes and have a "Create New Promo Code" button.
  - Clicking the button must open a form where an admin can define all the attributes of a new promo code.
  - Upon submission, the new promo code is saved to the database via the new `promotion-service`.
  - The `promotion-service` must expose secure, admin-only endpoints for creating and listing promo codes.

files_to_be_created:
  - apps/admin-panel/src/app/promotions/page.tsx
  - apps/admin-panel/src/app/promotions/create/page.tsx
  - libs/backend/promotion-service/src/lib/promotion.service.ts
  - libs/backend/promotion-service/src/lib/promotion.controller.ts
  - libs/backend/promotion-service/src/lib/promotion.module.ts

files_to_be_modified:
  - apps/admin-panel/src/components/layout/sidebar.tsx # To add the link to the new page
  - The database schema for the new `promotion-service`.

dev_notes: >
  This is the foundational story for the new "Promotions and Discounts" epic. It introduces a new, dedicated `promotion-service` to centralize all discount and promo logic. This story focuses exclusively on the administrative task of creating and viewing promo codes. The passenger-facing functionality to apply these codes during a ride booking will be handled in a subsequent story.
