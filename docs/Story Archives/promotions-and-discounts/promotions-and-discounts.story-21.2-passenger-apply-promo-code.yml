id: story-21.2
epic: promotions-and-discounts
slug: passenger-apply-promo-code
title: Allow Passenger to Apply Promo Code to a Ride
status: Done
author: Bob (sm)
date: '2024-07-19T13:00:00Z'

description: >
  As a passenger, I want to apply a promo code before confirming my ride,
  so that I can receive a discount on my fare.

acceptance_criteria:
  - An "Add Promo Code" input field or button must be added to the `RideConfirmationPanel` in the `passenger-app`.
  - When a user enters a valid promo code, the app must call a new endpoint in the `promotion-service` to validate it (e.g., GET `/promotions/validate/{code}`).
  - The `promotion-service` must check if the code exists, is not expired, and has not exceeded its usage limits for the user or in total.
  - If the code is valid, the `promotion-service` returns the discount details (e.g., type and value).
  - The `passenger-app` UI must update to show the applied discount and the new, adjusted estimated fare.
  - The selected promo code must be passed along with the ride request when the user confirms the ride (modifying the call from `story-6.3`).
  - The `ride-service` must receive the promo code and associate it with the created ride record.
  - The `payment-service` (`story-5.2`) must be updated to retrieve the discount for the ride and apply it when calculating the final charge.

files_to_be_created: []

files_to_be_modified:
  - apps/passenger-app/src/widgets/ride_confirmation_panel.dart # To add the promo code UI
  - libs/backend/promotion-service/src/lib/promotion.controller.ts # To add the validation endpoint
  - libs/backend/promotion-service/src/lib/promotion.service.ts # To add validation logic
  - libs/backend/ride-service/src/lib/ride.service.ts # To store the applied promo code with the ride
  - libs/backend/payment-service/src/lib/payment.service.ts # To apply the discount during final payment calculation

dev_notes: >
  This story builds on `story-21.1` by bringing the promo code functionality to the passenger. The key integration points are the `passenger-app` calling the `promotion-service` for validation, and then passing the code to the `ride-service` upon booking. The `payment-service` will then need to query the ride details to apply the correct discount at the end of the trip. This completes the core promo code lifecycle.
