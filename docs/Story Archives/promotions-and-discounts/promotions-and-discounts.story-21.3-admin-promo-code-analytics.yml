id: story-21.3
epic: promotions-and-discounts
slug: admin-promo-code-analytics
title: Admin View of Promo Code Usage and Analytics
status: DONE
author: Bob (sm)
date: '2024-07-20T09:03:00Z'

description: >
  As an administrator, I want to view statistics and usage details for each
  promo code, so that I can assess the effectiveness of promotions and make
  informed decisions about future campaigns.

acceptance_criteria:
  - The "Promotions" page in the `admin-panel` (`story-21.1`) must be enhanced to show usage statistics for each promo code.
  - For each promo code, the following metrics should be displayed:
    - Total times used
    - Number of unique users who used it
    - Total discount value provided
    - Remaining uses (if a limit was set)
  - The `promotion-service` must expose new, secure admin-only endpoints to retrieve these usage statistics.
  - The `payment-service` (from `story-21.2`) must be updated to record the `promoCodeId` with each transaction where a discount was applied.

files_to_be_created: []

files_to_modified:
  - apps/admin-panel/src/app/promotions/page.tsx # To display the new analytics
  - libs/backend/promotion-service/src/lib/promotion.service.ts # To implement logic for aggregating usage data
  - libs/backend/promotion-service/src/lib/promotion.controller.ts # To expose endpoints for analytics
  - libs/backend/payment-service/src/lib/payment.service.ts # To store promo code ID with transactions

dev_notes: >
  This story adds crucial analytical capabilities to the promotions feature. It requires the `promotion-service` to aggregate data, potentially from the `payment-service`'s transaction records. This will allow admins to see the ROI of their campaigns.
