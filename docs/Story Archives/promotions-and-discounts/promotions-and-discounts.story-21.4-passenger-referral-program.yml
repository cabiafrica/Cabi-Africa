id: story-21.4
epic: promotions-and-discounts
slug: passenger-referral-program
title: Implement Passenger Referral Program
status: DONE
author: Bob (sm)
date: '2024-07-27T09:05:00Z'

description: >
  As a passenger, I want to share a unique referral code with my friends, and
  when they take their first ride, we both receive a credit, so that I am
  incentivized to help grow the user base.

acceptance_criteria:
  - Each passenger must have a unique, shareable referral code available in their app.
  - A new "Refer & Earn" screen must be created in the `passenger-app` to display the code and share options.
  - During sign-up, new users must have an optional field to enter a referral code.
  - The `user-service` must store who referred whom.
  - The `promotion-service` must define the rules of the referral program (e.g., credit amount for referrer and referee).
  - When a new user (referee) completes their first trip, the `promotion-service` must be notified.
  - The service must then issue a credit to both the referee and the original referrer. This credit should be applied to their account as a non-cash balance for future rides.

files_to_be_created:
  - Cabi Alpha/mobile/passenger_app/lib/screens/referral_screen.dart

files_to_be_modified:
  - libs/backend/user-service/src/lib/user.service.ts # To handle referral code generation and linking
  - libs/backend/promotion-service/src/lib/promotion.service.ts # To process referral rewards
  - Cabi Alpha/mobile/passenger_app/lib/screens/signup_screen.dart # To add referral code field

dev_notes: >
  Referral programs are a powerful growth engine. This feature requires coordination between the `user-service` (to track the referral relationship) and the `promotion-service` (to trigger the reward). The reward should be a credit applied to an internal wallet, not a direct cash payment.
