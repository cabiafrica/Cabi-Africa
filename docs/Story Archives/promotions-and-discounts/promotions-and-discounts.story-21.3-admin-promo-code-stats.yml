id: story-21.3
epic: promotions-and-discounts
slug: admin-promo-code-stats
title: Implement Admin Dashboard for Promo Code Usage Statistics
status: DONE
author: Bob (sm)
date: '2024-06-29T09:00:00Z'

description: >
  As an administrator, I want to view usage statistics for promotion codes, so
  that I can measure the effectiveness of marketing campaigns and understand
  their financial impact.

acceptance_criteria:
  - When a ride paid with a promo code is completed, the `payment-service` must notify the `promotion-service` to log the usage.
  - The `promotion-service` must maintain a log of every time a promo code is successfully used, linking it to the `rideId` and `userId`.
  - A new "Statistics" view must be added to the "Promotions" page in the `admin-panel`.
  - This view must display overall statistics, such as total number of unique codes used and total discount amount given across all promotions.
  - The main promotions list should also show a summary for each code (e.g., "Times Used").
  - Clicking on a specific promo code should lead to a detailed statistics page for that code.
  - The detail page must show: total times used, total discount amount given by this code, and a list of the individual rides where it was applied.
  - The `promotion-service` must expose new, secure, admin-only endpoints to retrieve these aggregate and code-specific statistics.

files_to_be_created:
  - apps/admin-panel/src/app/promotions/[code]/stats/page.tsx

files_to_be_modified:
  - apps/admin-panel/src/app/promotions/page.tsx # To add summary stats and link to detail pages
  - libs/backend/promotion-service/src/lib/promotion.controller.ts # To add new endpoints for statistics
  - libs/backend/promotion-service/src/lib/promotion.service.ts # To implement logic for tracking usage and calculating stats
  - libs/backend/payment-service/src/lib/payment.service.ts # To publish an event or call the promotion-service after a discounted ride is paid
  - The database schema for the `promotion-service` to add a new `promo_code_usages` table.

dev_notes: >
  This story introduces analytics for our promotions system. The most important architectural decision is how the `payment-service` informs the `promotion-service` of a successful use. An event-driven approach is recommended, where `payment-service` publishes a `DiscountedRideCompleted` event that `promotion-service` subscribes to. This keeps the services decoupled. The `promotion-service` then becomes the source of truth for all usage analytics.
