id: story-11.1
epic: driver-acquisition
slug: user-portal-pwa-mlm-registration
title: Implement Driver MLM Registration PWA in User Portal
status: Done
author: Bob (sm)
date: '2024-05-30T14:00:00Z'

description: >
  As a business administrator, I want the `user-portal` to be an independent
  Progressive Web App (PWA) that facilitates Multi-Level Marketing (MLM)
  registration for new drivers, including the collection of a driver registration fee
  that will be distributed based on a configurable formula, so that we can expand our driver network
  through referrals, incentivize growth, and manage registration-based revenue.

acceptance_criteria:
  - The `user-portal` Next.js application must be converted into a fully installable Progressive Web App (PWA).
  - A new registration page/flow must be created specifically for drivers.
  - The registration form must include fields for the driver's personal details (name, phone number, email), an optional "Referrer Code", and facilitate the collection of a driver registration fee.
  - Upon successful registration, a new user account is created in the backend `user-service`.
  - The `user-service` must be updated to handle the MLM relationship, linking the new driver to the referring driver via the referrer code.
  - If a valid referrer code is provided, the system should associate the new driver with the referrer in the database.
  - After registration, the new driver should be assigned a unique referral code of their own.
  - The system must trigger the distribution process for the collected driver registration fee based on the established MLM formula.
  - A new "Referrals" or "Network" section should be added to the user portal where a logged-in driver can view their referral code and see a list of drivers they have successfully referred.
  - The application must be deployable as a standalone web application.

files_to_be_created:
  - Cabi Alpha/web/user_portal/src/pages/register.tsx
  - Cabi Alpha/web/user_portal/src/pages/dashboard/referrals.tsx
  - Cabi Alpha/web/user_portal/public/manifest.json
  - Cabi Alpha/web/user_portal/public/sw.js # Or configured via a Next.js PWA plugin
  - libs/backend/payment-service/src/lib/registration-fee-distribution.service.ts # New service for fee distribution

files_to_be_modified:
  - Cabi Alpha/web/user_portal/next.config.js # To add PWA plugin configuration
  - Cabi Alpha/web/user_portal/src/pages/_app.tsx # To include PWA meta tags
  - libs/backend/user-service/src/lib/user.service.ts # To add logic for handling MLM referrals and trigger fee distribution
  - libs/backend/user-service/src/lib/user.controller.ts # To expose new endpoints if necessary
  - libs/backend/payment-service/src/lib/payment.module.ts # To import and provide the new registration fee distribution service

dev_notes: >
  This story introduces a significant new feature set. The `user-portal` will become the primary entry point for our driver acquisition strategy. The PWA functionality is key for accessibility. The backend `user-service` will require a new data model to represent the MLM hierarchy (e.g., a self-referencing relationship on the user table to store the referrer's ID). This story now covers the collection of the driver registration fee and triggering its distribution. The actual detailed logic for distributing the registration fee according to the configurable MLM formula (e.g., to system, direct referrer, referrer's referrer) will be defined in a new dedicated story, likely building upon concepts in `driver-payouts.story-16.3-mlm-commission-payouts.yml` but specifically for registration fees. This story focuses on the registration process and enabling the fee collection and initial trigger.

tasks:
  - id: task-1
    description: Convert the user-portal to a Progressive Web App (PWA).
    subtasks:
      - "[x] Create `manifest.json` and a basic service worker."
      - "[x] Configure `next.config.js` with a PWA plugin."
      - "[x] Add PWA meta tags to `layout.tsx`."
  - id: task-2
    description: Implement the driver registration flow.
    subtasks:
      - "[x] Create the driver registration page with a form for personal details and referrer code."
      - "[x] Update `user-service` to handle the MLM relationship, linking new drivers to referrers."
      - "[x] Ensure new drivers are assigned their own unique referral code after registration."
  - id: task-3
    description: Create the referrals dashboard.
    subtasks:
      - "[x] Create the referrals dashboard page."
      - "[x] The page should display the logged-in driver's referral code and a list of their referred drivers."

