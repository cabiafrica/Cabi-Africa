id: story-105.1
epic: deliveries
slug: delivery-ride-type
title: Introduce "Package Delivery" Service
status: Done
author: Bob (sm)
date: '2024-08-10T06:40:00Z'

description: >
  As a user, I want to be able to send a small package from one location to
  another using the app, so I can quickly deliver items without leaving my home or office.

acceptance_criteria:
  - A new "Delivery" option must be available on the `passenger-app` home screen.
  - The user must specify pickup and drop-off locations and provide the recipient's name and phone number.
  - Drivers must be able to opt-in to receiving delivery requests in their settings.
  - The driver receives a delivery request, similar to a ride request.
  - The driver must confirm pickup and drop-off, optionally with a photo for proof of delivery.

files_to_be_modified:
  - apps/passenger-app/src/screens/home_screen.dart # To add the Delivery option
  - libs/backend/ride-service/src/lib/ride.service.ts # To handle the "delivery" ride type

dev_notes: >
  This is the foundational story for the new `deliveries` epic, opening up a new logistics-based revenue stream. The initial version should focus on small, person-to-person package delivery.
