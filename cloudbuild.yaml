# ==============================================================================
# CABI AFRICA - MULTI-SERVICE CLOUD BUILD
# ==============================================================================

steps:
  # ── STEP 1: Build Backend Image ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=auth-gateway'
      - '.'

  # ── STEP 2: Push Backend Image ───────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'

  # ── STEP 3: Deploy Backend to Cloud Run ──────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'auth-gateway'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3333'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--startup-cpu-boost'
      - '--timeout=300'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest'
      - '--set-env-vars=MPESA_ENABLED=false,NODE_ENV=production'

  # ── STEP 4: Build Frontend Image ─────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'
      - '-f'
      - 'web/user_portal/Dockerfile'
      - '.'

  # ── STEP 5: Push Frontend Image ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'

  # ── STEP 6: Deploy Frontend to Cloud Run ─────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'user-portal'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1'

images:
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '2400s'
