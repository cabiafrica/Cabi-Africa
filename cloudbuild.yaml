# ==============================================================================
# CABI AFRICA - TOTAL LAUNCH CLOUD BUILD CONFIGURATION
# ==============================================================================

steps:
  # ── STEP 1: Build & Push Auth Gateway (Used for migrations) ──────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-auth-gateway'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=auth-gateway'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-auth-gateway'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'

  - name: 'node:20'
    id: 'db-migrate'
    entrypoint: 'bash'
    secretEnv: ['DATABASE_URL', 'DIRECT_URL']
    args:
      - '-c'
      - |
        npm install --no-save prisma@5.22.0 @prisma/client@5.22.0
        # Use the absolute path to ensure the correct version is used
        ./node_modules/.bin/prisma migrate deploy --schema=libs/backend/database/prisma/schema.prisma

  # ── STEP 3: Deploy Auth Gateway ─────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-auth-gateway'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'auth-gateway'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest'
      - '--set-env-vars=NODE_ENV=production,MPESA_ENABLED=false'

  # ── STEP 4: Build & Deploy Verification Service ──────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-verification-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=verification-service'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-verification-service'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-verification-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'verification-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 5: Build & Deploy Referral Service ──────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-referral-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=referral-service'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-referral-service'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-referral-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'referral-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 6: Build & Deploy Sacco Service ─────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-sacco-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=sacco-service'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sacco-service'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-sacco-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sacco-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 7: Build & Deploy User Portal (Next.js) ───────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-user-portal'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'
      - '-f'
      - 'web/user_portal/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-user-portal'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-user-portal'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'user-portal'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1'

  # ── STEP 8: Health Check ──────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-launch'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying Auth Gateway..."
        URL=$(gcloud run services describe auth-gateway --region=us-central1 --format='value(status.url)')
        curl -s -f $${URL}/health || exit 1
        
        echo "Verifying Referral Service..."
        URL=$(gcloud run services describe referral-service --region=us-central1 --format='value(status.url)')
        curl -s -f $${URL}/health || exit 1
        
        echo "Verifying Sacco Service..."
        URL=$(gcloud run services describe sacco-service --region=us-central1 --format='value(status.url)')
        curl -s -f $${URL}/health || exit 1
        
        echo "Verifying User Portal..."
        URL=$(gcloud run services describe user-portal --region=us-central1 --format='value(status.url)')
        curl -s -f $${URL} || exit 1
        
        echo "✨ Deployment Verified Successfully!"

images:
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'

availableSecrets:
  secretManager:
    - versionName: projects/cabi-africa/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'
    - versionName: projects/cabi-africa/secrets/DIRECT_URL/versions/latest
      env: 'DIRECT_URL'
