    waitFor: ['build-driver-lead-service']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-driver-lead-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'driver-lead-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest'
      - '--set-env-vars=NODE_ENV=production'
    waitFor: ['push-driver-lead-service']

images:
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'
