# ==============================================================================
# CABI AFRICA - FULL PRODUCTION DEPLOY
# ==============================================================================

steps:

  # ── PRE-BUILD: Install & Build All Assets ────────────────────────────────────
  # NOTE: Database migrations are handled by GitHub Actions (deploy-production.yml)
  # to prevent double-run race conditions. Do NOT add them back here.
  - name: 'node:20'
    id: 'central-install'
    entrypoint: 'npm'
    args: ['install', '--legacy-peer-deps']
    waitFor: ['-']

  - name: 'node:20'
    id: 'central-build'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx prisma generate --schema=libs/backend/database/prisma/schema.prisma
        npx nx run-many --target=build --all --configuration=production
    waitFor: ['central-install']

  # ── STEP 1: Build Auth Gateway ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-auth-gateway'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '-f'
      - 'Dockerfile.backend.prebuilt'
      - '--build-arg'
      - 'SERVICE_NAME=auth-gateway'
      - '--build-arg'
      - 'IS_BACKEND_SUB_SERVICE=false'
      - '.'
    waitFor: ['central-build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-auth-gateway'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-auth-gateway'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'auth-gateway'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 2: Build Verification Service ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-verification-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
      - '-f'
      - 'Dockerfile.backend.prebuilt'
      - '--build-arg'
      - 'SERVICE_NAME=verification-service'
      - '.'
    waitFor: ['central-build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-verification-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-verification-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'verification-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 3: Build Referral Service ───────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-referral-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
      - '-f'
      - 'Dockerfile.backend.prebuilt'
      - '--build-arg'
      - 'SERVICE_NAME=referral-service'
      - '.'
    waitFor: ['central-build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-referral-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-referral-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'referral-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 4: Build Sacco Service ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-sacco-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
      - '-f'
      - 'Dockerfile.backend.prebuilt'
      - '--build-arg'
      - 'SERVICE_NAME=sacco-service'
      - '.'
    waitFor: ['central-build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sacco-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-sacco-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sacco-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 5: Build Dispatch Service ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dispatch-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest'
      - '-f'
      - 'Dockerfile.backend.prebuilt'
      - '--build-arg'
      - 'SERVICE_NAME=dispatch-service'
      - '.'
    waitFor: ['central-build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dispatch-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dispatch-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dispatch-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 6: Build Driver Lead Service ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-driver-lead-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'
      - '-f'
      - 'Dockerfile.backend.prebuilt'
      - '--build-arg'
      - 'SERVICE_NAME=driver-lead-service'
      - '.'
    waitFor: ['central-build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-driver-lead-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-driver-lead-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'driver-lead-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'

