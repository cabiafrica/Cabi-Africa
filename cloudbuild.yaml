# ==============================================================================
# CABI AFRICA - AUTH GATEWAY DEPLOY (FOCUSED BUILD)
# ==============================================================================

steps:
  # ── STEP 1: Build Auth Gateway ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-auth-gateway'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=auth-gateway'
      - '.'

  # ── STEP 2: Push Auth Gateway Image ───────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-auth-gateway'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'

  # ── STEP 3: Deploy Auth Gateway to Cloud Run ──────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-auth-gateway'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'auth-gateway'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
