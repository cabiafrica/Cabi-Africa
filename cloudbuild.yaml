# ==============================================================================
# CABI AFRICA - FULL PRODUCTION DEPLOY
# ==============================================================================

steps:
  # ── STEP 0: Run Database Migrations ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/npm'
    id: 'run-migrations'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install prisma --no-save --legacy-peer-deps
        npx prisma migrate deploy --schema=libs/backend/database/prisma/schema.prisma
    secretEnv: ['DATABASE_URL', 'DIRECT_URL']

  # ── STEP 1: Build Auth Gateway ────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-auth-gateway'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=auth-gateway'
      - '--build-arg'
      - 'IS_BACKEND_SUB_SERVICE=false'
      - '.'
    waitFor: ['run-migrations']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-auth-gateway'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-auth-gateway'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'auth-gateway'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 2: Build Verification Service ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-verification-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=verification-service'
      - '.'
    waitFor: ['deploy-auth-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-verification-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-verification-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'verification-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 3: Build Referral Service ───────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-referral-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=referral-service'
      - '.'
    waitFor: ['deploy-auth-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-referral-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-referral-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'referral-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 4: Build Sacco Service ──────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-sacco-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=sacco-service'
      - '.'
    waitFor: ['deploy-auth-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sacco-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-sacco-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sacco-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 5: Build Dispatch Service ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dispatch-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=dispatch-service'
      - '.'
    waitFor: ['deploy-auth-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dispatch-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dispatch-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dispatch-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 6: Build Driver Lead Service ────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-driver-lead-service'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '--build-arg'
      - 'SERVICE_NAME=driver-lead-service'
      - '.'
    waitFor: ['deploy-auth-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-driver-lead-service'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-driver-lead-service'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'driver-lead-service'
      - '--image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-env-vars=NODE_ENV=production'

  # ── STEP 7: Discovery & Global URL Mapping ───────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'discover-endpoints'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Mapping Production Endpoints..."
        gcloud run services describe auth-gateway --region=us-central1 --format='value(status.url)' > auth_url.txt
        gcloud run services describe verification-service --region=us-central1 --format='value(status.url)' > verify_url.txt
        gcloud run services describe driver-lead-service --region=us-central1 --format='value(status.url)' > driver_url.txt
        gcloud run services describe dispatch-service --region=us-central1 --format='value(status.url)' > dispatch_url.txt
        gcloud run services describe sacco-service --region=us-central1 --format='value(status.url)' > sacco_url.txt
        gcloud run services describe referral-service --region=us-central1 --format='value(status.url)' > referral_url.txt
    waitFor:
      - 'deploy-auth-gateway'
      - 'deploy-verification-service'
      - 'deploy-referral-service'
      - 'deploy-sacco-service'
      - 'deploy-dispatch-service'
      - 'deploy-driver-lead-service'

  # ── STEP 8: Build Frontend Portals (Parallelized Docker Builds) ─────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-admin-panel'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        AUTH_URL=$(cat auth_url.txt)
        DRIVER_URL=$(cat driver_url.txt)
        DISPATCH_URL=$(cat dispatch_url.txt)
        docker build -t us-central1-docker.pkg.dev/cabi-africa/cabi-repo/admin-panel:latest \
          -f web/admin_panel/Dockerfile \
          --build-arg VITE_API_URL=${AUTH_URL}/api \
          --build-arg VITE_DRIVER_LEAD_SERVICE_URL=${DRIVER_URL} \
          --build-arg VITE_DISPATCH_SERVICE_URL=${DISPATCH_URL} \
          .
    waitFor: ['discover-endpoints']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dispatch-panel'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        AUTH_URL=$(cat auth_url.txt)
        DISPATCH_URL=$(cat dispatch_url.txt)
        docker build -t us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-panel:latest \
          -f web/dispatch_panel/Dockerfile \
          --build-arg VITE_API_URL=${AUTH_URL}/api \
          --build-arg VITE_DISPATCH_SERVICE_URL=${DISPATCH_URL} \
          .
    waitFor: ['discover-endpoints']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-user-portal'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        AUTH_URL=$(cat auth_url.txt)
        DRIVER_URL=$(cat driver_url.txt)
        DISPATCH_URL=$(cat dispatch_url.txt)
        SACCO_URL=$(cat sacco_url.txt)
        REFERRAL_URL=$(cat referral_url.txt)
        docker build -t us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest \
          -f web/user_portal/Dockerfile \
          --build-arg NEXT_PUBLIC_API_URL=${AUTH_URL}/api \
          --build-arg NEXT_PUBLIC_SOCKET_URL=${AUTH_URL} \
          --build-arg NEXT_PUBLIC_DRIVER_LEAD_SERVICE_URL=${DRIVER_URL} \
          --build-arg NEXT_PUBLIC_DISPATCH_SERVICE_URL=${DISPATCH_URL} \
          --build-arg NEXT_PUBLIC_SACCO_SERVICE_URL=${SACCO_URL} \
          --build-arg NEXT_PUBLIC_REFERRAL_SERVICE_URL=${REFERRAL_URL} \
          .
    waitFor: ['discover-endpoints']

  # ── STEP 9A: Push Frontend Images ───────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-admin-panel'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/admin-panel:latest']
    waitFor: ['build-admin-panel']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dispatch-panel'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-panel:latest']
    waitFor: ['build-dispatch-panel']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-user-portal'
    args: ['push', 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest']
    waitFor: ['build-user-portal']

  # ── STEP 9B: Deploy Frontends ────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-admin-panel'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy admin-panel \
          --image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/admin-panel:latest \
          --region=us-central1 --platform=managed --allow-unauthenticated \
          --port=80 --memory=256Mi
    waitFor: ['push-admin-panel']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dispatch-panel'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        AUTH_URL=$(cat auth_url.txt)
        gcloud run deploy dispatch-panel \
          --image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-panel:latest \
          --region=us-central1 --platform=managed --allow-unauthenticated \
          --port=80 --memory=256Mi \
          --set-env-vars=BACKEND_URL=${AUTH_URL}
    waitFor: ['push-dispatch-panel']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-user-portal'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy user-portal \
          --image=us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest \
          --region=us-central1 --platform=managed --allow-unauthenticated \
          --port=3000 --memory=512Mi \
          --set-env-vars=NODE_ENV=production
    waitFor: ['push-user-portal']

images:
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/auth-gateway:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/verification-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/referral-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/sacco-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/driver-lead-service:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/admin-panel:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/dispatch-panel:latest'
  - 'us-central1-docker.pkg.dev/cabi-africa/cabi-repo/user-portal:latest'

availableSecrets:
  secretManager:
    - versionName: projects/746659778850/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'
    - versionName: projects/746659778850/secrets/DIRECT_URL/versions/latest
      env: 'DIRECT_URL'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'
