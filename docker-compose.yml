version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cabi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cabi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabi_password}
      POSTGRES_DB: ${POSTGRES_DB:-cabi_africa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cabi_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: cabi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # Verification Service (Professionally Dockerized)
  verification-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_NAME: verification-service
    container_name: cabi_verification
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Referral Service (Professionally Dockerized)
  referral-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_NAME: referral-service
    container_name: cabi_referral
    ports:
      - "3337:3337"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3337
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Sacco Service (Professionally Dockerized)
  sacco-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_NAME: sacco-service
    container_name: cabi_sacco
    ports:
      - "3338:3338"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3338
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Auth Gateway (Professionally Dockerized)
  auth-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_NAME: auth-gateway
        IS_BACKEND_SUB_SERVICE: "false"
    container_name: cabi_auth_gateway
    ports:
      - "3030:3030"
    environment:
      NODE_ENV: production
      IS_BACKEND_SUB_SERVICE: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: 3030
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dispatch Service (WebSockets & Real-Time Driver Tracking)
  dispatch-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE_NAME: dispatch-service
    container_name: cabi_dispatch
    ports:
      - "3334:3334"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: 3334
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Admin Panel (React/Vite SPA)
  admin-panel:
    build:
      context: .
      dockerfile: web/admin_panel/Dockerfile
      args:
        VITE_API_URL: https://api.cabi.africa/api
        VITE_SOCKET_URL: https://cabi.africa
        VITE_DISPATCH_SERVICE_URL: https://cabi.africa
    container_name: cabi_admin_panel
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - auth-gateway

  # Dispatch Panel (React/Vite SPA)
  dispatch-panel:
    build:
      context: .
      dockerfile: web/dispatch_panel/Dockerfile
      args:
        VITE_API_URL: https://api.cabi.africa/api
        VITE_SOCKET_URL: https://cabi.africa
    container_name: cabi_dispatch_panel
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - auth-gateway
      - dispatch-service

  # User Portal (Next.js Platform Root)
  user-portal:
    build:
      context: .
      dockerfile: web/user_portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.cabi.africa/api
        NEXT_PUBLIC_SOCKET_URL: https://cabi.africa
        NEXT_PUBLIC_DISPATCH_SERVICE_URL: https://cabi.africa
        NEXT_PUBLIC_SACCO_SERVICE_URL: https://api.cabi.africa/api
        NEXT_PUBLIC_REFERRAL_SERVICE_URL: https://api.cabi.africa/api
    container_name: cabi_user_portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      PORT: 8080
    depends_on:
      - auth-gateway
      - dispatch-service

  # Caddy Reverse Proxy (Auto-SSL for cabi.africa & WebSockets)
  caddy:
    image: caddy:2.7-alpine
    container_name: cabi_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-gateway
      - dispatch-service
      - verification-service
      - admin-panel
      - dispatch-panel
      - user-portal

networks:
  default:
    name: cabi_network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
