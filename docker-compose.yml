version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cabi_postgres
    restart: always
    environment:
      POSTGRES_USER: cabi_user
      POSTGRES_PASSWORD: cabi_password
      POSTGRES_DB: cabi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
